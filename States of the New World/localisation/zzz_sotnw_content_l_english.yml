l_english:
 zzz_sotnw.1.t:0 "The Strange Sickness"
 zzz_sotnw.1.d:0 "A trader from the coast brings a sickness none of the medicine men have seen before. Villages burn to stop its spread, and the council quarrels over what offering might satisfy the offended spirits."
 zzz_sotnw.1.a:0 "Burn the sick houses and endure."
 zzz_sotnw.1.b:0 "Hold a great sacrifice to the spirits."
 zzz_sotnw.2.t:0 "Corsairs on the Florida Coast"
 zzz_sotnw.2.d:0 "Sails have been sighted off the coast, flying no banner that any elder can name. Strange men come ashore to take what is not offered, and the villages along the shore dread the next sunrise."
 zzz_sotnw.2.a:0 "Drive them back into the sea."
 zzz_sotnw.2.b:0 "Pay tribute and let them pass."
 zzz_sotnw.2.c:0 "Hide the canoes and keep watch."
 zzz_sotnw.3.t:0 "Gold in the Riverbed"
 zzz_sotnw.3.d:0 "A child wading in the river brings back a stone that glints like captured sunlight. Soon every hand in the village is sifting the gravel, and old enmities rise over who may work the richest banks."
 zzz_sotnw.3.a:0 "Work the river openly."
 zzz_sotnw.3.b:0 "Keep the find secret."
 zzz_sotnw.3.c:0 "Share the river fairly among all clans."
 zzz_sotnw.4.t:0 "The Horse Spreads North"
 zzz_sotnw.4.d:0 "Strangers from the south bring beasts that carry a man swifter than any runner. Some say these creatures will change the old ways forever; others say they are a gift from the earth spirits."
 zzz_sotnw.4.a:0 "Learn to ride and fight from horseback."
 zzz_sotnw.4.b:0 "Trade for the beasts and sell them on."
 zzz_sotnw.4.c:0 "The old ways are good enough."
 zzz_sotnw.5.t:0 "Foreign Missionaries"
 zzz_sotnw.5.d:0 "Men in dark robes have come from the coast, speaking of a god who died and rose again. They fill the ears of the young with strange prayers and ask leave to build a house for their god among the lodges."
 zzz_sotnw.5.a:0 "Send them away and guard the old rites."
 zzz_sotnw.5.b:0 "Let them preach, and learn their ways."
 zzz_sotnw.6.t:0 "Council of the Confederacy"
 zzz_sotnw.6.d:0 "Firekeepers have called the clans together. Around the council fire, chiefs and elders dispute the boundaries of hunting grounds, the price of a bride, and the raising of war parties, while the young listen and learn how the people are ruled."
 zzz_sotnw.6.a:0 "Speak for unity and wisdom."
 zzz_sotnw.6.b:0 "Let the old men talk; nothing will change."
 zzz_sotnw.7.t:0 "Season of the Buffalo"
 zzz_sotnw.7.d:0 "The great herds move across the plains this year in numbers no living elder can recall. Pounded meat and cured hides fill the lodges, and the winter ahead looks fat and warm."
 zzz_sotnw.7.a:0 "Feast and grow strong."
 zzz_sotnw.7.b:0 "Trade the surplus hides with distant peoples."
 zzz_sotnw.8.t:0 "The Sky Burns"
 zzz_sotnw.8.d:0 "The sun went dark at midday, ringed by fire, and the birds fell silent. The priests read the burning sky as a sign, and all eyes turn to the council for the meaning of the omen."
 zzz_sotnw.8.a:0 "A great omen for our war chiefs."
 zzz_sotnw.8.b:0 "A warning: offer gifts to the sky."
 zzz_sotnw.8.c:0 "It is only the sun playing a trick."