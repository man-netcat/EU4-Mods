# Flag directories for the generated variant tags, in priority order
# (first match wins). Each entry is a directory containing TGA flag files.
#
# For each directory the generator tries, in order:
#   <dir>/<BASE_TAG>_<RULE>.tga   (rule-specific override)
#   <dir>/<BASE_TAG>.tga          (shared flag for all rules)
#
# If no directory matches, the base tag's own flag is used as a fallback
# (searched through the sources.conf roots, later roots first).
#
# Drop custom 128x128 TGA flags named <BASE_TAG>.tga (or
# <BASE_TAG>_<RULE>.tga) into ../assets/flags to override single tags.

