 request_overlord_support:0 "Request Overlord Support"
 request_overlord_support_desc:0 "Request that our overlord join us in a defensive war. This will either cost favors or require good relations."
 REQUEST_OVERLORD_SUPPORT_INVALID:0 "§RRequirements:§!\n• We must be a semi-independent vassal\n• We must be defending in a war\n• Overlord cannot be at war\n• Overlord must have §Y100§! opinion of us OR we must owe them §Y10§! favors"
 
 # Events
 semi_independent_vassal.1.t:0 "Vassal Requests Support"
 semi_independent_vassal.1.d:0 "Our semi-independent vassal [From.GetName] has been attacked and is requesting our military assistance. While we are not obligated to join their war, refusing could damage our relationship and increase their desire for independence."
 semi_independent_vassal.1.a:0 "We shall honor our commitment and join the war."
 semi_independent_vassal.1.b:0 "They must handle this conflict on their own."
 
 semi_independent_vassal.2.t:0 "Enforce Peace for Vassal"
 semi_independent_vassal.2.d:0 "Our semi-independent vassal [defended_vassal.GetName] is under attack. Should we intervene to protect them?"
 semi_independent_vassal.2.a:0 "Join the war to defend our vassal."
 
