l_english:
 # Subject Type
 semi_independent_vassal:0 "Semi-Independent Vassal"
 semi_independent_vassal_title:0 "Semi-Independent Vassal"
 semi_independent_vassal_title_plural:0 "Semi-Independent Vassals"
 semi_independent_vassal_desc:0 "A semi-independent vassal is a nation that maintains significant autonomy while acknowledging the suzerainty of its overlord. These vassals can declare wars, form alliances, and manage their own foreign policy. However, the overlord retains the right to enforce peace on their behalf when they are attacked, and the vassal can request military support from their overlord in defensive wars."
 semi_independent_vassal_long_desc:0 "A semi-independent vassal is a nation that maintains significant autonomy while acknowledging the suzerainty of its overlord. These vassals can declare wars, form alliances, and manage their own foreign policy."
 semi_independent_vassal_is_our:0 "is our Semi-Independent Vassal"
 
 # Static Modifiers
 semi_independent_vassal_nation:0 "Semi-Independent Vassal"
 semi_independent_vassal_nation_desc:0 "This nation is a semi-independent vassal, maintaining its own military and foreign policy while paying reduced tribute to its overlord."
 semi_independent_vassal_overlord:0 "Semi-Independent Vassals"
 semi_independent_vassal_overlord_desc:0 "This nation has semi-independent vassals, receiving diplomatic prestige and some income while allowing them significant autonomy."
 
 # Opinion Modifiers
 is_semi_independent_vassal:0 "Semi-Independent Vassal"
 overlord_joined_war:0 "Overlord Joined Our War"
 overlord_refused_support:0 "Overlord Refused Support"
 revoked_semi_independence:0 "Revoked Our Semi-Independence"
 attempted_revoke_independence:0 "Attempted to Revoke Our Independence"
 refused_return_vassal:0 "Refused to Return to Regular Vassalage"
 
 # Diplomatic Actions
 create_semi_independent_vassal:0 "Offer Semi-Independent Vassalage"
 create_semi_independent_vassal_title:0 "Offer Semi-Independent Vassalage"
 create_semi_independent_vassal_desc:0 "Offer this nation the status of a semi-independent vassal. They will acknowledge our suzerainty while maintaining the right to wage their own wars and conduct independent foreign policy. They will pay reduced tribute but retain significant autonomy."
 create_semi_independent_vassal_tooltip:0 "Offer Semi-Independent Vassalage to [From.GetName]"
 create_semi_independent_vassal_alert_tooltip:0 "We can offer Semi-Independent Vassalage to some nations"
 create_semi_independent_vassal_dialog:0 "[From.GetName] has offered us the status of a semi-independent vassal. We would maintain significant autonomy and the ability to wage our own wars, but would acknowledge their suzerainty and pay tribute."
 
 elevate_to_semi_independent_vassal:0 "Grant Semi-Independence"
 elevate_to_semi_independent_vassal_title:0 "Grant Semi-Independence to Vassal"
 elevate_to_semi_independent_vassal_desc:0 "Elevate this ordinary vassal to semi-independent status, granting them the right to conduct their own foreign policy and wage wars independently. This will reduce their liberty desire and improve relations, but they will pay less tribute."
 elevate_to_semi_independent_vassal_tooltip:0 "Grant Semi-Independence to [From.GetName]"
 elevate_to_semi_independent_vassal_alert_tooltip:0 "We can grant semi-independence to some vassals"
 elevate_to_semi_independent_vassal_dialog:0 "[From.GetName] has offered to grant us semi-independent status. We would gain the right to conduct our own foreign policy and wage wars as we see fit, while maintaining our vassalage."
 
 revoke_semi_independence:0 "Revoke Semi-Independence"
 revoke_semi_independence_title:0 "Revoke Semi-Independence"
 revoke_semi_independence_desc:0 "Revoke the semi-independent status of this vassal and return them to regular vassalage. They will lose their autonomy and be subject to our direct control again. This will significantly increase their liberty desire and damage relations. Cannot be done within 10 years of granting semi-independence."
 revoke_semi_independence_tooltip:0 "Revoke Semi-Independence from [From.GetName]"
 revoke_semi_independence_alert_tooltip:0 "We can revoke semi-independence from some vassals"
 revoke_semi_independence_dialog:0 "[From.GetName] demands that we relinquish our semi-independent status and return to regular vassalage. This would mean losing our right to conduct independent foreign policy."
 CANNOT_REVOKE_SEMI_INDEPENDENCE_TOO_SOON:0 "Has been semi-independent for less than 10 years"
 
 request_overlord_support:0 "Request Overlord Support"
 request_overlord_support_title:0 "Request Military Support"
 request_overlord_support_desc:0 "Request that our overlord join us in this defensive war. They may accept or decline based on our relations, their war exhaustion, and their current situation."
 request_overlord_support_tooltip:0 "Request [From.GetName] to join our defensive war"
 request_overlord_support_alert_tooltip:0 "We can request our overlord's support"
 request_overlord_support_dialog:0 "Our semi-independent vassal [From.GetName] is under attack and requests our military assistance. While we are not obligated to join their war, refusing could damage our relationship and increase their desire for independence."
 
 enforce_peace_for_vassal:0 "Enforce Peace for Vassal"
 enforce_peace_for_vassal_title:0 "Enforce Peace for Semi-Independent Vassal"
 enforce_peace_for_vassal_desc:0 "Intervene on behalf of our semi-independent vassal who is being attacked. This will join us to their defensive war."
 enforce_peace_for_vassal_tooltip:0 "Join [From.GetName]'s defensive war"
 enforce_peace_for_vassal_alert_tooltip:0 "We can enforce peace for our semi-independent vassals"
 enforce_peace_for_vassal_dialog:0 "Not used"
 
