l_english:
 kar_form_otuken_title:0 "Form Ötüken"
 kar_form_otuken:0 "Form Ötüken"
 kar_form_otuken_desc:0 "Between the Onon and the Kherlen the clans of the old Mongol country have long kept their own tents beneath the same sacred mountains. Yet the steppe remembers one throne above them all, and a single khan in the homeland would raise Ötüken as the kingdom of the Mongols."
 kar_form_gobi_title:0 "Form Gobi"
 kar_form_gobi:0 "Form Gobi"
 kar_form_gobi_desc:0 "The chiefs of the Gobi hold wells and pastures from the Khingan to the Altai, each jealous of his own grazing. Yet the desert is one road, and a single crown over every well would make Gobi a kingdom no caravan could cross unbidden."
 kar_form_buryatia_title:0 "Form Buryatia"
 kar_form_buryatia:0 "Form Buryatia"
 kar_form_buryatia_desc:0 "Round the great lake the Buryat clans fish, hunt and herd under many chiefs. Yet they share one tongue and one shaman's drum, and a single banner on the shores of the Baikal would make them a kingdom."
 kar_form_angara_title:0 "Form Angara"
 kar_form_angara:0 "Form Angara"
 kar_form_angara_desc:0 "On the river that leaves the Baikal the lords of the Angara valley keep their own forts. Yet the river is one road to the north, and a single crown over its banks would raise Angara as a kingdom."
 kar_form_mongol_empire_title:0 "Found the Mongol Empire"
 kar_form_mongol_empire:0 "Found the Mongol Empire"
 kar_form_mongol_empire_desc:0 "Ötüken, the Gobi, the lake and the river lands have each had their own king, and none has had the strength to rule them all. Let the greatest among them take the whole of the steppe under one banner, and the world will learn the name of the Mongols."
