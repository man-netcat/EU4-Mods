 kar_form_sardinia_title:0 "Form Sardinia"
 kar_form_sardinia:0 "Form Sardinia"
 kar_form_sardinia_desc:0 "The island has never answered to one master, and its judges guard their liberties fiercely. Yet one banner over every shore would end the age of petty courts and pirates. Let us claim the ancient mantle and raise the Four Moors over a united Sardinia."
