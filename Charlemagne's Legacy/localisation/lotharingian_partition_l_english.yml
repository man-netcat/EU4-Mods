l_english:
 kar_lotharingia.1.t:0 "The Death of Lothair II"
 kar_lotharingia.1.d:0 "Lothair II died at Piacenza on the eighth of August, on his way home from Italy, where he had gone to ask Pope Hadrian II to bless his marriage to Waldrada. His only son, Hugh, is Waldrada's, and the Church will not call him legitimate. Lothair's brother, the emperor Louis II, is far away besieging Bari. Lothair's uncles, Charles the Bald of the West Franks and Louis the German of the East Franks, have been counting the counties of the Middle Kingdom for years.\n\nHugh can be proclaimed and the kingdom held together by arms, or we can make our peace with our uncles and let them divide it."
 kar_lotharingia.1.a:0 "Hugh is our king, and Lotharingia stays whole!"
 kar_lotharingia.1.b:0 "Treat with our uncles."
 kar_lotharingia.2.t:0 "The Middle Kingdom Lies Open"
 kar_lotharingia.2.d:0 "Lothair II is dead and his son is a bastard. Charles the Bald means to have Cambrai, Verdun, Toul, Besancon and the Rhone-Saone country before his brother Louis reaches them."
 kar_lotharingia.2.a:0 "The western half is ours by right."
 kar_lotharingia.2.b:0 "Let the Lotharingians be."
 kar_lotharingia.3.t:0 "The Middle Kingdom Lies Open"
 kar_lotharingia.3.d:0 "Lothair II is dead and his son is a bastard. Louis the German means to have Aachen, Cologne, Trier, Frisia and Alsace before his brother Charles reaches them."
 kar_lotharingia.3.a:0 "The Rhineland is ours by right."
 kar_lotharingia.3.b:0 "Let the Lotharingians be."
 kar_lotharingia.4.t:0 "The Treaty of Meerssen"
 kar_lotharingia.4.d:0 "At Meerssen, near Maastricht, Charles the Bald and Louis the German divide the kingdom of their dead nephew. Charles takes the west and the south: Cambrai, Verdun, Toul, Besancon, Lyon and Vienne. Louis takes the Rhineland, Frisia and the Moselle: Aachen, Cologne, Trier, Metz, Utrecht and Strasbourg. The emperor Louis II, who was Lothair's heir by their father's will, is not asked.\n\nLotharingia is no more."
 kar_lotharingia.4.a:0 "A kingdom of nine years is divided."
 kar_lotharingia.5.t:0 "The Share of Lotharingia"
 kar_lotharingia.5.d:0 "The Treaty of Meerssen is sealed and the Middle Kingdom's counties have new lords."
 kar_lotharingia.5.a:0 "A fair division."
 kar_lotharingia_succession_crisis:0 "Lotharingian Succession Crisis"
 desc_kar_lotharingia_succession_crisis:0 "Lothair II died without a legitimate heir, and the nobles of the Middle Kingdom are choosing between his bastard and his uncles."
