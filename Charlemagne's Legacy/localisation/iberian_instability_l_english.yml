l_english:
 kar_iberia_1_title:0 "Muladi Discontent"
 kar_iberia_1_desc:0 "The convert families of the Marches and Extremadura have paid the emir's tax-farmers for a generation and were promised equality for it. They are not at all sure the promise will be kept. Toledo, Merida and Saraqustah mutter, and the governors there do not sleep well."
 kar_iberia_1_a:0 "The emirate frays at its edges."
 kar_iberia_2_title:0 "The Garrisons Grumble"
 kar_iberia_2_desc:0 "The Berber garrisons of the frontier were settled on poor land and paid late. They remember that they, not the Arab nobility, bear the brunt when Asturian raiders come down from the mountains. Their captains talk of arrears and of other masters."
 kar_iberia_2_a:0 "Our vassals grow restless."
 kar_iberia_3_title:0 "The Mozarabs Stir"
 kar_iberia_3_desc:0 "The Christians of the south have kept their churches, their bishops and their grievances under every emir. Word from the north of a king who calls himself the heir of the Goths has reached their villages, and the poll tax has never felt heavier."
 kar_iberia_3_a:0 "Let them murmur."
 kar_iberia_4_title:0 "A Disputed Succession"
 kar_iberia_4_desc:0 "The emir is dead, and his sons have each been told by their own partisans that the throne is theirs. Governors choose sides, tribute stops moving north, and every ambitious man in Al-Andalus now thinks about what he could take while Cordoba looks inward."
 kar_iberia_4_a:0 "Cordoba will be weaker for this."
 kar_frontier_vigor:0 "Frontier Vigour"
 desc_kar_frontier_vigor:0 "Frontier Vigour."
 kar_repopulated_frontier:0 "Repopulated Frontier"
 desc_kar_repopulated_frontier:0 "Repopulated Frontier."
 kar_hispania_restored:0 "Hispania Restored"
 desc_kar_hispania_restored:0 "Hispania Restored."
 kar_emirate_fraying:0 "Emirate Fraying"
 desc_kar_emirate_fraying:0 "Emirate Fraying."
 kar_berber_garrisons_restive:0 "Restive Garrisons"
 desc_kar_berber_garrisons_restive:0 "Restive Garrisons."
 kar_weak_succession:0 "Weak Succession"
 desc_kar_weak_succession:0 "Weak Succession."
 kar_asturian_reconquista_title:0 "The Reconquista of Asturias and Leon"
 kar_asturian_reconquista_desc:0 "The kings of the north hold the mountains and the Duero. The plains beyond have been Cordoba's for a century and a half, and the empty lands between are the next to be filled."
 kar_asturias_duero_title:0 "Hold the Duero"
 kar_asturias_duero_desc:0 "Settlers and fortresses on the great river. A king who holds Avila holds the road south."
 kar_asturias_portucale_title:0 "Retake Portucale"
 kar_asturias_portucale_desc:0 "Porto and Braganza were Gothic once. Let the western coast be ours again."
 kar_asturias_tagus_title:0 "To the Tagus"
 kar_asturias_tagus_desc:0 "The Tagus and its great harbour at Lisbon. The mountain kingdom becomes an Atlantic one."
 kar_asturias_toledo_title:0 "The City of the Councils"
 kar_asturias_toledo_desc:0 "Toledo was the seat of the Gothic kings. To hold it is to claim their crown."
 kar_asturias_cordoba_title:0 "The Fall of Cordoba"
 kar_asturias_cordoba_desc:0 "The emirs' great city, with its mosque and its treasury, falls to a Christian king."
 kar_asturias_hispania_title:0 "Hispania Restored"
 kar_asturias_hispania_desc:0 "From the Asturian mountains to the Andalusian shore, one king and one crown."
 kar_navarrese_reconquista_title:0 "The Reconquista of Navarra"
 kar_navarrese_reconquista_desc:0 "The Basques have held their mountains against Goth, Frank and Moor. Now the Ebro valley lies open to them."
 kar_navarra_rioja_title:0 "The Rioja Road"
 kar_navarra_rioja_desc:0 "The road down the Ebro begins at Najera."
 kar_navarra_ebro_title:0 "The Ebro Valley"
 kar_navarra_ebro_desc:0 "Saraqustah and the whole river valley, fortified and repopulated."
 kar_navarra_levant_title:0 "The Levant Coast"
 kar_navarra_levant_desc:0 "Valencia and the rich coast, within reach at last."
 kar_navarra_hispania_title:0 "Imperator Hispaniae"
 kar_navarra_hispania_desc:0 "Pamplona's king takes the title of the old emperors and holds Toledo, Saraqustah and Valencia to prove it."
 kar_castilian_reconquista_title:0 "The Reconquista of Castile"
 kar_castilian_reconquista_desc:0 "A march of castles and quarrelling counts becomes the heartland of a kingdom."
 kar_castile_burgos_title:0 "Unite the Castles"
 kar_castile_burgos_desc:0 "Burgos and Castilla la Vieja under one count."
 kar_castile_soria_title:0 "The Frontier of Soria"
 kar_castile_soria_desc:0 "Soria and Madrid, the first holdings south of the mountains."
 kar_castile_toledo_title:0 "Toledo Taken"
 kar_castile_toledo_desc:0 "The ancient capital of the Goths opens its gates to Castile."
 kar_castile_hispania_title:0 "Cordoba and Beyond"
 kar_castile_hispania_desc:0 "Castile holds Toledo and Cordoba, and calls itself Spain."
