 kar_form_lithuania_title:0 "Form Lithuania"
 kar_form_lithuania:0 "Form Lithuania"
 kar_form_lithuania_desc:0 "The tribes of the deep woods have never answered to one high chief, and each hillfort keeps its own gods and customs. Yet one crown over all the Balts would end the age of raiders and tribute-takers from every side. Let us unite the tribes and raise Lithuania among the kingdoms of the world."
