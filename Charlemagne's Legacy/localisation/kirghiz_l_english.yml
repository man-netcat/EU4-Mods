l_english:
 fall_of_kirghiz:0 "The Fall of the Kirghiz Khaganate"
 fall_of_kirghiz_desc:0 "The Khitan have ridden onto the steppe, and the peoples who paid tribute to the Kirghiz khagan no longer fear his horsemen. The great khaganate of the north is breaking into the lands of its peoples."
 fall_of_kirghiz.1.t:0 "The Fall of the Kirghiz Khaganate"
 fall_of_kirghiz.1.d:0 "The Khitan have beaten the khagan's armies, and the chiefs of the western steppe, the Sayan mountains and the Irtysh have begun to look to their own banners. The empire of the Kirghiz is falling apart."
 fall_of_kirghiz.1.a:0 "The khaganate is breaking."
 fall_of_kirghiz.2.t:0 "The Naiman Rise"
 fall_of_kirghiz.2.d:0 "The Naiman of the western Mongolian steppe have thrown off the Kirghiz yoke and raised a khan of their own at the old capital."
 fall_of_kirghiz.2.a:0 "They will not have our land."
 fall_of_kirghiz.3.t:0 "The Tuvans Break Away"
 fall_of_kirghiz.3.d:0 "The Uriankhai of the Tannu mountains have driven out the khagan's governors and chosen a chief of their own."
 fall_of_kirghiz.3.a:0 "They will not have our land."
 fall_of_kirghiz.4.t:0 "The Steppe of Sibir Breaks Away"
 fall_of_kirghiz.4.d:0 "The peoples of the Irtysh and the Om have stopped answering to the khagan and raised a chief at Sibir."
 fall_of_kirghiz.4.a:0 "They will not have our land."
 fall_of_kirghiz.5.t:0 "Dzungaria Reclaimed"
 fall_of_kirghiz.5.d:0 "The Dzungarian lands that the khaganate held pass back to the kingdom of Dzungaria, which has outlasted the khagan."
 fall_of_kirghiz.5.a:0 "Let them go."
 fall_of_kirghiz.6.t:0 "The Steppe Settles"
 fall_of_kirghiz.6.d:0 "The age of the Kirghiz khaganate is over. What remains is the Kirghiz kingdom of the Yenisei, and the peoples that were once its subjects."
 fall_of_kirghiz.6.a:0 "An age has ended."
