l_english:
 kar_form_jin_title:0 "Proclaim the Great Jin"
 kar_form_jin:0 "Proclaim the Great Jin"
 kar_form_jin_desc:0 "The Jurchen tribes of the forests and the rivers have long followed their own chiefs, each guarding his own valley. Yet their riders know no equals, and one banner raised above the tribes would take a golden name, the Great Jin, and answer to no overlord."
