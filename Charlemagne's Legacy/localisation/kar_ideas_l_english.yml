l_english:
 kar_tang_ideas:0 "Tang Ideas"
 kar_tang_ideas_start:0 "Tang Traditions"
 kar_tang_ideas_bonus:0 "Tang Ambition"
 kar_tang_1:0 "The Examination Graduates"
 kar_tang_1_desc:0 "The jinshi examinations lift men of letters, not of birth, into the ministries, and the throne knows whose pen governs."
 kar_tang_2:0 "Remnants of the Equal Field"
 kar_tang_2_desc:0 "What survives of the equal-field allotments still binds peasant households to the land and the levy."
 kar_tang_3:0 "The Grand Canal"
 kar_tang_3_desc:0 "Southern grain and silk reach Chang'an by water, and the capital eats what the Yangzi grows."
 kar_tang_4:0 "Tolls of the Silk Road"
 kar_tang_4_desc:0 "Caravans from Samarkand to Quanzhou pay the emperor's collectors at every gate."
 kar_tang_5:0 "The Frontier Jiedushi"
 kar_tang_5_desc:0 "Military governors hold the passes with armies that know no other lord, and the court pays for their loyalty."
 kar_tang_6:0 "The Palace Army"
 kar_tang_6_desc:0 "The eunuch-led Divine Strategy Army keeps the Son of Heaven's person and drills like no provincial levy."
 kar_tang_7:0 "The Cosmopolitan Capital"
 kar_tang_7_desc:0 "Persians, Sogdians, Uighurs and monks of every faith walk the streets of Chang'an under the emperor's protection."
 kar_abbasid_ideas:0 "Abbasid Ideas"
 kar_abbasid_ideas_start:0 "Abbasid Traditions"
 kar_abbasid_ideas_bonus:0 "Abbasid Ambition"
 kar_abbasid_1:0 "The House of Wisdom"
 kar_abbasid_1_desc:0 "Translators and astronomers in Baghdad gather the learning of Greece, Persia and India under the caliph's patronage."
 kar_abbasid_2:0 "The Diwans"
 kar_abbasid_2_desc:0 "Clerks of the great ministries keep the tax rolls of a hundred provinces in the Round City."
 kar_abbasid_3:0 "The Turkish Guard"
 kar_abbasid_3_desc:0 "Slave soldiers from the steppe, bought young and trained hard, stand between the caliph and his own subjects."
 kar_abbasid_4:0 "Dar al-Islam"
 kar_abbasid_4_desc:0 "One law and one tongue of prayer run from the Atlantic to the Oxus, and merchants carry both."
 kar_abbasid_5:0 "The Dhimma"
 kar_abbasid_5_desc:0 "Christians, Jews and Zoroastrians pay the jizya and keep their courts, and the treasury is the richer for it."
 kar_abbasid_6:0 "The Barid"
 kar_abbasid_6_desc:0 "The caliph's post riders carry news and spies across the roads of the empire in days."
 kar_abbasid_7:0 "Ghazis of the Marches"
 kar_abbasid_7_desc:0 "Volunteers gather at the Cilician frontier each summer, and the raid is half a pilgrimage."
 kar_byzantine_ideas:0 "Roman Ideas"
 kar_byzantine_ideas_start:0 "Roman Traditions"
 kar_byzantine_ideas_bonus:0 "Roman Ambition"
 kar_byzantine_1:0 "The Themes"
 kar_byzantine_1_desc:0 "The empire is divided into provinces under a single strategos, who raises and pays his soldiers from the land."
 kar_byzantine_2:0 "Greek Fire"
 kar_byzantine_2_desc:0 "The siphon on the dromon's prow burns on water and the emperor guards its secret."
 kar_byzantine_3:0 "The Corpus Juris"
 kar_byzantine_3_desc:0 "Justinian's law still decides every suit, and judges who know it are hard to bribe."
 kar_byzantine_4:0 "The Gold Nomisma"
 kar_byzantine_4_desc:0 "The solidus has kept its weight for five hundred years, and the world trades in it."
 kar_byzantine_5:0 "The Taxis"
 kar_byzantine_5_desc:0 "Every office, rank and precedence at court is written down, and every foreign envoy learns his place in it."
 kar_byzantine_6:0 "The Skholai and Tagmata"
 kar_byzantine_6_desc:0 "Professional regiments in the capital are the one army that does not melt away in winter."
 kar_byzantine_7:0 "The Orthodox Mission"
 kar_byzantine_7_desc:0 "Cyril and Methodios have taught the Slavs to read, and every Slav that reads looks to Constantinople."
 kar_japan_ideas:0 "Yamato Ideas"
 kar_japan_ideas_start:0 "Yamato Traditions"
 kar_japan_ideas_bonus:0 "Yamato Ambition"
 kar_japan_1:0 "The Ritsuryo Codes"
 kar_japan_1_desc:0 "Codes copied from Tang assign every household its rice land and its tax, in theory."
 kar_japan_2:0 "The Fujiwara Regents"
 kar_japan_2_desc:0 "One house rules in the emperor's name and stability is bought with its marriages."
 kar_japan_3:0 "Heian Court Culture"
 kar_japan_3_desc:0 "Poetry, perfume and rank fill the capital, and the nobles forget the sword."
 kar_japan_4:0 "Rice and Irrigation"
 kar_japan_4_desc:0 "New paddies and canals feed the provinces and the temples alike."
 kar_japan_5:0 "The Monastic Estates"
 kar_japan_5_desc:0 "Tendai and Shingon monasteries clear the hills and hold them tax-free."
 kar_japan_6:0 "Warrior Households of the East"
 kar_japan_6_desc:0 "In the Kanto provinces mounted bands settle quarrels without waiting for the capital."
 kar_japan_7:0 "The Inland Sea"
 kar_japan_7_desc:0 "Fleets of rice barges and pirates share the water between the islands."
 kar_khazar_ideas:0 "Khazar Ideas"
 kar_khazar_ideas_start:0 "Khazar Traditions"
 kar_khazar_ideas_bonus:0 "Khazar Ambition"
 kar_khazar_1:0 "The Dual Kingship"
 kar_khazar_1_desc:0 "The kagan reigns and the bek rules, and the empire survives the death of either."
 kar_khazar_2:0 "Tribute of the Rus and the Slavs"
 kar_khazar_2_desc:0 "Furs, honey and silver from the northern rivers arrive at Itil each summer."
 kar_khazar_3:0 "The Fortresses of the Don"
 kar_khazar_3_desc:0 "Sarkel and its white-stone sisters guard the portages against Magyar and Rus alike."
 kar_khazar_4:0 "Itil and Samandar"
 kar_khazar_4_desc:0 "The twin capitals sit on the Volga, where every caravan from Bukhara to Kiev must stop."
 kar_khazar_5:0 "Faith of Moses"
 kar_khazar_5_desc:0 "The ruling house has chosen the Law of Moses and tolerates the mosque and the church beside it."
 kar_khazar_6:0 "The Arsiya Guard"
 kar_khazar_6_desc:0 "Muslim professionals serve the kagan for pay and fight in no one's cause but his."
 kar_khazar_7:0 "Horse and Bow of the Pontic Steppe"
 kar_khazar_7_desc:0 "Every Khazar boy rides before he walks and shoots before he reads."
 kar_kirghiz_ideas:0 "Kirghiz Ideas"
 kar_kirghiz_ideas_start:0 "Kirghiz Traditions"
 kar_kirghiz_ideas_bonus:0 "Kirghiz Ambition"
 kar_kirghiz_1:0 "The Victory over the Uighurs"
 kar_kirghiz_1_desc:0 "The destruction of the Uighur khaganate made the Kirghiz masters of the steppe in a single campaign."
 kar_kirghiz_2:0 "Forest and Steppe"
 kar_kirghiz_2_desc:0 "Their ancestors hunt in the taiga and herd on the grass, and neither land can be taken from them."
 kar_kirghiz_3:0 "Ruddy Hair and Green Eyes"
 kar_kirghiz_3_desc:0 "The Tang court counts the Kirghiz kin to the house of Li, and a proud lineage is a claim on the old khaganate."
 kar_kirghiz_4:0 "Iron of the Yenisei"
 kar_kirghiz_4_desc:0 "Smiths of the upper river forge blades the whole steppe wants."
 kar_kirghiz_5:0 "The Fur Roads"
 kar_kirghiz_5_desc:0 "Sable and squirrel travel south to China and west to Itil, and tolls follow."
 kar_kirghiz_6:0 "Tribal Assemblies"
 kar_kirghiz_6_desc:0 "Clan heads meet at the kagan's tent and a decision of the assembly binds all."
 kar_kirghiz_7:0 "Ride to the Tarim"
 kar_kirghiz_7_desc:0 "Kirghiz riders reach the Tien Shan oases in a season and return with silk and slaves."
 kar_srivijaya_ideas:0 "Srivijaya Ideas"
 kar_srivijaya_ideas_start:0 "Srivijaya Traditions"
 kar_srivijaya_ideas_bonus:0 "Srivijaya Ambition"
 kar_srivijaya_1:0 "Lord of the Straits"
 kar_srivijaya_1_desc:0 "No ship passes between Sumatra and Malaya without paying the maharaja's harbour dues."
 kar_srivijaya_2:0 "The Sailendra Alliance"
 kar_srivijaya_2_desc:0 "The sea kings of Java and Palembang share a throne and a fleet."
 kar_srivijaya_3:0 "The Sea Peoples"
 kar_srivijaya_3_desc:0 "The orang laut are fishermen, pilots and pirates by turns, and all serve the maharaja."
 kar_srivijaya_4:0 "Mahayana Pilgrims"
 kar_srivijaya_4_desc:0 "Chinese monks stop at Palembang to study Sanskrit before sailing on to Nalanda."
 kar_srivijaya_5:0 "Entrepot of the Spice Trade"
 kar_srivijaya_5_desc:0 "Pepper, camphor and cloves are stored in the port's warehouses until the monsoon turns."
 kar_srivijaya_6:0 "The Mandala"
 kar_srivijaya_6_desc:0 "A ring of vassal ports owes the maharaja ships and tribute, not obedience."
 kar_srivijaya_7:0 "Gold of Suvarnadvipa"
 kar_srivijaya_7_desc:0 "The Golden Isle's rivers carry dust that pays for the fleet."
 kar_karolingian_empire_ideas:0 "Karolingian Ideas"
 kar_karolingian_empire_ideas_start:0 "Karolingian Traditions"
 kar_karolingian_empire_ideas_bonus:0 "Karolingian Ambition"
 kar_karolingian_empire_1:0 "The Missi Dominici"
 kar_karolingian_empire_1_desc:0 "Counts and bishops ride the empire in pairs to hear complaints and reprove officials in the emperor's name."
 kar_karolingian_empire_2:0 "Capitularies and the Palace School"
 kar_karolingian_empire_2_desc:0 "The emperor's laws are read at assemblies and copied in a clear script by monks educated at his court."
 kar_karolingian_empire_3:0 "The Host of the Franks"
 kar_karolingian_empire_3_desc:0 "The free men of every county muster under their count each spring and march where the emperor leads."
 kar_karolingian_empire_4:0 "The Marches"
 kar_karolingian_empire_4_desc:0 "Margraves hold the frontier with Bretons, Danes, Slavs and Moors and have their own castles and their own wars."
 kar_karolingian_empire_5:0 "Protector of the Church"
 kar_karolingian_empire_5_desc:0 "The emperor crowned by the pope guards Rome and the faith, and expects the Church's help in return."
 kar_karolingian_empire_6:0 "Benefices and Vassalage"
 kar_karolingian_empire_6_desc:0 "Land granted for service binds counts to the emperor by a personal oath."
 kar_karolingian_empire_7:0 "Charlemagne's Legacy"
 kar_karolingian_empire_7_desc:0 "The memory of the first emperor is a sword and a shield: no rival may claim it without a fight."
 kar_west_francia_ideas:0 "West Frankish Ideas"
 kar_west_francia_ideas_start:0 "West Frankish Traditions"
 kar_west_francia_ideas_bonus:0 "West Frankish Ambition"
 kar_west_francia_1:0 "The Edict of Pistres"
 kar_west_francia_1_desc:0 "Charles the Bald orders every river crossing fortified against the Northmen, and a bridge with a tower is a better wall than a march."
 kar_west_francia_2:0 "Counts of the Marches"
 kar_west_francia_2_desc:0 "The marcher lords of Neustria and Flanders raise their own men and pay their own garrisons."
 kar_west_francia_3:0 "The Royal Fisc"
 kar_west_francia_3_desc:0 "Villages of the crown estates feed the court as it travels between Compiegne, Quierzy and Attigny."
 kar_west_francia_4:0 "Hincmar's Coronations"
 kar_west_francia_4_desc:0 "The archbishop of Reims anoints the king with the holy oil and writes that kings may not be deposed lightly."
 kar_west_francia_5:0 "The Court of Charles the Bald"
 kar_west_francia_5_desc:0 "Irish scholars and Greek books at the royal court make the Latin West look to Paris for learning."
 kar_west_francia_6:0 "Heavy Horse of the Franks"
 kar_west_francia_6_desc:0 "The mailed horseman trained from boyhood wins what the foot levy cannot."
 kar_west_francia_7:0 "Vineyards and Mills"
 kar_west_francia_7_desc:0 "The Loire, Seine and Marne carry wine and grain to every market of the realm."
 kar_lotharingia_ideas:0 "Lotharingian Ideas"
 kar_lotharingia_ideas_start:0 "Lotharingian Traditions"
 kar_lotharingia_ideas_bonus:0 "Lotharingian Ambition"
 kar_lotharingia_1:0 "The Middle Kingdom"
 kar_lotharingia_1_desc:0 "Between the sons of Louis the Pious lay the Rhine, the Meuse, the Scheldt and the Rhone, and every road of the empire crossed them."
 kar_lotharingia_2:0 "The Palace at Aachen"
 kar_lotharingia_2_desc:0 "Charlemagne's chapel and bath house make the Lotharingian king the guardian of the imperial memory."
 kar_lotharingia_3:0 "Monasteries of the Meuse"
 kar_lotharingia_3_desc:0 "Stavelot, Prum and Echternach hold libraries and estates that the king can tax or borrow."
 kar_lotharingia_4:0 "Cloth of the Low Countries"
 kar_lotharingia_4_desc:0 "Frisian merchants and Flemish weavers send broadcloth down the Rhine to every fair."
 kar_lotharingia_5:0 "The Emperor's Brother"
 kar_lotharingia_5_desc:0 "Louis II sits in Italy and his backing keeps Lothair's uncles from the border."
 kar_lotharingia_6:0 "Dorestad and the Rhine Mouth"
 kar_lotharingia_6_desc:0 "The great emporium at the river's end draws ships from the North Sea to the king's tolls."
 kar_lotharingia_7:0 "Marches Against Northmen"
 kar_lotharingia_7_desc:0 "The Scheldt and the Meuse have been raided each spring, and counts learn to meet the dragon ships."
 kar_east_francia_ideas:0 "East Frankish Ideas"
 kar_east_francia_ideas_start:0 "East Frankish Traditions"
 kar_east_francia_ideas_bonus:0 "East Frankish Ambition"
 kar_east_francia_1:0 "The Royal Progress"
 kar_east_francia_1_desc:0 "Louis the German rides his realm from Regensburg to Frankfurt, and a king seen is a king obeyed."
 kar_east_francia_2:0 "The Kings Palatinate"
 kar_east_francia_2_desc:0 "The palaces of Frankfurt, Regensburg and Ingelheim hold the assemblies where the great men of the east swear their oaths."
 kar_east_francia_3:0 "The Archbishops of Mainz and Salzburg"
 kar_east_francia_3_desc:0 "The bishops hold the east's Latin learning and its missions among the Slavs."
 kar_east_francia_4:0 "The Marcher Counts"
 kar_east_francia_4_desc:0 "Counts of the Elbe, the Saale and the Danube hold the Slavic frontier with their own retinues."
 kar_east_francia_5:0 "The Host of the Tribes"
 kar_east_francia_5_desc:0 "Franks, Saxons, Swabians and Thuringians muster under their own dukes and fight beside one another."
 kar_east_francia_6:0 "Forests, Mines and Salt"
 kar_east_francia_6_desc:0 "The Harz silver, the Hallstatt salt and the black forests are the crown's own."
 kar_east_francia_7:0 "The German Tongue"
 kar_east_francia_7_desc:0 "A vernacular of many dialects binds the king's subjects more than any capitulary does."
 kar_bavaria_ideas:0 "Bavarian Ideas"
 kar_bavaria_ideas_start:0 "Bavarian Traditions"
 kar_bavaria_ideas_bonus:0 "Bavarian Ambition"
 kar_bavaria_1:0 "The Agilolfing Inheritance"
 kar_bavaria_1_desc:0 "The old ducal house is gone, but its laws and its pride remain with the Bavarian nobility."
 kar_bavaria_2:0 "Regensburg on the Danube"
 kar_bavaria_2_desc:0 "The palace and the river port link the Bavarian king to Pannonia, Bohemia and Byzantium."
 kar_bavaria_3:0 "The Salt of Reichenhall"
 kar_bavaria_3_desc:0 "White gold from the Alpine mines is loaded on the Isar and Inn and sold for silver."
 kar_bavaria_4:0 "The Eastern Marches"
 kar_bavaria_4_desc:0 "Carinthia, Pannonia and the Avar lands are held by counts who ride out against Slavs and Moravians alike."
 kar_bavaria_5:0 "The Bishops of Freising and Passau"
 kar_bavaria_5_desc:0 "Missionaries ride east with Bavarian princes and bring the Slavs under the Church and the crown."
 kar_bavaria_6:0 "Tegernsee and Salzburg"
 kar_bavaria_6_desc:0 "Alpine monasteries copy books and train priests for the whole of the east."
 kar_bavaria_7:0 "Horsemen of the Danube"
 kar_bavaria_7_desc:0 "Bavarian knights ride Avar-bred horses and fight like the nomads they replaced."
 kar_italy_ideas:0 "Italian Ideas"
 kar_italy_ideas_start:0 "Italian Traditions"
 kar_italy_ideas_bonus:0 "Italian Ambition"
 kar_italy_1:0 "Emperor Louis II"
 kar_italy_1_desc:0 "The one Carolingian who rules Italy has the Roman imperial crown, and every Italian lord knows it."
 kar_italy_2:0 "Pavia the Capital"
 kar_italy_2_desc:0 "The Lombard palace in Pavia is the seat of a court whose law runs back to Rothari."
 kar_italy_3:0 "The Lombard Law"
 kar_italy_3_desc:0 "Edicts older than the Franks decide every suit in the north, and judges honour them."
 kar_italy_4:0 "The Po Valley"
 kar_italy_4_desc:0 "Mills, vineyards and flax fields along the great river feed the kingdom's cities."
 kar_italy_5:0 "The Wars Against the Saracens"
 kar_italy_5_desc:0 "Muslim emirs hold Bari and Taranto, and the Italian host learns to fight them in the south."
 kar_italy_6:0 "Trading Ports of the Adriatic"
 kar_italy_6_desc:0 "Venetian, Amalfitan and Ravennate merchants carry Eastern goods to every Lombard market."
 kar_italy_7:0 "The Holy See at Rome"
 kar_italy_7_desc:0 "The pope crowns the emperor and expects obedience in return, but Italy's lords profit from both."
 kar_navarra_ideas:0 "Navarrese Ideas"
 kar_navarra_ideas_start:0 "Navarrese Traditions"
 kar_navarra_ideas_bonus:0 "Navarrese Ambition"
 kar_navarra_1:0 "The Passes of the Pyrenees"
 kar_navarra_1_desc:0 "The mountains that turned back Charlemagne's rearguard are the kingdom's gate and its wall."
 kar_navarra_2:0 "The Banu Qasi Alliance"
 kar_navarra_2_desc:0 "Muslim lords of Tudela are Pamplona's kin by marriage and its allies against Cordoba."
 kar_navarra_3:0 "Infanzones and Fueros"
 kar_navarra_3_desc:0 "Free landowners swear to the king in return for their own laws and exemptions."
 kar_navarra_4:0 "The Basque Tongue and Law"
 kar_navarra_4_desc:0 "An old language and customs older than Rome mark every Navarrese as one people."
 kar_navarra_5:0 "Shepherds and Iron"
 kar_navarra_5_desc:0 "Herds of the high pastures and forges of the valleys fill the royal storehouses."
 kar_navarra_6:0 "Light Horse of the Foothills"
 kar_navarra_6_desc:0 "Basque riders skirmish in mountain scrub and strike where the enemy cannot follow."
 kar_navarra_7:0 "The Arista Line"
 kar_navarra_7_desc:0 "The kings of Pamplona claim descent from Iñigo Arista and the legitimacy of a house that has held its throne against all comers."
 kar_brittany_ideas:0 "Breton Ideas"
 kar_brittany_ideas_start:0 "Breton Traditions"
 kar_brittany_ideas_bonus:0 "Breton Ambition"
 kar_brittany_1:0 "The Victory at Ballon"
 kar_brittany_1_desc:0 "The Breton host crushed Charles the Bald's army in 845, and no Frankish king has forced them to pay since."
 kar_brittany_2:0 "Javelin and Horse"
 kar_brittany_2_desc:0 "The Bretons fight with light cavalry and darts, and strike and withdraw before a Frankish host can form."
 kar_brittany_3:0 "The Peasant Plou"
 kar_brittany_3_desc:0 "Clans of free farmers, the plou, give Brittany a population that will not be taxed twice."
 kar_brittany_4:0 "The Monastery of Redon"
 kar_brittany_4_desc:0 "Abbot Conwoion's charters record Breton law and land in a script the Franks respect."
 kar_brittany_5:0 "Saints of the Isle"
 kar_brittany_5_desc:0 "Brythonic saints and their holy wells hold a Christian land where no bishop of Tours rules."
 kar_brittany_6:0 "Cornish Tin and Channel Trade"
 kar_brittany_6_desc:0 "Ships carry tin, salt and cloth between Brittany, Cornwall and Wales."
 kar_brittany_7:0 "Coast of the Armorican Sea"
 kar_brittany_7_desc:0 "Breton sailors know the reefs of Ushant and Finistere and raid or trade as the season requires."
 kar_asturias_ideas:0 "Asturian Ideas"
 kar_asturias_ideas_start:0 "Asturian Traditions"
 kar_asturias_ideas_bonus:0 "Asturian Ambition"
 kar_asturias_1:0 "Covadonga"
 kar_asturias_1_desc:0 "The cave where Pelayo broke the Moors is the founding story of every Asturian king and the reason they fight."
 kar_asturias_2:0 "The Gothic Succession"
 kar_asturias_2_desc:0 "Alfonso III claims the Visigothic crown and the legitimacy of Toledo for a kingdom of mountain valleys."
 kar_asturias_3:0 "The Presura"
 kar_asturias_3_desc:0 "Settlers who clear and hold empty land on the Duero keep it by right, and the frontier fills with armed farmers."
 kar_asturias_4:0 "Castles of the Frontier"
 kar_asturias_4_desc:0 "Towers and walls on every ridge hold the new land against Cordoban raiders."
 kar_asturias_5:0 "Mozarabs from the South"
 kar_asturias_5_desc:0 "Christians fleeing Muslim persecution bring books, craftsmen and a hatred of Cordoba."
 kar_asturias_6:0 "The Camino of Santiago"
 kar_asturias_6_desc:0 "The newly found tomb of the Apostle draws pilgrims and gold to Galicia."
 kar_asturias_7:0 "Infanzones and Hidalgos"
 kar_asturias_7_desc:0 "Landed warriors who answer to the king alone ride when summoned and need no wages."
 kar_galicia_ideas:0 "Galician Ideas"
 kar_galicia_ideas_start:0 "Galician Traditions"
 kar_galicia_ideas_bonus:0 "Galician Ambition"
 kar_galicia_1:0 "Finis Terrae"
 kar_galicia_1_desc:0 "At the end of the known world the Galicians fish, sail and raid the Atlantic coast."
 kar_galicia_2:0 "The Suevic Memory"
 kar_galicia_2_desc:0 "The kingdom of the Suebi lasted two centuries, and Galicians do not forget they once ruled themselves."
 kar_galicia_3:0 "The Apostle's City"
 kar_galicia_3_desc:0 "Santiago's cathedral and its pilgrims make the see of Compostela as rich as a kingdom."
 kar_galicia_4:0 "Hills and Hamlets"
 kar_galicia_4_desc:0 "Galician farmers live in scattered villages in rain-soaked hills that no army can hold."
 kar_galicia_5:0 "Atlantic Fisheries"
 kar_galicia_5_desc:0 "Whales, sardines and salt fish make the Rias a larder for the whole north."
 kar_galicia_6:0 "Hidalgos of the Hills"
 kar_galicia_6_desc:0 "Petty gentry guard their fields, fight for the king and ask little in return."
 kar_galicia_7:0 "Counts Against the Northmen"
 kar_galicia_7_desc:0 "Vikings have raided the Galician shore since 844, and its counts learn to answer fire with steel."
 kar_al_andalus_ideas:0 "Andalusi Ideas"
 kar_al_andalus_ideas_start:0 "Andalusi Traditions"
 kar_al_andalus_ideas_bonus:0 "Andalusi Ambition"
 kar_al_andalus_1:0 "The Great Mosque of Cordoba"
 kar_al_andalus_1_desc:0 "The Umayyad emirs build and rebuild their mosque to show the world a throne that rivals Baghdad's."
 kar_al_andalus_2:0 "Irrigation of the Vega"
 kar_al_andalus_2_desc:0 "Roman aqueducts, Arab waterwheels and Berber canals water fields from Valencia to Seville."
 kar_al_andalus_3:0 "The Slav Guard"
 kar_al_andalus_3_desc:0 "Saqaliba slaves and Berber mercenaries serve the emir for pay and fear his courtiers more than his generals."
 kar_al_andalus_4:0 "The Frontier Marches"
 kar_al_andalus_4_desc:0 "The Upper, Middle and Lower Marches are held by lords whose loyalty is bought with titles and tax farms."
 kar_al_andalus_5:0 "Muladis and Mozarabs"
 kar_al_andalus_5_desc:0 "Converts and Christians under the emir pay taxes, serve as clerks and sometimes rebel."
 kar_al_andalus_6:0 "Silks, Leather and Glass"
 kar_al_andalus_6_desc:0 "Cordovan workshops send fine goods to Egypt and Baghdad by way of Almeria."
 kar_al_andalus_7:0 "The Poets and Physicians"
 kar_al_andalus_7_desc:0 "Scholars from Baghdad and Kairouan teach in Cordoba, and the emir hires them."
 kar_egypt_ideas:0 "Egyptian Ideas"
 kar_egypt_ideas_start:0 "Egyptian Traditions"
 kar_egypt_ideas_bonus:0 "Egyptian Ambition"
 kar_egypt_1:0 "The Nile Flood"
 kar_egypt_1_desc:0 "The river rises and falls with the year, and the whole realm lives or starves by its gauge."
 kar_egypt_2:0 "Fustat and the Nilometer"
 kar_egypt_2_desc:0 "The governor's capital measures the flood on Roda island and sets the tax before the harvest."
 kar_egypt_3:0 "The Coptic Scribes"
 kar_egypt_3_desc:0 "Christian clerks keep the accounts of Egypt as their fathers kept them for Pharaoh and Caesar."
 kar_egypt_4:0 "Papyrus, Flax and Linen"
 kar_egypt_4_desc:0 "Alexandria's looms and the Fayyum's fields clothe and write for the Mediterranean world."
 kar_egypt_5:0 "The Red Sea and the Spice Road"
 kar_egypt_5_desc:0 "Pilgrim ships to Jeddah and Indian merchantmen deliver pepper and silk to the Delta."
 kar_egypt_6:0 "Turkish Troopers"
 kar_egypt_6_desc:0 "Soldiers raised in the steppe and trained at the barracks of Fustat ride under the governor's banner."
 kar_egypt_7:0 "The Alexandrian Pharos"
 kar_egypt_7_desc:0 "The beacon and the harbour of the old Ptolemaic capital still guide ships from Crete and Tunis."
 kar_great_moravia_ideas:0 "Moravian Ideas"
 kar_great_moravia_ideas_start:0 "Moravian Traditions"
 kar_great_moravia_ideas_bonus:0 "Moravian Ambition"
 kar_great_moravia_1:0 "The Hillforts"
 kar_great_moravia_1_desc:0 "Earth-and-timber hradiska on every river valley hold the land against Frankish raiders."
 kar_great_moravia_2:0 "The Apostles to the Slavs"
 kar_great_moravia_2_desc:0 "Cyril and Methodius arrive in 863, bringing a script, a liturgy and a Slavic church of Moravia's own."
 kar_great_moravia_3:0 "Prince Rastislav's Council"
 kar_great_moravia_3_desc:0 "The prince governs with the zupans, who lead their own retinues and sit in his council."
 kar_great_moravia_4:0 "The Slavic Liturgy"
 kar_great_moravia_4_desc:0 "A Slavic Mass and Slavic writings make a Moravian priest a subject of the prince rather than of Salzburg."
 kar_great_moravia_5:0 "Amber and Slaves on the Road"
 kar_great_moravia_5_desc:0 "The Amber Road from the Baltic passes through the prince's land to Venice and Byzantium."
 kar_great_moravia_6:0 "Heavy Slavic Spears"
 kar_great_moravia_6_desc:0 "The prince's druzhina carries swords forged in Moravian smithies and fights on foot in the old way."
 kar_great_moravia_7:0 "Alliance with the Eastern Emperor"
 kar_great_moravia_7_desc:0 "The emperor in Constantinople sends gifts and priests to a prince who holds the East Franks at bay."
 kar_bulgaria_ideas:0 "Bulgarian Ideas"
 kar_bulgaria_ideas_start:0 "Bulgarian Traditions"
 kar_bulgaria_ideas_bonus:0 "Bulgarian Ambition"
 kar_bulgaria_1:0 "Khan Boris and the New Faith"
 kar_bulgaria_1_desc:0 "Boris was baptised in 864, and his boyars must learn to be both Bulgars and Christians."
 kar_bulgaria_2:0 "The Boyar Council"
 kar_bulgaria_2_desc:0 "The great boyars hold the khan's army in their hands and his throne in their favour."
 kar_bulgaria_3:0 "Slavs and Bulgars"
 kar_bulgaria_3_desc:0 "A Turkic warrior caste has merged with the Slavic villages, and the khan rules both."
 kar_bulgaria_4:0 "The Great Ditches of the Balkan"
 kar_bulgaria_4_desc:0 "The Erkesiya earthwork and the Pliska ramparts hold the Byzantine road along the Balkan range."
 kar_bulgaria_5:0 "The Khan's Horsemen"
 kar_bulgaria_5_desc:0 "Bulgar horse archers and lancers have defeated an emperor and carried off his skull cup."
 kar_bulgaria_6:0 "Pliska the Capital"
 kar_bulgaria_6_desc:0 "The khan's palace of earth and stone replaces the felt tents of the steppe with a court."
 kar_bulgaria_7:0 "Black Sea Trade"
 kar_bulgaria_7_desc:0 "The Danube and the Black Sea ports ship wheat, wax and slaves to Constantinople."
 kar_magyars_ideas:0 "Magyar Ideas"
 kar_magyars_ideas_start:0 "Magyar Traditions"
 kar_magyars_ideas_bonus:0 "Magyar Ambition"
 kar_magyars_1:0 "The Seven Tribes"
 kar_magyars_1_desc:0 "Seven tribes swore a blood oath and chose a leader, and the Magyar host moves as one body."
 kar_magyars_2:0 "The Horse Archer"
 kar_magyars_2_desc:0 "A Magyar horseman shoots from the saddle at the gallop and feigns flight to draw the enemy on."
 kar_magyars_3:0 "Kende and Gyula"
 kar_magyars_3_desc:0 "A sacred king and a war leader split the rule, and neither can seize all power."
 kar_magyars_4:0 "The Pontic Pastures"
 kar_magyars_4_desc:0 "The grass between the Don and the Danube feeds herds without end."
 kar_magyars_5:0 "The Raid on Pannonia"
 kar_magyars_5_desc:0 "Magyar bands cross the Carpathians each summer and return laden with captives and silver."
 kar_magyars_6:0 "The Taltos Shamans"
 kar_magyars_6_desc:0 "The seer and the drum guide the tribes in choosing the day for war and the place for the camp."
 kar_magyars_7:0 "Silver and Slaves"
 kar_magyars_7_desc:0 "Magyar raiders sell their captives at Byzantine and Khazar markets for silver and silk."
 kar_wessex_ideas:0 "West Saxon Ideas"
 kar_wessex_ideas_start:0 "West Saxon Traditions"
 kar_wessex_ideas_bonus:0 "West Saxon Ambition"
 kar_wessex_1:0 "The Burhs"
 kar_wessex_1_desc:0 "Fortified towns, each a day's march from the next, give every shire a refuge against the Danes."
 kar_wessex_2:0 "The Fyrd"
 kar_wessex_2_desc:0 "The free men of each shire serve in rotation, and the harvest is never left unreaped."
 kar_wessex_3:0 "The Shire and the Reeve"
 kar_wessex_3_desc:0 "A reeve in every shire collects the king's dues and keeps the peace."
 kar_wessex_4:0 "The King's Law Codes"
 kar_wessex_4_desc:0 "Alfred the Great copies and enlarges the laws of Ine and Offa and swears his judges to them."
 kar_wessex_5:0 "Alfred's Translations"
 kar_wessex_5_desc:0 "Latin works are put into English by order of the king, and his thegns are taught to read."
 kar_wessex_6:0 "The Longships"
 kar_wessex_6_desc:0 "A West Saxon fleet of new, taller ships meets the Danes at sea."
 kar_wessex_7:0 "The Wool of the Downs"
 kar_wessex_7_desc:0 "Sheep on the chalk uplands supply the weavers of Winchester and the merchants of London."
 kar_northumbria_ideas:0 "Northumbrian Ideas"
 kar_northumbria_ideas_start:0 "Northumbrian Traditions"
 kar_northumbria_ideas_bonus:0 "Northumbrian Ambition"
 kar_northumbria_1:0 "Bede's Land"
 kar_northumbria_1_desc:0 "The monk of Jarrow wrote the history of the English people, and Northumbrians know they were once their masters."
 kar_northumbria_2:0 "The Lindisfarne Gospels"
 kar_northumbria_2_desc:0 "The illuminated book of Eadfrith and its monastery are the pride of the north and the treasure of its bishops."
 kar_northumbria_3:0 "The Danish Neighbour"
 kar_northumbria_3_desc:0 "The Vikings of Jorvik rule half of the kingdom and trade and quarrel with the other half."
 kar_northumbria_4:0 "The Wall and the Border"
 kar_northumbria_4_desc:0 "The old Roman wall and the ridges of the Cheviots mark a border that shepherds and reivers still cross."
 kar_northumbria_5:0 "Coal, Lead and Wool"
 kar_northumbria_5_desc:0 "Northumbrian mines and sheep walks supply the monasteries and the king's smiths."
 kar_northumbria_6:0 "Warrior Thegns"
 kar_northumbria_6_desc:0 "A great lord's retinue rides at his side and shields the kingdom's northern road."
 kar_northumbria_7:0 "The Humber Ports"
 kar_northumbria_7_desc:0 "Merchants of York ship cloth and slaves to Frisia and Norway."
 kar_mercia_ideas:0 "Mercian Ideas"
 kar_mercia_ideas_start:0 "Mercian Traditions"
 kar_mercia_ideas_bonus:0 "Mercian Ambition"
 kar_mercia_1:0 "Offa's Dyke"
 kar_mercia_1_desc:0 "The long earthwork from the Dee to the Wye marks the border and the memory of a king."
 kar_mercia_2:0 "The Fyrd of the Midlands"
 kar_mercia_2_desc:0 "Mercian levies are the largest in England and the cheapest to call."
 kar_mercia_3:0 "The Mercian Supremacy"
 kar_mercia_3_desc:0 "Offa and Coenwulf ruled all England south of the Humber, and Mercia's lords claim the title again."
 kar_mercia_4:0 "Pennies of Offa"
 kar_mercia_4_desc:0 "Mercian silver pennies set the pattern of the coinage of England."
 kar_mercia_5:0 "The Watling Street"
 kar_mercia_5_desc:0 "The Roman road is the spine of the kingdom and carries its army, its merchants and its law."
 kar_mercia_6:0 "The Danelaw Wars"
 kar_mercia_6_desc:0 "Danes hold the east of Mercia and its thegns have fought them for two generations."
 kar_mercia_7:0 "Church of Lichfield"
 kar_mercia_7_desc:0 "The archbishopric of Lichfield, short lived, left Mercia a proud church and a loyal clergy."
 kar_alba_ideas:0 "Alban Ideas"
 kar_alba_ideas_start:0 "Alban Traditions"
 kar_alba_ideas_bonus:0 "Alban Ambition"
 kar_alba_1:0 "The Union of Picts and Scots"
 kar_alba_1_desc:0 "Kenneth mac Alpin's kingdom joins two peoples under the stone of Scone."
 kar_alba_2:0 "Highland Fastnesses"
 kar_alba_2_desc:0 "The glens and lochs of the north make a campaign against the king a winter's torment."
 kar_alba_3:0 "The Columban Church"
 kar_alba_3_desc:0 "The monks of Iona and Dunkeld hold the learning and the loyalty of Alba."
 kar_alba_4:0 "The Mormaers"
 kar_alba_4_desc:0 "Provincial lords raise the host of their land and answer to the king alone."
 kar_alba_5:0 "The Cattle and the Raids"
 kar_alba_5_desc:0 "Herds are wealth, and every spring the glens' young men ride out for more."
 kar_alba_6:0 "Fishing Boats of the Firth"
 kar_alba_6_desc:0 "Pictish boats work the Firths of Forth and Tay and the Atlantic sea lochs."
 kar_alba_7:0 "Gaelic Learning and Law"
 kar_alba_7_desc:0 "Poets and judges of the old Irish schools teach the law of tanistry and the oath of kinship."
 kar_uppland_ideas:0 "Svear Ideas"
 kar_uppland_ideas_start:0 "Svear Traditions"
 kar_uppland_ideas_bonus:0 "Svear Ambition"
 kar_uppland_1:0 "The Thing at Uppsala"
 kar_uppland_1_desc:0 "Free men gather at Uppsala to hear the law and elect the king."
 kar_uppland_2:0 "The Ledung"
 kar_uppland_2_desc:0 "Each hundred owes the king a ship and its crew, and the fleet rises at the first call."
 kar_uppland_3:0 "Birka"
 kar_uppland_3_desc:0 "The trading port on the Malaren draws merchants from Hedeby, Dorestad and Novgorod."
 kar_uppland_4:0 "The Temple at Uppsala"
 kar_uppland_4_desc:0 "The great pagan feast at Uppsala draws the whole of Svealand every nine years."
 kar_uppland_5:0 "Iron of the Bergslagen"
 kar_uppland_5_desc:0 "Swedish smiths produce bar iron and blades for all the north."
 kar_uppland_6:0 "Eastern Voyages"
 kar_uppland_6_desc:0 "Swedish traders and warriors sail the rivers to Russia and Byzantium and bring home silver."
 kar_uppland_7:0 "Forests and Fjords"
 kar_uppland_7_desc:0 "Sweden's long winters and dense woods protect it from any invader."
 kar_novgorod_ideas:0 "Novgorodian Ideas"
 kar_novgorod_ideas_start:0 "Novgorodian Traditions"
 kar_novgorod_ideas_bonus:0 "Novgorodian Ambition"
 kar_novgorod_1:0 "The Rurikid Invitation"
 kar_novgorod_1_desc:0 "The Slavs and Finns of the north invited Rurik to rule and keep the peace, and his house stays to earn its place."
 kar_novgorod_2:0 "The Veche"
 kar_novgorod_2_desc:0 "The city assembly rings its bell and the people of the town decide, and no prince governs without them."
 kar_novgorod_3:0 "Ladoga and the Volkhov Route"
 kar_novgorod_3_desc:0 "The river from the Baltic to the interior passes Ladoga's walls and pays its toll."
 kar_novgorod_4:0 "Furs, Wax and Honey"
 kar_novgorod_4_desc:0 "Forest hunters bring sable, wax and honey to the town, and merchants send them south."
 kar_novgorod_5:0 "Varangian Retinue"
 kar_novgorod_5_desc:0 "Norse warriors under the prince guard the city and ride on distant campaigns for pay and plunder."
 kar_novgorod_6:0 "River Craft"
 kar_novgorod_6_desc:0 "Dugout boats carry men and trade goods over portages from the Baltic to the Black Sea."
 kar_novgorod_7:0 "Tribute from Slavs and Finns"
 kar_novgorod_7_desc:0 "Chud, Ves, Meryans and Krivichi pay the prince tribute in furs and silver."
 kar_kiev_ideas:0 "Kievan Ideas"
 kar_kiev_ideas_start:0 "Kievan Traditions"
 kar_kiev_ideas_bonus:0 "Kievan Ambition"
 kar_kiev_1:0 "The Hill of Kiev"
 kar_kiev_1_desc:0 "The fortress above the Dnieper commands the road from the Baltic to the Black Sea."
 kar_kiev_2:0 "The Road from the Varangians to the Greeks"
 kar_kiev_2_desc:0 "The river route from Novgorod to Constantinople is the greatest trade road of the north."
 kar_kiev_3:0 "The Druzhina"
 kar_kiev_3_desc:0 "The prince's sworn warband eats at his table and dies at his side."
 kar_kiev_4:0 "Raids on Constantinople"
 kar_kiev_4_desc:0 "Rus flotillas crossed the Black Sea and appeared before the walls of the Emperor's city."
 kar_kiev_5:0 "Tribute from the Polyane and the Drevlyane"
 kar_kiev_5_desc:0 "Slavic tribes along the Dnieper pay the prince in furs and grain."
 kar_kiev_6:0 "Khazar Tribute"
 kar_kiev_6_desc:0 "The Rus first pay the Khazar kagan, then learn to charge their neighbours the same."
 kar_kiev_7:0 "Pagan Rus Gods"
 kar_kiev_7_desc:0 "Perun and Veles are sworn upon in every treaty the prince makes."
 kar_sjaelland_ideas:0 "Danish Ideas"
 kar_sjaelland_ideas_start:0 "Danish Traditions"
 kar_sjaelland_ideas_bonus:0 "Danish Ambition"
 kar_sjaelland_1:0 "The Danevirke"
 kar_sjaelland_1_desc:0 "The great earthwork across the base of Jutland shuts out the Franks and Saxons at one stroke."
 kar_sjaelland_2:0 "Hedeby the Port"
 kar_sjaelland_2_desc:0 "The market on the Schlei draws Frisian, Slavic and Arab merchants who pay the king in silver."
 kar_sjaelland_3:0 "The Longship Fleet"
 kar_sjaelland_3_desc:0 "Fleets of dragon ships carry Danes to the Seine, the Thames and the Mediterranean."
 kar_sjaelland_4:0 "The Thing and the Hirdmen"
 kar_sjaelland_4_desc:0 "Free farmers meet to judge, and the king's hird fights for him in war."
 kar_sjaelland_5:0 "Raids on Frankia"
 kar_sjaelland_5_desc:0 "A Danish chief can win a dukedom by one good season on the Loire."
 kar_sjaelland_6:0 "The Island Kingdom"
 kar_sjaelland_6_desc:0 "Zealand, Fyn and Scania guard one another by water."
 kar_sjaelland_7:0 "Kings of the Danes"
 kar_sjaelland_7_desc:0 "The house of Ragnar and Godfred gives the Danes a royal line older than any in the north."
 kar_jylland_ideas:0 "Jutish Ideas"
 kar_jylland_ideas_start:0 "Jutish Traditions"
 kar_jylland_ideas_bonus:0 "Jutish Ambition"
 kar_jylland_1:0 "The Jutland Peninsula"
 kar_jylland_1_desc:0 "The long arm of Denmark lies between two seas and commands the road from the Baltic to the North Sea."
 kar_jylland_2:0 "The Ox Road"
 kar_jylland_2_desc:0 "Cattle drovers walk the Hærvejen to the markets of Hamburg and Dorestad."
 kar_jylland_3:0 "Hedeby and Ribe"
 kar_jylland_3_desc:0 "The twin ports of Jutland sell the goods of the whole of the north."
 kar_jylland_4:0 "Warriors of the Thing"
 kar_jylland_4_desc:0 "The free landholders of Jutland answer the horn and bring their own arms."
 kar_jylland_5:0 "Heath and Marsh"
 kar_jylland_5_desc:0 "The wet moors and heathlands of the west break any slow-moving army."
 kar_jylland_6:0 "The Danevirke Garrison"
 kar_jylland_6_desc:0 "A standing guard keeps the wall and the gate against Saxon raiders."
 kar_jylland_7:0 "Skalds and Rune Stones"
 kar_jylland_7_desc:0 "Poets and carvers record the kings of Jutland in verse and stone."
 kar_papacy_ideas:0 "Papal Ideas"
 kar_papacy_ideas_start:0 "Papal Traditions"
 kar_papacy_ideas_bonus:0 "Papal Ambition"
 kar_papacy_1:0 "The Patrimony of St Peter"
 kar_papacy_1_desc:0 "The lands around Rome and Ravenna belong to the Apostle, and the pope draws rent and obedience from them."
 kar_papacy_2:0 "Pope Nicholas the Great"
 kar_papacy_2_desc:0 "Nicholas I claims that no emperor, bishop or council can bind the Holy See, and the Frankish kings yield."
 kar_papacy_3:0 "The Lateran Chancery"
 kar_papacy_3_desc:0 "The chancery's letters and decrees reach every bishop in the West and settle disputes between kings."
 kar_papacy_4:0 "The Roman Schools"
 kar_papacy_4_desc:0 "Churchmen in Rome copy the fathers of the Church and teach the rites of the Roman Mass to pilgrims."
 kar_papacy_5:0 "The Leonine Wall"
 kar_papacy_5_desc:0 "Pope Leo IV walled the Vatican hill against the Saracens, and the city has withstood raids ever since."
 kar_papacy_6:0 "Legates and Missionaries"
 kar_papacy_6_desc:0 "Papal envoys travel to Constantinople, Bulgaria and Moravia and bring news of the pope's will."
 kar_papacy_7:0 "The Peter's Pence"
 kar_papacy_7_desc:0 "Pilgrims leave offerings at the tomb of the Apostle and kings send gifts to be remembered."
 kar_venice_ideas:0 "Venetian Ideas"
 kar_venice_ideas_start:0 "Venetian Traditions"
 kar_venice_ideas_bonus:0 "Venetian Ambition"
 kar_venice_1:0 "The Lagoon"
 kar_venice_1_desc:0 "A ring of shifting sandbanks and marshes protects the islands better than a wall."
 kar_venice_2:0 "The Doge and the Assembly"
 kar_venice_2_desc:0 "The people of the lagoon elect their doge and swear him to the laws of Venice."
 kar_venice_3:0 "Salt Pans of the Lagoon"
 kar_venice_3_desc:0 "Salt gathered in the shallows is the first good Venice sells to the mainland."
 kar_venice_4:0 "The Merchants of Rialto"
 kar_venice_4_desc:0 "Families of traders draw up contracts, share risk and send convoys to Alexandria and Constantinople."
 kar_venice_5:0 "Between Two Empires"
 kar_venice_5_desc:0 "Venice sells to Byzantium, to the Franks and to the Muslims, and takes sides only when she must."
 kar_venice_6:0 "The Relics of St Mark"
 kar_venice_6_desc:0 "The Evangelist's body, stolen from Alexandria in 828, makes Venice a holy city in her own right."
 kar_venice_7:0 "War Galleys of the Adriatic"
 kar_venice_7_desc:0 "Venetian crews chase Narentine pirates off the Dalmatian coast and keep the Adriatic open."
 kar_armenia_ideas:0 "Armenian Ideas"
 kar_armenia_ideas_start:0 "Armenian Traditions"
 kar_armenia_ideas_bonus:0 "Armenian Ambition"
 kar_armenia_1:0 "The Nakharar Houses"
 kar_armenia_1_desc:0 "Great families hold the valleys by hereditary right, and the prince of princes rules by their consent."
 kar_armenia_2:0 "The Bagratid Prince"
 kar_armenia_2_desc:0 "Ashot Bagratuni's recognition as prince of princes unites the highland lords under one family."
 kar_armenia_3:0 "Mountain Fortresses"
 kar_armenia_3_desc:0 "Castles on crags and monasteries behind walls make every valley a citadel."
 kar_armenia_4:0 "The Apostolic Church"
 kar_armenia_4_desc:0 "The church of Saint Gregory the Illuminator holds the nation's language and law against Caliph and Emperor alike."
 kar_armenia_5:0 "The Silk Road through Dvin"
 kar_armenia_5_desc:0 "Caravans between Constantinople, Persia and the Caucasus stop at Dvin and pay the prince's tolls."
 kar_armenia_6:0 "Armenian Cavalry"
 kar_armenia_6_desc:0 "Heavy horsemen with lances from the highland nobility have served both Rome and Persia."
 kar_armenia_7:0 "Buffer Between Empires"
 kar_armenia_7_desc:0 "The prince plays Caliph against Emperor and takes tribute from both."
 kar_aquitaine_ideas:0 "Aquitanian Ideas"
 kar_aquitaine_ideas_start:0 "Aquitanian Traditions"
 kar_aquitaine_ideas_bonus:0 "Aquitanian Ambition"
 kar_aquitaine_1:0 "The Kingdom of Aquitaine"
 kar_aquitaine_1_desc:0 "The Carolingian sub-kingdom keeps its own court, law and nobility, and refuses to be a mere province."
 kar_aquitaine_2:0 "The Gascon Marches"
 kar_aquitaine_2_desc:0 "Basque and Gascon lords guard the passes and raid the Moors across the mountains."
 kar_aquitaine_3:0 "The Garonne Vineyards"
 kar_aquitaine_3_desc:0 "Wine from Bordeaux and the Gironde fills barrels for the north and the sea."
 kar_aquitaine_4:0 "Roman Law of the South"
 kar_aquitaine_4_desc:0 "Roman and Visigothic law remains in force south of the Loire, and its judges are learned."
 kar_aquitaine_5:0 "The Pilgrim Road"
 kar_aquitaine_5_desc:0 "Travellers to Compostela cross Aquitaine and spend their coin in its towns."
 kar_aquitaine_6:0 "Counts of Toulouse and Poitiers"
 kar_aquitaine_6_desc:0 "Powerful counts hold their own armies and parley with the king as equals."
 kar_aquitaine_7:0 "Atlantic Ports"
 kar_aquitaine_7_desc:0 "La Rochelle, Bordeaux and Bayonne ship salt, wine and wool to Brittany and England."
 kar_angria_ideas:0 "Saxon Ideas"
 kar_angria_ideas_start:0 "Saxon Traditions"
 kar_angria_ideas_bonus:0 "Saxon Ambition"
 kar_angria_1:0 "The Old Saxon Law"
 kar_angria_1_desc:0 "Saxons keep their ancient customs under the Carolingian crown, and judge by Saxon law."
 kar_angria_2:0 "The Liudolfing House"
 kar_angria_2_desc:0 "The family of Duke Liudolf is first among Saxon nobles, and the king's friend and rival."
 kar_angria_3:0 "The Free Peasant Levy"
 kar_angria_3_desc:0 "Saxon freeholders keep their arms and march with their lord on any campaign."
 kar_angria_4:0 "The Harz Mines"
 kar_angria_4_desc:0 "Silver and copper from the mountains pay for horses and weapons."
 kar_angria_5:0 "The Elbe Frontier"
 kar_angria_5_desc:0 "Saxon counts fight the Wends and Obotrites across the river with fortresses and cavalry raids."
 kar_angria_6:0 "Corvey and Gandersheim"
 kar_angria_6_desc:0 "Monastic schools preserve Saxon legends and teach Saxon boys to read Latin."
 kar_angria_7:0 "Forests and Marshes"
 kar_angria_7_desc:0 "The woods of the Weser and the marshes of the Elbe swallow slow armies."
 kar_flanders_ideas:0 "Flemish Ideas"
 kar_flanders_ideas_start:0 "Flemish Traditions"
 kar_flanders_ideas_bonus:0 "Flemish Ambition"
 kar_flanders_1:0 "Count Baldwin Iron-Arm"
 kar_flanders_1_desc:0 "Baldwin eloped with Charles the Bald's daughter in 862 and was made Count of Flanders as the price of peace."
 kar_flanders_2:0 "Fortified Ghent and Bruges"
 kar_flanders_2_desc:0 "Walled towns and castles on the dunes hold the coast against Viking raiders."
 kar_flanders_3:0 "Cloth of the Lys and Scheldt"
 kar_flanders_3_desc:0 "Flemish weavers work English wool into cloth traded as far as Italy."
 kar_flanders_4:0 "The North Sea Coast"
 kar_flanders_4_desc:0 "Sailors of Flanders and Frisia sail to the Thames and the Elbe in flat-bottomed craft."
 kar_flanders_5:0 "The Polders"
 kar_flanders_5_desc:0 "Dikes and drainage ditches win new land from the sea."
 kar_flanders_6:0 "Abbeys of Saint-Bertin"
 kar_flanders_6_desc:0 "Rich abbeys keep the books and law of the county and train its clerks."
 kar_flanders_7:0 "Footmen of the Towns"
 kar_flanders_7_desc:0 "Burgher militias of Flanders drill in the town square on feast days."
 kar_neustria_ideas:0 "Neustrian Ideas"
 kar_neustria_ideas_start:0 "Neustrian Traditions"
 kar_neustria_ideas_bonus:0 "Neustrian Ambition"
 kar_neustria_1:0 "The Robertian Counts"
 kar_neustria_1_desc:0 "Robert the Strong and his sons hold the Loire and Seine marches against Northmen and rebels."
 kar_neustria_2:0 "Marches of the Loire"
 kar_neustria_2_desc:0 "A chain of towers and bridges protects the river from Nantes to Angers."
 kar_neustria_3:0 "Saint-Denis and Saint-Martin"
 kar_neustria_3_desc:0 "The great abbeys of Neustria hold the royal tombs and the king's treasure."
 kar_neustria_4:0 "Paris and the Seine"
 kar_neustria_4_desc:0 "The island city on the Seine is a fortress, a market and a bridge on the road to the sea."
 kar_neustria_5:0 "Frankish Knights"
 kar_neustria_5_desc:0 "Mounted warriors of Neustria train from boyhood in the lance and the sword."
 kar_neustria_6:0 "The Norman Question"
 kar_neustria_6_desc:0 "Norsemen have wintered on the Seine, and the counts of Neustria learn to treat with them."
 kar_neustria_7:0 "Forests of the Perche"
 kar_neustria_7_desc:0 "Oak and beech forests give timber for ships, mills and halls."
 kar_tuscany_ideas:0 "Tuscan Ideas"
 kar_tuscany_ideas_start:0 "Tuscan Traditions"
 kar_tuscany_ideas_bonus:0 "Tuscan Ambition"
 kar_tuscany_1:0 "The March of Tuscany"
 kar_tuscany_1_desc:0 "The marquis guards the roads to Rome and Lombardy and answers only to the emperor."
 kar_tuscany_2:0 "Lucca the Capital"
 kar_tuscany_2_desc:0 "The old Lombard city on the Serchio keeps a court and a mint for the margraves."
 kar_tuscany_3:0 "Wool and Marble"
 kar_tuscany_3_desc:0 "Quarries at Carrara and sheep on the Maremma supply Tuscan towns."
 kar_tuscany_4:0 "Via Francigena"
 kar_tuscany_4_desc:0 "The pilgrim road from Canterbury to Rome crosses the march, and its tolls fill the treasury."
 kar_tuscany_5:0 "Pisan Ships"
 kar_tuscany_5_desc:0 "Merchant sailors of Pisa trade to Sardinia, Corsica and the African shore."
 kar_tuscany_6:0 "The Margrave's Horse"
 kar_tuscany_6_desc:0 "Mounted men of the Tuscan nobility form the best cavalry in Italy."
 kar_tuscany_7:0 "Etruscan Memory"
 kar_tuscany_7_desc:0 "The ruins and the speech of old Etruria give Tuscans a sense of belonging that outlasts their masters."
 kar_spoleto_ideas:0 "Spoletan Ideas"
 kar_spoleto_ideas_start:0 "Spoletan Traditions"
 kar_spoleto_ideas_bonus:0 "Spoletan Ambition"
 kar_spoleto_1:0 "The Lombard Duchy"
 kar_spoleto_1_desc:0 "The dukes of Spoleto descend from Lombard kings and keep their own court and army."
 kar_spoleto_2:0 "Between Rome and Benevento"
 kar_spoleto_2_desc:0 "The duchy holds the roads of the Apennines, and both Rome and the south court its friendship."
 kar_spoleto_3:0 "Apennine Fortresses"
 kar_spoleto_3_desc:0 "Hill towns with walls and towers stand on every ridge."
 kar_spoleto_4:0 "Farfa and Montecassino"
 kar_spoleto_4_desc:0 "Rich monasteries guard the Benedictine rule and educate a clergy loyal to the duke."
 kar_spoleto_5:0 "Mountain Pastures"
 kar_spoleto_5_desc:0 "Shepherds drive flocks between the highlands and the plains of Latium."
 kar_spoleto_6:0 "The Duke's Lombard Horse"
 kar_spoleto_6_desc:0 "Lombard heavy cavalry fight as the Spoletan dukes have taught them."
 kar_spoleto_7:0 "Battles with the Saracens"
 kar_spoleto_7_desc:0 "Spoleto sent its men to Bari and Garigliano and learned how to beat Muslim raiders."
 kar_aghlabid_ideas:0 "Aghlabid Ideas"
 kar_aghlabid_ideas_start:0 "Aghlabid Traditions"
 kar_aghlabid_ideas_bonus:0 "Aghlabid Ambition"
 kar_aghlabid_1:0 "Kairouan the Camp-City"
 kar_aghlabid_1_desc:0 "The garrison city of the Aghlabids is a place of prayer, law and the market for all Ifriqiya."
 kar_aghlabid_2:0 "The Ribats"
 kar_aghlabid_2_desc:0 "A line of fortified monasteries along the coast holds volunteers who fight for the faith and the emir."
 kar_aghlabid_3:0 "The Conquest of Sicily"
 kar_aghlabid_3_desc:0 "The Aghlabids took Palermo and the Sicilian west from Byzantium and want the rest."
 kar_aghlabid_4:0 "The Maliki Jurists"
 kar_aghlabid_4_desc:0 "Scholars of Kairouan teach Maliki law to the western Islamic world."
 kar_aghlabid_5:0 "The Olive Oil and Wheat Plain"
 kar_aghlabid_5_desc:0 "The plains of Ifriqiya are Rome's old granary and now fill the emir's."
 kar_aghlabid_6:0 "The Aghlabid Cisterns"
 kar_aghlabid_6_desc:0 "Great reservoirs near Kairouan and Tunis store water for a dry land."
 kar_aghlabid_7:0 "Corsairs of the Western Sea"
 kar_aghlabid_7_desc:0 "Muslim ships harry Italian and Provençal coasts and capture slaves and ships."
 kar_idrisid_ideas:0 "Idrisid Ideas"
 kar_idrisid_ideas_start:0 "Idrisid Traditions"
 kar_idrisid_ideas_bonus:0 "Idrisid Ambition"
 kar_idrisid_1:0 "The Descendants of Ali"
 kar_idrisid_1_desc:0 "The Idrisids trace their line to the Prophet's family, and Berber tribes accept their rule because of it."
 kar_idrisid_2:0 "Fes and the Qarawiyyin"
 kar_idrisid_2_desc:0 "The new city on the Fes river boasts the great mosque and school founded by the lady Fatima al-Fihri."
 kar_idrisid_3:0 "The Zenata and Awraba"
 kar_idrisid_3_desc:0 "Berber tribal levies serve the imam as they served Idris, with a loyalty that is personal."
 kar_idrisid_4:0 "The Moroccan Highlands"
 kar_idrisid_4_desc:0 "Atlas and Rif mountains make an invasion from Cordoba or Kairouan a costly one."
 kar_idrisid_5:0 "Saharan Gold Routes"
 kar_idrisid_5_desc:0 "Camel trains from the south carry gold, salt and slaves to Fes."
 kar_idrisid_6:0 "Refugees from Cordoba and Kairouan"
 kar_idrisid_6_desc:0 "Scholars, craftsmen and soldiers flee to Fes, and the kingdom gains by their misfortune."
 kar_idrisid_7:0 "Tribal Peacekeeping"
 kar_idrisid_7_desc:0 "The Idrisid imams judge disputes between Berber tribes, and so keep the peace."
 kar_rustamid_ideas:0 "Rustamid Ideas"
 kar_rustamid_ideas_start:0 "Rustamid Traditions"
 kar_rustamid_ideas_bonus:0 "Rustamid Ambition"
 kar_rustamid_1:0 "The Ibadi Imamate"
 kar_rustamid_1_desc:0 "Imams of the Ibadi faith, elected for virtue and not birth, rule the highlands of the central Maghreb."
 kar_rustamid_2:0 "Tahert the Capital"
 kar_rustamid_2_desc:0 "The city on the steppe edge has a scholarly reputation as the Iraq of the Maghreb."
 kar_rustamid_3:0 "The Trans-Saharan Road"
 kar_rustamid_3_desc:0 "Camel caravans from Tahert reach the Sudan for gold and slaves."
 kar_rustamid_4:0 "Berber Tribal Levies"
 kar_rustamid_4_desc:0 "Tribes of the Zenata and Nafusa serve the imam in times of need."
 kar_rustamid_5:0 "Egalitarian Tradition"
 kar_rustamid_5_desc:0 "A man is judged by his piety and not his lineage, and rebels find few allies."
 kar_rustamid_6:0 "Persian and Arab Merchants"
 kar_rustamid_6_desc:0 "Traders from Basra and Kufa live at Tahert and make it a commercial hub."
 kar_rustamid_7:0 "Highland Strongholds"
 kar_rustamid_7_desc:0 "Fortified towns in the Zab and Aures mountains hold the imam's enemies at bay."
 kar_sicily_ideas:0 "Sicilian Ideas"
 kar_sicily_ideas_start:0 "Sicilian Traditions"
 kar_sicily_ideas_bonus:0 "Sicilian Ambition"
 kar_sicily_1:0 "The Isle of Three Peoples"
 kar_sicily_1_desc:0 "Greek, Arab and Latin communities live and trade in the island's cities."
 kar_sicily_2:0 "Palermo the Capital"
 kar_sicily_2_desc:0 "The new Muslim capital draws craftsmen, merchants and scholars from every shore."
 kar_sicily_3:0 "The Island's Wheat"
 kar_sicily_3_desc:0 "Sicily's plains feed the Mediterranean as they once fed Rome."
 kar_sicily_4:0 "Fleets of the Strait"
 kar_sicily_4_desc:0 "Ships based in Palermo and Syracuse command the narrow sea between Africa and Italy."
 kar_sicily_5:0 "Hill Fortresses"
 kar_sicily_5_desc:0 "Castles on the mountains of Etna and the Madonie hold out against any invader."
 kar_sicily_6:0 "Arab Irrigation and Citrus"
 kar_sicily_6_desc:0 "Arab farmers plant orange, lemon, sugar and cotton on watered terraces."
 kar_sicily_7:0 "Raids on Calabria"
 kar_sicily_7_desc:0 "Sicilian crews raid the mainland coasts of Italy for slaves and silver."
 kar_saffarid_ideas:0 "Saffarid Ideas"
 kar_saffarid_ideas_start:0 "Saffarid Traditions"
 kar_saffarid_ideas_bonus:0 "Saffarid Ambition"
 kar_saffarid_1:0 "Ya'qub the Coppersmith"
 kar_saffarid_1_desc:0 "A coppersmith's son from Sistan has made himself master of the east, and his army follows him because it believes he will win."
 kar_saffarid_2:0 "The Ayyar Brotherhoods"
 kar_saffarid_2_desc:0 "Bands of young men from the cities, sworn to a code of courage, make up the elite of the army."
 kar_saffarid_3:0 "Sistan and the Helmand"
 kar_saffarid_3_desc:0 "The oasis kingdom's fields and canals feed an army that does not depend on the caliph's tax."
 kar_saffarid_4:0 "The Persian Revival"
 kar_saffarid_4_desc:0 "Ya'qub orders Persian used at court, and poets praise the old kings of Iran."
 kar_saffarid_5:0 "Plunder of Khorasan"
 kar_saffarid_5_desc:0 "The Saffarids take the treasure of the Tahirids and the Abbasid governors."
 kar_saffarid_6:0 "The Kharijite Roots"
 kar_saffarid_6_desc:0 "Ya'qub's early followers were Kharijite rebels and the dynasty never forgets that it rose in revolt."
 kar_saffarid_7:0 "Mountain Road to the Indus"
 kar_saffarid_7_desc:0 "Passes to Kabul and Zabul open the route to India's wealth."
 kar_tahirid_ideas:0 "Tahirid Ideas"
 kar_tahirid_ideas_start:0 "Tahirid Traditions"
 kar_tahirid_ideas_bonus:0 "Tahirid Ambition"
 kar_tahirid_1:0 "Governors of Khorasan"
 kar_tahirid_1_desc:0 "The Tahirids govern the east for the caliph and keep order with the caliph's authority."
 kar_tahirid_2:0 "Nishapur"
 kar_tahirid_2_desc:0 "The city of scholars, merchants and mosques is the cultural capital of the eastern Islamic world."
 kar_tahirid_3:0 "The Silk Road Customs"
 kar_tahirid_3_desc:0 "The house collects the dues of the roads from Merv to Rayy."
 kar_tahirid_4:0 "Qanats of the Plateau"
 kar_tahirid_4_desc:0 "Underground canals bring water to the dry plain and make its soil rich."
 kar_tahirid_5:0 "The Persian Gentry"
 kar_tahirid_5_desc:0 "Landed dihqans fight for the Tahirids and keep their local estates."
 kar_tahirid_6:0 "The Caliph's Friend"
 kar_tahirid_6_desc:0 "Tahirid loyalty to Baghdad earns them honours, gifts and a long leash."
 kar_tahirid_7:0 "Ghazi Volunteers"
 kar_tahirid_7_desc:0 "Pious volunteers gather in Khorasan to fight the Turks beyond the Oxus."
 kar_samanid_ideas:0 "Samanid Ideas"
 kar_samanid_ideas_start:0 "Samanid Traditions"
 kar_samanid_ideas_bonus:0 "Samanid Ambition"
 kar_samanid_1:0 "Bukhara and Samarkand"
 kar_samanid_1_desc:0 "The Samanid cities are rich markets for Chinese silk, Persian carpets and Turkish slaves."
 kar_samanid_2:0 "The Persian Renaissance"
 kar_samanid_2_desc:0 "Poets write New Persian in Arabic script, and a Persian court rises in Bukhara."
 kar_samanid_3:0 "The Frontier of Faith"
 kar_samanid_3_desc:0 "Samanid ghazis ride against pagan Turks and win converts, captives and plunder."
 kar_samanid_4:0 "The Oasis Farms"
 kar_samanid_4_desc:0 "Canals from the Zarafshan and Oxus water Transoxiana's fields."
 kar_samanid_5:0 "Slave Soldiers of the Steppe"
 kar_samanid_5_desc:0 "Turkic boys, captured young, are trained as mamluks for the emir's guard."
 kar_samanid_6:0 "Governors of Transoxiana"
 kar_samanid_6_desc:0 "Nuh and Nasr serve the Tahirids as governors and come to rule in their own right."
 kar_samanid_7:0 "Paper of Samarkand"
 kar_samanid_7_desc:0 "Samarkand mills produce paper and spread the written word through the east."
 kar_sindh_ideas:0 "Sindhi Ideas"
 kar_sindh_ideas_start:0 "Sindhi Traditions"
 kar_sindh_ideas_bonus:0 "Sindhi Ambition"
 kar_sindh_1:0 "Mansura on the Indus"
 kar_sindh_1_desc:0 "The Arab capital of Sindh sits on a great loop of the river with palaces and a Friday mosque."
 kar_sindh_2:0 "The Habbari Emirs"
 kar_sindh_2_desc:0 "The descendants of Arab conquerors rule Sindh in the caliph's name and answer to no governor."
 kar_sindh_3:0 "Multan the Temple City"
 kar_sindh_3_desc:0 "The Sun Temple of Multan draws Hindu pilgrims whose gifts fill the emir's treasury."
 kar_sindh_4:0 "Merchants of Debal"
 kar_sindh_4_desc:0 "Sindhi merchants ship goods across the Arabian Sea to Basra and Siraf."
 kar_sindh_5:0 "Camel Corps of the Thar"
 kar_sindh_5_desc:0 "Riders in the desert carry messages and raid caravans across the sands."
 kar_sindh_6:0 "The Indus Flood"
 kar_sindh_6_desc:0 "Sindh's fields depend on the flood, and the people learn to manage the water."
 kar_sindh_7:0 "Arab and Hindu Notables"
 kar_sindh_7_desc:0 "Local Hindu landholders and Muslim settlers share the administration."
 kar_ghana_ideas:0 "Ghanaian Ideas"
 kar_ghana_ideas_start:0 "Ghanaian Traditions"
 kar_ghana_ideas_bonus:0 "Ghanaian Ambition"
 kar_ghana_1:0 "Gold of Wagadu"
 kar_ghana_1_desc:0 "Gold from the southern forests reaches the king's hands by custom, and the Ghana's court shines with it."
 kar_ghana_2:0 "Salt and Gold Trade"
 kar_ghana_2_desc:0 "Berber caravans bring Saharan salt south to the gold lands and take gold north."
 kar_ghana_3:0 "The King's Nuggets"
 kar_ghana_3_desc:0 "All gold nuggets belong to the king, and only gold dust circulates among his subjects."
 kar_ghana_4:0 "Iron-Armed Soninke"
 kar_ghana_4_desc:0 "Iron-working made the Soninke strong, and their spears and shields fill the king's army."
 kar_ghana_5:0 "Kumbi Saleh"
 kar_ghana_5_desc:0 "The twin city of the king and the merchants has a royal palace and thirteen mosques."
 kar_ghana_6:0 "The Oath of the Elders"
 kar_ghana_6_desc:0 "The clan heads advise the king, and a king cannot rule without their sworn oath."
 kar_ghana_7:0 "Tribute of the Neighbours"
 kar_ghana_7_desc:0 "Berber, Peul and Malinke chiefs pay Ghana tribute in cattle, gold and men."
 kar_abyssinia_ideas:0 "Abyssinian Ideas"
 kar_abyssinia_ideas_start:0 "Abyssinian Traditions"
 kar_abyssinia_ideas_bonus:0 "Abyssinian Ambition"
 kar_abyssinia_1:0 "The Solomonic Claim"
 kar_abyssinia_1_desc:0 "The kings of Abyssinia trace their line to the Queen of Sheba and Solomon and the legitimacy of the Ark."
 kar_abyssinia_2:0 "The Highland Fortress"
 kar_abyssinia_2_desc:0 "The high plateau and its gorges guard the kingdom from invasion."
 kar_abyssinia_3:0 "The Miaphysite Church"
 kar_abyssinia_3_desc:0 "The Church of Tewahedo gives Abyssinia its writing, its calendar and its monks."
 kar_abyssinia_4:0 "Monasteries and Rock Churches"
 kar_abyssinia_4_desc:0 "Monks in rock-hewn churches and cliffside monasteries preserve the books and the faith."
 kar_abyssinia_5:0 "Coffee Beans and Incense"
 kar_abyssinia_5_desc:0 "Trade goods from the south cross the highlands to the Red Sea ports."
 kar_abyssinia_6:0 "Peasant Spearmen"
 kar_abyssinia_6_desc:0 "Farmers of the plateau gather behind the banners of their lords at the king's call."
 kar_abyssinia_7:0 "The Red Sea Ports"
 kar_abyssinia_7_desc:0 "Adulis, Massawa and Zeila link the kingdom to Arabia and India."
 kar_oghuz_ideas:0 "Oghuz Ideas"
 kar_oghuz_ideas_start:0 "Oghuz Traditions"
 kar_oghuz_ideas_bonus:0 "Oghuz Ambition"
 kar_oghuz_1:0 "The Yabghu of the Oghuz"
 kar_oghuz_1_desc:0 "The tribal federation obeys a yabghu who rules from his winter camp on the Syr Darya."
 kar_oghuz_2:0 "Twenty-Four Tribes"
 kar_oghuz_2_desc:0 "The Oghuz are two groups of twelve tribes, and the khan's rule depends on balancing them."
 kar_oghuz_3:0 "The Sheep and the Horse"
 kar_oghuz_3_desc:0 "Great herds feed the camps and mount the warriors who ride from them."
 kar_oghuz_4:0 "Raids on the Samanid Border"
 kar_oghuz_4_desc:0 "Oghuz bands cross the Syr Darya in winter and trade or fight as they must."
 kar_oghuz_5:0 "The Salt Road from Khwarezm"
 kar_oghuz_5_desc:0 "Oghuz herdsmen guard the road of caravans between the Oxus and the Volga for a price."
 kar_oghuz_6:0 "The Felt Tent Shaman"
 kar_oghuz_6_desc:0 "Kams and seers govern the calendar of migration, war and feast."
 kar_oghuz_7:0 "Camp Fortresses of the Syr Darya"
 kar_oghuz_7_desc:0 "Winter camps on the river become stone towns when the khan needs a permanent seat."
 kar_zhetysu_ideas:0 "Karluk Ideas"
 kar_zhetysu_ideas_start:0 "Karluk Traditions"
 kar_zhetysu_ideas_bonus:0 "Karluk Ambition"
 kar_zhetysu_1:0 "The Seven Rivers"
 kar_zhetysu_1_desc:0 "The grasslands of Zhetysu are some of the best pasture in Asia, and herds grow fat on them."
 kar_zhetysu_2:0 "The Karluk Yabghu"
 kar_zhetysu_2_desc:0 "The Karluk khan was once the Tang emperor's ally, then the Uighur's rival, and rules his own country now."
 kar_zhetysu_3:0 "Talas and Balasagun"
 kar_zhetysu_3_desc:0 "Trading towns in the Chu and Talas valleys prosper from the silk road."
 kar_zhetysu_4:0 "Cavalry of the Tien Shan"
 kar_zhetysu_4_desc:0 "Karluk horsemen are drilled to fight in mountains and on the plain."
 kar_zhetysu_5:0 "The Talas Memory"
 kar_zhetysu_5_desc:0 "The Karluk were present at the great battle of Talas, and their veterans' tales serve their recruits."
 kar_zhetysu_6:0 "Faiths Along the Road"
 kar_zhetysu_6_desc:0 "Nestorians, Manichaeans, Buddhists and Muslims all live in Karluk cities, and the khan allows all of them."
 kar_zhetysu_7:0 "Mountain Passes"
 kar_zhetysu_7_desc:0 "The passes of the Tien Shan close in winter and shelter the Karluk from invaders."
 kar_uighur_ideas:0 "Uighur Ideas"
 kar_uighur_ideas_start:0 "Uighur Traditions"
 kar_uighur_ideas_bonus:0 "Uighur Ambition"
 kar_uighur_1:0 "The Manichaean Elect"
 kar_uighur_1_desc:0 "The Uighur elite held the faith of Mani, and their khaganate was its great patron."
 kar_uighur_2:0 "The Oasis Cities"
 kar_uighur_2_desc:0 "Turfan, Beshbaliq and Karakhoja are cities of canals, temples and libraries."
 kar_uighur_3:0 "The Karez Canals"
 kar_uighur_3_desc:0 "Underground channels carry melt-water from the Tien Shan into dry fields."
 kar_uighur_4:0 "Merchants of the Silk Road"
 kar_uighur_4_desc:0 "Sogdian and Uighur traders manage the most profitable stage of the road to China."
 kar_uighur_5:0 "The Scribes of Qocho"
 kar_uighur_5_desc:0 "Scribes write Uighur in a script adapted from Sogdian, and the khan's court is literate."
 kar_uighur_6:0 "The Fallen Khaganate"
 kar_uighur_6_desc:0 "The Uighur lost Mongolia to the Kirghiz, but their descendants keep the memory of empire."
 kar_uighur_7:0 "Light Cavalry of the Tarim"
 kar_uighur_7_desc:0 "Riders from the oases fight with bows and sabres in the old Uighur way."
 kar_naimania_ideas:0 "Naiman Ideas"
 kar_naimania_ideas_start:0 "Naiman Traditions"
 kar_naimania_ideas_bonus:0 "Naiman Ambition"
 kar_naimania_1:0 "The Eight Clans"
 kar_naimania_1_desc:0 "The clans of the Naiman gather under one khan in the grass of the Altai."
 kar_naimania_2:0 "Nestorian Steppe Christians"
 kar_naimania_2_desc:0 "Many Naiman chiefs follow the faith of the Church of the East, and priests bless their camps."
 kar_naimania_3:0 "The Altai Pastures"
 kar_naimania_3_desc:0 "Mountain meadows give herds of horses and sheep to the clans."
 kar_naimania_4:0 "Riders of the Irtysh"
 kar_naimania_4_desc:0 "Naiman bowmen ride the long plains between the Altai and the Irtysh."
 kar_naimania_5:0 "Tribute from the Forest People"
 kar_naimania_5_desc:0 "Tribes of the taiga pay the khan in furs."
 kar_naimania_6:0 "Blacksmith Khans"
 kar_naimania_6_desc:0 "Their ancestors were iron-workers of the mountains, and Naiman blades are prized."
 kar_naimania_7:0 "Between the Kirghiz and the Karluks"
 kar_naimania_7_desc:0 "The Naiman survive by sitting between powerful neighbours and trading with all."
 kar_tuva_ideas:0 "Tuvan Ideas"
 kar_tuva_ideas_start:0 "Tuvan Traditions"
 kar_tuva_ideas_bonus:0 "Tuvan Ambition"
 kar_tuva_1:0 "Reindeer and Taiga"
 kar_tuva_1_desc:0 "The Uriankhai herd reindeer in the northern taiga and horses on the southern steppe."
 kar_tuva_2:0 "The Sayan Passes"
 kar_tuva_2_desc:0 "Narrow valleys and mountain gates make any invasion of Tuva a hard march."
 kar_tuva_3:0 "Throat Singers and Shamans"
 kar_tuva_3_desc:0 "Priests of the old faith speak with the spirits and guide the clans in war and peace."
 kar_tuva_4:0 "The Forest Archers"
 kar_tuva_4_desc:0 "Hunters of the forest stalk their prey and their enemies with arrows."
 kar_tuva_5:0 "Salt and Furs"
 kar_tuva_5_desc:0 "Furs and salt from lakes pay the tribute of the Tuvan clans."
 kar_tuva_6:0 "Clan Elders"
 kar_tuva_6_desc:0 "A council of elders settles disputes and chooses leaders."
 kar_tuva_7:0 "Metalworkers of the Yenisei"
 kar_tuva_7_desc:0 "Smiths on the upper Yenisei forge iron and bronze."
 kar_sibir_ideas:0 "Siberian Ideas"
 kar_sibir_ideas_start:0 "Siberian Traditions"
 kar_sibir_ideas_bonus:0 "Siberian Ambition"
 kar_sibir_1:0 "The Irtysh Fortresses"
 kar_sibir_1_desc:0 "Wooden forts on the great river mark the khan's seat and the portage to the Urals."
 kar_sibir_2:0 "Fur Tribute"
 kar_sibir_2_desc:0 "Hunters of the taiga pay the khan in sable, ermine and fox."
 kar_sibir_3:0 "River Highways"
 kar_sibir_3_desc:0 "Boats on the Ob, Irtysh and Tobol carry men and goods across the plain."
 kar_sibir_4:0 "The Cold War"
 kar_sibir_4_desc:0 "Siberian winters kill invaders who carry no furs or bread."
 kar_sibir_5:0 "Hunters and Skiers"
 kar_sibir_5_desc:0 "Light infantry on skis and snowshoes hunt and fight through the snow."
 kar_sibir_6:0 "Clan Councils"
 kar_sibir_6_desc:0 "The Tatar and Ugrian clans choose a khan from among themselves."
 kar_sibir_7:0 "Shaman and Mullah"
 kar_sibir_7_desc:0 "Both shaman and Muslim missionary preach to the Siberians."
 kar_khotan_ideas:0 "Khotanese Ideas"
 kar_khotan_ideas_start:0 "Khotanese Traditions"
 kar_khotan_ideas_bonus:0 "Khotanese Ambition"
 kar_khotan_1:0 "The Jade of Khotan"
 kar_khotan_1_desc:0 "White jade from the river Yurungkash is sent to China, where it fetches more than gold."
 kar_khotan_2:0 "The Buddhist Oasis"
 kar_khotan_2_desc:0 "Khotan's monasteries produce Mahayana scholars who travel to China and Tibet."
 kar_khotan_3:0 "Silk of the Kingdom"
 kar_khotan_3_desc:0 "The legend says silkworm eggs were smuggled here in a princess's headdress, and Khotan's silk is still prized."
 kar_khotan_4:0 "Saka Heritage"
 kar_khotan_4_desc:0 "The Khotanese speak an Iranian tongue older than Turkish and keep their own script and literature."
 kar_khotan_5:0 "Between Tibet and the Uighurs"
 kar_khotan_5_desc:0 "Khotan's diplomats balance the claims of two powerful neighbours."
 kar_khotan_6:0 "The Desert Rim Road"
 kar_khotan_6_desc:0 "Khotan guards the southern road around the Taklamakan with garrisons and wells."
 kar_khotan_7:0 "Oasis Militias"
 kar_khotan_7_desc:0 "Farmers and herders muster to defend their canals when raiders approach."
 kar_hexi_ideas:0 "Guiyijun Ideas"
 kar_hexi_ideas_start:0 "Guiyijun Traditions"
 kar_hexi_ideas_bonus:0 "Guiyijun Ambition"
 kar_hexi_1:0 "The Return to Tang"
 kar_hexi_1_desc:0 "Zhang Yichao drove out the Tibetans in 851 and gave the western provinces back to the emperor."
 kar_hexi_2:0 "Dunhuang and the Mogao Caves"
 kar_hexi_2_desc:0 "The oasis city is a centre of Buddhist art and of the scribal craft."
 kar_hexi_3:0 "The Gansu Corridor"
 kar_hexi_3_desc:0 "The narrow road through Hexi connects China to the western regions, and pays tolls to the one who holds it."
 kar_hexi_4:0 "Ethnic Mixture"
 kar_hexi_4_desc:0 "Han, Tibetans, Sogdians and Uighurs live in the oasis towns, and the governor has learned to rule all."
 kar_hexi_5:0 "Garrison Cities"
 kar_hexi_5_desc:0 "Fortified oases at Guazhou and Shazhou are manned by veteran soldiers."
 kar_hexi_6:0 "Horse Herds of the Qilian"
 kar_hexi_6_desc:0 "The mountains north of Tibet feed horses for the Hexi cavalry."
 kar_hexi_7:0 "Envoys to the Uighurs and Tibetans"
 kar_hexi_7_desc:0 "Hexi sends caravans, gifts and marriages to its neighbours and keeps the peace."
 kar_u_tsang_ideas:0 "Tibetan Ideas"
 kar_u_tsang_ideas_start:0 "Tibetan Traditions"
 kar_u_tsang_ideas_bonus:0 "Tibetan Ambition"
 kar_u_tsang_1:0 "The Fallen Empire"
 kar_u_tsang_1_desc:0 "The Tibetan Empire broke after Langdarma's death in 842, and every lord of the plateau claims its mantle."
 kar_u_tsang_2:0 "The Roof of the World"
 kar_u_tsang_2_desc:0 "At fifteen thousand feet, a march in winter is an ordeal for lowland troops."
 kar_u_tsang_3:0 "Yak and Barley"
 kar_u_tsang_3_desc:0 "The farmers of the river valleys and the nomads of the highlands feed the lords' armies."
 kar_u_tsang_4:0 "Bon and Buddhist Priests"
 kar_u_tsang_4_desc:0 "The old priests of Bon and the new monks of Buddha compete for the nobles' favour."
 kar_u_tsang_5:0 "The Fortress Dzongs"
 kar_u_tsang_5_desc:0 "Castles on crags watch over every valley and monastery."
 kar_u_tsang_6:0 "Salt and Musk Caravans"
 kar_u_tsang_6_desc:0 "Caravans carry salt, musk and wool to India and China."
 kar_u_tsang_7:0 "The Warrior Clans"
 kar_u_tsang_7_desc:0 "Great families of Tsang and Ü maintain retinues of armoured horsemen."
 kar_guge_ideas:0 "Gugé Ideas"
 kar_guge_ideas_start:0 "Gugé Traditions"
 kar_guge_ideas_bonus:0 "Gugé Ambition"
 kar_guge_1:0 "Descendants of the Tsenpos"
 kar_guge_1_desc:0 "The western lords descend from the old emperors and rule with royal claims."
 kar_guge_2:0 "Mount Kailash"
 kar_guge_2_desc:0 "The holy mountain draws Hindu, Buddhist and Bon pilgrims whose offerings reach the king."
 kar_guge_3:0 "The Salt Lakes of the Chang Tang"
 kar_guge_3_desc:0 "Salt harvested from high lakes supplies all of western Tibet."
 kar_guge_4:0 "Passes to Kashmir and India"
 kar_guge_4_desc:0 "The western passes link the Tibetan plateau with Kashmir's valley and the plains below."
 kar_guge_5:0 "Translators and Monasteries"
 kar_guge_5_desc:0 "Monks translate Sanskrit texts and spread the Dharma."
 kar_guge_6:0 "Mountain Strongholds"
 kar_guge_6_desc:0 "Gugé's fortresses at the cliff edge cannot be taken from below."
 kar_guge_7:0 "Yak Herders of the Plateau"
 kar_guge_7_desc:0 "The nomad herders supply the army with leather, meat and mounts."
 kar_dali_ideas:0 "Dali Ideas"
 kar_dali_ideas_start:0 "Dali Traditions"
 kar_dali_ideas_bonus:0 "Dali Ambition"
 kar_dali_1:0 "The Heir of Nanzhao"
 kar_dali_1_desc:0 "The kings of Dali claim the empire of Nanzhao, which defeated Tang armies and threatened Sichuan."
 kar_dali_2:0 "Erhai Lake"
 kar_dali_2_desc:0 "A fertile lake plateau feeds the capital and supports a large population."
 kar_dali_3:0 "Salt Wells and Copper Mines"
 kar_dali_3_desc:0 "Yunnan's salt and metals pay for the army."
 kar_dali_4:0 "The Tea-Horse Road"
 kar_dali_4_desc:0 "Caravans of tea go north to Tibet and bring horses back to Dali."
 kar_dali_5:0 "Elephants and Archers"
 kar_dali_5_desc:0 "War elephants and crossbowmen from the highlands hold the passes."
 kar_dali_6:0 "Buddhist Kings"
 kar_dali_6_desc:0 "Kings abdicate to monasteries and the Buddhist Church shapes Dali's law."
 kar_dali_7:0 "Tribal Confederacy"
 kar_dali_7_desc:0 "Bai, Yi and Dai chieftains swear to the king and keep their own customs."
 kar_balhae_ideas:0 "Balhae Ideas"
 kar_balhae_ideas_start:0 "Balhae Traditions"
 kar_balhae_ideas_bonus:0 "Balhae Ambition"
 kar_balhae_1:0 "Heirs of Goguryeo"
 kar_balhae_1_desc:0 "The ruling house of Balhae claims the heritage of Goguryeo's kings and fights for it."
 kar_balhae_2:0 "The Five Capitals"
 kar_balhae_2_desc:0 "Five regional capitals each with its own administration and garrisons give the kingdom a Tang-style order."
 kar_balhae_3:0 "Mohe Cavalry"
 kar_balhae_3_desc:0 "Mohe horsemen serve as the vanguard of the royal army."
 kar_balhae_4:0 "Horses of the North"
 kar_balhae_4_desc:0 "The kingdom sells horses to Tang China and Japan."
 kar_balhae_5:0 "The Sea of Japan Route"
 kar_balhae_5_desc:0 "Ships from Balhae reach Japan across the sea and bring back furs and silk."
 kar_balhae_6:0 "Mountain Fortresses"
 kar_balhae_6_desc:0 "Stone fortresses built on mountain tops follow Goguryeo traditions and hold the kingdom's borders."
 kar_balhae_7:0 "Tang Learning"
 kar_balhae_7_desc:0 "Balhae students study at Chang'an and bring back Chinese writing, law and ritual."
 kar_silla_ideas:0 "Silla Ideas"
 kar_silla_ideas_start:0 "Silla Traditions"
 kar_silla_ideas_bonus:0 "Silla Ambition"
 kar_silla_1:0 "The Bone-Rank System"
 kar_silla_1_desc:0 "Royal blood is graded and each grade has its rank and robe, and a Silla official knows his place."
 kar_silla_2:0 "Gyeongju the Golden City"
 kar_silla_2_desc:0 "The capital's palaces, temples and tombs are full of gold and make Silla a bright part of Asia."
 kar_silla_3:0 "The Hwarang"
 kar_silla_3_desc:0 "Young nobles train in poetry, arms and loyalty and become the officers of the kingdom."
 kar_silla_4:0 "Buddhist Monarchy"
 kar_silla_4_desc:0 "Kings build temples and promote the Dharma, and monks pray for the state."
 kar_silla_5:0 "The Maritime Trade of Cheonghae"
 kar_silla_5_desc:0 "Silla ships trade to China and Japan, and Korean merchants have their own quarter in Chinese ports."
 kar_silla_6:0 "Granite Fortresses"
 kar_silla_6_desc:0 "Hill forts guard every pass of the Taebaek mountains."
 kar_silla_7:0 "Learning from Tang"
 kar_silla_7_desc:0 "Silla envoys study at the Chinese academy and take Chinese titles for their ministries."
 kar_later_baekje_ideas:0 "Hubaekje Ideas"
 kar_later_baekje_ideas_start:0 "Hubaekje Traditions"
 kar_later_baekje_ideas_bonus:0 "Hubaekje Ambition"
 kar_later_baekje_1:0 "Heirs of Baekje"
 kar_later_baekje_1_desc:0 "The rebels of the south-west claim to restore the old kingdom that Silla destroyed."
 kar_later_baekje_2:0 "Gyeon Hwon's Army"
 kar_later_baekje_2_desc:0 "A soldier who rose from the ranks is a general with a genius for swift campaigns."
 kar_later_baekje_3:0 "Rice Plains of the South-West"
 kar_later_baekje_3_desc:0 "The Honam plains are the granary of the peninsula."
 kar_later_baekje_4:0 "The Yellow Sea Coast"
 kar_later_baekje_4_desc:0 "Ships from Baekje's ports carry goods and envoys to China."
 kar_later_baekje_5:0 "Defecting Generals"
 kar_later_baekje_5_desc:0 "Silla officers who go over to the rebels bring their troops and plans."
 kar_later_baekje_6:0 "Grievances of the Old Baekje"
 kar_later_baekje_6_desc:0 "Former Baekje families resent Silla and give Gyeon Hwon their support."
 kar_later_baekje_7:0 "Mountain Strongholds"
 kar_later_baekje_7_desc:0 "The slopes of Jirisan give shelter to rebels."
 kar_later_goguryeo_ideas:0 "Taebong Ideas"
 kar_later_goguryeo_ideas_start:0 "Taebong Traditions"
 kar_later_goguryeo_ideas_bonus:0 "Taebong Ambition"
 kar_later_goguryeo_1:0 "Heirs of Goguryeo"
 kar_later_goguryeo_1_desc:0 "Gung Ye proclaimed that Goguryeo was reborn, and the northern lords rally to the name."
 kar_later_goguryeo_2:0 "The Merchant Houses of Songak"
 kar_later_goguryeo_2_desc:0 "Wang Geon's family of traders and shipmasters supplies the kingdom with ships and money."
 kar_later_goguryeo_3:0 "The Prophet King"
 kar_later_goguryeo_3_desc:0 "Gung Ye claims to be Maitreya Buddha and his people believe it, for a while."
 kar_later_goguryeo_4:0 "Rice and Paddy of the North"
 kar_later_goguryeo_4_desc:0 "Farmers of the Imjin river plains feed the armies."
 kar_later_goguryeo_5:0 "Local Strongmen"
 kar_later_goguryeo_5_desc:0 "Provincial warlords join the kingdom with their own retinues."
 kar_later_goguryeo_6:0 "The Han River Fortresses"
 kar_later_goguryeo_6_desc:0 "Forts at the mouth of the Han River command the road to the capital."
 kar_later_goguryeo_7:0 "Naval Raids on the South"
 kar_later_goguryeo_7_desc:0 "Taebong's fleets harry the Baekje coast and carry the war to the rivals."
 kar_viet_ideas:0 "Viet Ideas"
 kar_viet_ideas_start:0 "Viet Traditions"
 kar_viet_ideas_bonus:0 "Viet Ambition"
 kar_viet_1:0 "The Khuc Family Governors"
 kar_viet_1_desc:0 "The Khuc family rules Annam in the name of the Tang and has made themselves governors in all but name."
 kar_viet_2:0 "Red River Rice"
 kar_viet_2_desc:0 "Rice paddies of the Red River delta feed a large population."
 kar_viet_3:0 "Dike Builders"
 kar_viet_3_desc:0 "Embankments against the river protect fields and give the king power over water."
 kar_viet_4:0 "Resistance to the North"
 kar_viet_4_desc:0 "The Viet fought for centuries against Han rule, and remember the Trung sisters."
 kar_viet_5:0 "Tattooed Boatmen"
 kar_viet_5_desc:0 "River and sea fighters of the delta serve in the king's fleet."
 kar_viet_6:0 "Monsoon Forests"
 kar_viet_6_desc:0 "Hills and jungles hold any Chinese advance."
 kar_viet_7:0 "Mahayana and Spirit Cults"
 kar_viet_7_desc:0 "Buddhist monks, Confucian clerks and village spirit-priests share the Viet world."
 kar_champa_ideas:0 "Cham Ideas"
 kar_champa_ideas_start:0 "Cham Traditions"
 kar_champa_ideas_bonus:0 "Cham Ambition"
 kar_champa_1:0 "Lords of the Southern Seas"
 kar_champa_1_desc:0 "Cham sailors dominate the sea between Annam and the Mekong."
 kar_champa_2:0 "Aloeswood and Ivory"
 kar_champa_2_desc:0 "The highlands yield agarwood, ivory and rhino horn which the Chinese pay dearly for."
 kar_champa_3:0 "Hindu Temples of My Son"
 kar_champa_3_desc:0 "Brick towers and sanctuaries to Shiva make Champa a holy land."
 kar_champa_4:0 "Elephant Cavalry"
 kar_champa_4_desc:0 "War elephants lead the Cham army in battle."
 kar_champa_5:0 "Raids on Annam"
 kar_champa_5_desc:0 "Cham fleets and armies strike the northern coast at will."
 kar_champa_6:0 "Rice Valleys of Annam"
 kar_champa_6_desc:0 "The narrow coastal valleys produce rice and trade goods."
 kar_champa_7:0 "Princes of Indrapura"
 kar_champa_7_desc:0 "The new dynasty of Indrapura mixes Cham and Indian custom in its court."
 kar_dvaravati_ideas:0 "Dvaravati Ideas"
 kar_dvaravati_ideas_start:0 "Dvaravati Traditions"
 kar_dvaravati_ideas_bonus:0 "Dvaravati Ambition"
 kar_dvaravati_1:0 "The Mon Cities"
 kar_dvaravati_1_desc:0 "Moat-and-rampart cities such as Nakhon Pathom hold the trade and the temples of Dvaravati."
 kar_dvaravati_2:0 "The Wheel of the Law"
 kar_dvaravati_2_desc:0 "The dharmachakra stones show a Buddhist kingdom that spreads its doctrine across Southeast Asia."
 kar_dvaravati_3:0 "Chao Phraya Rice"
 kar_dvaravati_3_desc:0 "Wet rice on the great river plain feeds the kingdom."
 kar_dvaravati_4:0 "Trade Between India and China"
 kar_dvaravati_4_desc:0 "Dvaravati sits on a land bridge between two seas, and its merchants carry Indian goods across it."
 kar_dvaravati_5:0 "Mon-Khmer Federation"
 kar_dvaravati_5_desc:0 "Cities of Mon and Khmer culture accept the king while governing themselves."
 kar_dvaravati_6:0 "Elephants of the Forest"
 kar_dvaravati_6_desc:0 "War elephants trained by mahouts march behind the king."
 kar_dvaravati_7:0 "Monastery Learning"
 kar_dvaravati_7_desc:0 "Monks teach Pali and Sanskrit, and the sangha educates the sons of lords."
 kar_pratihara_ideas:0 "Pratihara Ideas"
 kar_pratihara_ideas_start:0 "Pratihara Traditions"
 kar_pratihara_ideas_bonus:0 "Pratihara Ambition"
 kar_pratihara_1:0 "The Gurjara Cavalry"
 kar_pratihara_1_desc:0 "The Pratihara kings field the best horse in northern India, bought from Arab and Turkic dealers."
 kar_pratihara_2:0 "Kannauj"
 kar_pratihara_2_desc:0 "The city on the Ganga is the prize of three dynasties and the seat of the great king of the north."
 kar_pratihara_3:0 "The Barrier Against Arabs"
 kar_pratihara_3_desc:0 "The Pratihara kings halted the Arab advance at Rajasthan and are praised as the shield of the Hindus."
 kar_pratihara_4:0 "The Doab Fields"
 kar_pratihara_4_desc:0 "The rich lands between the Ganga and the Yamuna fill the royal granaries."
 kar_pratihara_5:0 "Feudatory Samantas"
 kar_pratihara_5_desc:0 "Local chiefs hold land for service and arrive with their own war bands."
 kar_pratihara_6:0 "Merchant Guilds"
 kar_pratihara_6_desc:0 "Guilds of Kannauj and Ujjain move cloth, spice and horses over the old roads."
 kar_pratihara_7:0 "Vaishnava Temples"
 kar_pratihara_7_desc:0 "Kings endow temples to Vishnu and the Brahmins who tend them."
 kar_rashtrakuta_ideas:0 "Rashtrakuta Ideas"
 kar_rashtrakuta_ideas_start:0 "Rashtrakuta Traditions"
 kar_rashtrakuta_ideas_bonus:0 "Rashtrakuta Ambition"
 kar_rashtrakuta_1:0 "Amoghavarsha the Great"
 kar_rashtrakuta_1_desc:0 "The Rashtrakuta emperor was a great king, a poet and a Jain, and his court is the model for the Deccan."
 kar_rashtrakuta_2:0 "Manyakheta the Fortress Capital"
 kar_rashtrakuta_2_desc:0 "The new capital is a walled city with a palace and a mint."
 kar_rashtrakuta_3:0 "Jain and Hindu Patrons"
 kar_rashtrakuta_3_desc:0 "Kings give land and gold to Jain monks and to Shaiva temples with equal grace."
 kar_rashtrakuta_4:0 "Elephants of the Deccan"
 kar_rashtrakuta_4_desc:0 "Elephant corps lead the army in the open field."
 kar_rashtrakuta_5:0 "Cotton and Black Soil"
 kar_rashtrakuta_5_desc:0 "The black soil of the plateau grows cotton for export from the west coast ports."
 kar_rashtrakuta_6:0 "The Kailasa Temple"
 kar_rashtrakuta_6_desc:0 "A temple carved from a single hill at Ellora shows the wealth and skill of the kings."
 kar_rashtrakuta_7:0 "Arab Merchants of the Konkan"
 kar_rashtrakuta_7_desc:0 "Muslims of the coast pay tolls and sell horses and glass to the king."
 kar_pala_ideas:0 "Pala Ideas"
 kar_pala_ideas_start:0 "Pala Traditions"
 kar_pala_ideas_bonus:0 "Pala Ambition"
 kar_pala_1:0 "The Elected King"
 kar_pala_1_desc:0 "Gopala was chosen by the leaders of Bengal to end anarchy, and his heirs keep the throne."
 kar_pala_2:0 "The Ganges Delta"
 kar_pala_2_desc:0 "The delta's rivers, rice and fish support a dense population and busy markets."
 kar_pala_3:0 "Nalanda and Vikramashila"
 kar_pala_3_desc:0 "Buddhist monastic universities draw scholars from China, Tibet and Java."
 kar_pala_4:0 "War Elephants of the East"
 kar_pala_4_desc:0 "Bengali elephants are the finest in India, and the Palas export them."
 kar_pala_5:0 "River Fleets"
 kar_pala_5_desc:0 "Rivers carry troops and trade across the delta."
 kar_pala_6:0 "Buddhist Patrons"
 kar_pala_6_desc:0 "The Palas fund monasteries and send missionaries to Tibet and Southeast Asia."
 kar_pala_7:0 "The Silk and Muslin Looms"
 kar_pala_7_desc:0 "Fine textiles from Bengal are known to the Arab and Chinese merchant."
 kar_kamarupa_ideas:0 "Kamarupan Ideas"
 kar_kamarupa_ideas_start:0 "Kamarupan Traditions"
 kar_kamarupa_ideas_bonus:0 "Kamarupan Ambition"
 kar_kamarupa_1:0 "The Brahmaputra Valley"
 kar_kamarupa_1_desc:0 "The great river waters a long fertile valley hemmed in by mountains."
 kar_kamarupa_2:0 "Kings of the Naraka Line"
 kar_kamarupa_2_desc:0 "The Kamarupan kings claim descent from the demon Naraka, son of the Earth."
 kar_kamarupa_3:0 "Shiva and the Mother Goddess"
 kar_kamarupa_3_desc:0 "The Kamakhya temple draws pilgrims to the hilltop shrine."
 kar_kamarupa_4:0 "Hill and Valley Peoples"
 kar_kamarupa_4_desc:0 "Kachari, Garo, Khasi and Naga tribes serve the king as scouts and levies."
 kar_kamarupa_5:0 "Elephants of the Forest"
 kar_kamarupa_5_desc:0 "Wild elephants are caught, trained and put into battle."
 kar_kamarupa_6:0 "Silk and Agarwood"
 kar_kamarupa_6_desc:0 "Kamarupa produces silk, eaglewood and spices for trade with Bengal and Tibet."
 kar_kamarupa_7:0 "The Fortress Passes"
 kar_kamarupa_7_desc:0 "The mountain gates to Tibet, Burma and Bengal are held by garrisons."
 kar_lanka_ideas:0 "Sinhalese Ideas"
 kar_lanka_ideas_start:0 "Sinhalese Traditions"
 kar_lanka_ideas_bonus:0 "Sinhalese Ambition"
 kar_lanka_1:0 "Anuradhapura the Capital"
 kar_lanka_1_desc:0 "The ancient capital's stupas, palaces and reservoirs are the pride of the island."
 kar_lanka_2:0 "The Tanks and Canals"
 kar_lanka_2_desc:0 "Great irrigation tanks hold the monsoon rains for the dry zone's rice."
 kar_lanka_3:0 "The Tooth Relic"
 kar_lanka_3_desc:0 "The relic of the Buddha's tooth legitimises the king and draws pilgrims from across Asia."
 kar_lanka_4:0 "The Sangha"
 kar_lanka_4_desc:0 "The Mahavihara monks keep the Theravada tradition and the chronicles."
 kar_lanka_5:0 "Cinnamon and Pearls"
 kar_lanka_5_desc:0 "The island's cinnamon, pearls and gems bring merchants from every sea."
 kar_lanka_6:0 "The Island Shield"
 kar_lanka_6_desc:0 "The sea protects Lanka from all but the sea-borne invader, and the king mans the coast."
 kar_lanka_7:0 "War with the Tamil Neighbours"
 kar_lanka_7_desc:0 "Pandya and Chola raids from the mainland have taught the Sinhalese to fight on their own shore."
 kar_chola_ideas:0 "Chola Ideas"
 kar_chola_ideas_start:0 "Chola Traditions"
 kar_chola_ideas_bonus:0 "Chola Ambition"
 kar_chola_1:0 "The Kaveri Delta"
 kar_chola_1_desc:0 "The delta's rice and canals are the wealth of the Chola country."
 kar_chola_2:0 "Heirs of the Old Cholas"
 kar_chola_2_desc:0 "The Cholas, ancient kings of the Tamil country, were crushed by the Pallavas but remember their glory."
 kar_chola_3:0 "Shaiva Temples"
 kar_chola_3_desc:0 "Villagers and rulers fund temples to Shiva whose priests teach, judge and keep records."
 kar_chola_4:0 "The Village Assemblies"
 kar_chola_4_desc:0 "Village sabhas manage land, tax and justice, and give the king loyal local government."
 kar_chola_5:0 "The Coromandel Sailors"
 kar_chola_5_desc:0 "Tamil ships sail to Sri Lanka, Java and China."
 kar_chola_6:0 "War Elephants of the Plain"
 kar_chola_6_desc:0 "Elephants lead the armies of the Tamil kings."
 kar_chola_7:0 "Pearl and Cotton Trade"
 kar_chola_7_desc:0 "Merchants of the Coromandel coast sell pearls and fine cloth."
 kar_pandya_ideas:0 "Pandya Ideas"
 kar_pandya_ideas_start:0 "Pandya Traditions"
 kar_pandya_ideas_bonus:0 "Pandya Ambition"
 kar_pandya_1:0 "Madurai the Sangam City"
 kar_pandya_1_desc:0 "The capital of the Pandyas was the seat of the Tamil poets, and the king still patronises them."
 kar_pandya_2:0 "The Pearl Fishery"
 kar_pandya_2_desc:0 "The Gulf of Mannar's pearls are famous across Asia and are the Pandya's own."
 kar_pandya_3:0 "The Pepper Coast"
 kar_pandya_3_desc:0 "Pepper and spices from the Malabar hills reach foreign merchants through Pandya ports."
 kar_pandya_4:0 "The Fish Banner"
 kar_pandya_4_desc:0 "The Pandyas' standard of a fish is known from Rome to China, and their embassies went to both."
 kar_pandya_5:0 "Sinhalese Wars"
 kar_pandya_5_desc:0 "Pandya armies have invaded Lanka and burned its capital."
 kar_pandya_6:0 "Temple Cities"
 kar_pandya_6_desc:0 "Madurai and Rameshwaram are centres of pilgrimage and their priests are influential."
 kar_pandya_7:0 "Mariners of Korkai"
 kar_pandya_7_desc:0 "Korkai's seamen sail to Southeast Asia and Arabia, and return rich."
 kar_kashmir_ideas:0 "Kashmiri Ideas"
 kar_kashmir_ideas_start:0 "Kashmiri Traditions"
 kar_kashmir_ideas_bonus:0 "Kashmiri Ambition"
 kar_kashmir_1:0 "The Valley Fortress"
 kar_kashmir_1_desc:0 "A ring of high mountains keeps the Kashmir valley safe from invaders."
 kar_kashmir_2:0 "Kings of the Karkota and Utpala"
 kar_kashmir_2_desc:0 "The line of Lalitaditya, who raided as far as Bengal, gives Kashmir pride."
 kar_kashmir_3:0 "Sanskrit Scholars"
 kar_kashmir_3_desc:0 "Poets, grammarians and Shaiva philosophers write in Sanskrit at Kashmir's court."
 kar_kashmir_4:0 "Saffron and Shawl Wool"
 kar_kashmir_4_desc:0 "The valley grows saffron and spins fine wool, which the merchants carry down the passes."
 kar_kashmir_5:0 "Temples of Shiva and Buddha"
 kar_kashmir_5_desc:0 "Both faiths have monuments here, and the king honours both."
 kar_kashmir_6:0 "Passes to Central Asia"
 kar_kashmir_6_desc:0 "Caravans of Tibetan, Turkic and Chinese merchants cross Kashmir to India."
 kar_kashmir_7:0 "Damara Lords"
 kar_kashmir_7_desc:0 "The great landholders of Kashmir keep castles and rebellious followers, and threaten the king."
 kar_culture_french_ideas:0 "French Ideas"
 kar_culture_french_ideas_start:0 "French Traditions"
 kar_culture_french_ideas_bonus:0 "French Ambition"
 kar_culture_french_1:0 "The Frankish Aristocracy"
 kar_culture_french_1_desc:0 "Counts and their sons are raised to the lance and the court, and a French lord rides at the head of his vassals."
 kar_culture_french_2:0 "The Rule of Saint Benedict"
 kar_culture_french_2_desc:0 "The great abbeys of Neustria and Burgundy keep the Rule and keep the realm's records."
 kar_culture_french_3:0 "Counts and Viscounts"
 kar_culture_french_3_desc:0 "A thick network of counts, viscounts and castellans runs the countryside on the king's behalf."
 kar_culture_french_4:0 "The Heavy Plough"
 kar_culture_french_4_desc:0 "New heavy ploughs and three-field rotation raise the yield of the northern plains."
 kar_culture_french_5:0 "The Roman Law of the South"
 kar_culture_french_5_desc:0 "Language and law in the Midi keep their Latin form while the north turns to Frankish custom."
 kar_culture_french_6:0 "Bridges and Mills"
 kar_culture_french_6_desc:0 "Villages build mills on every stream and bridges on every river."
 kar_culture_french_7:0 "Pilgrim Roads"
 kar_culture_french_7_desc:0 "The roads to Tours, Rome and Compostela make French towns richer by trade and charity."
 kar_culture_saxon_ideas:0 "Saxon Ideas"
 kar_culture_saxon_ideas_start:0 "Saxon Traditions"
 kar_culture_saxon_ideas_bonus:0 "Saxon Ambition"
 kar_culture_saxon_1:0 "Free Saxon Peasants"
 kar_culture_saxon_1_desc:0 "The Saxon farmers keep their weapons and their pride, and enter the field behind their own lord."
 kar_culture_saxon_2:0 "The Old Saxon Gods Remembered"
 kar_culture_saxon_2_desc:0 "Folk customs remember the faith of Widukind and the sacred oak despite the Frankish conversion."
 kar_culture_saxon_3:0 "The Weser and the Elbe"
 kar_culture_saxon_3_desc:0 "Saxon rivers and forests are routes of trade and walls of defence."
 kar_culture_saxon_4:0 "Cloth and Salt"
 kar_culture_saxon_4_desc:0 "Lüneburg's salt and the north's linen go by cart and barge to the Baltic and the Rhine."
 kar_culture_saxon_5:0 "Monks of Corvey"
 kar_culture_saxon_5_desc:0 "The abbey on the Weser trained Saxon clerks and monks."
 kar_culture_saxon_6:0 "The Saxon Law"
 kar_culture_saxon_6_desc:0 "Customary law preserved by Saxon judges gives clear answers to local conflicts."
 kar_culture_saxon_7:0 "Border Counts of the Wends"
 kar_culture_saxon_7_desc:0 "Margraves hold the Elbe line with their own men."
 kar_culture_bavarian_ideas:0 "Bavarian Ideas"
 kar_culture_bavarian_ideas_start:0 "Bavarian Traditions"
 kar_culture_bavarian_ideas_bonus:0 "Bavarian Ambition"
 kar_culture_bavarian_1:0 "Bavarian Law"
 kar_culture_bavarian_1_desc:0 "The Lex Baiuvariorum protects the church, the free and the duke, and its judges are respected."
 kar_culture_bavarian_2:0 "Monastic Colonisation"
 kar_culture_bavarian_2_desc:0 "Monks clear the Alpine valleys and teach farming to the peasants who settle them."
 kar_culture_bavarian_3:0 "Salzburg and Passau"
 kar_culture_bavarian_3_desc:0 "Bishops of the Danube missionary sees send priests to Slavs and Hungarians."
 kar_culture_bavarian_4:0 "Alpine Passes"
 kar_culture_bavarian_4_desc:0 "Mountain roads over the Brenner connect Bavaria with Italy and Venice."
 kar_culture_bavarian_5:0 "Danube Shipping"
 kar_culture_bavarian_5_desc:0 "River boats move salt, wine and grain from Regensburg to Vienna."
 kar_culture_bavarian_6:0 "Landed Horsemen"
 kar_culture_bavarian_6_desc:0 "The Bavarian gentry ride to war as mounted men-at-arms, paid with land."
 kar_culture_bavarian_7:0 "The Mountain Fastnesses"
 kar_culture_bavarian_7_desc:0 "Valleys and passes make Bavaria a hard place to conquer."
 kar_culture_franconian_ideas:0 "Franconian Ideas"
 kar_culture_franconian_ideas_start:0 "Franconian Traditions"
 kar_culture_franconian_ideas_bonus:0 "Franconian Ambition"
 kar_culture_franconian_1:0 "The Heartland of the Franks"
 kar_culture_franconian_1_desc:0 "The Rhine and Main valleys are the Frankish homeland, and its people fight with a pride that no one else can match."
 kar_culture_franconian_2:0 "Palaces of the Empire"
 kar_culture_franconian_2_desc:0 "Ingelheim, Frankfurt and Worms host the assemblies of the Frankish kings."
 kar_culture_franconian_3:0 "Rhenish Wine"
 kar_culture_franconian_3_desc:0 "The vineyards of the Rhine and Moselle make the best-known wine in the north."
 kar_culture_franconian_4:0 "Cathedral Schools of Mainz and Worms"
 kar_culture_franconian_4_desc:0 "Bishops train an educated clergy who staff the royal chapel."
 kar_culture_franconian_5:0 "The Frankish Counts"
 kar_culture_franconian_5_desc:0 "A strong class of counts run the localities and give the kingdom its framework."
 kar_culture_franconian_6:0 "Frankish Infantry"
 kar_culture_franconian_6_desc:0 "Franks still fight on foot with sword and shield in the old fashion, and a strong line is hard to break."
 kar_culture_franconian_7:0 "The River Cities"
 kar_culture_franconian_7_desc:0 "Cologne, Mainz and Speyer trade up and down the Rhine."
 kar_culture_andalusian_ideas:0 "Andalusi Ideas"
 kar_culture_andalusian_ideas_start:0 "Andalusi Traditions"
 kar_culture_andalusian_ideas_bonus:0 "Andalusi Ambition"
 kar_culture_andalusian_1:0 "Arab Agronomy"
 kar_culture_andalusian_1_desc:0 "Irrigation, new crops and orchards turn the south of Iberia into a garden."
 kar_culture_andalusian_2:0 "The City of Cordoba"
 kar_culture_andalusian_2_desc:0 "The largest city in the west boasts libraries, baths and street lighting."
 kar_culture_andalusian_3:0 "Craftsmen of the Souks"
 kar_culture_andalusian_3_desc:0 "Leather, silk, ceramics and metal go from Andalusi workshops to every market."
 kar_culture_andalusian_4:0 "Convivencia"
 kar_culture_andalusian_4_desc:0 "Muslims, Christians and Jews live together, and the state taxes all three."
 kar_culture_andalusian_5:0 "Berber Garrisons"
 kar_culture_andalusian_5_desc:0 "Berber soldiers settled in the marches provide a standing army."
 kar_culture_andalusian_6:0 "Ports of the South"
 kar_culture_andalusian_6_desc:0 "Almeria, Malaga and Seville trade with Egypt, the Maghreb and the north."
 kar_culture_andalusian_7:0 "Arabic Poetry and Science"
 kar_culture_andalusian_7_desc:0 "Poets, astronomers and physicians write in Arabic and teach pupils from Christian lands."
 kar_culture_lombard_ideas:0 "Lombard Ideas"
 kar_culture_lombard_ideas_start:0 "Lombard Traditions"
 kar_culture_lombard_ideas_bonus:0 "Lombard Ambition"
 kar_culture_lombard_1:0 "The Lombard Dukes"
 kar_culture_lombard_1_desc:0 "The great dukes of Spoleto and Benevento keep a Lombard court and law in the south."
 kar_culture_lombard_2:0 "The Edict of Rothari"
 kar_culture_lombard_2_desc:0 "The Lombard law code is learned by every judge."
 kar_culture_lombard_3:0 "The Roman Cities"
 kar_culture_lombard_3_desc:0 "Italian towns keep their walls, bishops and markets from the time of Rome."
 kar_culture_lombard_4:0 "Lombard Cavalry"
 kar_culture_lombard_4_desc:0 "Lombard horsemen in the north and south still ride with lance and shield."
 kar_culture_lombard_5:0 "Monasteries of Bobbio and Monte Cassino"
 kar_culture_lombard_5_desc:0 "Monks preserve the Latin classics and the Benedictine Rule."
 kar_culture_lombard_6:0 "Pilgrims to Rome"
 kar_culture_lombard_6_desc:0 "Roads to Rome fill the inns, markets and churches of the peninsula."
 kar_culture_lombard_7:0 "The Po and the Adriatic"
 kar_culture_lombard_7_desc:0 "River and sea trade connects Italy's cities."
 kar_culture_bedouin_ideas:0 "Bedouin Ideas"
 kar_culture_bedouin_ideas_start:0 "Bedouin Traditions"
 kar_culture_bedouin_ideas_bonus:0 "Bedouin Ambition"
 kar_culture_bedouin_1:0 "Ahl al-Bayt and Tribe"
 kar_culture_bedouin_1_desc:0 "The tribe is the Arab's first loyalty, and the shaykh holds it together by generosity."
 kar_culture_bedouin_2:0 "Camel Riders"
 kar_culture_bedouin_2_desc:0 "Desert fighters ride swift camels and horses, and strike across waterless country."
 kar_culture_bedouin_3:0 "The Desert Road"
 kar_culture_bedouin_3_desc:0 "Caravan routes across Arabia pay the tribes who guard them."
 kar_culture_bedouin_4:0 "The Poets of the Tribe"
 kar_culture_bedouin_4_desc:0 "The qasida preserves tribal glory and shames the coward."
 kar_culture_bedouin_5:0 "The Wells and Oases"
 kar_culture_bedouin_5_desc:0 "Control of water means control of the desert."
 kar_culture_bedouin_6:0 "The Pilgrim Convoys"
 kar_culture_bedouin_6_desc:0 "Tribes escort and tax the Hajj caravans."
 kar_culture_bedouin_7:0 "Raiding Parties"
 kar_culture_bedouin_7_desc:0 "The ghazw of a tribe against its neighbours brings livestock and prestige."
 kar_culture_levantine_ideas:0 "Levantine Ideas"
 kar_culture_levantine_ideas_start:0 "Levantine Traditions"
 kar_culture_levantine_ideas_bonus:0 "Levantine Ambition"
 kar_culture_levantine_1:0 "Cities of Syria"
 kar_culture_levantine_1_desc:0 "Damascus, Aleppo and Jerusalem are old cities with great markets and holy sites."
 kar_culture_levantine_2:0 "The Mediterranean Coast"
 kar_culture_levantine_2_desc:0 "Sidon, Tyre and Acre are ports for the grain of the interior."
 kar_culture_levantine_3:0 "The Christian Communities"
 kar_culture_levantine_3_desc:0 "Melkite, Jacobite and Maronite communities live under Muslim rulers and keep their own clergy."
 kar_culture_levantine_4:0 "Glass and Soap"
 kar_culture_levantine_4_desc:0 "Syrian workshops produce glass, soap and cloth for export."
 kar_culture_levantine_5:0 "The Border with Byzantium"
 kar_culture_levantine_5_desc:0 "Frontier lords fight in the summer raids against the Greeks."
 kar_culture_levantine_6:0 "The Pilgrim Route to Mecca"
 kar_culture_levantine_6_desc:0 "Damascus is the gathering place of the Syrian pilgrims."
 kar_culture_levantine_7:0 "Syrian Scribes"
 kar_culture_levantine_7_desc:0 "Clerks of Syria served the Umayyads and now serve the Abbasids."
 kar_culture_persian_ideas:0 "Persian Ideas"
 kar_culture_persian_ideas_start:0 "Persian Traditions"
 kar_culture_persian_ideas_bonus:0 "Persian Ambition"
 kar_culture_persian_1:0 "Heirs of Cyrus"
 kar_culture_persian_1_desc:0 "The Persian elite remember the old kings and their administration."
 kar_culture_persian_2:0 "The Dihqans"
 kar_culture_persian_2_desc:0 "The landed gentry of Persia manage the villages and the harvest."
 kar_culture_persian_3:0 "Qanat and Garden"
 kar_culture_persian_3_desc:0 "Underground canals bring water to desert fields."
 kar_culture_persian_4:0 "Persian Secretaries"
 kar_culture_persian_4_desc:0 "Clerks of the Persian chancery serve the Muslim caliphs and amirs."
 kar_culture_persian_5:0 "Silk and Carpets"
 kar_culture_persian_5_desc:0 "The workshops of Persia weave silk and woollen carpets that are traded across Eurasia."
 kar_culture_persian_6:0 "The Cavalry of the Plateau"
 kar_culture_persian_6_desc:0 "Armoured Persian horse have faced Rome, Arabia and Turan."
 kar_culture_persian_7:0 "The New Persian Verse"
 kar_culture_persian_7_desc:0 "Poets write in Persian again, and the court of the east patronises them."
 kar_culture_turkish_ideas:0 "Turkic Ideas"
 kar_culture_turkish_ideas_start:0 "Turkic Traditions"
 kar_culture_turkish_ideas_bonus:0 "Turkic Ambition"
 kar_culture_turkish_1:0 "The Horse Archer"
 kar_culture_turkish_1_desc:0 "A Turkic warrior shoots as he rides and rides as he shoots."
 kar_culture_turkish_2:0 "The Khagan's Law"
 kar_culture_turkish_2_desc:0 "The törü, the law of the steppe, guides assemblies, tribute and war."
 kar_culture_turkish_3:0 "Herds of the Steppe"
 kar_culture_turkish_3_desc:0 "Immense herds support a mobile army."
 kar_culture_turkish_4:0 "Slave Soldiers"
 kar_culture_turkish_4_desc:0 "Turkic youths sold into Muslim lands become the best soldiers of the caliphs."
 kar_culture_turkish_5:0 "The Silk Road Tolls"
 kar_culture_turkish_5_desc:0 "Turkic tribes control passes and oases on the great trade routes."
 kar_culture_turkish_6:0 "Tengri and the Ancestors"
 kar_culture_turkish_6_desc:0 "The sky god and the ancestors of the clan receive sacrifices in every camp."
 kar_culture_turkish_7:0 "Feigned Retreat"
 kar_culture_turkish_7_desc:0 "Steppe warriors draw the enemy out and turn about to strike."
 kar_culture_javanese_ideas:0 "Javanese Ideas"
 kar_culture_javanese_ideas_start:0 "Javanese Traditions"
 kar_culture_javanese_ideas_bonus:0 "Javanese Ambition"
 kar_culture_javanese_1:0 "The Rice Kingdoms"
 kar_culture_javanese_1_desc:0 "Volcanic soil and wet-rice terraces give Java the densest population of the islands."
 kar_culture_javanese_2:0 "Temples of Borobudur and Prambanan"
 kar_culture_javanese_2_desc:0 "Great stone temples rise in the Kedu plain as monuments to kings and gods."
 kar_culture_javanese_3:0 "Shailendra and Sanjaya"
 kar_culture_javanese_3_desc:0 "Two dynasties, Buddhist and Shaiva, share and rival the island's power."
 kar_culture_javanese_4:0 "Pasisir Ports"
 kar_culture_javanese_4_desc:0 "North-coast harbours carry rice, spices and cloth to the straits and to China."
 kar_culture_javanese_5:0 "Gamelan and Wayang"
 kar_culture_javanese_5_desc:0 "Court culture of music and shadow-play mixes Indian epic with Javanese spirit."
 kar_culture_javanese_6:0 "The Village Desa"
 kar_culture_javanese_6_desc:0 "Village communities manage fields, irrigation and levies."
 kar_culture_javanese_7:0 "Warships of the Java Sea"
 kar_culture_javanese_7_desc:0 "Javanese fleets sail to Sumatra, Borneo and Malaya."
 kar_culture_malay_ideas:0 "Malay Ideas"
 kar_culture_malay_ideas_start:0 "Malay Traditions"
 kar_culture_malay_ideas_bonus:0 "Malay Ambition"
 kar_culture_malay_1:0 "Straits of Malacca"
 kar_culture_malay_1_desc:0 "Ships pass through narrow waters controlled by the Malay ports."
 kar_culture_malay_2:0 "The Orang Laut"
 kar_culture_malay_2_desc:0 "Sea nomads pilot, scout and fight for Malay rulers."
 kar_culture_malay_3:0 "Pepper and Tin"
 kar_culture_malay_3_desc:0 "Sumatran pepper and Malay tin are sold to Indian and Chinese traders."
 kar_culture_malay_4:0 "The Raja and the Bendahara"
 kar_culture_malay_4_desc:0 "The king rules with a first minister who holds the treasury and command."
 kar_culture_malay_5:0 "River Ports"
 kar_culture_malay_5_desc:0 "Cities along the rivers mark the line between jungle and sea."
 kar_culture_malay_6:0 "The Malay Rivers"
 kar_culture_malay_6_desc:0 "Boats carry soldiers to every village along the coast."
 kar_culture_malay_7:0 "Indian Traders and Religion"
 kar_culture_malay_7_desc:0 "Indian merchants and Brahmins give Malay courts titles and rites."
 kar_culture_philippine_ideas:0 "Philippine Ideas"
 kar_culture_philippine_ideas_start:0 "Philippine Traditions"
 kar_culture_philippine_ideas_bonus:0 "Philippine Ambition"
 kar_culture_philippine_1:0 "The Barangay"
 kar_culture_philippine_1_desc:0 "The boat-community of the datu is a village, a war band and a trading house."
 kar_culture_philippine_2:0 "Datu and Rajah"
 kar_culture_philippine_2_desc:0 "Chiefs rule with generosity and war prowess."
 kar_culture_philippine_3:0 "Gold and Pottery"
 kar_culture_philippine_3_desc:0 "Philippine goldsmiths and potters trade with China and Borneo."
 kar_culture_philippine_4:0 "Warriors of the Islands"
 kar_culture_philippine_4_desc:0 "Philippine raiders strike by sea and withdraw."
 kar_culture_philippine_5:0 "Rice Terraces"
 kar_culture_philippine_5_desc:0 "Mountain terraces in Luzon feed large populations."
 kar_culture_philippine_6:0 "The Balangay"
 kar_culture_philippine_6_desc:0 "Large plank-built ships carry whole communities across the sea."
 kar_culture_philippine_7:0 "Ancestor Spirits"
 kar_culture_philippine_7_desc:0 "Anito spirits are offered feasts for success in war and harvest."
 kar_faith_norse_ideas:0 "Heathen Norse Ideas"
 kar_faith_norse_ideas_start:0 "Heathen Norse Traditions"
 kar_faith_norse_ideas_bonus:0 "Heathen Norse Ambition"
 kar_faith_norse_1:0 "The Dragon Ship"
 kar_faith_norse_1_desc:0 "The clinker-built longship goes where no Christian fleet dares, and the oarsmen are free men who own their shares."
 kar_faith_norse_2:0 "The Thing at the Mound"
 kar_faith_norse_2_desc:0 "Free men gather at the lawmound and the lawspeaker recites the law from memory; a chief rules by their consent."
 kar_faith_norse_3:0 "Winter Raid and Summer Trade"
 kar_faith_norse_3_desc:0 "The same crews carry furs and slaves to the markets and iron and silver home."
 kar_faith_norse_4:0 "Oath-sworn Hirdmen"
 kar_faith_norse_4_desc:0 "A jarl's household warriors eat at his table and die at his side."
 kar_faith_norse_5:0 "The Shield Wall"
 kar_faith_norse_5_desc:0 "Men of the same hundred stand shoulder to shoulder and the line does not break."
 kar_faith_norse_6:0 "Blood Feud and Wergild"
 kar_faith_norse_6_desc:0 "The feud is settled by payment before a Thing, or it is settled by the axe."
 kar_faith_norse_7:0 "Odin's Chosen"
 kar_faith_norse_7_desc:0 "The warrior who dies with a sword in hand feasts in Valhalla, and this makes men fearless."
 kar_faith_slavic_ideas:0 "Slavic Tribes Ideas"
 kar_faith_slavic_ideas_start:0 "Slavic Tribes Traditions"
 kar_faith_slavic_ideas_bonus:0 "Slavic Tribes Ambition"
 kar_faith_slavic_1:0 "The Hillfort"
 kar_faith_slavic_1_desc:0 "A timber and earth rampart on a hill or an island in the marsh shelters the whole tribe and its herds."
 kar_faith_slavic_2:0 "The Veche"
 kar_faith_slavic_2_desc:0 "The free men gather, shout their consent and elect a war leader for the season."
 kar_faith_slavic_3:0 "Forest and Marsh"
 kar_faith_slavic_3_desc:0 "The tribe knows the paths through bog and thicket that a stranger cannot find."
 kar_faith_slavic_4:0 "Swidden Fields and Beehives"
 kar_faith_slavic_4_desc:0 "Burnt clearings, millet and honey feed the tribe without the lord's granary."
 kar_faith_slavic_5:0 "The Sacred Grove"
 kar_faith_slavic_5_desc:0 "At the grove and the carved idol of the god the oath is sworn and the harvest is blessed."
 kar_faith_slavic_6:0 "Amber and Fur"
 kar_faith_slavic_6_desc:0 "River portages carry furs, honey and slaves to the markets on the Dnieper and the Elbe."
 kar_faith_slavic_7:0 "Levy of the Tribe"
 kar_faith_slavic_7_desc:0 "When the war horn sounds every free man brings his spear and a sack of meal."
 kar_faith_finnic_baltic_ideas:0 "Forest Peoples Ideas"
 kar_faith_finnic_baltic_ideas_start:0 "Forest Peoples Traditions"
 kar_faith_finnic_baltic_ideas_bonus:0 "Forest Peoples Ambition"
 kar_faith_finnic_baltic_1:0 "Hillfort and Swamp"
 kar_faith_finnic_baltic_1_desc:0 "A palisade on a wooded hill and a belt of marsh around it stop a column of strangers."
 kar_faith_finnic_baltic_2:0 "The Sacred Grove"
 kar_faith_finnic_baltic_2_desc:0 "The old oak and the spring are where the people meet the gods, and no priest of Christ has felled them."
 kar_faith_finnic_baltic_3:0 "Amber Roads"
 kar_faith_finnic_baltic_3_desc:0 "Amber, furs and wax pass from the coast to the south along old paths."
 kar_faith_finnic_baltic_4:0 "Skiers and Archers"
 kar_faith_finnic_baltic_4_desc:0 "Men on skis and with bows move through the snow where horses cannot go."
 kar_faith_finnic_baltic_5:0 "Clan Elders"
 kar_faith_finnic_baltic_5_desc:0 "The heads of the great kin-groups settle quarrels and name a leader for the raid."
 kar_faith_finnic_baltic_6:0 "Sea Raiders"
 kar_faith_finnic_baltic_6_desc:0 "Boats from the coast fall upon the Danish and Swedish shores and return with plunder."
 kar_faith_finnic_baltic_7:0 "Hunters of the Forest"
 kar_faith_finnic_baltic_7_desc:0 "A hunting people knows its woods, and a woodland ambush is deadly."
 kar_faith_steppe_tengri_ideas:0 "Peoples of the Sky Ideas"
 kar_faith_steppe_tengri_ideas_start:0 "Peoples of the Sky Traditions"
 kar_faith_steppe_tengri_ideas_bonus:0 "Peoples of the Sky Ambition"
 kar_faith_steppe_tengri_1:0 "The Mounted Archer"
 kar_faith_steppe_tengri_1_desc:0 "A boy learns to shoot from the saddle before he can write his name."
 kar_faith_steppe_tengri_2:0 "The Herds"
 kar_faith_steppe_tengri_2_desc:0 "Horses, sheep and camels are the people's wealth, and a campaign is a migration."
 kar_faith_steppe_tengri_3:0 "The Kurultai"
 kar_faith_steppe_tengri_3_desc:0 "The lords of the tribes gather to elect a khan and to swear loyalty on the felt."
 kar_faith_steppe_tengri_4:0 "Eternal Blue Sky"
 kar_faith_steppe_tengri_4_desc:0 "Tengri gives the khan the right to rule, and the people believe that he does."
 kar_faith_steppe_tengri_5:0 "Tribute from the Sown"
 kar_faith_steppe_tengri_5_desc:0 "Farming and trading cities pay silk, grain and silver to avoid the raiders."
 kar_faith_steppe_tengri_6:0 "Tamgha and Clan"
 kar_faith_steppe_tengri_6_desc:0 "Every clan has its mark, its pastures and its place in the order of march."
 kar_faith_steppe_tengri_7:0 "The Caravan Road"
 kar_faith_steppe_tengri_7_desc:0 "Sogdian merchants buy horses and sell silk, and the khan taxes both."
 kar_faith_kharijite_ideas:0 "Kharijite Imamates Ideas"
 kar_faith_kharijite_ideas_start:0 "Kharijite Imamates Traditions"
 kar_faith_kharijite_ideas_bonus:0 "Kharijite Imamates Ambition"
 kar_faith_kharijite_1:0 "The Elected Imam"
 kar_faith_kharijite_1_desc:0 "The community chooses the most pious man, whatever his tribe, and deposes him if he strays."
 kar_faith_kharijite_2:0 "Piety and Austerity"
 kar_faith_kharijite_2_desc:0 "The people reject luxury and the rulers live like the poor."
 kar_faith_kharijite_3:0 "The Oases and the Caravans"
 kar_faith_kharijite_3_desc:0 "Kharijite traders carry gold, salt and slaves across the Sahara."
 kar_faith_kharijite_4:0 "The Citadel"
 kar_faith_kharijite_4_desc:0 "A walled town on the edge of the desert is hard to take and harder to hold."
 kar_faith_kharijite_5:0 "The Desert Raiders"
 kar_faith_kharijite_5_desc:0 "Camel riders strike and vanish into the sand."
 kar_faith_kharijite_6:0 "The Mission to the Berbers"
 kar_faith_kharijite_6_desc:0 "Ibadi missionaries have won the tribes beyond the Sahara."
 kar_faith_kharijite_7:0 "The Council of Elders"
 kar_faith_kharijite_7_desc:0 "Respected men settle quarrels by custom and advise the imam."
 kar_faith_hindu_kingdoms_ideas:0 "Hindu Kingdoms Ideas"
 kar_faith_hindu_kingdoms_ideas_start:0 "Hindu Kingdoms Traditions"
 kar_faith_hindu_kingdoms_ideas_bonus:0 "Hindu Kingdoms Ambition"
 kar_faith_hindu_kingdoms_1:0 "Brahmin Land Grants"
 kar_faith_hindu_kingdoms_1_desc:0 "A king gives villages to temples and scholars, and the Brahmins write his name on copper plates."
 kar_faith_hindu_kingdoms_2:0 "The Temple"
 kar_faith_hindu_kingdoms_2_desc:0 "A great stone temple on the royal road shows the people what the king is and whom he serves."
 kar_faith_hindu_kingdoms_3:0 "The War Elephants"
 kar_faith_hindu_kingdoms_3_desc:0 "Elephants carry archers into the line and break an unready enemy."
 kar_faith_hindu_kingdoms_4:0 "The Mandala of Kings"
 kar_faith_hindu_kingdoms_4_desc:0 "Lesser rajas bow to the greatest, send tribute and hold their own courts."
 kar_faith_hindu_kingdoms_5:0 "The Guild of Merchants"
 kar_faith_hindu_kingdoms_5_desc:0 "The merchant guilds trade with the Arabs and Chinese and endow the temple."
 kar_faith_hindu_kingdoms_6:0 "Irrigated Rice"
 kar_faith_hindu_kingdoms_6_desc:0 "Tanks and canals feed the villages and fill the royal granary."
 kar_faith_hindu_kingdoms_7:0 "Varna and Dharma"
 kar_faith_hindu_kingdoms_7_desc:0 "The old duty of each caste keeps the villages quiet and the army supplied."
 kar_faith_buddhist_mainland_ideas:0 "Buddhist Kingdoms Ideas"
 kar_faith_buddhist_mainland_ideas_start:0 "Buddhist Kingdoms Traditions"
 kar_faith_buddhist_mainland_ideas_bonus:0 "Buddhist Kingdoms Ambition"
 kar_faith_buddhist_mainland_1:0 "The Sangha"
 kar_faith_buddhist_mainland_1_desc:0 "Monks keep the records, teach the children and advise the king."
 kar_faith_buddhist_mainland_2:0 "The Great Stupa"
 kar_faith_buddhist_mainland_2_desc:0 "A king who builds a pagoda earns merit for himself and glory for his realm."
 kar_faith_buddhist_mainland_3:0 "Wet Rice and the Tank"
 kar_faith_buddhist_mainland_3_desc:0 "A people that irrigates its paddies can feed an army and the monks."
 kar_faith_buddhist_mainland_4:0 "The Dharma King"
 kar_faith_buddhist_mainland_4_desc:0 "A ruler who follows the Buddha's law is obeyed more readily by his people."
 kar_faith_buddhist_mainland_5:0 "The Pilgrim Road"
 kar_faith_buddhist_mainland_5_desc:0 "Chinese and Indian pilgrims bring ideas and gifts as they pass."
 kar_faith_buddhist_mainland_6:0 "Elephants and Archers"
 kar_faith_buddhist_mainland_6_desc:0 "The mahouts and bowmen of the king are drilled in the old way."
 kar_faith_buddhist_mainland_7:0 "The Monastery Schools"
 kar_faith_buddhist_mainland_7_desc:0 "Every boy learns to read in a temple, and the king chooses his officials among them."
 kar_faith_vajrayana_ideas:0 "Realms of the Dharma Ideas"
 kar_faith_vajrayana_ideas_start:0 "Realms of the Dharma Traditions"
 kar_faith_vajrayana_ideas_bonus:0 "Realms of the Dharma Ambition"
 kar_faith_vajrayana_1:0 "The Mountain Pass"
 kar_faith_vajrayana_1_desc:0 "A few fortified passes open the road to the high plateau, and a small garrison can hold them."
 kar_faith_vajrayana_2:0 "The Lama and the King"
 kar_faith_vajrayana_2_desc:0 "The abbot blesses the throne, and the king protects the monastery."
 kar_faith_vajrayana_3:0 "The Mounted Spearmen"
 kar_faith_vajrayana_3_desc:0 "Horsemen from the high pastures are tough, tireless and hard to catch."
 kar_faith_vajrayana_4:0 "The Monastery Estate"
 kar_faith_vajrayana_4_desc:0 "The great monastery owns land, herds and serfs and pays a share to the throne."
 kar_faith_vajrayana_5:0 "The Salt and Tea Road"
 kar_faith_vajrayana_5_desc:0 "Yak caravans carry salt, tea and horses between China and India."
 kar_faith_vajrayana_6:0 "The Translators"
 kar_faith_vajrayana_6_desc:0 "Scholars from India bring sutras and tantras, and the court pays for their translation."
 kar_faith_vajrayana_7:0 "Thin Air and High Snow"
 kar_faith_vajrayana_7_desc:0 "A lowland army does not survive a winter on the plateau."
 kar_faith_waaqism_ideas:0 "Cushitic Highlanders Ideas"
 kar_faith_waaqism_ideas_start:0 "Cushitic Highlanders Traditions"
 kar_faith_waaqism_ideas_bonus:0 "Cushitic Highlanders Ambition"
 kar_faith_waaqism_1:0 "The Gadaa"
 kar_faith_waaqism_1_desc:0 "Age-grades of men take turns at government, and none holds power for more than eight years."
 kar_faith_waaqism_2:0 "Herds of Cattle"
 kar_faith_waaqism_2_desc:0 "The cattle are wealth, bride-price and sacrifice, and the pastures are held by the clan."
 kar_faith_waaqism_3:0 "The Highland Redoubt"
 kar_faith_waaqism_3_desc:0 "Steep escarpments and deep gorges make the highlands hard to cross."
 kar_faith_waaqism_4:0 "Waaq the Sky God"
 kar_faith_waaqism_4_desc:0 "The one god of the sky is worshipped on hilltops, and the tribes swear their oaths upon his name."
 kar_faith_waaqism_5:0 "The Salt and Gold Trade"
 kar_faith_waaqism_5_desc:0 "Caravans carry salt, ivory and gold from the lowlands to the Red Sea."
 kar_faith_waaqism_6:0 "Cavalry of the Plain"
 kar_faith_waaqism_6_desc:0 "The clan's horsemen strike and withdraw."
 kar_faith_waaqism_7:0 "The Council of Elders"
 kar_faith_waaqism_7_desc:0 "The elders of the clans advise the leader and settle quarrels with the neighbours."
 kar_faith_taiga_ideas:0 "Peoples of the Taiga Ideas"
 kar_faith_taiga_ideas_start:0 "Peoples of the Taiga Traditions"
 kar_faith_taiga_ideas_bonus:0 "Peoples of the Taiga Ambition"
 kar_faith_taiga_1:0 "The Reindeer Herd"
 kar_faith_taiga_1_desc:0 "Reindeer carry loads, give milk and clothe the people against the cold."
 kar_faith_taiga_2:0 "The Shaman"
 kar_faith_taiga_2_desc:0 "A man who speaks with the spirits heals the sick and finds the herds."
 kar_faith_taiga_3:0 "Sable and Ermine"
 kar_faith_taiga_3_desc:0 "The fur-tax makes the people wealthy and attracts the traders."
 kar_faith_taiga_4:0 "Forest Archers"
 kar_faith_taiga_4_desc:0 "A hunter's bow takes the elk, and the same bow takes the enemy."
 kar_faith_taiga_5:0 "Winter Camps"
 kar_faith_taiga_5_desc:0 "The people spread over the forest in summer and gather in the winter camp."
 kar_faith_taiga_6:0 "The Clan Elder"
 kar_faith_taiga_6_desc:0 "The kin-group's eldest man judges quarrels and leads the hunt."
 kar_faith_taiga_7:0 "River and Sledge"
 kar_faith_taiga_7_desc:0 "Boats in summer and sledges in winter carry the people across the vast lands."
 kar_faith_island_animist_ideas:0 "Island Animists Ideas"
 kar_faith_island_animist_ideas_start:0 "Island Animists Traditions"
 kar_faith_island_animist_ideas_bonus:0 "Island Animists Ambition"
 kar_faith_island_animist_1:0 "The Longhouse"
 kar_faith_island_animist_1_desc:0 "A whole community lives under one roof and answers to one headman."
 kar_faith_island_animist_2:0 "Ancestors and Spirits"
 kar_faith_island_animist_2_desc:0 "The dead stay with the living, and the rites of the village keep them favourable."
 kar_faith_island_animist_3:0 "The Jungle Warriors"
 kar_faith_island_animist_3_desc:0 "Men of the forest strike from hiding and vanish into the undergrowth."
 kar_faith_island_animist_4:0 "River and Coast Boats"
 kar_faith_island_animist_4_desc:0 "The people pass between the settlements by river and by sea."
 kar_faith_island_animist_5:0 "Forest Trade"
 kar_faith_island_animist_5_desc:0 "Camphor, resin, gold and hornbills are traded to Chinese and Indian merchants."
 kar_faith_island_animist_6:0 "The Headman and the Elders"
 kar_faith_island_animist_6_desc:0 "The headman rules with the elders and none of them can act alone."
 kar_faith_island_animist_7:0 "Swidden and Sago"
 kar_faith_island_animist_7_desc:0 "Fire-cleared fields and sago palms feed the people in lean years."
 kar_faith_eastern_churches_ideas:0 "Eastern Christians Ideas"
 kar_faith_eastern_churches_ideas_start:0 "Eastern Christians Traditions"
 kar_faith_eastern_churches_ideas_bonus:0 "Eastern Christians Ambition"
 kar_faith_eastern_churches_1:0 "The Mountain Fastness"
 kar_faith_eastern_churches_1_desc:0 "A people that holds a mountain valley can outlast an empire."
 kar_faith_eastern_churches_2:0 "The Katholikos"
 kar_faith_eastern_churches_2_desc:0 "The head of the church crowns the king, speaks for the people and keeps the records."
 kar_faith_eastern_churches_3:0 "The Monasteries"
 kar_faith_eastern_churches_3_desc:0 "Monks copy the Scriptures, teach the young and shelter the traveller."
 kar_faith_eastern_churches_4:0 "Merchants between Empires"
 kar_faith_eastern_churches_4_desc:0 "Caravans of the nation pass between Byzantium, the caliphate and the Silk Road."
 kar_faith_eastern_churches_5:0 "Cavalry of the Nakharars"
 kar_faith_eastern_churches_5_desc:0 "The great houses send mounted retainers on campaign."
 kar_faith_eastern_churches_6:0 "Tolerance under a Master"
 kar_faith_eastern_churches_6_desc:0 "A subject people learns to pay and to wait."
 kar_faith_eastern_churches_7:0 "The Faith of the Fathers"
 kar_faith_eastern_churches_7_desc:0 "The people have kept the faith under Persian, Byzantine and Arab rule."
 kar_group_albanian_ideas:0 "Albanian Ideas"
 kar_group_albanian_ideas_start:0 "Albanian Traditions"
 kar_group_albanian_ideas_bonus:0 "Albanian Ambition"
 kar_group_albanian_1:0 "The Eagle's Nest"
 kar_group_albanian_1_desc:0 "Crags and mountain valleys give every clan a natural fortress."
 kar_group_albanian_2:0 "Clan and Besa"
 kar_group_albanian_2_desc:0 "The besa, a sworn word between clans, guarantees peace between kin and neighbour."
 kar_group_albanian_3:0 "Mountain Shepherds"
 kar_group_albanian_3_desc:0 "Sheep and goats pasture in the high meadows and are the mainstay of the highlands."
 kar_group_albanian_4:0 "Light Infantry of the Hills"
 kar_group_albanian_4_desc:0 "Albanian clansmen fight on foot with spear, sling and long knife."
 kar_group_albanian_5:0 "Roman Roads of the Via Egnatia"
 kar_group_albanian_5_desc:0 "The old road across the Balkans passes through Albanian lands, and gives its lords tolls."
 kar_group_albanian_6:0 "Byzantine Titles"
 kar_group_albanian_6_desc:0 "Lords accept imperial titles and a patent of office from Constantinople for their local power."
 kar_group_albanian_7:0 "Illyrian Heritage"
 kar_group_albanian_7_desc:0 "The Albanians' speech and customs are older than Rome, and the people know it."
 kar_group_arabic_ideas:0 "Arabic Ideas"
 kar_group_arabic_ideas_start:0 "Arabic Traditions"
 kar_group_arabic_ideas_bonus:0 "Arabic Ambition"
 kar_group_arabic_1:0 "The Language of the Quran"
 kar_group_arabic_1_desc:0 "Arabic is the language of the revelation, law and learning for a hundred peoples."
 kar_group_arabic_2:0 "The Majlis"
 kar_group_arabic_2_desc:0 "Rulers hold open audience where any subject may petition, and their justice earns loyalty."
 kar_group_arabic_3:0 "Caravan Trade"
 kar_group_arabic_3_desc:0 "Camel trains and river boats link the cities from Basra to Cairo."
 kar_group_arabic_4:0 "The Hajj"
 kar_group_arabic_4_desc:0 "The pilgrimage to Mecca brings wealth, travellers and news across the Muslim world."
 kar_group_arabic_5:0 "Arab Horses"
 kar_group_arabic_5_desc:0 "Purebred Arabian mounts give the cavalry speed and endurance."
 kar_group_arabic_6:0 "The Scholars of the Cities"
 kar_group_arabic_6_desc:0 "Jurists, physicians and astronomers teach in the mosques of every city."
 kar_group_arabic_7:0 "Tribal Confederations"
 kar_group_arabic_7_desc:0 "The Arab tribes keep their kin-ties and pledge their spears to the amir."
 kar_group_austronesian_ideas:0 "Austronesian Ideas"
 kar_group_austronesian_ideas_start:0 "Austronesian Traditions"
 kar_group_austronesian_ideas_bonus:0 "Austronesian Ambition"
 kar_group_austronesian_1:0 "Outrigger and Sail"
 kar_group_austronesian_1_desc:0 "Island peoples have crossed the oceans for thousands of years in boats with outriggers and woven sails."
 kar_group_austronesian_2:0 "The Monsoon Winds"
 kar_group_austronesian_2_desc:0 "Sailors who know the monsoon calendar move between the islands of the east."
 kar_group_austronesian_3:0 "Datu and Rajah"
 kar_group_austronesian_3_desc:0 "Local chiefs gather retinues of warriors and rule by honour and generosity."
 kar_group_austronesian_4:0 "Spices and Camphor"
 kar_group_austronesian_4_desc:0 "Islands produce cloves, nutmeg, pepper and camphor for the markets of China, India and Arabia."
 kar_group_austronesian_5:0 "Rice Terraces and Taro Fields"
 kar_group_austronesian_5_desc:0 "Careful water control raises dense harvests on volcanic soils."
 kar_group_austronesian_6:0 "Warriors of the Archipelago"
 kar_group_austronesian_6_desc:0 "Island fighters strike from the sea and fall back to the jungle."
 kar_group_austronesian_7:0 "The Ancestral Spirits"
 kar_group_austronesian_7_desc:0 "The dead are honoured with ritual feasts, and chiefs rule by the favour of spirits."
 kar_group_baltic_ideas:0 "Baltic Ideas"
 kar_group_baltic_ideas_start:0 "Baltic Traditions"
 kar_group_baltic_ideas_bonus:0 "Baltic Ambition"
 kar_group_baltic_1:0 "The Hillforts"
 kar_group_baltic_1_desc:0 "Earth-and-timber forts on hills defend the Baltic tribes against all invaders."
 kar_group_baltic_2:0 "The Amber Coast"
 kar_group_baltic_2_desc:0 "Amber gathered on the shore is traded south to Rome and Byzantium."
 kar_group_baltic_3:0 "The Forest Walls"
 kar_group_baltic_3_desc:0 "Deep forests and swamps stop slow armies and hide fast raiders."
 kar_group_baltic_4:0 "Pagan Priests"
 kar_group_baltic_4_desc:0 "Priests of Perkunas keep sacred groves and guide chiefs in war."
 kar_group_baltic_5:0 "Mounted Raiders"
 kar_group_baltic_5_desc:0 "Light cavalry strike Slavic and Finnish neighbours and withdraw."
 kar_group_baltic_6:0 "Tribal Assemblies"
 kar_group_baltic_6_desc:0 "Elders choose the war leader from among the clan chiefs."
 kar_group_baltic_7:0 "Honey and Wax"
 kar_group_baltic_7_desc:0 "Forest beekeepers supply honey, wax and furs."
 kar_group_balto_finnic_ideas:0 "Finnic Ideas"
 kar_group_balto_finnic_ideas_start:0 "Finnic Traditions"
 kar_group_balto_finnic_ideas_bonus:0 "Finnic Ambition"
 kar_group_balto_finnic_1:0 "Lakes and Forests"
 kar_group_balto_finnic_1_desc:0 "Finnic territory is a maze of water, bog and pine."
 kar_group_balto_finnic_2:0 "Shamans and Sacred Groves"
 kar_group_balto_finnic_2_desc:0 "The tietäjä sings the sacred words and speaks with the spirits."
 kar_group_balto_finnic_3:0 "Fur and Fish"
 kar_group_balto_finnic_3_desc:0 "Hunters and fishermen sell pelts and dried fish across the Baltic."
 kar_group_balto_finnic_4:0 "Archers of the Forest"
 kar_group_balto_finnic_4_desc:0 "Finnic hunters shoot with the bow from cover."
 kar_group_balto_finnic_5:0 "Longboats of the Gulf"
 kar_group_balto_finnic_5_desc:0 "Finnish and Estonian boats raid and trade across the Gulf of Finland."
 kar_group_balto_finnic_6:0 "Clan Elders"
 kar_group_balto_finnic_6_desc:0 "Councils of the kin-group settle disputes."
 kar_group_balto_finnic_7:0 "Hillfort Tribes"
 kar_group_balto_finnic_7_desc:0 "Ringforts of earth and timber hold the coast."
 kar_group_berber_ideas:0 "Berber Ideas"
 kar_group_berber_ideas_start:0 "Berber Traditions"
 kar_group_berber_ideas_bonus:0 "Berber Ambition"
 kar_group_berber_1:0 "The Atlas and the Sahara"
 kar_group_berber_1_desc:0 "Berber peoples live between mountains and desert and cannot be easily conquered."
 kar_group_berber_2:0 "Tribal Confederations"
 kar_group_berber_2_desc:0 "Zenata, Sanhaja and Masmuda tribes make war and peace as federations."
 kar_group_berber_3:0 "Camel Caravans"
 kar_group_berber_3_desc:0 "Berber merchants and guides lead trans-Saharan trade."
 kar_group_berber_4:0 "Horsemen of the Plains"
 kar_group_berber_4_desc:0 "Berber cavalry are famous for their speed and skirmishing."
 kar_group_berber_5:0 "The Fortified Granary"
 kar_group_berber_5_desc:0 "Walled storehouses (ksour) on the hilltops protect the harvest."
 kar_group_berber_6:0 "Heterodox Islam"
 kar_group_berber_6_desc:0 "Berbers have joined many sects, Kharijite, Shiite and Sunni, to resist Arab rule."
 kar_group_berber_7:0 "The Spirit of Revolt"
 kar_group_berber_7_desc:0 "Berber communities rebel against tyranny and the memory of their revolts is long."
 kar_group_brythonic_ideas:0 "Brythonic Ideas"
 kar_group_brythonic_ideas_start:0 "Brythonic Traditions"
 kar_group_brythonic_ideas_bonus:0 "Brythonic Ambition"
 kar_group_brythonic_1:0 "Lords of the Island of Britain"
 kar_group_brythonic_1_desc:0 "Britons remember that their fathers ruled the whole island before the English."
 kar_group_brythonic_2:0 "The Celtic Saints"
 kar_group_brythonic_2_desc:0 "Monks and hermits found holy sites across Wales and Cornwall."
 kar_group_brythonic_3:0 "Bards and Law"
 kar_group_brythonic_3_desc:0 "The bards memorise genealogy and law and carry the tradition."
 kar_group_brythonic_4:0 "Mountain Strongholds"
 kar_group_brythonic_4_desc:0 "Snowdonia and the Welsh hills guard the Britons from invasion."
 kar_group_brythonic_5:0 "Longbow Foot"
 kar_group_brythonic_5_desc:0 "Welsh spearmen and archers fight from hills and woods."
 kar_group_brythonic_6:0 "Cattle Raids"
 kar_group_brythonic_6_desc:0 "A king's wealth is herds, and war is cattle raiding writ large."
 kar_group_brythonic_7:0 "Tin and Wool"
 kar_group_brythonic_7_desc:0 "Cornwall's tin and Wales's wool go out by sea."
 kar_group_byzantine_ideas:0 "Greek Ideas"
 kar_group_byzantine_ideas_start:0 "Greek Traditions"
 kar_group_byzantine_ideas_bonus:0 "Greek Ambition"
 kar_group_byzantine_1:0 "The Heirs of Hellas"
 kar_group_byzantine_1_desc:0 "Greek speakers remember the poets, philosophers and statesmen of their past."
 kar_group_byzantine_2:0 "The Orthodox Church"
 kar_group_byzantine_2_desc:0 "The Church of Constantinople shapes daily life and speaks with a Greek voice."
 kar_group_byzantine_3:0 "Island Sailors"
 kar_group_byzantine_3_desc:0 "Seamen from the Aegean and the Ionian islands man the empire's fleets."
 kar_group_byzantine_4:0 "Olive and Vine"
 kar_group_byzantine_4_desc:0 "The Greek lands produce oil and wine for export."
 kar_group_byzantine_5:0 "Roman Administration"
 kar_group_byzantine_5_desc:0 "Provincial governors and tax assessors follow Roman custom."
 kar_group_byzantine_6:0 "City Walls"
 kar_group_byzantine_6_desc:0 "Every Greek city keeps its walls in repair."
 kar_group_byzantine_7:0 "Harbours of the Aegean"
 kar_group_byzantine_7_desc:0 "Merchant ships link Thessaloniki, Smyrna and the Black Sea."
 kar_group_caucasian_ideas:0 "Caucasian Ideas"
 kar_group_caucasian_ideas_start:0 "Caucasian Traditions"
 kar_group_caucasian_ideas_bonus:0 "Caucasian Ambition"
 kar_group_caucasian_1:0 "The Mountain Wall"
 kar_group_caucasian_1_desc:0 "The Caucasus range divides two seas and two worlds, and guards its people."
 kar_group_caucasian_2:0 "Knightly Houses"
 kar_group_caucasian_2_desc:0 "Great noble houses maintain warrior retinues."
 kar_group_caucasian_3:0 "Early Christians"
 kar_group_caucasian_3_desc:0 "Georgia and Armenia were among the first Christian kingdoms."
 kar_group_caucasian_4:0 "Wine and Silk"
 kar_group_caucasian_4_desc:0 "Valleys produce wine, silk and wool for the Black Sea and Caspian markets."
 kar_group_caucasian_5:0 "Hill Fortresses"
 kar_group_caucasian_5_desc:0 "Castles guard every pass."
 kar_group_caucasian_6:0 "The Crossroads of Empires"
 kar_group_caucasian_6_desc:0 "Persia, Byzantium and the Caliphate all contest the Caucasus, and local princes use all."
 kar_group_caucasian_7:0 "Blood Feud and Hospitality"
 kar_group_caucasian_7_desc:0 "Kin and honour bind every man, and a guest is sacred."
 kar_group_central_germanic_ideas:0 "German Ideas"
 kar_group_central_germanic_ideas_start:0 "German Traditions"
 kar_group_central_germanic_ideas_bonus:0 "German Ambition"
 kar_group_central_germanic_1:0 "The Free Men"
 kar_group_central_germanic_1_desc:0 "German freemen bear arms and follow their lords as a matter of right."
 kar_group_central_germanic_2:0 "The Thing"
 kar_group_central_germanic_2_desc:0 "Public assemblies meet to hear complaints and judge disputes."
 kar_group_central_germanic_3:0 "Forests and Rivers"
 kar_group_central_germanic_3_desc:0 "The forests of Germany are boundaries and sources of timber."
 kar_group_central_germanic_4:0 "Royal and Imperial Churches"
 kar_group_central_germanic_4_desc:0 "Bishops and abbots hold lands and ride in the king's host."
 kar_group_central_germanic_5:0 "Hunting Lodges and Castles"
 kar_group_central_germanic_5_desc:0 "Fortified halls of the lords are centres of local power."
 kar_group_central_germanic_6:0 "The Horse of the Lowlands"
 kar_group_central_germanic_6_desc:0 "German heavy horse is bred on the plains."
 kar_group_central_germanic_7:0 "Markets and Fairs"
 kar_group_central_germanic_7_desc:0 "Towns on rivers hold fairs, pay tolls and draw merchants."
 kar_group_east_slavic_ideas:0 "East Slavic Ideas"
 kar_group_east_slavic_ideas_start:0 "East Slavic Traditions"
 kar_group_east_slavic_ideas_bonus:0 "East Slavic Ambition"
 kar_group_east_slavic_1:0 "The Great Rivers"
 kar_group_east_slavic_1_desc:0 "The Dnieper, Volga and Don are the roads of the east."
 kar_group_east_slavic_2:0 "The Druzhina"
 kar_group_east_slavic_2_desc:0 "Princes keep a body of sworn warriors who live at their table."
 kar_group_east_slavic_3:0 "Forest and Steppe"
 kar_group_east_slavic_3_desc:0 "Slavic farmers live between the forest and the steppe frontier."
 kar_group_east_slavic_4:0 "The Veche"
 kar_group_east_slavic_4_desc:0 "Town meetings choose princes and set policy."
 kar_group_east_slavic_5:0 "Furs and Honey"
 kar_group_east_slavic_5_desc:0 "Forest produce goes up the rivers to the Baltic and down to the Black Sea."
 kar_group_east_slavic_6:0 "The Wooden Forts"
 kar_group_east_slavic_6_desc:0 "Slavic towns stand behind wooden palisades."
 kar_group_east_slavic_7:0 "Orthodox Conversion"
 kar_group_east_slavic_7_desc:0 "Greek priests teach in Slavonic and bring the Rus into the Byzantine world."
 kar_group_frankish_ideas:0 "Frankish Ideas"
 kar_group_frankish_ideas_start:0 "Frankish Traditions"
 kar_group_frankish_ideas_bonus:0 "Frankish Ambition"
 kar_group_frankish_1:0 "The Merovingian Memory"
 kar_group_frankish_1_desc:0 "Clovis's descendants and Charlemagne's recollections shape the sense of belonging of the Franks."
 kar_group_frankish_2:0 "The Frankish Host"
 kar_group_frankish_2_desc:0 "Free men of each county assemble every spring under their count."
 kar_group_frankish_3:0 "Counts and Missi"
 kar_group_frankish_3_desc:0 "Royal officers and inspectors keep the counties under the king's eye."
 kar_group_frankish_4:0 "Monastic Schools"
 kar_group_frankish_4_desc:0 "Abbeys keep the Latin classics and train clerks."
 kar_group_frankish_5:0 "Heavy Cavalry"
 kar_group_frankish_5_desc:0 "Frankish nobles ride armoured on strong horses."
 kar_group_frankish_6:0 "Castles on the Marches"
 kar_group_frankish_6_desc:0 "Frontier lords build earthwork and stone castles."
 kar_group_frankish_7:0 "The Roman Roads"
 kar_group_frankish_7_desc:0 "Old roads connect the Frankish cities and keep trade alive."
 kar_group_goidelic_ideas:0 "Gaelic Ideas"
 kar_group_goidelic_ideas_start:0 "Gaelic Traditions"
 kar_group_goidelic_ideas_bonus:0 "Gaelic Ambition"
 kar_group_goidelic_1:0 "The Kindred Lands"
 kar_group_goidelic_1_desc:0 "Each tuath belongs to one extended kin, and the king of the tuath is its war leader and judge."
 kar_group_goidelic_2:0 "Brehon Law"
 kar_group_goidelic_2_desc:0 "Itinerant judges memorise the law and settle disputes by compensation."
 kar_group_goidelic_3:0 "Monasteries of Learning"
 kar_group_goidelic_3_desc:0 "Irish monastic schools teach Latin and Greek, and send monks and books abroad."
 kar_group_goidelic_4:0 "Cattle Raids"
 kar_group_goidelic_4_desc:0 "A king's wealth is his herd and his fame is his raids."
 kar_group_goidelic_5:0 "Bog and Forest"
 kar_group_goidelic_5_desc:0 "Irish bogs, rivers and woods slow invaders."
 kar_group_goidelic_6:0 "High Kingship"
 kar_group_goidelic_6_desc:0 "The title of High King of Ireland brings prestige to its holder."
 kar_group_goidelic_7:0 "Fosterage and Clientship"
 kar_group_goidelic_7_desc:0 "Kings bind lesser chiefs by fostering their sons and granting cattle."
 kar_group_iberian_ideas:0 "Iberian Ideas"
 kar_group_iberian_ideas_start:0 "Iberian Traditions"
 kar_group_iberian_ideas_bonus:0 "Iberian Ambition"
 kar_group_iberian_1:0 "The Meseta and the Mountains"
 kar_group_iberian_1_desc:0 "Rugged ground makes war in Iberia a siege and ambush game."
 kar_group_iberian_2:0 "Hill Castles"
 kar_group_iberian_2_desc:0 "Every ridge has a castle, and every pass a tower."
 kar_group_iberian_3:0 "Transhumance"
 kar_group_iberian_3_desc:0 "Flocks move between summer and winter pastures, and the shepherds serve as scouts."
 kar_group_iberian_4:0 "The Reconquista Spirit"
 kar_group_iberian_4_desc:0 "War against the Moor, for land and faith, defines the north."
 kar_group_iberian_5:0 "The Visigothic Code"
 kar_group_iberian_5_desc:0 "The old Gothic law, the Liber Iudiciorum, still guides judges."
 kar_group_iberian_6:0 "Monasteries of the North"
 kar_group_iberian_6_desc:0 "Monks copy books and settle new land."
 kar_group_iberian_7:0 "Light Horse"
 kar_group_iberian_7_desc:0 "Jinetes and skirmishers fight Moors and Christians alike with javelin and shield."
 kar_group_israelite_ideas:0 "Jewish Ideas"
 kar_group_israelite_ideas_start:0 "Jewish Traditions"
 kar_group_israelite_ideas_bonus:0 "Jewish Ambition"
 kar_group_israelite_1:0 "The Law of Moses"
 kar_group_israelite_1_desc:0 "The Torah and the Talmud guide Jewish communities across the world."
 kar_group_israelite_2:0 "Radhanite Merchants"
 kar_group_israelite_2_desc:0 "Jewish traders speak every tongue and link the Frankish West to China."
 kar_group_israelite_3:0 "The Yeshivot"
 kar_group_israelite_3_desc:0 "Rabbinical schools of Babylon and Spain teach law and attract students."
 kar_group_israelite_4:0 "Protected People"
 kar_group_israelite_4_desc:0 "Communities live under royal protection in exchange for tribute."
 kar_group_israelite_5:0 "Financiers of Kings"
 kar_group_israelite_5_desc:0 "Jewish bankers lend to princes and bishops."
 kar_group_israelite_6:0 "Scattered but United"
 kar_group_israelite_6_desc:0 "Letters and travellers keep far-off communities in touch."
 kar_group_israelite_7:0 "The Return to Zion"
 kar_group_israelite_7_desc:0 "The longing for Jerusalem sustains the communities through exile."
 kar_group_latin_ideas:0 "Italian Ideas"
 kar_group_latin_ideas_start:0 "Italian Traditions"
 kar_group_latin_ideas_bonus:0 "Italian Ambition"
 kar_group_latin_1:0 "Roman Ruins and Roman Law"
 kar_group_latin_1_desc:0 "Every city has a forum, a wall and a code of law from the days of the Empire."
 kar_group_latin_2:0 "The Free Cities"
