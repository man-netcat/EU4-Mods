 kar_group_south_slavic_3:0 "Mountains and Karst"
 kar_group_south_slavic_3_desc:0 "The Balkan ranges break up large armies."
 kar_group_south_slavic_4:0 "Slavic Script"
 kar_group_south_slavic_4_desc:0 "A script for the Slavic tongue spreads literacy and independence."
