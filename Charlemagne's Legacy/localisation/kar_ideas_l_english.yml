 kar_group_iranian_6_desc:0 "Magi and mullahs share the villages."
 kar_group_iranian_7:0 "Kurds and Daylamites"
 kar_group_iranian_7_desc:0 "Mountain infantry are hired by every ruler."
 kar_group_turkic_ideas:0 "Turkic Ideas"
 kar_group_turkic_ideas_start:0 "Turkic Traditions"
 kar_group_turkic_ideas_bonus:0 "Turkic Ambition"
