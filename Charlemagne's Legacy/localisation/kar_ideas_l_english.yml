 kar_group_bantu_ideas:0 "Bantu Ideas"
 kar_group_bantu_ideas_start:0 "Bantu Traditions"
 kar_group_bantu_ideas_bonus:0 "Bantu Ambition"
 kar_group_bantu_1:0 "Iron Smiths"
 kar_group_bantu_1_desc:0 "Iron tools and spears have carried the Bantu across half a continent."
 kar_group_bantu_2:0 "Cattle and Millet"
 kar_group_bantu_2_desc:0 "Herds and gardens feed large villages."
 kar_group_bantu_3:0 "Village Chiefs"
 kar_group_bantu_3_desc:0 "Chiefs and councils of elders settle disputes."
 kar_group_bantu_4:0 "The Coast Trade"
 kar_group_bantu_4_desc:0 "Swahili ports send ivory, gold and slaves to Arabia and India."
 kar_group_bantu_5:0 "Dhows and Harbours"
 kar_group_bantu_5_desc:0 "Coastal towns build trading ships that sail with the monsoon."
 kar_group_bantu_6:0 "Spears and Shields"
 kar_group_bantu_6_desc:0 "Bantu warriors fight in tight formation behind great shields."
 kar_group_bantu_7:0 "Spirit Mediums"
 kar_group_bantu_7_desc:0 "Mediums speak for the ancestors and guide the chief's decisions."
 kar_group_burman_ideas:0 "Burman Ideas"
 kar_group_burman_ideas_start:0 "Burman Traditions"
 kar_group_burman_ideas_bonus:0 "Burman Ambition"
