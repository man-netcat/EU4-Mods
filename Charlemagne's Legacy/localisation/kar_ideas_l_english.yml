 kar_group_burman_6:0 "Hill Tribes"
 kar_group_burman_6_desc:0 "Shan, Kachin and Chin chiefs send levies to the king."
 kar_group_burman_7:0 "Monks and Scribes"
 kar_group_burman_7_desc:0 "Sangha libraries preserve palm-leaf books of the Pali canon."
 kar_group_buyeo_ideas:0 "Buyeo Ideas"
 kar_group_buyeo_ideas_start:0 "Buyeo Traditions"
 kar_group_buyeo_ideas_bonus:0 "Buyeo Ambition"
 kar_group_buyeo_1:0 "Mountain Fortresses"
