 kar_group_latin_6:0 "Heavy Horse and Pike"
 kar_group_latin_6_desc:0 "City militias hold the line and noble horsemen charge."
 kar_group_latin_7:0 "Churches and Monasteries"
 kar_group_latin_7_desc:0 "Benedictine houses guard learning and teach the sons of lords."
 kar_group_magyar_ideas:0 "Hungarian Ideas"
 kar_group_magyar_ideas_start:0 "Hungarian Traditions"
 kar_group_magyar_ideas_bonus:0 "Hungarian Ambition"
 kar_group_magyar_1:0 "Seven Tribes"
 kar_group_magyar_1_desc:0 "The clans swear a blood oath of brotherhood, and the Magyar nation springs from that vow."
