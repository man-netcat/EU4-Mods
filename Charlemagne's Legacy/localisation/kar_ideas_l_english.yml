 kar_group_south_slavic_6_desc:0 "Raiders on the Balkan frontier fight with javelin and bow."
 kar_group_south_slavic_7:0 "Orthodox and Latin Faiths"
 kar_group_south_slavic_7_desc:0 "Slavs hear mass in both rites and bargain with both bishops."
 kar_group_syriac_ideas:0 "Syriac Ideas"
