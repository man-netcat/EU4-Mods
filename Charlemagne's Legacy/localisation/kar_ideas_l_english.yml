 kar_group_turkic_6_desc:0 "The Eternal Sky and the clan spirits guard the people."
 kar_group_turkic_7:0 "Mercenaries and Mamluks"
 kar_group_turkic_7_desc:0 "Turkic soldiers serve caliphs and princes for pay."
 kar_group_ainuic_ideas:0 "Ainu Ideas"
 kar_group_ainuic_ideas_start:0 "Ainu Traditions"
 kar_group_ainuic_ideas_bonus:0 "Ainu Ambition"
 kar_group_ainuic_1:0 "Hunters and Fishers"
 kar_group_ainuic_1_desc:0 "The Ainu live by the hunt, the salmon run and the gathering of wild plants."
