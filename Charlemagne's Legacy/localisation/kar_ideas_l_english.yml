 kar_group_syriac_7:0 "Physicians and Scribes"
 kar_group_syriac_7_desc:0 "Syriac Christians serve rulers as doctors and clerks."
 kar_group_vlach_ideas:0 "Vlach Ideas"
 kar_group_vlach_ideas_start:0 "Vlach Traditions"
 kar_group_vlach_ideas_bonus:0 "Vlach Ambition"
