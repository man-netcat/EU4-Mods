 kar_group_magyar_4:0 "Raiding Season"
 kar_group_magyar_4_desc:0 "Annual campaigns bring slaves and silver and unite the tribes."
 kar_group_magyar_5:0 "The Fire and the Drum"
 kar_group_magyar_5_desc:0 "Taltos shamans guide the tribes."
 kar_group_magyar_6:0 "Felt Tents and Wagons"
 kar_group_magyar_6_desc:0 "The camp moves with the army and the army feeds itself."
 kar_group_magyar_7:0 "Tribute from the Slavs"
 kar_group_magyar_7_desc:0 "Slavic villages along the Tisza pay the Magyars in grain and cattle."
 kar_group_north_germanic_ideas:0 "Norse Ideas"
 kar_group_north_germanic_ideas_start:0 "Norse Traditions"
 kar_group_north_germanic_ideas_bonus:0 "Norse Ambition"
 kar_group_north_germanic_1:0 "The Longship"
 kar_group_north_germanic_1_desc:0 "Fast, shallow-draft ships carry Norse crews across seas and up rivers."
 kar_group_north_germanic_2:0 "The Thing"
 kar_group_north_germanic_2_desc:0 "Free men meet, make laws and choose leaders."
 kar_group_north_germanic_3:0 "Raids and Plunder"
 kar_group_north_germanic_3_desc:0 "The Viking raid brings silver, slaves and fame."
 kar_group_north_germanic_4:0 "The Hird"
 kar_group_north_germanic_4_desc:0 "A chief's sworn companions fight at his side."
 kar_group_north_germanic_5:0 "Seafarers and Settlers"
 kar_group_north_germanic_5_desc:0 "Norse sailors have found new lands from Iceland to the Rus rivers."
 kar_group_north_germanic_6:0 "Smiths and Skalds"
 kar_group_north_germanic_6_desc:0 "Iron workers and poets spread the fame of the Norse."
 kar_group_north_germanic_7:0 "The Old Gods"
 kar_group_north_germanic_7_desc:0 "Odin, Thor and Freyr keep the fear of the Norse in the heart of their enemies."
 kar_group_south_slavic_ideas:0 "South Slavic Ideas"
 kar_group_south_slavic_ideas_start:0 "South Slavic Traditions"
 kar_group_south_slavic_ideas_bonus:0 "South Slavic Ambition"
