 kar_group_ainuic_7:0 "Kotan Chiefs"
 kar_group_ainuic_7_desc:0 "Each village chief is both judge and war leader."
 kar_group_akan_ideas:0 "Akan Ideas"
 kar_group_akan_ideas_start:0 "Akan Traditions"
 kar_group_akan_ideas_bonus:0 "Akan Ambition"
