 kar_form_tibet_title:0 "Form Tibet"
 kar_form_tibet:0 "Form Tibet"
 kar_form_tibet_desc:0 "The roof of the world has long been ruled from many monasteries and many fortresses, each of its valleys keeping its own lord. Yet the Dharma and the high plateau are one, and a single throne above them all would raise Tibet again as the great empire of the snows."
