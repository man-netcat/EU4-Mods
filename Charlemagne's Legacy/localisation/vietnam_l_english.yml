l_english:
 kar_form_dai_viet_title:0 "Proclaim Dai Viet"
 kar_form_dai_viet:0 "Proclaim Dai Viet"
 kar_form_dai_viet_desc:0 "The Red River country has shaken off the governors of the north, and its kings have held the delta against every army sent to retake it. Let the ruler of the south take the title of emperor in his own land. A realm that has reached the passes of Hue and beyond will call itself Dai Nam, the Great South."
