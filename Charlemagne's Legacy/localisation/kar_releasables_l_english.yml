l_english:
 kar_releasables.1.t:0 "[KAE.GetName] Wants Its Freedom"
 kar_releasables.1.d:0 "The lords and townsmen of [KAE.GetName] have long chafed under their overlord and now have a ruler of their own who will not kneel. We can let them go or hold them by force."
 kar_releasables.1.a:0 "Let them go."
 kar_releasables.1.b:0 "They will learn their place."
