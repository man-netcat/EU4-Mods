 kar_releasables.100.t:0 "Imperial Immediacy"
 kar_releasables.100.d:0 "Now that the Empire is whole again, the cities and bishoprics along the Rhine, the Danube and the Elbe ask for the charters their forefathers held from Charlemagne: to answer to the emperor alone. Granting them frees them of their present lords; refusing keeps the land in our hands."
 kar_releasables.100.a:0 "Grant them immediacy."
 kar_releasables.100.b:0 "The Empire's land is ours."
