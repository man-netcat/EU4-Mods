 kar_releasables.17.t:0 "The Bishop of Utrecht Is Made a Prince"
 kar_releasables.17.d:0 "The bishops of Utrecht have long held Nedersticht and Oversticht for the crown, and the emperor now names the bishop prince of both: a duchy of the Church, answering to no count or duke, with its own court and its own army. Our officers in the Sticht are asked to withdraw."
 kar_releasables.17.a:0 "Raise the bishop to prince."
 kar_releasables.17.b:0 "The Sticht is ours to keep."
