l_english:
 kar_form_armenia_title:0 "Form Armenia"
 kar_form_armenia:0 "Form Armenia"
 kar_form_armenia_desc:0 "From Ararat to Lake Van, and from the Kura to the upper Euphrates, the Armenian highlands have been one kingdom under Orontids, Artaxiads and Arsacids. Our princes now hold only a part of that old Greater Armenia; let one crown gather the nakharars again and make Armenia whole."
