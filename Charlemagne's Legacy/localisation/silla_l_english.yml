l_english:
 fall_of_silla:0 "The Later Three Kingdoms"
 fall_of_silla_desc:0 "Silla's lords no longer obey the crown in Gyeongju. Gyeon Hwon in the south-west and Gung Ye in the north have raised their own kingdoms in the old names of Baekje and Goguryeo, and the peninsula is falling back into three."
 fall_of_silla.1.t:0 "The Later Three Kingdoms"
 fall_of_silla.1.d:0 "The royal bone-rank has lost its grip on the provinces, and the great houses of the south-west and the north have begun to arm. Before long each will take a crown of his own, and Silla will be one kingdom of three."
 fall_of_silla.1.a:0 "The realm is breaking."
 fall_of_silla.2.t:0 "Hubaekje Proclaimed"
 fall_of_silla.2.d:0 "Gyeon Hwon, once a soldier of the Silla frontier, has gathered the people of the south-west behind him and proclaimed himself king of Later Baekje. The old kingdom's name is on every tongue in the western provinces."
 fall_of_silla.2.a:0 "We will not yield our land."
 fall_of_silla.3.t:0 "Taebong Proclaimed"
 fall_of_silla.3.d:0 "In the north, Gung Ye has taken the title of king over the old lands of Goguryeo, and the lords of Songak, among them the house of Wang, have joined him. The provinces beyond the river no longer answer to us."
 fall_of_silla.3.a:0 "Crush the rebels."
 fall_of_silla.4.t:0 "The Peninsula Settles"
 fall_of_silla.4.d:0 "The age of the Later Three Kingdoms is over. Whether Goryeo has united the peninsula or the last crown of Silla has been surrendered, the realm as it was is gone."
 fall_of_silla.4.a:0 "An age has ended."
