 kar_form_galicia_volhynia_title:0 "Form Galicia-Volhynia"
 kar_form_galicia_volhynia:0 "Form Galicia-Volhynia"
 kar_form_galicia_volhynia_desc:0 "The princes of Halych and Volodymyr share blood, faith and enemies, yet each calls himself the true heir of the Rus' south. One throne over both lands would silence the rival courts for good. Let us unite the principalities and crown a king in Galicia-Volhynia."
