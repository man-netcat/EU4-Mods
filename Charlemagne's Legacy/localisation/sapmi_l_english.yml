 kar_form_sapmi_title:0 "Form Sápmi"
 kar_form_sapmi:0 "Form Sápmi"
 kar_form_sapmi_desc:0 "The Siidas have followed the reindeer across the northern fells since before the songs began, each answering to its own elders and no king. Yet one crown over the whole of the northern lands would shield the Sami from the tribute-takers pressing in from every side. Let us unite the Siidas and raise Sápmi among the kingdoms of the world."
