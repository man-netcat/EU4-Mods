l_english:
 kar_home_area_ct:0 "All provinces in the §Y[Root.Capital.GetAreaName]§! area are owned by §Y[Root.GetName]§!."
 kar_roman_balkans_thrace_title:0 "Secure Thrace"
 kar_roman_balkans_thrace_desc:0 "The approaches to the City must be ours: Adrianople and the long walls cover Constantinople from the north."
 kar_roman_balkans_macedonia_title:0 "Reclaim Macedonia"
 kar_roman_balkans_macedonia_desc:0 "Thessalonica and the Strymon valley were Roman before the Slavs came; the themes must be restored."
 kar_roman_balkans_bulgars_title:0 "Humble the Bulgars"
 kar_roman_balkans_bulgars_desc:0 "The khan at Pliska has taxed our border for two generations; his lands must be brought under the emperor."
 kar_roman_balkans_slavs_title:0 "Slavs under the Eagle"
 kar_roman_balkans_slavs_desc:0 "The Slavic tribes of the Morava and the Vardar settle on Roman land and owe it service."
 kar_roman_balkans_adriatic_title:0 "Command the Adriatic"
 kar_roman_balkans_adriatic_desc:0 "The Dalmatian cities have been Roman ports since Justinian; their fleets must sail under the imperial flag."
 kar_bulgar_slayer:0 "Bulgar-slayer"
 desc_kar_bulgar_slayer:0 "The emperor has humbled the khan, and the army fights with new confidence."
 kar_roman_west_crete_title:0 "Reclaim Crete"
 kar_roman_west_crete_desc:0 "The emirs of Chandax raid every island of the Aegean; the island must be taken back from the Saracens."
 kar_roman_west_calabria_title:0 "Calabria and Apulia"
 kar_roman_west_calabria_desc:0 "Bari and the heel of Italy are Saracen or Lombard; the Roman themes of the west must be restored."
 kar_roman_west_sicily_title:0 "The Island of Sicily"
 kar_roman_west_sicily_desc:0 "Syracuse still flies the eagle, but Palermo and the west are the emirate's; the whole island must come back."
 kar_roman_west_naples_title:0 "Duchy of Naples"
 kar_roman_west_naples_desc:0 "The Neapolitan dukes remember that they are Roman; Naples and Amalfi must be brought back under the throne."
 kar_roman_west_rome_title:0 "Rome and Ravenna"
 kar_roman_west_rome_desc:0 "The old capital and the seat of the exarchs: the empire is whole when both are held by the emperor again."
 kar_cretan_waters_cleared:0 "Cretan Waters Cleared"
 desc_kar_cretan_waters_cleared:0 "The Aegean is safe again for the grain ships and the imperial fleet."
 kar_island_granary:0 "Sicilian Granary"
 desc_kar_island_granary:0 "The grain of Sicily feeds the City and fills the fisc once more."
 kar_roman_east_cilicia_title:0 "The Cilician Gates"
 kar_roman_east_cilicia_desc:0 "Tarsus and the plain below the Taurus are the gateway to Syria and the base of every Saracen raid on Anatolia."
 kar_roman_east_taurus_title:0 "The Passes of the Taurus"
 kar_roman_east_taurus_desc:0 "Melitene and the upper Euphrates are the emperor's frontier fortress; the garrisons of the passes must be ours."
 kar_roman_east_armenia_title:0 "The Armenian Marches"
 kar_roman_east_armenia_desc:0 "The princes of Armenia and the upper Tigris are Christian, and their lands are the emperor's natural frontier."
 kar_roman_east_antioch_title:0 "Antioch Returns"
 kar_roman_east_antioch_desc:0 "The great city of the east was Roman for three hundred years; the Orontes valley must be held again."
 kar_roman_east_jerusalem_title:0 "The Holy Land"
 kar_roman_east_jerusalem_desc:0 "The Holy Sepulchre was taken from the empire by the caliph; to hold Palestine again is the oldest duty of the throne."
 kar_taurus_frontier_secured:0 "Taurus Frontier Secured"
 desc_kar_taurus_frontier_secured:0 "The passes of the Taurus are fortified and watched, and the Saracen raiders turn back."
 kar_roman_court_alliance_title:0 "A Christian Alliance"
 kar_roman_court_alliance_desc:0 "The empire is not friendless: the Christian kings of the west and the Caucasus should be bound to the throne."
 kar_roman_court_treasury_title:0 "The Fisc"
 kar_roman_court_treasury_desc:0 "The nomisma has kept its weight for five hundred years; a full treasury keeps it that way."
 kar_roman_court_basilika_title:0 "The Basilika"
 kar_roman_court_basilika_desc:0 "The laws of Justinian are old and in Latin; the emperor orders them recast in Greek for his judges."
 kar_roman_court_renaissance_title:0 "The Macedonian Revival"
 kar_roman_court_renaissance_desc:0 "Under the new dynasty the university at the Magnaura teaches the old learning again."
 kar_macedonian_renaissance:0 "Macedonian Renaissance"
 desc_kar_macedonian_renaissance:0 "Scholars copy the books of the ancients, and the court is a model of learning."
 kar_abbasid_east_khuzestan_title:0 "Secure Khuzestan"
 kar_abbasid_east_khuzestan_desc:0 "The sugar and cloth of Khuzestan feed Baghdad, and its governor must answer to the caliph alone."
 kar_abbasid_east_jibal_title:0 "Isfahan and Luristan"
 kar_abbasid_east_jibal_desc:0 "The Jibal is the heart of the Iranian plateau; its dynasts hold it for the caliph or for themselves."
 kar_abbasid_east_ajam_title:0 "Iraq-i Ajam and Tabaristan"
 kar_abbasid_east_ajam_desc:0 "The northern Iranian lands behind the Elburz were the caliph's province before the local princes rose."
 kar_abbasid_east_saffarids_title:0 "Break the Saffarids"
 kar_abbasid_east_saffarids_desc:0 "The coppersmith of Sistan has made himself master of the east; the caliph must end his empire."
 kar_abbasid_east_khorasan_title:0 "Khorasan"
 kar_abbasid_east_khorasan_desc:0 "The great frontier province of the caliphate, whose soldiers once placed the Abbasids on the throne."
 kar_abbasid_east_oxus_title:0 "Beyond the Oxus"
 kar_abbasid_east_oxus_desc:0 "Balkh and the cities of Tokharistan are the caliphate's gateway to the steppe and the roads to China."
 kar_iran_restored:0 "Iran Restored"
 desc_kar_iran_restored:0 "The governors of the Iranian plateau send their taxes to Baghdad again."
 kar_khorasan_regained:0 "Khorasan Regained"
 desc_kar_khorasan_regained:0 "The eastern marches of the caliphate are again in the caliph's hand."
 kar_abbasid_arabia_mecca_title:0 "Guardian of Mecca"
 kar_abbasid_arabia_mecca_desc:0 "The sanctuary and the pilgrim road need a firm hand; Mecca and its hinterland must answer to Baghdad."
 kar_abbasid_arabia_medina_title:0 "The Prophet's City"
 kar_abbasid_arabia_medina_desc:0 "The city of the Prophet's tomb is the caliph's to protect; no local emir may hold it against him."
 kar_abbasid_arabia_yemen_title:0 "The Yemeni Highlands"
 kar_abbasid_arabia_yemen_desc:0 "The terraced highlands, the coffee-less cliffs and the ports of the Red Sea feed the caliph's treasury."
 kar_abbasid_arabia_oman_title:0 "Oman and the Gulf"
 kar_abbasid_arabia_oman_desc:0 "The mariners of Oman sail to India and China; the caliph's fleets must meet them at their harbours."
 kar_custodian_of_the_haramayn:0 "Custodian of the Sanctuaries"
 desc_kar_custodian_of_the_haramayn:0 "The caliph protects the pilgrim roads and the holy cities, and the faithful honour him."
 kar_abbasid_west_delta_title:0 "The Nile Delta"
 kar_abbasid_west_delta_desc:0 "Alexandria and the Delta are Egypt's gate to the sea; their governor must be the caliph's man."
 kar_abbasid_west_upper_egypt_title:0 "Upper Egypt"
 kar_abbasid_west_upper_egypt_desc:0 "The land of Thebes and the Fayyum is the granary of the Muslim world."
 kar_abbasid_west_barqa_title:0 "Barqa and the Oases"
 kar_abbasid_west_barqa_desc:0 "The desert road to the west runs through Cyrenaica and the oases; whoever holds them holds the road to Ifriqiya."
 kar_abbasid_west_ifriqiya_title:0 "Ifriqiya"
 kar_abbasid_west_ifriqiya_desc:0 "The Aghlabid emirs of Qayrawan rule in the caliph's name only; the province must be held by the caliph himself."
 kar_abbasid_west_maghreb_title:0 "The Central Maghreb"
 kar_abbasid_west_maghreb_desc:0 "Tahert and the Zab are the caliphate's western edge, held for the faith against the Berber chiefs."
 kar_nile_valley_regained:0 "Nile Valley Regained"
 desc_kar_nile_valley_regained:0 "Egypt's grain and gold fill the caliph's treasury again."
 kar_abbasid_court_bonds_title:0 "Bonds of Loyalty"
 kar_abbasid_court_bonds_desc:0 "The caliph is more than a name only if the great emirs are bound to him by oath and alliance."
 kar_abbasid_court_treasury_title:0 "The Caliph's Treasury"
 kar_abbasid_court_treasury_desc:0 "The treasury at Baghdad pays the army and the court; it must be full for the caliph to be obeyed."
 kar_abbasid_court_wisdom_title:0 "The House of Wisdom"
 kar_abbasid_court_wisdom_desc:0 "The translators of the Bayt al-Hikma work for the caliph's glory and for the knowledge of mankind."
 kar_house_of_wisdom:0 "House of Wisdom"
 desc_kar_house_of_wisdom:0 "Scholars translate the books of the Greeks, Indians and Persians in Baghdad."
 kar_cordoba_march_aragon_title:0 "The Upper March"
 kar_cordoba_march_aragon_desc:0 "Saragossa and the Ebro valley are the emirate's northern frontier against the Franks and the mountain Christians."
 kar_cordoba_march_pamplona_title:0 "The Basque Country"
 kar_cordoba_march_pamplona_desc:0 "The Banu Qasi and the lords of Pamplona play between Cordoba and the Franks; the passes must be held."
 kar_cordoba_march_catalonia_title:0 "The Marca Hispanica"
 kar_cordoba_march_catalonia_desc:0 "Barcelona and Girona were taken by the Franks in Charlemagne's day; the emir wants them back."
 kar_cordoba_march_leon_title:0 "Break the Mountain Kingdom"
 kar_cordoba_march_leon_desc:0 "Oviedo and Leon are the seat of the Christian kings of the north; their power must end."
 kar_cordoba_march_compostela_title:0 "Galicia"
 kar_cordoba_march_compostela_desc:0 "The shrine of Santiago and the Atlantic coast end the emirate's work in the north."
 kar_upper_march_held:0 "Upper March Held"
 desc_kar_upper_march_held:0 "The fortress towns of the northern frontier are garrisoned and supplied."
 kar_christian_north_subdued:0 "Christian North Subdued"
 desc_kar_christian_north_subdued:0 "The kings of the mountains pay tribute and fear Cordoba's cavalry."
 kar_cordoba_sea_baleares_title:0 "The Balearic Isles"
 kar_cordoba_sea_baleares_desc:0 "The islands command the sea road between Spain and Italy; a fleet there is a fleet everywhere."
 kar_cordoba_sea_ceuta_title:0 "Across the Strait"
 kar_cordoba_sea_ceuta_desc:0 "Tangier, Ceuta and the Rif shield the emirate from the Berber lands and open the Atlantic coast of Africa."
 kar_cordoba_sea_morocco_title:0 "Western Morocco"
 kar_cordoba_sea_morocco_desc:0 "The Atlantic plains of Morocco are the emirate's granary and the end of the gold caravan road."
 kar_strait_commanded:0 "Strait Commanded"
 desc_kar_strait_commanded:0 "Cordoba's ships hold both shores of the strait, and the Atlantic trade passes through her ports."
 kar_cordoba_court_allies_title:0 "Friends in the North"
 kar_cordoba_court_allies_desc:0 "Cordoba is not alone; its emirs seek friendship with the Franks' enemies and with Byzantium."
 kar_cordoba_court_treasury_title:0 "The Emir's Treasury"
 kar_cordoba_court_treasury_desc:0 "The silver of the Andalusi cities and the gold of Africa fill the emir's coffers."
 kar_cordoba_court_splendour_title:0 "The Splendour of Cordoba"
 kar_cordoba_court_splendour_desc:0 "The mosque of Cordoba is enlarged, the court is full of poets and doctors, and the emirate has no equal in the west."
 kar_cordoban_splendour:0 "Cordoban Splendour"
 desc_kar_cordoban_splendour:0 "Madinat al-Zahra and the great mosque draw scholars, merchants and ambassadors."
 kar_west_francia_realm_burgundy_title:0 "The Burgundian March"
 kar_west_francia_realm_burgundy_desc:0 "The old kingdom of the Burgundians is the Rhone's gateway; Charles the Bald must hold it for his own."
 kar_west_francia_realm_brittany_title:0 "The Breton March"
 kar_west_francia_realm_brittany_desc:0 "The dukes of Brittany pay no tribute and shelter the king's enemies; the march must be forced to obey."
 kar_west_francia_realm_aquitaine_title:0 "The Crown of Aquitaine"
 kar_west_francia_realm_aquitaine_desc:0 "Charles's nephew wears the Aquitanian crown; Poitiers, Bordeaux and the Garonne must obey Paris."
 kar_west_francia_realm_toulouse_title:0 "Toulouse and the South"
 kar_west_francia_realm_toulouse_desc:0 "The counts of Toulouse and the Auvergne hold the south under the king's name; the south must be brought in."
 kar_west_francia_realm_pyrenees_title:0 "The Pyrenean March"
 kar_west_francia_realm_pyrenees_desc:0 "The passes of the Pyrenees and the county of Barcelona are the kingdom's southern edge."
 kar_marches_secured:0 "Marches Secured"
 desc_kar_marches_secured:0 "Counts on the marches answer the king's summons and hold the roads and bridges."
 kar_kingdom_of_aquitaine_joined:0 "Aquitaine Joined"
 desc_kar_kingdom_of_aquitaine_joined:0 "The south has sworn to the king in Paris, and its wine and salt fill his treasury."
 kar_west_francia_lotharingia_lorraine_title:0 "The Lorraine Marches"
 kar_west_francia_lotharingia_lorraine_desc:0 "Metz and Toul are the heart of the Carolingian homeland; the kingdom is not whole without them."
 kar_west_francia_lotharingia_lowlands_title:0 "The Walloon Lands"
 kar_west_francia_lotharingia_lowlands_desc:0 "The abbeys and the fairs of the Meuse valley belong to the old centre of Francia."
 kar_west_francia_lotharingia_frisia_title:0 "Holland and Frisia"
 kar_west_francia_lotharingia_frisia_desc:0 "The sea-coast of the Rhine mouths, the Frisian cities and the Viking-ravaged Dorestad need a master who can defend them."
 kar_west_francia_lotharingia_rhineland_title:0 "The Lower Rhine"
 kar_west_francia_lotharingia_rhineland_desc:0 "Cologne and the great monasteries of the Rhine make the Rhineland the realm's religious heart."
 kar_west_francia_lotharingia_aachen_title:0 "The Throne at Aachen"
 kar_west_francia_lotharingia_aachen_desc:0 "The palace chapel of Aachen holds the throne of Charlemagne; whoever sits on it speaks for the Franks."
 kar_aachen_regained:0 "Aachen Regained"
 desc_kar_aachen_regained:0 "The throne of Charlemagne and the chapel of Aachen are under the king again."
 kar_west_francia_court_marriage_title:0 "Marriage Alliances"
 kar_west_francia_court_marriage_desc:0 "The king's daughters are given to princes whose swords he will need against the Northmen."
 kar_west_francia_court_treasury_title:0 "The Danegeld"
 kar_west_francia_court_treasury_desc:0 "The king pays tribute to the Northmen, and the fisc must bear it without breaking the realm."
 kar_west_francia_court_pitres_title:0 "The Edict of Pitres"
 kar_west_francia_court_pitres_desc:0 "The assembly at Pitres orders every bridge on the great rivers fortified and every count to answer for them."
 kar_edict_of_pitres:0 "Edict of Pitres"
 desc_kar_edict_of_pitres:0 "Fortified bridges and a king's ban against private armies defend the Seine and Loire."
 kar_east_francia_marches_thuringia_title:0 "The Thuringian March"
 kar_east_francia_marches_thuringia_desc:0 "Erfurt and the Saale are the border between the Franks and the Sorbs; the march must be wholly the king's."
 kar_east_francia_marches_sorbs_title:0 "The Sorbian Lands"
 kar_east_francia_marches_sorbs_desc:0 "The Sorbs between the Elbe and the Saale are Slavs who pay tribute only when the king's army is near."
 kar_east_francia_marches_bohemia_title:0 "The Bohemian Dukes"
 kar_east_francia_marches_bohemia_desc:0 "The Czech dukes in the basin behind the Erzgebirge have paid Frankish tribute since Charlemagne; they must kneel again."
 kar_east_francia_marches_moravia_title:0 "Great Moravia"
 kar_east_francia_marches_moravia_desc:0 "Rastislav's kingdom on the March has shaken off Frankish overlordship, and its missionaries are Byzantine."
 kar_eastern_marches_held:0 "Eastern Marches Held"
 desc_kar_eastern_marches_held:0 "Margraves and counts on the Elbe and the Saale keep the Slavs from the rivers."
 kar_bohemian_tribute:0 "Bohemian Tribute"
 desc_kar_bohemian_tribute:0 "The dukes of Bohemia pay tribute and send men for the king's host."
 kar_east_francia_north_holstein_title:0 "The Danish March"
 kar_east_francia_north_holstein_desc:0 "The Eider is the frontier with the Danes; Hamburg's archbishop must have a safe diocese."
 kar_east_francia_north_mecklenburg_title:0 "The Abodrite Coast"
 kar_east_francia_north_mecklenburg_desc:0 "The Abodrite princes between the Elbe and the Warnow pay tribute and shelter pirates; they must be dealt with."
 kar_east_francia_north_pomerania_title:0 "The Baltic Shore"
 kar_east_francia_north_pomerania_desc:0 "The Wends of Pomerania trade in amber and furs; the king's march should reach the sea."
 kar_east_francia_north_havel_title:0 "The Havel Slavs"
 kar_east_francia_north_havel_desc:0 "The Lutici and the Hevelli behind the Elbe raid the Saxon border and keep their old gods."
 kar_baltic_marches_secured:0 "Baltic Marches Secured"
 desc_kar_baltic_marches_secured:0 "The coastal marches keep the Danes and the Abodrites at arm's length."
 kar_east_francia_rhine_lower_lotharingia_title:0 "Lower Lotharingia"
 kar_east_francia_rhine_lower_lotharingia_desc:0 "The Rhine mouths and the Brabant plain were Lothar's, and Louis the German's sons claim them."
 kar_east_francia_rhine_cologne_title:0 "Cologne and the Rhine"
 kar_east_francia_rhine_cologne_desc:0 "The archbishopric of Cologne and the Rhenish monasteries tie the east to the old Carolingian heartland."
 kar_east_francia_rhine_coast_title:0 "The Frisian Coast"
 kar_east_francia_rhine_coast_desc:0 "Holland and Frisia are rich and exposed to the Viking longships; a strong lord could hold them."
 kar_east_francia_rhine_middle_kingdom_title:0 "The Middle Kingdom"
 kar_east_francia_rhine_middle_kingdom_desc:0 "Lothar's old realm between the Rhine and the Meuse is the prize of the Carolingian family."
 kar_lotharingia_reunited:0 "Lotharingia Reunited"
 desc_kar_lotharingia_reunited:0 "The middle kingdom is joined to the east, and Aachen's court is the king's."
 kar_east_francia_court_oaths_title:0 "Oaths of the Great Men"
 kar_east_francia_court_oaths_desc:0 "The dukes of Bavaria and Saxony and the margraves swear to the king, and the crown can rely on their support."
 kar_east_francia_court_treasury_title:0 "The Royal Fisc"
 kar_east_francia_court_treasury_desc:0 "The royal estates at Regensburg, Frankfurt and Ingelheim keep the king's court and pay his guards."
 kar_east_francia_court_diets_title:0 "The Diets of the East"
 kar_east_francia_court_diets_desc:0 "The king meets his dukes in a diet each year, and the east holds together because of it."
 kar_diets_of_the_east:0 "Diets of the East"
 desc_kar_diets_of_the_east:0 "The king holds his diets at Regensburg and Frankfurt, and the great men of the east attend him."
 kar_italy_south_rome_title:0 "Defender of Rome"
 kar_italy_south_rome_desc:0 "Pope and Roman senate look to the emperor to defend Rome from the Saracens and the Roman clans."
 kar_italy_south_naples_title:0 "Naples and Salerno"
 kar_italy_south_naples_desc:0 "The Lombard princes of Salerno and the dukes of Naples owe the emperor service, and play off Greeks and Saracens against him."
 kar_italy_south_bari_title:0 "The Emirate of Bari"
 kar_italy_south_bari_desc:0 "The Saracens of Bari raid the Adriatic from a fortress in the heel; Louis the emperor has sworn to destroy it."
 kar_italy_south_calabria_title:0 "The Toe of Italy"
 kar_italy_south_calabria_desc:0 "Calabria is Greek in speech and Byzantine in tradition, and the emperor wants the lands of the toe to be held by his own."
 kar_italy_south_sicily_title:0 "The Island Beyond"
 kar_italy_south_sicily_desc:0 "Sicily is held by Greeks and Saracens, but its Latin Christians look to the emperor."
 kar_roman_crown_defended:0 "Roman Crown Defended"
 desc_kar_roman_crown_defended:0 "The emperor has made Rome safe from Saracen raids and Roman factions alike."
 kar_saracens_expelled:0 "Saracens Expelled"
 desc_kar_saracens_expelled:0 "The emirates of the south are broken and the coast is safe again."
 kar_italy_north_lagoon_title:0 "The Venetian Lagoon"
 kar_italy_north_lagoon_desc:0 "The doge's lagoon is Greek in name and Italian in trade; the emperor wants its harbours open."
 kar_italy_north_islands_title:0 "The Tyrrhenian Isles"
 kar_italy_north_islands_desc:0 "Corsica and Sardinia are the key to the western sea; whoever holds them can protect the coast."
 kar_italy_north_liguria_title:0 "The Ligurian Coast"
 kar_italy_north_liguria_desc:0 "The Ligurian ports are the empire's door to the west and to the Provencal Franks."
 kar_italy_north_savoy_title:0 "The Western Passes"
 kar_italy_north_savoy_desc:0 "The passes of Savoy and the Dauphine join Italy and Francia; the empire's frontier runs along them."
 kar_italy_north_carinthia_title:0 "The Eastern Marches"
 kar_italy_north_carinthia_desc:0 "Carinthia, Istria and the Tyrol guard the north-east door of Italy against the Slavs and the Hungarians."
 kar_alpine_passes_held:0 "Alpine Passes Held"
 desc_kar_alpine_passes_held:0 "The passes from Savoy to Carinthia are in the emperor's hands."
 kar_italy_court_alliances_title:0 "Friends of the Emperor"
 kar_italy_court_alliances_desc:0 "The emperor needs the dukes of Spoleto and Friuli, and the princes of the south, at his side."
 kar_italy_court_treasury_title:0 "The Pavia Treasury"
 kar_italy_court_treasury_desc:0 "The Iron Crown's palace at Pavia and its royal estates fill the treasury."
 kar_italy_court_coronation_title:0 "The Imperial Coronation"
 kar_italy_court_coronation_desc:0 "The pope crowns the emperor in Rome, and Italy again leads the Latin world."
 kar_imperial_coronation:0 "Imperial Coronation"
 desc_kar_imperial_coronation:0 "The pope anointed the emperor in Rome, and the whole of Italy answers to him."
 kar_wessex_realm_wessex_title:0 "Unite Wessex"
 kar_wessex_realm_wessex_desc:0 "Cornwall and the western shires have been Wessex's subjects for generations; the kingdom must be whole."
 kar_wessex_realm_east_anglia_title:0 "East Anglia"
 kar_wessex_realm_east_anglia_desc:0 "The fens and the Norfolk coast face the Danish ships; the king needs them as a shield."
 kar_wessex_realm_mercia_title:0 "The Mercian Heartland"
 kar_wessex_realm_mercia_desc:0 "Mercia was the overlord of the English in Offa's day; its shires are the heart of the island."
 kar_wessex_realm_northumbria_title:0 "Northumbria"
 kar_wessex_realm_northumbria_desc:0 "The great kingdom of the north has been broken by the Danes; its churches and its fertile river-valleys wait for a king."
 kar_wessex_realm_wales_title:0 "The Welsh Princes"
 kar_wessex_realm_wales_desc:0 "The princes of Gwynedd, Powys and Deheubarth pay tribute only when the English host is at their gates."
 kar_english_unity:0 "English Unity"
 desc_kar_english_unity:0 "The English kingdoms are bound under one crown, and the shires obey one law."
 kar_danelaw_broken:0 "Danelaw Broken"
 desc_kar_danelaw_broken:0 "The Great Army is beaten, and the Danes settle under the king's peace."
 kar_wessex_burhs_allies_title:0 "Friends against the Danes"
 kar_wessex_burhs_allies_desc:0 "Wessex needs the princes of Wales and the lords of Mercia beside her when the Great Army comes."
 kar_wessex_burhs_treasury_title:0 "Silver for the Fyrd"
 kar_wessex_burhs_treasury_desc:0 "The king pays his thegns and his reeves in silver, and he must have enough of it to fight a long war."
 kar_wessex_burhs_burhs_title:0 "The Burghal Hidage"
 kar_wessex_burhs_burhs_desc:0 "A ring of burhs across the kingdom, each manned by the men of its hidage, makes the realm safe from raiders."
 kar_burghal_system:0 "Burghal System"
 desc_kar_burghal_system:0 "Fortified burhs a day's march apart cover the whole of the kingdom."
 kar_tang_southwest_yungui_title:0 "Yun-Gui Plateau"
 kar_tang_southwest_yungui_desc:0 "The marches of the south-west are Tang land in name and the tribes' land in fact; the governor must be obeyed."
 kar_tang_southwest_chuannan_title:0 "The Southern Sichuan Road"
 kar_tang_southwest_chuannan_desc:0 "The road from Chengdu to the south passes Nanzhao's frontier and must be held by Tang garrisons."
 kar_tang_southwest_nanzhao_title:0 "Humble Nanzhao"
 kar_tang_southwest_nanzhao_desc:0 "The king of Nanzhao has taken the title of emperor and raided Annam and Sichuan; he must be punished."
 kar_tang_southwest_chuanbei_title:0 "Northern Sichuan"
 kar_tang_southwest_chuanbei_desc:0 "The upper Min and the northern Sichuan passes end the troubles of the south-west."
 kar_southwest_pacified:0 "Southwest Pacified"
 desc_kar_southwest_pacified:0 "The roads of Yunnan and Sichuan are open, and the tribes pay tribute again."
 kar_tang_west_gansu_title:0 "Reclaim Longyou"
 kar_tang_west_gansu_desc:0 "The western Gansu counties fell to the Tibetans and the Uighurs; their return secures the Wei valley."
 kar_tang_west_hexi_title:0 "The Hexi Corridor"
 kar_tang_west_hexi_desc:0 "The long strip of oases from Liangzhou to Dunhuang is the Silk Road's door and the empire's western lung."
 kar_tang_west_turfan_title:0 "Turfan and Hami"
 kar_tang_west_turfan_desc:0 "The oases of the Tian Shan are the gateway to the Western Regions and the old protectorate of Beiting."
 kar_tang_west_tarim_title:0 "The Four Garrisons"
 kar_tang_west_tarim_desc:0 "Kucha, Khotan, Kashgar and Karashahr were the Four Garrisons of Anxi; the protectorate must stand again."
 kar_hexi_corridor_open:0 "Hexi Corridor Open"
 desc_kar_hexi_corridor_open:0 "Caravans pass freely between the Wei valley and the oases of the Tarim basin."
 kar_tang_north_ordos_title:0 "The Ordos Loop"
 kar_tang_north_ordos_desc:0 "The bend of the Yellow River has been the empire's northern wall since the Qin; it must be fortified and garrisoned."
 kar_tang_north_steppe_title:0 "The Steppe Frontier"
 kar_tang_north_steppe_desc:0 "The tribes of the Yin Mountains pay tribute when the Tang army is near and raid when it is far."
 kar_tang_north_liaodong_title:0 "Liaodong"
 kar_tang_north_liaodong_desc:0 "The Liao plain and its Khitan neighbours are the empire's north-east frontier and its gate to Manchuria."
 kar_tang_north_goguryeo_title:0 "The Lost Provinces"
 kar_tang_north_goguryeo_desc:0 "Pyongan was Goguryeo's heartland and was Tang for a generation; Tang again would be a prize."
 kar_northern_frontier_secured:0 "Northern Frontier Secured"
 desc_kar_northern_frontier_secured:0 "The garrisons of the Ordos and the Great Wall are strengthened, and the steppe peoples pay tribute."
 kar_tang_court_alliances_title:0 "Friends of the Throne"
 kar_tang_court_alliances_desc:0 "Tang tributaries and the Uighur khagan can be bound to the throne by marriage and treaty."
 kar_tang_court_treasury_title:0 "The Imperial Treasury"
 kar_tang_court_treasury_desc:0 "The Salt Commission and the Grand Canal tolls keep the Tang treasury full."
 kar_tang_court_golden_age_title:0 "The Golden Age of Tang"
 kar_tang_court_golden_age_desc:0 "The examination system, the bureaucracy and the great poets mark Tang as the model of the world."
 kar_tang_golden_age:0 "Tang Golden Age"
 desc_kar_tang_golden_age:0 "The poets, the painters and the monasteries of Chang'an are the glory of the world."
 kar_yamato_frontier_kyushu_title:0 "The Dazaifu"
 kar_yamato_frontier_kyushu_desc:0 "Kyushu is the gate to Korea and China; the governor-general at Dazaifu must answer for it."
 kar_yamato_frontier_tohoku_title:0 "The Emishi Frontier"
 kar_yamato_frontier_tohoku_desc:0 "The Emishi of the north have beaten imperial armies before; the shogun and his frontier forts must finally win."
 kar_yamato_frontier_ezo_title:0 "The Island of Ezo"
 kar_yamato_frontier_ezo_desc:0 "Beyond the Tsugaru strait lie the Ainu hunters and fishers, and the court hopes for their furs."
 kar_emishi_pacified:0 "Emishi Pacified"
 desc_kar_emishi_pacified:0 "The north is brought under the court's law, and its horse-breeders serve the emperor."
 kar_danes_rise_lands_title:0 "The Danish Lands"
 kar_danes_rise_lands_desc:0 "Jutland, the islands and Skane are one people in speech and law; one king should rule them from Jelling."
 kar_danes_rise_holstein_title:0 "The Eider Frontier"
 kar_danes_rise_holstein_desc:0 "Hedeby on the Schlei is the greatest market of the north, and the Eider is the border of the Danes."
 kar_danes_rise_viken_title:0 "The Viken"
 kar_danes_rise_viken_desc:0 "The shores of the Oslofjord have been Danish for as long as men remember, and the Norwegian jarls hold them in the king's name."
 kar_danes_rise_halland_title:0 "The Kattegat Coast"
 kar_danes_rise_halland_desc:0 "Halland and the Gota river mouth control the straits; whoever holds them taxes every ship that passes."
 kar_danes_rise_wends_title:0 "The Wendish Coast"
 kar_danes_rise_wends_desc:0 "The Abodrite harbours of Mecklenburg send amber, furs and slaves to Hedeby, and the Danish king claims their dues."
 kar_one_danish_crown:0 "One Danish Crown"
 desc_kar_one_danish_crown:0 "The Danes of the islands, the peninsula and Skane obey one king, and the thing meets at his call."
 kar_wendish_coast_held:0 "Wendish Coast Held"
 desc_kar_wendish_coast_held:0 "Harbours on the southern Baltic shore bring the king the dues of the Wendish trade."
 kar_danes_danelaw_east_anglia_title:0 "The Fenland Shore"
 kar_danes_danelaw_east_anglia_desc:0 "The Great Army has wintered in East Anglia; the farmland beyond the fens is a place for Danes to settle."
 kar_danes_danelaw_jorvik_title:0 "Jorvik"
 kar_danes_danelaw_jorvik_desc:0 "York on the Ouse is the greatest town of the north of England, and its Danish king commands the roads to Scotland."
 kar_danes_danelaw_five_boroughs_title:0 "The Five Boroughs"
 kar_danes_danelaw_five_boroughs_desc:0 "Lincoln, Nottingham, Derby, Stamford and Leicester make a Danish league in the midlands."
 kar_danelaw_realised:0 "Danelaw Realised"
 desc_kar_danelaw_realised:0 "Danish settlers farm the shires of the east, and English silver pays for the longships."
 kar_svear_rise_svealand_title:0 "The Lake Malar Lands"
 kar_svear_rise_svealand_desc:0 "The lands around the Malar and Uppsala are the Svear's core; the king's hall and the great temple stand there."
 kar_svear_rise_gotaland_title:0 "The Land of the Geats"
 kar_svear_rise_gotaland_desc:0 "The Geats of Gotaland are the rivals of the Svear, and the great lakes between them are the heart of Sweden."
 kar_svear_rise_norrland_title:0 "The Northern Coast"
 kar_svear_rise_norrland_desc:0 "The coast of the Gulf of Bothnia is thinly settled, with fishermen, fur traders and the first iron-smelters."
 kar_svear_rise_lapps_title:0 "The Lapland Tribute"
 kar_svear_rise_lapps_desc:0 "The Lapps pay tribute in furs and reindeer, and the king's tax-gatherers ride the winter snow."
 kar_kingdom_of_the_svear:0 "Kingdom of the Svear"
 desc_kar_kingdom_of_the_svear:0 "The uppsala thing and the Geatish lawspeakers acknowledge one king."
 kar_north_road_open:0 "North Road Open"
 desc_kar_north_road_open:0 "The coastal roads and the rivers of Norrland carry the fur and iron of the north."
 kar_svear_eastern_way_finland_title:0 "Across the Gulf"
 kar_svear_eastern_way_finland_desc:0 "The Finnish tribes of the south-west coast pay tribute to the Svear and know them as traders and raiders."
 kar_svear_eastern_way_ingria_title:0 "The Gulf of Finland"
 kar_svear_eastern_way_ingria_desc:0 "The Neva river mouth leads to Lake Ladoga and the road to Novgorod and the Volga; the Swedes want it for their own."
 kar_svear_eastern_way_livonia_title:0 "The Livonian Shore"
 kar_svear_eastern_way_livonia_desc:0 "The Livs and Estonians pay tribute in amber and furs, and their ports are the Baltic's richest."
 kar_eastern_way_trade:0 "Eastern Way Trade"
 desc_kar_eastern_way_trade:0 "Swedish ships and sleds carry furs, wax and slaves along the rivers to Novgorod and beyond."
 kar_norway_rise_vestfold_title:0 "The Viken Kings"
 kar_norway_rise_vestfold_desc:0 "Vestfold and the Oslofjord are the old seat of the Ynglings and the richest farmland in the north."
 kar_norway_rise_vestlandet_title:0 "The Western Fjords"
 kar_norway_rise_vestlandet_desc:0 "The deep fjords of the west coast breed independent jarls, but also the best sailors in the north."
 kar_norway_rise_halogaland_title:0 "Trondelag and Halogaland"
 kar_norway_rise_halogaland_desc:0 "The northern coast supplies fish, furs and walrus ivory, and its great men are rich enough to defy a king."
 kar_norway_rise_north_isles_title:0 "The Isles of the North"
 kar_norway_rise_north_isles_desc:0 "Shetland, Orkney, the Faroes and Iceland are settled by Norwegians and look to the king for law."
 kar_norway_rise_sudreyjar_title:0 "The Kingdom of the Isles"
 kar_norway_rise_sudreyjar_desc:0 "The Hebrides and Man are the Norwegian jarls' kingdom in the west, a base for raids on Ireland and Scotland."
 kar_fairhair_realm:0 "Fairhair's Realm"
 desc_kar_fairhair_realm:0 "Harald's jarls have bent the knee, and the coast from the Oslofjord to the North Cape is one kingdom."
 kar_northern_fleets:0 "Northern Fleets"
 desc_kar_northern_fleets:0 "The coastal levy of the fjords is organised into ship-districts that call out their ships when the king calls."
 kar_polans_rise_polanie_title:0 "The Land of the Polans"
 kar_polans_rise_polanie_desc:0 "The Polans of Gniezno and Poznan are the core of the nation; the fields of the Warta must be under one duke."
 kar_polans_rise_kuyavia_title:0 "Kuyavia and Leczyca"
 kar_polans_rise_kuyavia_desc:0 "The Goplo lake and the salt of Kuyavia are the Polans' tributaries, and the dukes of Leczyca have long been their rivals."
 kar_polans_rise_mazovia_title:0 "The Mazovian Plain"
 kar_polans_rise_mazovia_desc:0 "The dukes of Plock hold the middle Vistula, a country of forests, marshes and amber roads."
 kar_polans_rise_malopolska_title:0 "Lesser Poland"
 kar_polans_rise_malopolska_desc:0 "Cracow and the Vistulans are rich in salt and lead, and are the strongest of the western Slavic tribes."
 kar_polans_rise_silesia_title:0 "Silesia"
 kar_polans_rise_silesia_desc:0 "The Oder valley is the kingdom's western gate, and the Slavic tribes there trade with Bohemia and Moravia."
 kar_piast_state:0 "Piast State"
 desc_kar_piast_state:0 "A ring of stockaded towns holds the Polans together under one duke, and the dues come to Gniezno."
 kar_polish_heartland:0 "Polish Heartland"
 desc_kar_polish_heartland:0 "The fields between the Vistula and the Oder are tilled by one people under one law."
 kar_czechs_rise_moravia_title:0 "Moravia"
 kar_czechs_rise_moravia_desc:0 "The Morava valley is the Moravians' country, and the road to the Danube and the Adriatic runs through it."
 kar_czechs_rise_lusatia_title:0 "The Lusatian Lands"
 kar_czechs_rise_lusatia_desc:0 "The Sorbian tribes of the upper Spree and the Neisse live on land between Bohemia and Saxony."
 kar_czechs_rise_silesia_title:0 "Silesia"
 kar_czechs_rise_silesia_desc:0 "The Oder valley and the passes of the Sudeten link Bohemia to the Baltic, and the Slavic tribes there trade with Prague."
 kar_czechs_rise_sorbs_title:0 "The Sorbian March"
 kar_czechs_rise_sorbs_desc:0 "The tribes of the Saale and the Mulde are Slavs on the border of the Franks; to hold them is to hold the Elbe."
 kar_czechs_rise_slovakia_title:0 "The Carpathian Gate"
 kar_czechs_rise_slovakia_desc:0 "The Slovak valleys behind the Tatra connect Bohemia to the Danube and to Great Moravia's old land."
 kar_bohemian_crown:0 "Bohemian Crown"
 desc_kar_bohemian_crown:0 "The Premyslid dukes at Prague command the Czech tribes, and the roads of the Elbe pay tolls."
 kar_amber_road_tolls:0 "Amber Road Tolls"
 desc_kar_amber_road_tolls:0 "The amber and salt roads cross Bohemia, and the dukes tax every wagon."
 kar_magyars_rise_black_sea_title:0 "The Black Sea Steppe"
 kar_magyars_rise_black_sea_desc:0 "The seven tribes graze their herds from the Don to the Danube, and the Khazar tribute weighs on them."
 kar_magyars_rise_moldavia_title:0 "Beyond the Passes"
 kar_magyars_rise_moldavia_desc:0 "The forest passes of the Carpathians lead to the plains of the Danube basin; the Magyars must cross them before the Pechenegs do."
 kar_magyars_rise_forest_land_title:0 "The Land Beyond the Forest"
 kar_magyars_rise_forest_land_desc:0 "The high basin of the Mures and the Olt is a land of salt and gold; whoever holds it holds the eastern door of the Carpathians."
 kar_magyars_rise_alfold_title:0 "The Great Plain"
 kar_magyars_rise_alfold_desc:0 "The plain between the Tisza and the Danube is grass country as far as the eye can see, and suits the horse-archers."
 kar_magyars_rise_pannonia_title:0 "Pannonia"
 kar_magyars_rise_pannonia_desc:0 "The Roman province of Pannonia, the Avar khagan's old seat and the road to Bavaria and the Alps, is the kingdom's last conquest."
 kar_arpad_conquest:0 "The Conquest of the Homeland"
 desc_kar_arpad_conquest:0 "The seven tribes have settled the basin of the middle Danube and do not look back."
 kar_carpathian_basin_held:0 "Carpathian Basin Held"
 desc_kar_carpathian_basin_held:0 "The plains and hills of the Danube and Tisza feed the herds of the new kingdom."
 kar_balts_rise_tribes_title:0 "The Baltic Core"
 kar_balts_rise_tribes_desc:0 "The Lithuanians of the interior and the Samogitians of the lowland share a language, a faith and a need for allies."
 kar_balts_rise_prussia_title:0 "The Prussian Coast"
 kar_balts_rise_prussia_desc:0 "The Prussian clans on the Samland coast sell amber, honey and slaves to every sea-faring people."
 kar_balts_rise_vistula_mouth_title:0 "The Vistula Delta"
 kar_balts_rise_vistula_mouth_desc:0 "West Prussia and the mouths of the Vistula control the amber road to the Baltic."
 kar_balts_rise_curonia_title:0 "The Curonian Coast"
 kar_balts_rise_curonia_desc:0 "The Curonians are the best seamen of the eastern Baltic, and their harbours are pirate nests."
 kar_balts_rise_livonia_title:0 "The Livonian Lands"
 kar_balts_rise_livonia_desc:0 "The Livs and Letts of the Dvina and the Gauja lie open to anyone who can unite the tribes."
 kar_baltic_confederation:0 "Baltic Confederation"
 desc_kar_baltic_confederation:0 "The chiefs of the Baltic tribes hold their lands together against the Rus and the Teutons."
 kar_amber_coast_held:0 "Amber Coast Held"
 desc_kar_amber_coast_held:0 "The amber of the Samland coast brings silver from the south and north."
 kar_volhynians_rise_cherven_title:0 "The Cherven Towns"
 kar_volhynians_rise_cherven_desc:0 "Halych, Przemysl and Cherven control the Carpathian salt, and they were the first towns in the contest between Rus and the Poles."
 kar_volhynians_rise_podolia_title:0 "The Podolian Uplands"
 kar_volhynians_rise_podolia_desc:0 "The Dniester valley is open farm country, and whoever settles it owns the crossroads of the Rus lands and the steppe."
 kar_volhynians_rise_bug_river_title:0 "The Bug River Lands"
 kar_volhynians_rise_bug_river_desc:0 "Podlasie and the marshes of the Pripyat tie the two river systems together."
 kar_cherven_towns_united:0 "Cherven Towns United"
 desc_kar_cherven_towns_united:0 "The fortress-towns of the San and the Bug are held by one prince, and the salt road passes his gates."
 kar_serbs_rise_raska_title:0 "Raska and Serbia"
 kar_serbs_rise_raska_desc:0 "The mountain valleys of the Ibar and the Morava are the cradle of the Serbs, and the zupans there choose a grand zupan."
 kar_serbs_rise_bosnia_title:0 "The Bosnian Hills"
 kar_serbs_rise_bosnia_desc:0 "The Bosnian zupans on the Drina and the Bosna are cousins of the Serbs, and the mountain forts are strong."
 kar_serbs_rise_zeta_title:0 "The Adriatic Coast"
 kar_serbs_rise_zeta_desc:0 "Zeta and the Dalmatian coast bring Serbia to the sea, in sight of Venice and the Greeks."
 kar_serbs_rise_croats_title:0 "The Croat Lands"
 kar_serbs_rise_croats_desc:0 "The Croats of the Sava and the Adriatic coast speak the same tongue as the Serbs, and both look to Byzantium and Rome for their church."
 kar_serb_zupas_united:0 "Serbian Zupas United"
 desc_kar_serb_zupas_united:0 "The zupans of the Serbian lands answer to one grand zupan."
 kar_pomeranians_rise_coast_title:0 "The Slavic Coast"
 kar_pomeranians_rise_coast_desc:0 "Mecklenburg and Vorpommern are the home of the Abodrites, Rani and Wolliner; whoever unites them commands the south Baltic."
 kar_pomeranians_rise_pomerania_title:0 "Further Pomerania"
 kar_pomeranians_rise_pomerania_desc:0 "The coast east of the Oder is held by the Pomeranian tribes, and Kolobrzeg's salt-works are a prize."
 kar_pomeranians_rise_marches_title:0 "The Havel Marches"
 kar_pomeranians_rise_marches_desc:0 "The marches of the Havel and the lower Warta are forest and marsh, home to the Lutici and Pyritz."
 kar_baltic_slavic_state:0 "Baltic Slavic State"
 desc_kar_baltic_slavic_state:0 "The Slavic tribes of the south Baltic shore are bound by a duke, and Wolin is the greatest market of the north."
 kar_rus_novgorod_pskov_title:0 "Pskov and the Lake"
 kar_rus_novgorod_pskov_desc:0 "Pskov and Lake Peipus are Novgorod's western gate, and the Chud and Vod tribes pay it tribute."
 kar_rus_novgorod_beloozero_title:0 "The White Lake"
 kar_rus_novgorod_beloozero_desc:0 "Beloozero lies on the road to the Volga, and the Ves tribe pays its tribute in furs."
 kar_rus_novgorod_upper_volga_title:0 "The Upper Volga"
 kar_rus_novgorod_upper_volga_desc:0 "The Volga headwaters and the lakes of Tver link Novgorod to the Bulgar and Khazar markets."
 kar_rus_novgorod_zalesye_title:0 "The Land Beyond the Forest"
 kar_rus_novgorod_zalesye_desc:0 "Suzdal and Vladimir lie between the Volga and the Oka, among the forests of the Merya, and hold the best soil in the north."
 kar_land_of_the_rus:0 "Land of the Rus"
 desc_kar_land_of_the_rus:0 "The princes of the north hold the portage roads between the Baltic, the Volga and the Dnieper."
 kar_rus_kiev_polyane_title:0 "The Land of the Polyane"
 kar_rus_kiev_polyane_desc:0 "The meadow-tribes around Kiev are the core of the Rus state, and the mound-city commands the middle Dnieper."
 kar_rus_kiev_pripyat_title:0 "The Pripyat Marshes"
 kar_rus_kiev_pripyat_desc:0 "The Pripyat marshes are the old homeland of the Drevlians and Dregovichi and the road to the Baltic lowlands."
 kar_rus_kiev_smolensk_title:0 "The Smolensk Portage"
 kar_rus_kiev_smolensk_desc:0 "The Dnieper portage at Smolensk joins the rivers of the Baltic to the rivers of the Black Sea, and the Krivichi hold it."
 kar_rus_kiev_khazar_border_title:0 "The Khazar Border"
 kar_rus_kiev_khazar_border_desc:0 "Chernigov and the Sula river mark the border with the Khazars; to hold them is to break the tribute that Kiev pays."
 kar_dnieper_route:0 "The Dnieper Route"
 desc_kar_dnieper_route:0 "The river road from the Baltic to the Black Sea pays tribute to Kiev's princes."
 kar_welsh_rise_cymry_title:0 "The Land of the Cymry"
 kar_welsh_rise_cymry_desc:0 "Gwynedd, Powys, Deheubarth and Morgannwg are one people, and whoever unites them is king of Wales."
 kar_welsh_rise_marches_title:0 "The Marches"
 kar_welsh_rise_marches_desc:0 "The Mercian lords on the Severn and Dee threaten Wales, and Offa's Dyke must be pushed back to the Severn."
 kar_welsh_rise_dumnonia_title:0 "Kin of Dumnonia"
 kar_welsh_rise_dumnonia_desc:0 "Cornwall and Devon speak the Welsh tongue; the kinsmen of the south-west would welcome a Welsh king."
 kar_welsh_rise_old_north_title:0 "The Men of the North"
 kar_welsh_rise_old_north_desc:0 "Strathclyde and the Clyde were the last British kingdom of the north; its rock at Dumbarton is a Welsh cousin's seat."
 kar_cymry_united:0 "The Cymry United"
 desc_kar_cymry_united:0 "The Welsh princes hold together under one lord, and the bards sing of Cunedda's sons."
 kar_kin_of_the_west:0 "Kin of the West"
 desc_kar_kin_of_the_west:0 "The Britons of Dumnonia and Cornwall look to Wales for kinship and shelter."
 kar_irish_rise_munster_title:0 "The Kingdom of Munster"
 kar_irish_rise_munster_desc:0 "The kings of Cashel hold the south from the Shannon to the sea, and Cashel is where the high kings are crowned."
 kar_irish_rise_leinster_title:0 "Leinster and the Vikings"
 kar_irish_rise_leinster_desc:0 "The Norse settlements of Dublin and Wexford sit in Leinster, and the Irish kings must either use them or expel them."
 kar_irish_rise_connacht_title:0 "The West"
 kar_irish_rise_connacht_desc:0 "Connacht and Thomond between the Shannon and the Atlantic are the home of the Ui Briuin and the Dal Cais."
 kar_irish_rise_tara_title:0 "The High King at Tara"
 kar_irish_rise_tara_desc:0 "The northern Ui Neill and the kings of Ulster have the best claim to the high kingship and the hill of Tara."
 kar_irish_rise_gaelic_isles_title:0 "The Isles of the Gaels"
 kar_irish_rise_gaelic_isles_desc:0 "The Gaelic kings of Ireland and Dal Riata claim the western isles by descent from the first Scots."
 kar_high_kingship:0 "The High Kingship"
 desc_kar_high_kingship:0 "The kings of the provinces accept one among them as high king at Tara."
 kar_monastic_learning:0 "Monastic Learning"
 desc_kar_monastic_learning:0 "The great monasteries of Clonmacnoise, Bangor and Armagh teach Latin, Greek and the old Irish law."
 kar_alban_rise_highlands_title:0 "The Highlands"
 kar_alban_rise_highlands_desc:0 "The mountains and glens of the north are the Pictish heartland, and a king there must have the chieftains' consent."
 kar_alban_rise_lowlands_title:0 "Strathclyde and Lothian"
 kar_alban_rise_lowlands_desc:0 "The Clyde and the Forth are the king's gateway to the south, and Dumbarton's Britons are old rivals."
 kar_alban_rise_border_title:0 "The Border Marches"
 kar_alban_rise_border_desc:0 "The Tweed and the Cheviot hills are a border between Alba and Northumbria, and the Scots have claimed Lothian ever since."
 kar_alban_rise_western_isles_title:0 "The Western Isles"
 kar_alban_rise_western_isles_desc:0 "The Hebrides are the Norse sea-kings' domain, but the Gaelic chiefs there look to Alba."
 kar_kingdom_of_alba:0 "Kingdom of Alba"
 desc_kar_kingdom_of_alba:0 "The Picts and Scots are one kingdom with one king at Scone, and the old tribal strife is over."
 kar_firth_of_clyde:0 "Firth of Clyde"
 desc_kar_firth_of_clyde:0 "The ships of the Clyde and the Forth carry the king's goods and men."
 kar_norse_isles_rise_highlands_coast_title:0 "The Highland Shores"
 kar_norse_isles_rise_highlands_coast_desc:0 "The Norse of the isles hold the fjord heads of the Highland coast and want the mainland glens behind them."
 kar_norse_isles_rise_clyde_firth_title:0 "The Clyde and Galloway"
 kar_norse_isles_rise_clyde_firth_desc:0 "The Clyde and Galloway coasts are home to Gaelic-Norse settlers who look to the isles' jarls as their lords."
 kar_norse_isles_rise_dublin_title:0 "Dublin and the Irish Sea"
 kar_norse_isles_rise_dublin_desc:0 "Dublin is the Norse kings' greatest town in the west and the market where the slaves of the Irish Sea are sold."
 kar_sea_kings_of_the_isles:0 "Sea-Kings of the Isles"
 desc_kar_sea_kings_of_the_isles:0 "The jarls of the Orkneys and Hebrides command the sea roads of the north."
 kar_english_rise_midlands_title:0 "The Midlands"
 kar_english_rise_midlands_desc:0 "The Trent valley and the Avon are the old heartland of Mercia, whose kings were once overlords of the English."
 kar_english_rise_thames_title:0 "The Thames Valley"
 kar_english_rise_thames_desc:0 "London, Kent and the valley of the Thames hold the richest towns of England and the road to the Continent."
 kar_english_rise_the_fens_title:0 "The Fens and the Wash"
 kar_english_rise_the_fens_desc:0 "East Anglia's coast faces the sea road from Denmark, and the fens are the gateway to the east."
 kar_english_rise_wessex_shires_title:0 "The West Saxon Shires"
 kar_english_rise_wessex_shires_desc:0 "Hampshire, Somerset, Devon and Cornwall are the heartland of the West Saxon kings."
 kar_english_rise_north_shires_title:0 "The Northern Shires"
 kar_english_rise_north_shires_desc:0 "York, Durham and the border country were once the greatest English kingdom, and the Danes took them from it."
 kar_english_crown_won:0 "The English Crown"
 desc_kar_english_crown_won:0 "The shires accept one king, and the king's peace holds from the Humber to the Channel."
 kar_shire_courts:0 "The Shire Courts"
 desc_kar_shire_courts:0 "Sheriffs and shire courts carry the king's writ to every hundred."
 kar_steppe_expansion_anda_title:0 "Sworn Brothers"
 kar_steppe_expansion_anda_desc:0 "A khan with no friends is a khan with many enemies; the clans swear brotherhood with a neighbour."
 kar_steppe_expansion_raid_title:0 "Raid the Sown Lands"
 kar_steppe_expansion_raid_desc:0 "The farmers and townsmen of the neighbouring lands pay richly for peace, and richer for war."
 kar_steppe_expansion_pastures_title:0 "The Home Pastures"
 kar_steppe_expansion_pastures_desc:0 "The best grass and the best wells are the clan's right; all of them must be under one khan."
 kar_steppe_expansion_khanate_title:0 "A Khanate Worth the Name"
 kar_steppe_expansion_khanate_desc:0 "Four new lands at the khan's feet make the clans a people with a future."
 kar_steppe_expansion_lord_of_the_steppe_title:0 "Lord of the Steppe"
 kar_steppe_expansion_lord_of_the_steppe_desc:0 "When the whole home region rides under one banner, no neighbour dares to let the herds graze its border."
 kar_steppe_raiders:0 "Steppe Raiders"
 desc_kar_steppe_raiders:0 "The horsemen ride out each spring and come back with silver, cloth and captives."
 kar_steppe_khanate:0 "A Khanate Worth the Name"
 desc_kar_steppe_khanate:0 "Clans that once fought one another now ride together under one banner."
 kar_steppe_realm_kurultai_title:0 "The Kurultai"
 kar_steppe_realm_kurultai_desc:0 "The lords of the clans meet to elect the khan and to swear that his word will be obeyed in war."
 kar_steppe_realm_herds_title:0 "Herds and Horses"
 kar_steppe_realm_herds_desc:0 "A full horse-herd is wealth, food and an army; the khan counts his animals and his men together."
 kar_steppe_realm_companions_title:0 "The Khan's Companions"
 kar_steppe_realm_companions_desc:0 "A khan's sworn warriors ride beside him in every campaign, and their fame makes recruits."
 kar_steppe_realm_tribute_title:0 "Tribute from the Sown"
 kar_steppe_realm_tribute_desc:0 "The farmers and city-dwellers beside the steppe pay tribute for peace."
 kar_steppe_realm_oasis_title:0 "Oasis and Caravan Cities"
 kar_steppe_realm_oasis_desc:0 "The caravan cities on the steppe's rim bring silk, horses and learned men to the khan's court."
 kar_steppe_hearth:0 "The Great Camp"
 desc_kar_steppe_hearth:0 "The khan's great camp keeps the herds fed and the riders fit through the winter."
 kar_steppe_tribute:0 "Tribute from the Sown"
 desc_kar_steppe_tribute:0 "Cities and oases send silver and silk to the khan rather than see his riders."
 kar_savanna_expansion_elders_title:0 "The Council of Elders"
 kar_savanna_expansion_elders_desc:0 "The elders of the clans advise the chief; the chief takes a wife from a neighbouring lineage and gains an ally."
 kar_savanna_expansion_smiths_title:0 "The Smiths' Fires"
 kar_savanna_expansion_smiths_desc:0 "The smiths of the realm make iron tools and weapons, and the land beyond is cleared for new villages."
 kar_savanna_expansion_homeland_title:0 "The Homeland"
 kar_savanna_expansion_homeland_desc:0 "The rivers, the fields and the sacred groves of the homeland must all be under the chief's drum."
 kar_savanna_expansion_chiefs_title:0 "Chiefs Become Vassals"
 kar_savanna_expansion_chiefs_desc:0 "Neighbouring chiefs who cannot be beaten are made vassals, and the king's rule spreads without constant war."
 kar_savanna_expansion_the_kingdom_title:0 "Master of the Region"
 kar_savanna_expansion_the_kingdom_desc:0 "When the whole region obeys one king, caravans, craftsmen and priests all look to his court."
 kar_smiths_fires:0 "The Smiths' Fires"
 desc_kar_smiths_fires:0 "Iron hoes and spears from the furnaces of the villages spread across the land."
 kar_savanna_kingdom:0 "The Kingdom"
 desc_kar_savanna_kingdom:0 "Chiefs of many villages kneel to one king, and the royal drum calls them to his court."
 kar_savanna_realm_markets_title:0 "The Great Market"
 kar_savanna_realm_markets_desc:0 "A weekly market in the capital draws traders from three days' journey in every direction."
 kar_savanna_realm_salt_and_gold_title:0 "Salt and Gold"
 kar_savanna_realm_salt_and_gold_desc:0 "Caravans from the north bring salt, copper and cloth to the kingdom, and carry away gold and ivory."
 kar_savanna_realm_shrines_title:0 "Shrines of the Ancestors"
 kar_savanna_realm_shrines_desc:0 "The king keeps the shrines of his ancestors, and his rule rests on the blessings of the dead."
 kar_savanna_realm_royal_city_title:0 "The Royal City"
 kar_savanna_realm_royal_city_desc:0 "A walled royal city with its markets, workshops and palace shows the world the kingdom's strength."
 kar_trans_saharan_trade:0 "Trans-Saharan Trade"
 desc_kar_trans_saharan_trade:0 "Salt, copper, gold and cloth move along the caravan roads, and the king taxes them."
 kar_sacred_kingship:0 "Sacred Kingship"
 desc_kar_sacred_kingship:0 "The king is the keeper of the sacred groves and the rain, and his people believe it."
 kar_horn_expansion_ties_title:0 "Dynastic Ties"
 kar_horn_expansion_ties_desc:0 "A king in the highlands marries into the neighbouring houses and finds allies among the lowland chiefs."
 kar_horn_expansion_terraces_title:0 "The Terraced Fields"
 kar_horn_expansion_terraces_desc:0 "New fields, terraces and irrigation channels in the hills make the realm richer and bigger."
 kar_horn_expansion_heartland_title:0 "The Heartland"
 kar_horn_expansion_heartland_desc:0 "The king's highland home, with its churches, markets and fortresses, must all be in his hand."
 kar_horn_expansion_lowlands_title:0 "The Lowland Marches"
 kar_horn_expansion_lowlands_desc:0 "Caravans, camel-herders and slavers use the lowland routes, and the king wants them to pay him."
 kar_horn_expansion_king_of_kings_title:0 "King of Kings"
 kar_horn_expansion_king_of_kings_desc:0 "When the whole region kneels to one throne, its king may take the oldest and proudest titles of the east."
 kar_highland_granary:0 "Highland Granary"
 desc_kar_highland_granary:0 "Terraced fields on the high plateau feed the court, the church and the army."
 kar_coastal_reach:0 "Coastal Reach"
 desc_kar_coastal_reach:0 "Ports on the Red Sea and the Indian Ocean give the highlands a window on the world."
 kar_horn_realm_patrons_title:0 "Patrons of the Faith"
 kar_horn_realm_patrons_desc:0 "The king builds a great church or shrine, and the clergy and people give him their loyalty."
 kar_horn_realm_caravans_title:0 "Caravans to the Coast"
 kar_horn_realm_caravans_desc:0 "Gold, ivory and civet are carried down to the coast, and silver and cloth are carried back."
 kar_horn_realm_court_title:0 "The Royal Court"
 kar_horn_realm_court_desc:0 "A court with a chancery, a treasury and a standing guard marks the king off from the chiefs."
 kar_horn_realm_fortresses_title:0 "Fortress and Frontier"
 kar_horn_realm_fortresses_desc:0 "The hill fortresses of the realm protect the roads, the churches and the royal treasure."
 kar_red_sea_trade:0 "Red Sea Trade"
 desc_kar_red_sea_trade:0 "Gold, ivory, incense and slaves leave the highlands for the Red Sea and Arabia."
 kar_faith_and_crown:0 "Faith and Crown"
 desc_kar_faith_and_crown:0 "Priests and king stand together, and the faith of the realm is the faith of the throne."
 kar_lotharingia_marches_rhine_gate_title:0 "The Rhine Gate"
 kar_lotharingia_marches_rhine_gate_desc:0 "The mouths of the Rhine and the Brabant plain face the East Franks, and Lotharingia must hold them."
 kar_lotharingia_marches_channel_title:0 "The Channel Coast"
 kar_lotharingia_marches_channel_desc:0 "Picardy and the coast of the Channel give Lotharingia a window on the northern sea."
 kar_lotharingia_marches_flanders_title:0 "The Flemish Towns"
 kar_lotharingia_marches_flanders_desc:0 "Flanders' cloth, its ports and its monks make it the richest country of the north."
 kar_lotharingia_marches_burgundy_title:0 "The Burgundian Gate"
 kar_lotharingia_marches_burgundy_desc:0 "The old Burgundian lands between the Saone and the Jura join Lotharingia to the Rhone and to Italy."
 kar_middle_kingdom_borders:0 "Borders of the Middle Kingdom"
 desc_kar_middle_kingdom_borders:0 "The rivers and passes of Lothar's realm are watched by his counts and margraves."
 kar_flemish_wealth:0 "Flemish Wealth"
 desc_kar_flemish_wealth:0 "The cloth towns of Flanders and the ports of the Scheldt pay the king well."
 kar_lotharingia_south_jura_title:0 "Romandie and the Jura"
 kar_lotharingia_south_jura_desc:0 "The passes of the Jura and the Great St Bernard join Lotharingia to Italy, and the lords there swear to whom they please."
 kar_lotharingia_south_savoy_title:0 "Savoy and the Dauphine"
 kar_lotharingia_south_savoy_desc:0 "The Alpine valleys of Savoy and the Dauphine connect Lotharingia's heartland with the Rhone."
 kar_lotharingia_south_rhone_title:0 "Provence and the Rhone"
 kar_lotharingia_south_rhone_desc:0 "The Rhone valley and the Provencal coast are the old kingdom of Burgundy and Provence that Lothar's family also ruled."
 kar_lotharingia_south_lombardy_title:0 "The Iron Crown"
 kar_lotharingia_south_lombardy_desc:0 "Pavia and the Lombard plain are Italy's kingdom and the emperor's seat; the middle realm is whole with them."
 kar_lotharingia_south_rome_title:0 "The Imperial City"
 kar_lotharingia_south_rome_desc:0 "Rome crowns the emperor, and whoever holds the Lateran can claim the imperial title for his house."
 kar_imperial_inheritance:0 "Imperial Inheritance"
 desc_kar_imperial_inheritance:0 "Lothar's heirs hold the imperial title and the lands of the three kingdoms' middle."
 kar_lotharingia_court_ties_title:0 "Ties of Blood"
 kar_lotharingia_court_ties_desc:0 "Lothar's sons and daughters are married to princes who can shield the Middle Kingdom."
 kar_lotharingia_court_fisc_title:0 "The Royal Estates"
 kar_lotharingia_court_fisc_desc:0 "The palaces and estates of Aachen, Nijmegen and Thionville supply the king's court."
 kar_lotharingia_court_school_title:0 "The Palace School"
 kar_lotharingia_court_school_desc:0 "Aachen's palace school copies books, teaches the clerks and sends missi dominici through the realm."
 kar_court_of_aachen:0 "Court of Aachen"
 desc_kar_court_of_aachen:0 "The palace school and the royal chapel draw scholars to Lothar's court."
 kar_bavaria_march_tirol_title:0 "Tyrol and Trent"
 kar_bavaria_march_tirol_desc:0 "The Brenner is the way to Italy, and the counts of Trent hold the southern side of it."
 kar_bavaria_march_carinthia_title:0 "Carinthia and Carniola"
 kar_bavaria_march_carinthia_desc:0 "The Slovene lands of Carinthia, Carniola and Istria are Bavaria's march towards the Adriatic."
 kar_bavaria_march_nordgau_title:0 "Swabia and Franconia"
 kar_bavaria_march_nordgau_desc:0 "The northern and western neighbours of Bavaria are great and rich, and their counts have played Bavaria against the king."
 kar_bavaria_march_moravian_march_title:0 "The Moravian March"
 kar_bavaria_march_moravian_march_desc:0 "Great Moravia lies behind the Bohemian forest, and its prince is a rival and a neighbour."
 kar_bavaria_march_pannonia_title:0 "The Pannonian March"
 kar_bavaria_march_pannonia_desc:0 "The Danube plain towards the east, the old Avar land, is the dukes' last march."
 kar_southeastern_march:0 "The South-Eastern March"
 desc_kar_southeastern_march:0 "Margraves on the Danube and the Drava watch the Slavs, the Avars and the Hungarians."
 kar_bavarian_duchy:0 "The Bavarian Duchy"
 desc_kar_bavarian_duchy:0 "The dukes of Regensburg hold the Alps, the Danube and the Inn in their own right."
 kar_bavaria_court_oaths_title:0 "Oaths of the Bavarians"
 kar_bavaria_court_oaths_desc:0 "The Bavarian counts and bishops swear loyalty to their duke, whatever the king in Frankfurt says."
 kar_bavaria_court_salt_roads_title:0 "The Salt Roads"
 kar_bavaria_court_salt_roads_desc:0 "Reichenhall and Salzburg send salt on the Inn and the Salzach, and the duke takes his share."
 kar_bavaria_court_ducal_diet_title:0 "The Ducal Diet"
 kar_bavaria_court_ducal_diet_desc:0 "The duke judges at his own diet; Bavarian law, church and army are in his hand."
 kar_ducal_court:0 "The Ducal Court"
 desc_kar_ducal_court:0 "The dukes hold their own diets at Regensburg, and the Bavarian great men attend them."
 kar_aquitaine_rise_south_title:0 "Languedoc and the Massif"
 kar_aquitaine_rise_south_desc:0 "Toulouse, the Auvergne and the Cevennes were Aquitaine's core under the old kings."
 kar_aquitaine_rise_poitou_title:0 "Poitou"
 kar_aquitaine_rise_poitou_desc:0 "The counts of Poitiers hold the northern marches; their loyalty has been wavering since the Carolingians took the throne."
 kar_aquitaine_rise_gothia_title:0 "The Gothic March"
 kar_aquitaine_rise_gothia_desc:0 "The Frankish march of Catalonia keeps the Moorish emirs of the south from the Languedoc."
 kar_aquitaine_rise_rhone_coast_title:0 "The Rhone Coast"
 kar_aquitaine_rise_rhone_coast_desc:0 "Provence and Marseilles belong to the Aquitanian south by trade, language and law."
 kar_aquitanian_realm:0 "The Aquitanian Realm"
 desc_kar_aquitanian_realm:0 "The lands between the Loire and the Pyrenees are one kingdom with one law."
 kar_gothic_march:0 "The Gothic March"
 desc_kar_gothic_march:0 "Narbonne, Roussillon and Barcelona are settled by Goths and Spaniards, who owe service to the Aquitanian king."
 kar_brittany_rise_loire_title:0 "The Loire Marches"
 kar_brittany_rise_loire_desc:0 "Nantes and the Loire mouth are the Breton march, a rich and exposed border town on the Frankish side of the river."
 kar_brittany_rise_cotentin_title:0 "Cotentin and Avranches"
 kar_brittany_rise_cotentin_desc:0 "The Breton border towards Normandy is held by Frankish counts who owe their king little loyalty."
 kar_brittany_rise_anjou_title:0 "Poitou and Anjou"
 kar_brittany_rise_anjou_desc:0 "The counts of Anjou and Poitou are neighbours of Brittany and the allies of every Frankish king who wishes it ill."
 kar_brittany_rise_orleans_title:0 "The Loire Valley"
 kar_brittany_rise_orleans_desc:0 "Orleans and the central Loire valley are the Frankish king's heartland; a Breton there would be a revolution."
 kar_breton_march_pushed:0 "The Breton Border Pushed Back"
 desc_kar_breton_march_pushed:0 "The ramparts of Rennes, Nantes and Vannes cover the peninsula, and Breton riders raid the Franks."
 kar_papal_patrimony_lazio_title:0 "The Duchy of Rome"
 kar_papal_patrimony_lazio_desc:0 "Rome and the Latin countryside, with the Campagna and the Sabine hills, are the Pope's own."
 kar_papal_patrimony_marches_title:0 "The Marches and Spoleto"
 kar_papal_patrimony_marches_desc:0 "Spoleto, Camerino and Ancona are the Pope's inheritance since Pippin's grant, and the dukes there serve the emperor."
 kar_papal_patrimony_ravenna_title:0 "The Exarchate"
 kar_papal_patrimony_ravenna_desc:0 "Pippin's donation gave the Pope the lands of the Byzantine exarch at Ravenna and the Pentapolis."
 kar_papal_patrimony_benevento_title:0 "Benevento and Naples"
 kar_papal_patrimony_benevento_desc:0 "Benevento, Naples and Capua are claimed by the Popes as old patrimonies of the Church in the south."
 kar_papal_patrimony_tiara_title:0 "The Triple Crown"
 kar_papal_patrimony_tiara_desc:0 "The Pope is lord over kings: he crowns them, excommunicates them and sets them against one another."
 kar_patrimony_of_st_peter:0 "Patrimony of St Peter"
 desc_kar_patrimony_of_st_peter:0 "The Papal lands are held in the saint's name, and their revenues feed the Lateran."
 kar_defender_of_christendom:0 "Defender of Christendom"
 desc_kar_defender_of_christendom:0 "Latin kings and Greek emperors alike must reckon with the Pope's blessing and his ban."
 kar_moravia_rise_silesia_title:0 "The Oder Valley"
 kar_moravia_rise_silesia_desc:0 "The Silesian tribes between the Oder and the Sudetes are the first Slavs the Moravians try to bring under their rule."
 kar_moravia_rise_slovakia_title:0 "The Carpathian Valleys"
 kar_moravia_rise_slovakia_desc:0 "The Slovak valleys behind the Tatra connect the Moravians to the Danube and the Magyar steppe."
 kar_moravia_rise_pannonian_slavs_title:0 "Pannonia"
 kar_moravia_rise_pannonian_slavs_desc:0 "Kocel's Pannonian principality and the plain of the Danube bend are the Slavic prince's step toward the south."
 kar_moravia_rise_bohemians_title:0 "The Bohemian Dukes"
 kar_moravia_rise_bohemians_desc:0 "The dukes of Bohemia were baptised at Regensburg; a Moravian king would make them his men."
 kar_moravia_rise_vistulans_title:0 "The Vistulans"
 kar_moravia_rise_vistulans_desc:0 "The tribes on the upper Vistula around Cracow are a prize of the Moravian king, who wants a Slavic empire."
 kar_moravian_empire:0 "The Moravian Empire"
 desc_kar_moravian_empire:0 "Svatopluk's lords gather around him in the Morava valley and the king's word reaches the Oder and the Danube."
 kar_slavic_liturgy:0 "The Slavic Liturgy"
 desc_kar_slavic_liturgy:0 "Cyril and Methodios' disciples teach the Slavs in their own tongue, and the Church follows the king."
 kar_provence_rise_alps_title:0 "The Alpine Valleys"
 kar_provence_rise_alps_desc:0 "Savoy and the Dauphine are the kingdom's northern and eastern shield against Lotharingia and Italy."
 kar_provence_rise_ligurian_coast_title:0 "The Ligurian Coast"
 kar_provence_rise_ligurian_coast_desc:0 "The Ligurian ports join Provence to Italy, and its galleys defend them from the Saracens."
 kar_provence_rise_narbonne_title:0 "Narbonne and Languedoc"
 kar_provence_rise_narbonne_desc:0 "Septimania and the Languedoc coast were Provence's neighbour and partner in every Gothic-Frankish quarrel."
 kar_provence_rise_cevennes_title:0 "The Cevennes"
 kar_provence_rise_cevennes_desc:0 "The highlands behind Languedoc close the kingdom's western flank and give it timber and iron."
 kar_kingdom_of_provence:0 "Kingdom of Provence"
 desc_kar_kingdom_of_provence:0 "The Rhone valley and the Provencal coast are one kingdom with its own court and charters."
