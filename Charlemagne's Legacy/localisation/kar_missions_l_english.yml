l_english:
 kar_roman_balkans_thrace_title:0 "Secure Thrace"
 kar_roman_balkans_thrace_desc:0 "The approaches to the City must be ours: Adrianople and the long walls cover Constantinople from the north."
 kar_roman_balkans_macedonia_title:0 "Reclaim Macedonia"
 kar_roman_balkans_macedonia_desc:0 "Thessalonica and the Strymon valley were Roman before the Slavs came; the themes must be restored."
 kar_roman_balkans_bulgars_title:0 "Humble the Bulgars"
 kar_roman_balkans_bulgars_desc:0 "The khan at Pliska has taxed our border for two generations; his lands must be brought under the emperor."
 kar_roman_balkans_slavs_title:0 "Slavs under the Eagle"
 kar_roman_balkans_slavs_desc:0 "The Slavic tribes of the Morava and the Vardar settle on Roman land and owe it service."
 kar_roman_balkans_adriatic_title:0 "Command the Adriatic"
 kar_roman_balkans_adriatic_desc:0 "The Dalmatian cities have been Roman ports since Justinian; their fleets must sail under the imperial flag."
 kar_bulgar_slayer:0 "Bulgar-slayer"
 desc_kar_bulgar_slayer:0 "The emperor has humbled the khan, and the army fights with new confidence."
 kar_roman_west_crete_title:0 "Reclaim Crete"
 kar_roman_west_crete_desc:0 "The emirs of Chandax raid every island of the Aegean; the island must be taken back from the Saracens."
 kar_roman_west_calabria_title:0 "Calabria and Apulia"
 kar_roman_west_calabria_desc:0 "Bari and the heel of Italy are Saracen or Lombard; the Roman themes of the west must be restored."
 kar_roman_west_sicily_title:0 "The Island of Sicily"
 kar_roman_west_sicily_desc:0 "Syracuse still flies the eagle, but Palermo and the west are the emirate's; the whole island must come back."
 kar_roman_west_naples_title:0 "Duchy of Naples"
 kar_roman_west_naples_desc:0 "The Neapolitan dukes remember that they are Roman; Naples and Amalfi must be brought back under the throne."
 kar_roman_west_rome_title:0 "Rome and Ravenna"
 kar_roman_west_rome_desc:0 "The old capital and the seat of the exarchs: the empire is whole when both are held by the emperor again."
 kar_cretan_waters_cleared:0 "Cretan Waters Cleared"
 desc_kar_cretan_waters_cleared:0 "The Aegean is safe again for the grain ships and the imperial fleet."
 kar_island_granary:0 "Sicilian Granary"
 desc_kar_island_granary:0 "The grain of Sicily feeds the City and fills the fisc once more."
 kar_roman_east_cilicia_title:0 "The Cilician Gates"
 kar_roman_east_cilicia_desc:0 "Tarsus and the plain below the Taurus are the gateway to Syria and the base of every Saracen raid on Anatolia."
 kar_roman_east_taurus_title:0 "The Passes of the Taurus"
 kar_roman_east_taurus_desc:0 "Melitene and the upper Euphrates are the emperor's frontier fortress; the garrisons of the passes must be ours."
 kar_roman_east_armenia_title:0 "The Armenian Marches"
 kar_roman_east_armenia_desc:0 "The princes of Armenia and the upper Tigris are Christian, and their lands are the emperor's natural frontier."
 kar_roman_east_antioch_title:0 "Antioch Returns"
 kar_roman_east_antioch_desc:0 "The great city of the east was Roman for three hundred years; the Orontes valley must be held again."
 kar_roman_east_jerusalem_title:0 "The Holy Land"
 kar_roman_east_jerusalem_desc:0 "The Holy Sepulchre was taken from the empire by the caliph; to hold Palestine again is the oldest duty of the throne."
 kar_taurus_frontier_secured:0 "Taurus Frontier Secured"
 desc_kar_taurus_frontier_secured:0 "The passes of the Taurus are fortified and watched, and the Saracen raiders turn back."
 kar_roman_court_alliance_title:0 "A Christian Alliance"
 kar_roman_court_alliance_desc:0 "The empire is not friendless: the Christian kings of the west and the Caucasus should be bound to the throne."
 kar_roman_court_treasury_title:0 "The Fisc"
 kar_roman_court_treasury_desc:0 "The nomisma has kept its weight for five hundred years; a full treasury keeps it that way."
 kar_roman_court_basilika_title:0 "The Basilika"
 kar_roman_court_basilika_desc:0 "The laws of Justinian are old and in Latin; the emperor orders them recast in Greek for his judges."
 kar_roman_court_renaissance_title:0 "The Macedonian Revival"
 kar_roman_court_renaissance_desc:0 "Under the new dynasty the university at the Magnaura teaches the old learning again."
 kar_macedonian_renaissance:0 "Macedonian Renaissance"
 desc_kar_macedonian_renaissance:0 "Scholars copy the books of the ancients, and the court is a model of learning."
 kar_abbasid_east_khuzestan_title:0 "Secure Khuzestan"
 kar_abbasid_east_khuzestan_desc:0 "The sugar and cloth of Khuzestan feed Baghdad, and its governor must answer to the caliph alone."
 kar_abbasid_east_jibal_title:0 "Isfahan and Luristan"
 kar_abbasid_east_jibal_desc:0 "The Jibal is the heart of the Iranian plateau; its dynasts hold it for the caliph or for themselves."
 kar_abbasid_east_ajam_title:0 "Iraq-i Ajam and Tabaristan"
 kar_abbasid_east_ajam_desc:0 "The northern Iranian lands behind the Elburz were the caliph's province before the local princes rose."
 kar_abbasid_east_saffarids_title:0 "Break the Saffarids"
 kar_abbasid_east_saffarids_desc:0 "The coppersmith of Sistan has made himself master of the east; the caliph must end his empire."
 kar_abbasid_east_khorasan_title:0 "Khorasan"
 kar_abbasid_east_khorasan_desc:0 "The great frontier province of the caliphate, whose soldiers once placed the Abbasids on the throne."
 kar_abbasid_east_oxus_title:0 "Beyond the Oxus"
 kar_abbasid_east_oxus_desc:0 "Balkh and the cities of Tokharistan are the caliphate's gateway to the steppe and the roads to China."
 kar_iran_restored:0 "Iran Restored"
 desc_kar_iran_restored:0 "The governors of the Iranian plateau send their taxes to Baghdad again."
 kar_khorasan_regained:0 "Khorasan Regained"
 desc_kar_khorasan_regained:0 "The eastern marches of the caliphate are again in the caliph's hand."
 kar_abbasid_arabia_mecca_title:0 "Guardian of Mecca"
 kar_abbasid_arabia_mecca_desc:0 "The sanctuary and the pilgrim road need a firm hand; Mecca and its hinterland must answer to Baghdad."
 kar_abbasid_arabia_medina_title:0 "The Prophet's City"
 kar_abbasid_arabia_medina_desc:0 "The city of the Prophet's tomb is the caliph's to protect; no local emir may hold it against him."
 kar_abbasid_arabia_yemen_title:0 "The Yemeni Highlands"
 kar_abbasid_arabia_yemen_desc:0 "The terraced highlands, the coffee-less cliffs and the ports of the Red Sea feed the caliph's treasury."
 kar_abbasid_arabia_oman_title:0 "Oman and the Gulf"
 kar_abbasid_arabia_oman_desc:0 "The mariners of Oman sail to India and China; the caliph's fleets must meet them at their harbours."
 kar_custodian_of_the_haramayn:0 "Custodian of the Sanctuaries"
 desc_kar_custodian_of_the_haramayn:0 "The caliph protects the pilgrim roads and the holy cities, and the faithful honour him."
 kar_abbasid_west_delta_title:0 "The Nile Delta"
 kar_abbasid_west_delta_desc:0 "Alexandria and the Delta are Egypt's gate to the sea; their governor must be the caliph's man."
 kar_abbasid_west_upper_egypt_title:0 "Upper Egypt"
 kar_abbasid_west_upper_egypt_desc:0 "The land of Thebes and the Fayyum is the granary of the Muslim world."
 kar_abbasid_west_barqa_title:0 "Barqa and the Oases"
 kar_abbasid_west_barqa_desc:0 "The desert road to the west runs through Cyrenaica and the oases; whoever holds them holds the road to Ifriqiya."
 kar_abbasid_west_ifriqiya_title:0 "Ifriqiya"
 kar_abbasid_west_ifriqiya_desc:0 "The Aghlabid emirs of Qayrawan rule in the caliph's name only; the province must be held by the caliph himself."
 kar_abbasid_west_maghreb_title:0 "The Central Maghreb"
 kar_abbasid_west_maghreb_desc:0 "Tahert and the Zab are the caliphate's western edge, held for the faith against the Berber chiefs."
 kar_nile_valley_regained:0 "Nile Valley Regained"
 desc_kar_nile_valley_regained:0 "Egypt's grain and gold fill the caliph's treasury again."
 kar_abbasid_court_bonds_title:0 "Bonds of Loyalty"
 kar_abbasid_court_bonds_desc:0 "The caliph is more than a name only if the great emirs are bound to him by oath and alliance."
 kar_abbasid_court_treasury_title:0 "The Caliph's Treasury"
 kar_abbasid_court_treasury_desc:0 "The treasury at Baghdad pays the army and the court; it must be full for the caliph to be obeyed."
 kar_abbasid_court_wisdom_title:0 "The House of Wisdom"
 kar_abbasid_court_wisdom_desc:0 "The translators of the Bayt al-Hikma work for the caliph's glory and for the knowledge of mankind."
 kar_house_of_wisdom:0 "House of Wisdom"
 desc_kar_house_of_wisdom:0 "Scholars translate the books of the Greeks, Indians and Persians in Baghdad."
 kar_cordoba_march_aragon_title:0 "The Upper March"
 kar_cordoba_march_aragon_desc:0 "Saragossa and the Ebro valley are the emirate's northern frontier against the Franks and the mountain Christians."
 kar_cordoba_march_pamplona_title:0 "The Basque Country"
 kar_cordoba_march_pamplona_desc:0 "The Banu Qasi and the lords of Pamplona play between Cordoba and the Franks; the passes must be held."
 kar_cordoba_march_catalonia_title:0 "The Marca Hispanica"
 kar_cordoba_march_catalonia_desc:0 "Barcelona and Girona were taken by the Franks in Charlemagne's day; the emir wants them back."
 kar_cordoba_march_leon_title:0 "Break the Mountain Kingdom"
 kar_cordoba_march_leon_desc:0 "Oviedo and Leon are the seat of the Christian kings of the north; their power must end."
 kar_cordoba_march_compostela_title:0 "Galicia"
 kar_cordoba_march_compostela_desc:0 "The shrine of Santiago and the Atlantic coast end the emirate's work in the north."
 kar_upper_march_held:0 "Upper March Held"
 desc_kar_upper_march_held:0 "The fortress towns of the northern frontier are garrisoned and supplied."
 kar_christian_north_subdued:0 "Christian North Subdued"
 desc_kar_christian_north_subdued:0 "The kings of the mountains pay tribute and fear Cordoba's cavalry."
 kar_cordoba_sea_baleares_title:0 "The Balearic Isles"
 kar_cordoba_sea_baleares_desc:0 "The islands command the sea road between Spain and Italy; a fleet there is a fleet everywhere."
 kar_cordoba_sea_ceuta_title:0 "Across the Strait"
 kar_cordoba_sea_ceuta_desc:0 "Tangier, Ceuta and the Rif shield the emirate from the Berber lands and open the Atlantic coast of Africa."
 kar_cordoba_sea_morocco_title:0 "Western Morocco"
 kar_cordoba_sea_morocco_desc:0 "The Atlantic plains of Morocco are the emirate's granary and the end of the gold caravan road."
 kar_strait_commanded:0 "Strait Commanded"
 desc_kar_strait_commanded:0 "Cordoba's ships hold both shores of the strait, and the Atlantic trade passes through her ports."
 kar_cordoba_court_allies_title:0 "Friends in the North"
 kar_cordoba_court_allies_desc:0 "Cordoba is not alone; its emirs seek friendship with the Franks' enemies and with Byzantium."
 kar_cordoba_court_treasury_title:0 "The Emir's Treasury"
 kar_cordoba_court_treasury_desc:0 "The silver of the Andalusi cities and the gold of Africa fill the emir's coffers."
 kar_cordoba_court_splendour_title:0 "The Splendour of Cordoba"
 kar_cordoba_court_splendour_desc:0 "The mosque of Cordoba is enlarged, the court is full of poets and doctors, and the emirate has no equal in the west."
 kar_cordoban_splendour:0 "Cordoban Splendour"
 desc_kar_cordoban_splendour:0 "Madinat al-Zahra and the great mosque draw scholars, merchants and ambassadors."
 kar_west_francia_realm_burgundy_title:0 "The Burgundian March"
 kar_west_francia_realm_burgundy_desc:0 "The old kingdom of the Burgundians is the Rhone's gateway; Charles the Bald must hold it for his own."
 kar_west_francia_realm_brittany_title:0 "The Breton March"
 kar_west_francia_realm_brittany_desc:0 "The dukes of Brittany pay no tribute and shelter the king's enemies; the march must be forced to obey."
 kar_west_francia_realm_aquitaine_title:0 "The Crown of Aquitaine"
 kar_west_francia_realm_aquitaine_desc:0 "Charles's nephew wears the Aquitanian crown; Poitiers, Bordeaux and the Garonne must obey Paris."
 kar_west_francia_realm_toulouse_title:0 "Toulouse and the South"
 kar_west_francia_realm_toulouse_desc:0 "The counts of Toulouse and the Auvergne hold the south under the king's name; the south must be brought in."
 kar_west_francia_realm_pyrenees_title:0 "The Pyrenean March"
 kar_west_francia_realm_pyrenees_desc:0 "The passes of the Pyrenees and the county of Barcelona are the kingdom's southern edge."
 kar_marches_secured:0 "Marches Secured"
 desc_kar_marches_secured:0 "Counts on the marches answer the king's summons and hold the roads and bridges."
 kar_kingdom_of_aquitaine_joined:0 "Aquitaine Joined"
 desc_kar_kingdom_of_aquitaine_joined:0 "The south has sworn to the king in Paris, and its wine and salt fill his treasury."
 kar_west_francia_lotharingia_lorraine_title:0 "The Lorraine Marches"
 kar_west_francia_lotharingia_lorraine_desc:0 "Metz and Toul are the heart of the Carolingian homeland; the kingdom is not whole without them."
 kar_west_francia_lotharingia_lowlands_title:0 "The Walloon Lands"
 kar_west_francia_lotharingia_lowlands_desc:0 "The abbeys and the fairs of the Meuse valley belong to the old centre of Francia."
 kar_west_francia_lotharingia_frisia_title:0 "Holland and Frisia"
 kar_west_francia_lotharingia_frisia_desc:0 "The sea-coast of the Rhine mouths, the Frisian cities and the Viking-ravaged Dorestad need a master who can defend them."
 kar_west_francia_lotharingia_rhineland_title:0 "The Lower Rhine"
 kar_west_francia_lotharingia_rhineland_desc:0 "Cologne and the great monasteries of the Rhine make the Rhineland the realm's religious heart."
 kar_west_francia_lotharingia_aachen_title:0 "The Throne at Aachen"
 kar_west_francia_lotharingia_aachen_desc:0 "The palace chapel of Aachen holds the throne of Charlemagne; whoever sits on it speaks for the Franks."
 kar_aachen_regained:0 "Aachen Regained"
 desc_kar_aachen_regained:0 "The throne of Charlemagne and the chapel of Aachen are under the king again."
 kar_west_francia_court_marriage_title:0 "Marriage Alliances"
 kar_west_francia_court_marriage_desc:0 "The king's daughters are given to princes whose swords he will need against the Northmen."
 kar_west_francia_court_treasury_title:0 "The Danegeld"
 kar_west_francia_court_treasury_desc:0 "The king pays tribute to the Northmen, and the fisc must bear it without breaking the realm."
 kar_west_francia_court_pitres_title:0 "The Edict of Pitres"
 kar_west_francia_court_pitres_desc:0 "The assembly at Pitres orders every bridge on the great rivers fortified and every count to answer for them."
 kar_edict_of_pitres:0 "Edict of Pitres"
 desc_kar_edict_of_pitres:0 "Fortified bridges and a king's ban against private armies defend the Seine and Loire."
 kar_east_francia_marches_thuringia_title:0 "The Thuringian March"
 kar_east_francia_marches_thuringia_desc:0 "Erfurt and the Saale are the border between the Franks and the Sorbs; the march must be wholly the king's."
 kar_east_francia_marches_sorbs_title:0 "The Sorbian Lands"
 kar_east_francia_marches_sorbs_desc:0 "The Sorbs between the Elbe and the Saale are Slavs who pay tribute only when the king's army is near."
 kar_east_francia_marches_bohemia_title:0 "The Bohemian Dukes"
 kar_east_francia_marches_bohemia_desc:0 "The Czech dukes in the basin behind the Erzgebirge have paid Frankish tribute since Charlemagne; they must kneel again."
 kar_east_francia_marches_moravia_title:0 "Great Moravia"
 kar_east_francia_marches_moravia_desc:0 "Rastislav's kingdom on the March has shaken off Frankish overlordship, and its missionaries are Byzantine."
 kar_eastern_marches_held:0 "Eastern Marches Held"
 desc_kar_eastern_marches_held:0 "Margraves and counts on the Elbe and the Saale keep the Slavs from the rivers."
 kar_bohemian_tribute:0 "Bohemian Tribute"
 desc_kar_bohemian_tribute:0 "The dukes of Bohemia pay tribute and send men for the king's host."
 kar_east_francia_north_holstein_title:0 "The Danish March"
 kar_east_francia_north_holstein_desc:0 "The Eider is the frontier with the Danes; Hamburg's archbishop must have a safe diocese."
 kar_east_francia_north_mecklenburg_title:0 "The Abodrite Coast"
 kar_east_francia_north_mecklenburg_desc:0 "The Abodrite princes between the Elbe and the Warnow pay tribute and shelter pirates; they must be dealt with."
 kar_east_francia_north_pomerania_title:0 "The Baltic Shore"
 kar_east_francia_north_pomerania_desc:0 "The Wends of Pomerania trade in amber and furs; the king's march should reach the sea."
 kar_east_francia_north_havel_title:0 "The Havel Slavs"
 kar_east_francia_north_havel_desc:0 "The Lutici and the Hevelli behind the Elbe raid the Saxon border and keep their old gods."
 kar_baltic_marches_secured:0 "Baltic Marches Secured"
 desc_kar_baltic_marches_secured:0 "The coastal marches keep the Danes and the Abodrites at arm's length."
 kar_east_francia_rhine_lower_lotharingia_title:0 "Lower Lotharingia"
 kar_east_francia_rhine_lower_lotharingia_desc:0 "The Rhine mouths and the Brabant plain were Lothar's, and Louis the German's sons claim them."
 kar_east_francia_rhine_cologne_title:0 "Cologne and the Rhine"
 kar_east_francia_rhine_cologne_desc:0 "The archbishopric of Cologne and the Rhenish monasteries tie the east to the old Carolingian heartland."
 kar_east_francia_rhine_coast_title:0 "The Frisian Coast"
 kar_east_francia_rhine_coast_desc:0 "Holland and Frisia are rich and exposed to the Viking longships; a strong lord could hold them."
 kar_east_francia_rhine_middle_kingdom_title:0 "The Middle Kingdom"
 kar_east_francia_rhine_middle_kingdom_desc:0 "Lothar's old realm between the Rhine and the Meuse is the prize of the Carolingian family."
 kar_lotharingia_reunited:0 "Lotharingia Reunited"
 desc_kar_lotharingia_reunited:0 "The middle kingdom is joined to the east, and Aachen's court is the king's."
 kar_east_francia_court_oaths_title:0 "Oaths of the Great Men"
 kar_east_francia_court_oaths_desc:0 "The dukes of Bavaria and Saxony and the margraves swear to the king, and the crown can rely on their support."
 kar_east_francia_court_treasury_title:0 "The Royal Fisc"
 kar_east_francia_court_treasury_desc:0 "The royal estates at Regensburg, Frankfurt and Ingelheim keep the king's court and pay his guards."
 kar_east_francia_court_diets_title:0 "The Diets of the East"
 kar_east_francia_court_diets_desc:0 "The king meets his dukes in a diet each year, and the east holds together because of it."
 kar_diets_of_the_east:0 "Diets of the East"
 desc_kar_diets_of_the_east:0 "The king holds his diets at Regensburg and Frankfurt, and the great men of the east attend him."
 kar_italy_south_rome_title:0 "Defender of Rome"
 kar_italy_south_rome_desc:0 "Pope and Roman senate look to the emperor to defend Rome from the Saracens and the Roman clans."
 kar_italy_south_naples_title:0 "Naples and Salerno"
 kar_italy_south_naples_desc:0 "The Lombard princes of Salerno and the dukes of Naples owe the emperor service, and play off Greeks and Saracens against him."
 kar_italy_south_bari_title:0 "The Emirate of Bari"
 kar_italy_south_bari_desc:0 "The Saracens of Bari raid the Adriatic from a fortress in the heel; Louis the emperor has sworn to destroy it."
 kar_italy_south_calabria_title:0 "The Toe of Italy"
 kar_italy_south_calabria_desc:0 "Calabria is Greek in speech and Byzantine in tradition, and the emperor wants the lands of the toe to be held by his own."
 kar_italy_south_sicily_title:0 "The Island Beyond"
 kar_italy_south_sicily_desc:0 "Sicily is held by Greeks and Saracens, but its Latin Christians look to the emperor."
 kar_roman_crown_defended:0 "Roman Crown Defended"
 desc_kar_roman_crown_defended:0 "The emperor has made Rome safe from Saracen raids and Roman factions alike."
 kar_saracens_expelled:0 "Saracens Expelled"
 desc_kar_saracens_expelled:0 "The emirates of the south are broken and the coast is safe again."
 kar_italy_north_lagoon_title:0 "The Venetian Lagoon"
 kar_italy_north_lagoon_desc:0 "The doge's lagoon is Greek in name and Italian in trade; the emperor wants its harbours open."
 kar_italy_north_islands_title:0 "The Tyrrhenian Isles"
 kar_italy_north_islands_desc:0 "Corsica and Sardinia are the key to the western sea; whoever holds them can protect the coast."
 kar_italy_north_liguria_title:0 "The Ligurian Coast"
 kar_italy_north_liguria_desc:0 "The Ligurian ports are the empire's door to the west and to the Provencal Franks."
 kar_italy_north_savoy_title:0 "The Western Passes"
 kar_italy_north_savoy_desc:0 "The passes of Savoy and the Dauphine join Italy and Francia; the empire's frontier runs along them."
 kar_italy_north_carinthia_title:0 "The Eastern Marches"
 kar_italy_north_carinthia_desc:0 "Carinthia, Istria and the Tyrol guard the north-east door of Italy against the Slavs and the Hungarians."
 kar_alpine_passes_held:0 "Alpine Passes Held"
 desc_kar_alpine_passes_held:0 "The passes from Savoy to Carinthia are in the emperor's hands."
 kar_italy_court_alliances_title:0 "Friends of the Emperor"
 kar_italy_court_alliances_desc:0 "The emperor needs the dukes of Spoleto and Friuli, and the princes of the south, at his side."
 kar_italy_court_treasury_title:0 "The Pavia Treasury"
 kar_italy_court_treasury_desc:0 "The Iron Crown's palace at Pavia and its royal estates fill the treasury."
 kar_italy_court_coronation_title:0 "The Imperial Coronation"
 kar_italy_court_coronation_desc:0 "The pope crowns the emperor in Rome, and Italy again leads the Latin world."
 kar_imperial_coronation:0 "Imperial Coronation"
 desc_kar_imperial_coronation:0 "The pope anointed the emperor in Rome, and the whole of Italy answers to him."
 kar_wessex_realm_wessex_title:0 "Unite Wessex"
 kar_wessex_realm_wessex_desc:0 "Cornwall and the western shires have been Wessex's subjects for generations; the kingdom must be whole."
 kar_wessex_realm_east_anglia_title:0 "East Anglia"
 kar_wessex_realm_east_anglia_desc:0 "The fens and the Norfolk coast face the Danish ships; the king needs them as a shield."
 kar_wessex_realm_mercia_title:0 "The Mercian Heartland"
 kar_wessex_realm_mercia_desc:0 "Mercia was the overlord of the English in Offa's day; its shires are the heart of the island."
 kar_wessex_realm_northumbria_title:0 "Northumbria"
 kar_wessex_realm_northumbria_desc:0 "The great kingdom of the north has been broken by the Danes; its churches and its fertile river-valleys wait for a king."
 kar_wessex_realm_wales_title:0 "The Welsh Princes"
 kar_wessex_realm_wales_desc:0 "The princes of Gwynedd, Powys and Deheubarth pay tribute only when the English host is at their gates."
 kar_english_unity:0 "English Unity"
 desc_kar_english_unity:0 "The English kingdoms are bound under one crown, and the shires obey one law."
 kar_danelaw_broken:0 "Danelaw Broken"
 desc_kar_danelaw_broken:0 "The Great Army is beaten, and the Danes settle under the king's peace."
 kar_wessex_burhs_allies_title:0 "Friends against the Danes"
 kar_wessex_burhs_allies_desc:0 "Wessex needs the princes of Wales and the lords of Mercia beside her when the Great Army comes."
 kar_wessex_burhs_treasury_title:0 "Silver for the Fyrd"
 kar_wessex_burhs_treasury_desc:0 "The king pays his thegns and his reeves in silver, and he must have enough of it to fight a long war."
 kar_wessex_burhs_burhs_title:0 "The Burghal Hidage"
 kar_wessex_burhs_burhs_desc:0 "A ring of burhs across the kingdom, each manned by the men of its hidage, makes the realm safe from raiders."
 kar_burghal_system:0 "Burghal System"
 desc_kar_burghal_system:0 "Fortified burhs a day's march apart cover the whole of the kingdom."
 kar_tang_southwest_yungui_title:0 "Yun-Gui Plateau"
 kar_tang_southwest_yungui_desc:0 "The marches of the south-west are Tang land in name and the tribes' land in fact; the governor must be obeyed."
 kar_tang_southwest_chuannan_title:0 "The Southern Sichuan Road"
 kar_tang_southwest_chuannan_desc:0 "The road from Chengdu to the south passes Nanzhao's frontier and must be held by Tang garrisons."
 kar_tang_southwest_nanzhao_title:0 "Humble Nanzhao"
 kar_tang_southwest_nanzhao_desc:0 "The king of Nanzhao has taken the title of emperor and raided Annam and Sichuan; he must be punished."
 kar_tang_southwest_chuanbei_title:0 "Northern Sichuan"
 kar_tang_southwest_chuanbei_desc:0 "The upper Min and the northern Sichuan passes end the troubles of the south-west."
 kar_southwest_pacified:0 "Southwest Pacified"
 desc_kar_southwest_pacified:0 "The roads of Yunnan and Sichuan are open, and the tribes pay tribute again."
 kar_tang_west_gansu_title:0 "Reclaim Longyou"
 kar_tang_west_gansu_desc:0 "The western Gansu counties fell to the Tibetans and the Uighurs; their return secures the Wei valley."
 kar_tang_west_hexi_title:0 "The Hexi Corridor"
 kar_tang_west_hexi_desc:0 "The long strip of oases from Liangzhou to Dunhuang is the Silk Road's door and the empire's western lung."
 kar_tang_west_turfan_title:0 "Turfan and Hami"
 kar_tang_west_turfan_desc:0 "The oases of the Tian Shan are the gateway to the Western Regions and the old protectorate of Beiting."
 kar_tang_west_tarim_title:0 "The Four Garrisons"
 kar_tang_west_tarim_desc:0 "Kucha, Khotan, Kashgar and Karashahr were the Four Garrisons of Anxi; the protectorate must stand again."
 kar_hexi_corridor_open:0 "Hexi Corridor Open"
 desc_kar_hexi_corridor_open:0 "Caravans pass freely between the Wei valley and the oases of the Tarim basin."
 kar_tang_north_ordos_title:0 "The Ordos Loop"
 kar_tang_north_ordos_desc:0 "The bend of the Yellow River has been the empire's northern wall since the Qin; it must be fortified and garrisoned."
 kar_tang_north_steppe_title:0 "The Steppe Frontier"
 kar_tang_north_steppe_desc:0 "The tribes of the Yin Mountains pay tribute when the Tang army is near and raid when it is far."
 kar_tang_north_liaodong_title:0 "Liaodong"
 kar_tang_north_liaodong_desc:0 "The Liao plain and its Khitan neighbours are the empire's north-east frontier and its gate to Manchuria."
 kar_tang_north_goguryeo_title:0 "The Lost Provinces"
 kar_tang_north_goguryeo_desc:0 "Pyongan was Goguryeo's heartland and was Tang for a generation; Tang again would be a prize."
 kar_northern_frontier_secured:0 "Northern Frontier Secured"
 desc_kar_northern_frontier_secured:0 "The garrisons of the Ordos and the Great Wall are strengthened, and the steppe peoples pay tribute."
 kar_tang_court_alliances_title:0 "Friends of the Throne"
 kar_tang_court_alliances_desc:0 "Tang tributaries and the Uighur khagan can be bound to the throne by marriage and treaty."
 kar_tang_court_treasury_title:0 "The Imperial Treasury"
 kar_tang_court_treasury_desc:0 "The Salt Commission and the Grand Canal tolls keep the Tang treasury full."
 kar_tang_court_golden_age_title:0 "The Golden Age of Tang"
 kar_tang_court_golden_age_desc:0 "The examination system, the bureaucracy and the great poets mark Tang as the model of the world."
 kar_tang_golden_age:0 "Tang Golden Age"
 desc_kar_tang_golden_age:0 "The poets, the painters and the monasteries of Chang'an are the glory of the world."
 kar_yamato_frontier_kyushu_title:0 "The Dazaifu"
 kar_yamato_frontier_kyushu_desc:0 "Kyushu is the gate to Korea and China; the governor-general at Dazaifu must answer for it."
 kar_yamato_frontier_tohoku_title:0 "The Emishi Frontier"
 kar_yamato_frontier_tohoku_desc:0 "The Emishi of the north have beaten imperial armies before; the shogun and his frontier forts must finally win."
 kar_yamato_frontier_ezo_title:0 "The Island of Ezo"
 kar_yamato_frontier_ezo_desc:0 "Beyond the Tsugaru strait lie the Ainu hunters and fishers, and the court hopes for their furs."
 kar_emishi_pacified:0 "Emishi Pacified"
 desc_kar_emishi_pacified:0 "The north is brought under the court's law, and its horse-breeders serve the emperor."
