l_english:
 kar_form_leon_title:0 "Form Leon"
 kar_form_leon:0 "Form Leon"
 kar_form_leon_desc:0 "The crown of Oviedo has outgrown its mountain valleys. From the plains of the Duero to the Galician coast the Christian kings look to the old city of the legion as the seat of their power. Let the throne move from the hills to Leon and the kingdom take the name it will carry through the centuries."
 kar_form_castile_title:0 "Form Castile"
 kar_form_castile:0 "Form Castile"
 kar_form_castile_desc:0 "Beyond the fortified valleys of the north lies the Meseta, a land of castles and frontier counts who answer to no one for long. Let the counts of Burgos and the Duero lands be bound under a single crown, and let Castile be a kingdom and not a march."
 kar_form_aragon_title:0 "Form Aragon"
 kar_form_aragon:0 "Form Aragon"
 kar_form_aragon_desc:0 "The valley of the Ebro and the mountain counties along the Pyrenees have long been held by many hands. Let the lords of the river and the sea coast swear to one banner, and the crown of Aragon shall rule from the mountains to the Mediterranean."
 kar_form_portugal_title:0 "Form Portugal"
 kar_form_portugal:0 "Form Portugal"
 kar_form_portugal_desc:0 "Between the Minho and the Mondego the old harbour of Portus Cale watches the western ocean. A land of ports and river valleys, bordered by the sea on one side and by the great realms of Iberia on the other, may yet be a kingdom in its own right. Let Portugal be proclaimed."
 kar_form_valencia_title:0 "Form Valencia"
 kar_form_valencia:0 "Form Valencia"
 kar_form_valencia_desc:0 "The huerta of the Turia and the coasts of the Levant are among the richest lands in the peninsula, and their cities have always looked to the sea. Let the lords of the eastern coast join their holdings under one crown and the kingdom of Valencia shall flourish."
 kar_form_badajoz_title:0 "Form Badajoz"
 kar_form_badajoz:0 "Form Badajoz"
 kar_form_badajoz_desc:0 "The lords of the Guadiana valley have never bowed easily to the emirs of Cordoba. Let the cities of the west be gathered under one banner and the kingdom of Badajoz shall rule the lands between the Tagus and the Guadiana."
 kar_form_spain_title:0 "Proclaim Hispania"
 kar_form_spain:0 "Proclaim Hispania"
 kar_form_spain_desc:0 "Visigoth, Roman and Iberian all claimed to rule the whole peninsula, and none ever held it. Let the greatest ruler of the age gather the kingdoms of the peninsula under one crown, as the emperors of Hispania once did, and let a single banner fly from the Pyrenees to the straits."
