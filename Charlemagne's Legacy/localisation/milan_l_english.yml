 kar_form_milan_title:0 "Form Milan"
 kar_form_milan:0 "Form Milan"
 kar_form_milan_desc:0 "The cities of the Lombard plain have always been rich and quarrelsome, and the lord who holds the great city on the road to the Alps can make them answer to him. Let our banner and the serpent of Milan stand over the whole of Lombardy."
