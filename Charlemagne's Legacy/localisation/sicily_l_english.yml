 kar_form_sicily_title:0 "Form Sicily"
 kar_form_sicily:0 "Form Sicily"
 kar_form_sicily_desc:0 "The strait has divided the island from the mainland since the ancients, and its shores answer to sceptres from every quarter of the world. Let us plant the black eagle over both shores at once and end the age of divided masters. Under one crown, the sea between them becomes our garden."
