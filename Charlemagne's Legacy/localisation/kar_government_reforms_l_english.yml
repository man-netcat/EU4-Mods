l_english:
 kar_household_court_reform:0 "Household Government"
 kar_household_court_reform_desc:0 "The court and the government are one household: stewards, marshals and chamberlains rule in the king's name."
 kar_oath_bound_reform:0 "Oath-Bound Realm"
 kar_oath_bound_reform_desc:0 "Every lord holds by oath, and the oath is renewed at each new reign."
 kar_missi_reform:0 "Missi Dominici"
 kar_missi_reform_desc:0 "Pairs of envoys, one lay and one clerical, ride the counties to hear complaints and enforce the king's will."
 kar_palatine_counties_reform:0 "Palatine Counties"
 kar_palatine_counties_reform_desc:0 "Border counties are held by powerful counts with the rights of the crown within their lands."
 kar_ministeriales_reform:0 "Ministeriales"
 kar_ministeriales_reform_desc:0 "Unfree household servants are raised to administer the royal lands, and owe everything to the crown."
 kar_cathedral_chapters_reform:0 "Cathedral Chapters"
 kar_cathedral_chapters_reform_desc:0 "Bishops and their canons are the realm's clerks, judges and tax-reckoners."
 kar_royal_chancery_reform:0 "Royal Chancery"
 kar_royal_chancery_reform_desc:0 "A standing office issues the king's writs and keeps copies of every grant."
 kar_borough_charters_reform:0 "Borough Charters"
 kar_borough_charters_reform_desc:0 "Towns hold their own courts and councils and answer to the crown for the dues they owe."
 kar_exchequer_reform:0 "The Exchequer"
 kar_exchequer_reform_desc:0 "Sheriffs account twice a year at a table of squares; every debt is written down."
 kar_manorial_economy_reform:0 "Manorial Economy"
 kar_manorial_economy_reform_desc:0 "The land is worked by tenants of the manor, and the manor feeds the realm."
 kar_market_rights_reform:0 "Market Rights"
 kar_market_rights_reform_desc:0 "The crown sells the right to hold markets and takes its share of every sale."
 kar_royal_church_reform:0 "Royal Church"
 kar_royal_church_reform_desc:0 "Bishops are named by the king and serve him as lords and counsellors."
 kar_retinue_host_reform:0 "Retinue Host"
 kar_retinue_host_reform_desc:0 "Every lord keeps a retinue, and the king's host is the sum of them."
 kar_castle_guard_reform:0 "Castle Guard"
 kar_castle_guard_reform_desc:0 "Knights serve for a term in the castles that hold the land."
 kar_guild_assembly_reform:0 "Guild Assembly"
 kar_guild_assembly_reform_desc:0 "The guilds sit as the city's council, each for its own trade."
 kar_patrician_council_reform:0 "Patrician Council"
 kar_patrician_council_reform_desc:0 "A few old families hold every office, and keep the city's trade in their hands."
 kar_civic_militia_reform:0 "Civic Militia"
 kar_civic_militia_reform_desc:0 "Every citizen drills with his ward, and the wards march together."
 kar_staple_rights_reform:0 "Staple Rights"
 kar_staple_rights_reform_desc:0 "Foreign merchants must offer their goods in the city's market before they sail on."
 kar_abbot_lord_reform:0 "Abbot-Lord"
 kar_abbot_lord_reform_desc:0 "The head of the order is lord of its lands as well as its souls."
 kar_clerical_scribes_reform:0 "Clerical Scribes"
 kar_clerical_scribes_reform_desc:0 "The clergy keep the accounts, the rolls and the letters of the order."
 kar_monastic_estates_reform:0 "Monastic Estates"
 kar_monastic_estates_reform_desc:0 "Lay brothers and tenants work the order's farms, and the order's farms feed it."
 kar_clan_moots_reform:0 "Clan Moots"
 kar_clan_moots_reform_desc:0 "Free men meet at the assembly to judge disputes and choose war."
 kar_war_band_reform:0 "War Band"
 kar_war_band_reform_desc:0 "The chief's sworn companions ride with him and are fed at his table."
 kar_oath_circles_reform:0 "Oath Circles"
 kar_oath_circles_reform_desc:0 "Kin swear oaths of blood and of the land, and the oaths bind more tightly than law."
 kar_early_monarchy_1a_reform:0 "Royal Household"
 kar_early_monarchy_1a_reform_desc:0 "The royal household keeps the realm together through the ruler's own kin and household."
 kar_early_monarchy_1b_reform:0 "Kindred Council"
 kar_early_monarchy_1b_reform_desc:0 "The kindred council binds the subject peoples to the ruler's household and customs."
 kar_early_monarchy_2a_reform:0 "Law of the Land"
 kar_early_monarchy_2a_reform_desc:0 "The law of the land sets down the customs of the realm so that officers can apply them alike everywhere."
 kar_early_monarchy_2b_reform:0 "Royal Peace"
 kar_early_monarchy_2b_reform_desc:0 "The royal peace keeps the peace by custom, oath and the fixed price of every wrong."
 kar_early_monarchy_3a_reform:0 "Great Officers"
 kar_early_monarchy_3a_reform_desc:0 "The great officers gives each task of government to a named officer of the court."
 kar_early_monarchy_3b_reform:0 "Itinerant Court"
 kar_early_monarchy_3b_reform_desc:0 "The itinerant court lets the ruler's court travel the realm and receive foreign envoys."
 kar_early_monarchy_4a_reform:0 "Fiefs and Service"
 kar_early_monarchy_4a_reform_desc:0 "The fiefs and service ties every holding of land to a fixed share of the army."
 kar_early_monarchy_4b_reform:0 "Free Levy"
 kar_early_monarchy_4b_reform_desc:0 "The free levy keeps the land's defenders trained and their strongholds manned."
 kar_early_monarchy_5a_reform:0 "Bishop-Counsellors"
 kar_early_monarchy_5a_reform_desc:0 "The bishop-counsellors lets the clergy carry the ruler's orders to every parish."
 kar_early_monarchy_5b_reform:0 "Royal Chapel"
 kar_early_monarchy_5b_reform_desc:0 "The royal chapel puts the faith's holy days and rites at the centre of public life."
 kar_early_monarchy_6a_reform:0 "Royal Boroughs"
 kar_early_monarchy_6a_reform_desc:0 "The royal boroughs grants towns their own councils in return for steady dues."
 kar_early_monarchy_6b_reform:0 "Mint and Market"
 kar_early_monarchy_6b_reform_desc:0 "The mint and market licenses markets and mints so that coin moves through the realm."
 kar_early_monarchy_7a_reform:0 "Charter Rolls"
 kar_early_monarchy_7a_reform_desc:0 "The charter rolls keeps rolls of every holding, tenant and due."
 kar_early_monarchy_7b_reform:0 "Domesday Survey"
 kar_early_monarchy_7b_reform_desc:0 "The domesday survey surveys the realm so that new lands are quickly put in order."
 kar_early_monarchy_8a_reform:0 "Great Council"
 kar_early_monarchy_8a_reform_desc:0 "The great council gathers the realm's great men into a council that shares the ruler's burdens."
 kar_early_monarchy_8b_reform:0 "Standing Council"
 kar_early_monarchy_8b_reform_desc:0 "The standing council calls the whole realm to arms through its standing council."
