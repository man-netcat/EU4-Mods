 kar_form_sweden_title:0 "Form Sweden"
 kar_form_sweden:0 "Form Sweden"
 kar_form_sweden_desc:0 "The Svear and Götar have warred over Uppsala and the southern seas since the songs began, while Danes press from the south and raiders from every fjord. Yet one crown over the forests and lakes would turn the sea-kings' homeland into a realm to be reckoned with. Let us unite the Swedes and raise Sweden among the kingdoms of the world."
