l_english:
 kar_form_denmark_title:0 "Form Denmark"
 kar_form_denmark:0 "Form Denmark"
 kar_form_denmark_desc:0 "The petty kings of the Danes have warred over Sjaelland and Jutland since the songs began, while the Swedes press from the east and the Franks from the south. Yet one crown over the straits and the northern seas would make the raiders' homeland a kingdom to be reckoned with. Let us unite the Danes and raise Denmark among the kingdoms of the world."
