 sufri_school:0 "Sufri Rite"
 sufri_school_desc:0 "The Kharijites of Ifriqiya and the Sahara, whose imams ruled Sijilmasa and Tahert. They are masters of the desert roads."
 sufri_scholar_modifier:0 "Sufri Rite Clergy"
 desc_sufri_scholar_modifier:0 "We are currently entertaining clergy of the Sufri Rite to further the liturgical and theological discussion in our country."
