 desc_slavic_pagan_scholar_modifier:0 "We are currently entertaining clergy of the Slovianska Pravda Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_slavic_pagan_school:0 "Allows to invite a Cleric of the §YSlovianska Pravda Rite§! without diplomatic relations."
 baltic_pagan_school:0 "Baltic Rite"
 baltic_pagan_school_desc:0 "The faith of Dievas, Perkunas and Gabija, kept beneath the sacred oaks. Its holy places are the best defence the Baltic tribes have."
 baltic_pagan_scholar_modifier:0 "Baltic Rite Clergy"
 desc_baltic_pagan_scholar_modifier:0 "We are currently entertaining clergy of the Baltic Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_baltic_pagan_school:0 "Allows to invite a Cleric of the §YBaltic Rite§! without diplomatic relations."
 finnish_pagan_school:0 "Finnic Rite"
 finnish_pagan_school_desc:0 "The faith of Ukko, Tapio and the spirits of forest and water, led by the tietaja in the wilds of the north. Its hunters are quick and hard to catch."
 finnish_pagan_scholar_modifier:0 "Finnic Rite Clergy"
 desc_finnish_pagan_scholar_modifier:0 "We are currently entertaining clergy of the Finnic Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_finnish_pagan_school:0 "Allows to invite a Cleric of the §YFinnic Rite§! without diplomatic relations."
 magyar_pagan_school:0 "Taltos Rite"
 magyar_pagan_school_desc:0 "The shamanic faith of the Magyars, led by the taltos who speak to the spirits of sky and steppe. Its riders are the terror of the plains."
 magyar_pagan_scholar_modifier:0 "Taltos Rite Clergy"
 desc_magyar_pagan_scholar_modifier:0 "We are currently entertaining clergy of the Taltos Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_magyar_pagan_school:0 "Allows to invite a Cleric of the §YTaltos Rite§! without diplomatic relations."
 hanafi_school:0 "Hanafi Rite"
 hanafi_school_desc:0 "The school of Abu Hanifa, prominent throughout the Persian and Turkic world. Its jurists favour reasoning and local custom, and are held to be the most flexible of the schools."
 hanafi_scholar_modifier:0 "Hanafi Rite Clergy"
 desc_hanafi_scholar_modifier:0 "We are currently entertaining clergy of the Hanafi Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_hanafi_school:0 "Allows to invite a Cleric of the §YHanafi Rite§! without diplomatic relations."
 hanbali_school:0 "Hanbali Rite"
 hanbali_school_desc:0 "The school of Ahmad ibn Hanbal, strict in following the Quran and the hadith. Its rigour holds a community together through disorder."
 hanbali_scholar_modifier:0 "Hanbali Rite Clergy"
 desc_hanbali_scholar_modifier:0 "We are currently entertaining clergy of the Hanbali Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_hanbali_school:0 "Allows to invite a Cleric of the §YHanbali Rite§! without diplomatic relations."
 maliki_school:0 "Maliki Rite"
 maliki_school_desc:0 "The school of Malik ibn Anas of Medina, which holds the practice of the city of the Prophet as law. It is the school of the Maghreb and al-Andalus."
 maliki_scholar_modifier:0 "Maliki Rite Clergy"
 desc_maliki_scholar_modifier:0 "We are currently entertaining clergy of the Maliki Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_maliki_school:0 "Allows to invite a Cleric of the §YMaliki Rite§! without diplomatic relations."
 shafii_school:0 "Shafi'i Rite"
 shafii_school_desc:0 "The school of al-Shafi'i, who set out the roots of jurisprudence. Its judges are found in the markets of Egypt, the Hejaz and the ports of the Indian Ocean."
 shafii_scholar_modifier:0 "Shafi'i Rite Clergy"
 desc_shafii_scholar_modifier:0 "We are currently entertaining clergy of the Shafi'i Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_shafii_school:0 "Allows to invite a Cleric of the §YShafi'i Rite§! without diplomatic relations."
 ismaili_school:0 "Ismaili Rite"
 ismaili_school_desc:0 "The Sevener branch of the Shia, looking to a hidden knowledge behind the words of the law. Its missionaries work in secret across the Muslim world."
 ismaili_scholar_modifier:0 "Ismaili Rite Clergy"
 desc_ismaili_scholar_modifier:0 "We are currently entertaining clergy of the Ismaili Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_ismaili_school:0 "Allows to invite a Cleric of the §YIsmaili Rite§! without diplomatic relations."
 hafizi_school:0 "Hafizi Rite"
 hafizi_school_desc:0 "A branch of the Ismailis that holds to the primacy of the Fatimid caliph in all things of the faith."
 hafizi_scholar_modifier:0 "Hafizi Rite Clergy"
 desc_hafizi_scholar_modifier:0 "We are currently entertaining clergy of the Hafizi Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_hafizi_school:0 "Allows to invite a Cleric of the §YHafizi Rite§! without diplomatic relations."
 alawite_school:0 "Alawite Rite"
 alawite_school_desc:0 "A secretive Shia sect of the Syrian mountains, with its own mysteries kept from outsiders. Its villages are hard to conquer."
 alawite_scholar_modifier:0 "Alawite Rite Clergy"
 desc_alawite_scholar_modifier:0 "We are currently entertaining clergy of the Alawite Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_alawite_school:0 "Allows to invite a Cleric of the §YAlawite Rite§! without diplomatic relations."
 alevi_school:0 "Alevi Rite"
 alevi_school_desc:0 "A mystical Shia path of Anatolia and the Turkic tribes, close to the Sufis and lax in ritual. Its people are slow to rebel."
 alevi_scholar_modifier:0 "Alevi Rite Clergy"
 desc_alevi_scholar_modifier:0 "We are currently entertaining clergy of the Alevi Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_alevi_school:0 "Allows to invite a Cleric of the §YAlevi Rite§! without diplomatic relations."
 qarmatian_school:0 "Qarmatian Rite"
 qarmatian_school_desc:0 "A radical Ismaili sect that rejects the caliph and holds property in common. Its fighters of Bahrayn have sacked Mecca."
 qarmatian_scholar_modifier:0 "Qarmatian Rite Clergy"
 desc_qarmatian_scholar_modifier:0 "We are currently entertaining clergy of the Qarmatian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_qarmatian_school:0 "Allows to invite a Cleric of the §YQarmatian Rite§! without diplomatic relations."
 nizari_school:0 "Nizari Rite"
 nizari_school_desc:0 "The Ismaili Nizaris, remembered for their mountain fortresses and their disciplined fida'is. Few armies match their devotion."
 nizari_scholar_modifier:0 "Nizari Rite Clergy"
 desc_nizari_scholar_modifier:0 "We are currently entertaining clergy of the Nizari Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_nizari_school:0 "Allows to invite a Cleric of the §YNizari Rite§! without diplomatic relations."
 zaidi_school:0 "Zaydi Rite"
 zaidi_school_desc:0 "The Fiver branch of the Shia, which holds that any worthy descendant of Ali may lead the community by the sword. It is the faith of Yemen and the Caspian highlands."
 zaidi_scholar_modifier:0 "Zaydi Rite Clergy"
 desc_zaidi_scholar_modifier:0 "We are currently entertaining clergy of the Zaydi Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_zaidi_school:0 "Allows to invite a Cleric of the §YZaydi Rite§! without diplomatic relations."
 jafari_school:0 "Imami Rite"
 jafari_school_desc:0 "The Twelver branch of the Shia, which follows the line of twelve imams and the jurisprudence of Ja'far al-Sadiq. Its scholars live from the favour of no ruler."
 jafari_scholar_modifier:0 "Imami Rite Clergy"
 desc_jafari_scholar_modifier:0 "We are currently entertaining clergy of the Imami Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_jafari_school:0 "Allows to invite a Cleric of the §YImami Rite§! without diplomatic relations."
 ghulat_school:0 "Ghulat Rite"
 ghulat_school_desc:0 "The 'exaggerators', Shia sects that raise Ali or his line to the divine. Their zealots ride to war with total conviction."
 ghulat_scholar_modifier:0 "Ghulat Rite Clergy"
 desc_ghulat_scholar_modifier:0 "We are currently entertaining clergy of the Ghulat Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_ghulat_school:0 "Allows to invite a Cleric of the §YGhulat Rite§! without diplomatic relations."
 ibadi_school:0 "Ibadi Rite"
 ibadi_school_desc:0 "The moderate branch of the Kharijites, found in Oman, the Mzab and the Maghreb. Its imams are chosen by the community and its merchants are known across the sea."
 ibadi_scholar_modifier:0 "Ibadi Rite Clergy"
 desc_ibadi_scholar_modifier:0 "We are currently entertaining clergy of the Ibadi Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_ibadi_school:0 "Allows to invite a Cleric of the §YIbadi Rite§! without diplomatic relations."
 azariqa_school:0 "Azariqa Rite"
 azariqa_school_desc:0 "The most uncompromising of the Kharijites, who hold that all other Muslims are unbelievers. They are feared as holy warriors."
 azariqa_scholar_modifier:0 "Azariqa Rite Clergy"
