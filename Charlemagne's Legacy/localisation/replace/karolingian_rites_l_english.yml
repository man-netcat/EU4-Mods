 allows_every_time_invite_of_nestorian_rite_school:0 "Allows to invite a Cleric of the §YNestorian Rite§! without diplomatic relations."
 bosnian_church_rite_school:0 "Bosnian Rite"
 bosnian_church_rite_school_desc:0 "The Church of Bosnia, forgotten by Rome and Constantinople alike. Its simple, unstructured worship leaves its people free to deal with all sides."
 bosnian_church_rite_scholar_modifier:0 "Bosnian Rite Clergy"
 desc_bosnian_church_rite_scholar_modifier:0 "We are currently entertaining clergy of the Bosnian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_bosnian_church_rite_school:0 "Allows to invite a Cleric of the §YBosnian Rite§! without diplomatic relations."
 slavic_pagan_school:0 "Slovianska Pravda Rite"
 slavic_pagan_school_desc:0 "The old faith of the Slavs, with Perun and Veles worshipped in groves and on hilltops. Its warrior bands are the heart of every tribe."
