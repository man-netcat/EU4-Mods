l_english:
 roman_rite_school:0 "Roman Rite"
 roman_rite_school_desc:0 "The liturgy of the Church of Rome, spread by the papacy and the Benedictines across the Latin west. Its clergy carry the weight of Peter's see into every court."
 roman_rite_scholar_modifier:0 "Roman Rite Clergy"
 desc_roman_rite_scholar_modifier:0 "We are currently entertaining clergy of the Roman Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_roman_rite_school:0 "Allows to invite a Cleric of the §YRoman Rite§! without diplomatic relations."
 carolingian_rite_school:0 "Carolingian Rite"
 carolingian_rite_school_desc:0 "The Frankish church of Reims and Metz, shaped by Charlemagne's reforms: the king as protector of the faith, bishops as servants of the realm, and a liturgy bent to the needs of the crown."
 carolingian_rite_scholar_modifier:0 "Carolingian Rite Clergy"
 desc_carolingian_rite_scholar_modifier:0 "We are currently entertaining clergy of the Carolingian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_carolingian_rite_school:0 "Allows to invite a Cleric of the §YCarolingian Rite§! without diplomatic relations."
 ambrosian_rite_school:0 "Ambrosian Rite"
 ambrosian_rite_school_desc:0 "The rite of Milan, which keeps the chants and customs of Saint Ambrose and bows to Rome only in what it must. The cathedral builders of Lombardy are its pride."
 ambrosian_rite_scholar_modifier:0 "Ambrosian Rite Clergy"
 desc_ambrosian_rite_scholar_modifier:0 "We are currently entertaining clergy of the Ambrosian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_ambrosian_rite_school:0 "Allows to invite a Cleric of the §YAmbrosian Rite§! without diplomatic relations."
 beneventan_rite_school:0 "Beneventan Rite"
 beneventan_rite_school_desc:0 "The old Lombard rite of Benevento and Monte Cassino, with its own script, chant and calendar. Its monks are soldiers of the faith as much as scribes."
 beneventan_rite_scholar_modifier:0 "Beneventan Rite Clergy"
 desc_beneventan_rite_scholar_modifier:0 "We are currently entertaining clergy of the Beneventan Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_beneventan_rite_school:0 "Allows to invite a Cleric of the §YBeneventan Rite§! without diplomatic relations."
 mozarabic_rite_school:0 "Mozarabic Rite"
 mozarabic_rite_school_desc:0 "The ancient Visigothic liturgy of Toledo, kept alive by the Christians of al-Andalus under Muslim rule. Its people have learned to prosper among those who do not share their creed."
 mozarabic_rite_scholar_modifier:0 "Mozarabic Rite Clergy"
 desc_mozarabic_rite_scholar_modifier:0 "We are currently entertaining clergy of the Mozarabic Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_mozarabic_rite_school:0 "Allows to invite a Cleric of the §YMozarabic Rite§! without diplomatic relations."
 insular_celtic_rite_school:0 "Insular Celtic Rite"
 insular_celtic_rite_school_desc:0 "The church of Ireland, Wales and Scotland, built on monasteries rather than dioceses. Its scholars copy and teach through the dark ages, and carry the faith abroad as peregrini."
 insular_celtic_rite_scholar_modifier:0 "Insular Celtic Rite Clergy"
 desc_insular_celtic_rite_scholar_modifier:0 "We are currently entertaining clergy of the Insular Celtic Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_insular_celtic_rite_school:0 "Allows to invite a Cleric of the §YInsular Celtic Rite§! without diplomatic relations."
 byzantine_rite_school:0 "Byzantine Rite"
 byzantine_rite_school_desc:0 "The rite of Constantinople, with its Divine Liturgy of Saint John Chrysostom, imperial ceremonial and the patriarch beside the emperor. Order in worship is order in the state."
 byzantine_rite_scholar_modifier:0 "Byzantine Rite Clergy"
 desc_byzantine_rite_scholar_modifier:0 "We are currently entertaining clergy of the Byzantine Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_byzantine_rite_school:0 "Allows to invite a Cleric of the §YByzantine Rite§! without diplomatic relations."
 georgian_rite_school:0 "Georgian Rite"
 georgian_rite_school_desc:0 "The church of Iberia and Kartli, autocephalous in all but name and fiercely loyal to its own saints. It stands as a wall of faith in the Caucasus."
 georgian_rite_scholar_modifier:0 "Georgian Rite Clergy"
 desc_georgian_rite_scholar_modifier:0 "We are currently entertaining clergy of the Georgian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_georgian_rite_school:0 "Allows to invite a Cleric of the §YGeorgian Rite§! without diplomatic relations."
 slavic_rite_school:0 "Slavic Rite"
 slavic_rite_school_desc:0 "The liturgy in Old Church Slavonic, fruit of the mission of Saints Cyril and Methodius. It carries the Gospel to the Slavs in a tongue they understand."
 slavic_rite_scholar_modifier:0 "Slavic Rite Clergy"
 desc_slavic_rite_scholar_modifier:0 "We are currently entertaining clergy of the Slavic Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_slavic_rite_school:0 "Allows to invite a Cleric of the §YSlavic Rite§! without diplomatic relations."
 coptic_rite_school:0 "Coptic Rite"
 coptic_rite_school_desc:0 "The church of Alexandria and Egypt, which holds to the miaphysite creed and has endured every conqueror. Its people have long learned patience."
 coptic_rite_scholar_modifier:0 "Coptic Rite Clergy"
 desc_coptic_rite_scholar_modifier:0 "We are currently entertaining clergy of the Coptic Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_coptic_rite_school:0 "Allows to invite a Cleric of the §YCoptic Rite§! without diplomatic relations."
 antiochian_rite_school:0 "Antiochian Rite"
 antiochian_rite_school_desc:0 "The rite of the ancient see of Antioch and the Syriac-speaking Christians of the Levant. Its merchants and translators move between the courts of the world."
 antiochian_rite_scholar_modifier:0 "Antiochian Rite Clergy"
 desc_antiochian_rite_scholar_modifier:0 "We are currently entertaining clergy of the Antiochian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_antiochian_rite_school:0 "Allows to invite a Cleric of the §YAntiochian Rite§! without diplomatic relations."
 ethiopian_rite_school:0 "Ethiopian Rite"
 ethiopian_rite_school_desc:0 "The church of Aksum, with its Ge'ez liturgy and ties to Alexandria. In its mountain kingdom it is the faith of the whole people and its armies."
 ethiopian_rite_scholar_modifier:0 "Ethiopian Rite Clergy"
 desc_ethiopian_rite_scholar_modifier:0 "We are currently entertaining clergy of the Ethiopian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_ethiopian_rite_school:0 "Allows to invite a Cleric of the §YEthiopian Rite§! without diplomatic relations."
 armenian_rite_school:0 "Armenian Rite"
 armenian_rite_school_desc:0 "The church of Armenia, the first Christian kingdom, whose merchants hold the roads from Persia to the sea and whose priests hold the nation together."
 armenian_rite_scholar_modifier:0 "Armenian Rite Clergy"
 desc_armenian_rite_scholar_modifier:0 "We are currently entertaining clergy of the Armenian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_armenian_rite_school:0 "Allows to invite a Cleric of the §YArmenian Rite§! without diplomatic relations."
 nestorian_rite_school:0 "Nestorian Rite"
 nestorian_rite_school_desc:0 "The Church of the East, whose Syriac liturgy and missionaries have reached from Mesopotamia to the courts of Central Asia and China."
 nestorian_rite_scholar_modifier:0 "Nestorian Rite Clergy"
 desc_nestorian_rite_scholar_modifier:0 "We are currently entertaining clergy of the Nestorian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_nestorian_rite_school:0 "Allows to invite a Cleric of the §YNestorian Rite§! without diplomatic relations."
 bosnian_church_rite_school:0 "Bosnian Rite"
 bosnian_church_rite_school_desc:0 "The Church of Bosnia, forgotten by Rome and Constantinople alike. Its simple, unstructured worship leaves its people free to deal with all sides."
 bosnian_church_rite_scholar_modifier:0 "Bosnian Rite Clergy"
 desc_bosnian_church_rite_scholar_modifier:0 "We are currently entertaining clergy of the Bosnian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_bosnian_church_rite_school:0 "Allows to invite a Cleric of the §YBosnian Rite§! without diplomatic relations."
 slavic_pagan_school:0 "Slovianska Pravda Rite"
 slavic_pagan_school_desc:0 "The old faith of the Slavs, with Perun and Veles worshipped in groves and on hilltops. Its warrior bands are the heart of every tribe."
 slavic_pagan_scholar_modifier:0 "Slovianska Pravda Rite Clergy"
 desc_slavic_pagan_scholar_modifier:0 "We are currently entertaining clergy of the Slovianska Pravda Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_slavic_pagan_school:0 "Allows to invite a Cleric of the §YSlovianska Pravda Rite§! without diplomatic relations."
 baltic_pagan_school:0 "Baltic Rite"
 baltic_pagan_school_desc:0 "The faith of Dievas, Perkunas and Gabija, kept beneath the sacred oaks. Its holy places are the best defence the Baltic tribes have."
 baltic_pagan_scholar_modifier:0 "Baltic Rite Clergy"
 desc_baltic_pagan_scholar_modifier:0 "We are currently entertaining clergy of the Baltic Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_baltic_pagan_school:0 "Allows to invite a Cleric of the §YBaltic Rite§! without diplomatic relations."
 finnish_pagan_school:0 "Finnic Rite"
 finnish_pagan_school_desc:0 "The faith of Ukko, Tapio and the spirits of forest and water, led by the tietaja in the wilds of the north. Its hunters are quick and hard to catch."
 finnish_pagan_scholar_modifier:0 "Finnic Rite Clergy"
 desc_finnish_pagan_scholar_modifier:0 "We are currently entertaining clergy of the Finnic Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_finnish_pagan_school:0 "Allows to invite a Cleric of the §YFinnic Rite§! without diplomatic relations."
 magyar_pagan_school:0 "Taltos Rite"
 magyar_pagan_school_desc:0 "The shamanic faith of the Magyars, led by the taltos who speak to the spirits of sky and steppe. Its riders are the terror of the plains."
 magyar_pagan_scholar_modifier:0 "Taltos Rite Clergy"
 desc_magyar_pagan_scholar_modifier:0 "We are currently entertaining clergy of the Taltos Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_magyar_pagan_school:0 "Allows to invite a Cleric of the §YTaltos Rite§! without diplomatic relations."
 hanafi_school:0 "Hanafi Rite"
 hanafi_school_desc:0 "The school of Abu Hanifa, prominent throughout the Persian and Turkic world. Its jurists favour reasoning and local custom, and are held to be the most flexible of the schools."
 hanafi_scholar_modifier:0 "Hanafi Rite Clergy"
 desc_hanafi_scholar_modifier:0 "We are currently entertaining clergy of the Hanafi Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_hanafi_school:0 "Allows to invite a Cleric of the §YHanafi Rite§! without diplomatic relations."
 hanbali_school:0 "Hanbali Rite"
 hanbali_school_desc:0 "The school of Ahmad ibn Hanbal, strict in following the Quran and the hadith. Its rigour holds a community together through disorder."
 hanbali_scholar_modifier:0 "Hanbali Rite Clergy"
 desc_hanbali_scholar_modifier:0 "We are currently entertaining clergy of the Hanbali Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_hanbali_school:0 "Allows to invite a Cleric of the §YHanbali Rite§! without diplomatic relations."
 maliki_school:0 "Maliki Rite"
 maliki_school_desc:0 "The school of Malik ibn Anas of Medina, which holds the practice of the city of the Prophet as law. It is the school of the Maghreb and al-Andalus."
 maliki_scholar_modifier:0 "Maliki Rite Clergy"
 desc_maliki_scholar_modifier:0 "We are currently entertaining clergy of the Maliki Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_maliki_school:0 "Allows to invite a Cleric of the §YMaliki Rite§! without diplomatic relations."
 shafii_school:0 "Shafi'i Rite"
 shafii_school_desc:0 "The school of al-Shafi'i, who set out the roots of jurisprudence. Its judges are found in the markets of Egypt, the Hejaz and the ports of the Indian Ocean."
 shafii_scholar_modifier:0 "Shafi'i Rite Clergy"
 desc_shafii_scholar_modifier:0 "We are currently entertaining clergy of the Shafi'i Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_shafii_school:0 "Allows to invite a Cleric of the §YShafi'i Rite§! without diplomatic relations."
 ismaili_school:0 "Ismaili Rite"
 ismaili_school_desc:0 "The Sevener branch of the Shia, looking to a hidden knowledge behind the words of the law. Its missionaries work in secret across the Muslim world."
 ismaili_scholar_modifier:0 "Ismaili Rite Clergy"
 desc_ismaili_scholar_modifier:0 "We are currently entertaining clergy of the Ismaili Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_ismaili_school:0 "Allows to invite a Cleric of the §YIsmaili Rite§! without diplomatic relations."
 hafizi_school:0 "Hafizi Rite"
 hafizi_school_desc:0 "A branch of the Ismailis that holds to the primacy of the Fatimid caliph in all things of the faith."
 hafizi_scholar_modifier:0 "Hafizi Rite Clergy"
 desc_hafizi_scholar_modifier:0 "We are currently entertaining clergy of the Hafizi Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_hafizi_school:0 "Allows to invite a Cleric of the §YHafizi Rite§! without diplomatic relations."
 alawite_school:0 "Alawite Rite"
 alawite_school_desc:0 "A secretive Shia sect of the Syrian mountains, with its own mysteries kept from outsiders. Its villages are hard to conquer."
 alawite_scholar_modifier:0 "Alawite Rite Clergy"
 desc_alawite_scholar_modifier:0 "We are currently entertaining clergy of the Alawite Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_alawite_school:0 "Allows to invite a Cleric of the §YAlawite Rite§! without diplomatic relations."
 alevi_school:0 "Alevi Rite"
 alevi_school_desc:0 "A mystical Shia path of Anatolia and the Turkic tribes, close to the Sufis and lax in ritual. Its people are slow to rebel."
 alevi_scholar_modifier:0 "Alevi Rite Clergy"
 desc_alevi_scholar_modifier:0 "We are currently entertaining clergy of the Alevi Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_alevi_school:0 "Allows to invite a Cleric of the §YAlevi Rite§! without diplomatic relations."
 qarmatian_school:0 "Qarmatian Rite"
 qarmatian_school_desc:0 "A radical Ismaili sect that rejects the caliph and holds property in common. Its fighters of Bahrayn have sacked Mecca."
 qarmatian_scholar_modifier:0 "Qarmatian Rite Clergy"
 desc_qarmatian_scholar_modifier:0 "We are currently entertaining clergy of the Qarmatian Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_qarmatian_school:0 "Allows to invite a Cleric of the §YQarmatian Rite§! without diplomatic relations."
 nizari_school:0 "Nizari Rite"
 nizari_school_desc:0 "The Ismaili Nizaris, remembered for their mountain fortresses and their disciplined fida'is. Few armies match their devotion."
 nizari_scholar_modifier:0 "Nizari Rite Clergy"
 desc_nizari_scholar_modifier:0 "We are currently entertaining clergy of the Nizari Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_nizari_school:0 "Allows to invite a Cleric of the §YNizari Rite§! without diplomatic relations."
 zaidi_school:0 "Zaydi Rite"
 zaidi_school_desc:0 "The Fiver branch of the Shia, which holds that any worthy descendant of Ali may lead the community by the sword. It is the faith of Yemen and the Caspian highlands."
 zaidi_scholar_modifier:0 "Zaydi Rite Clergy"
 desc_zaidi_scholar_modifier:0 "We are currently entertaining clergy of the Zaydi Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_zaidi_school:0 "Allows to invite a Cleric of the §YZaydi Rite§! without diplomatic relations."
 jafari_school:0 "Imami Rite"
 jafari_school_desc:0 "The Twelver branch of the Shia, which follows the line of twelve imams and the jurisprudence of Ja'far al-Sadiq. Its scholars live from the favour of no ruler."
 jafari_scholar_modifier:0 "Imami Rite Clergy"
 desc_jafari_scholar_modifier:0 "We are currently entertaining clergy of the Imami Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_jafari_school:0 "Allows to invite a Cleric of the §YImami Rite§! without diplomatic relations."
 ghulat_school:0 "Ghulat Rite"
 ghulat_school_desc:0 "The 'exaggerators', Shia sects that raise Ali or his line to the divine. Their zealots ride to war with total conviction."
 ghulat_scholar_modifier:0 "Ghulat Rite Clergy"
 desc_ghulat_scholar_modifier:0 "We are currently entertaining clergy of the Ghulat Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_ghulat_school:0 "Allows to invite a Cleric of the §YGhulat Rite§! without diplomatic relations."
 ibadi_school:0 "Ibadi Rite"
 ibadi_school_desc:0 "The moderate branch of the Kharijites, found in Oman, the Mzab and the Maghreb. Its imams are chosen by the community and its merchants are known across the sea."
 ibadi_scholar_modifier:0 "Ibadi Rite Clergy"
 desc_ibadi_scholar_modifier:0 "We are currently entertaining clergy of the Ibadi Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_ibadi_school:0 "Allows to invite a Cleric of the §YIbadi Rite§! without diplomatic relations."
 azariqa_school:0 "Azariqa Rite"
 azariqa_school_desc:0 "The most uncompromising of the Kharijites, who hold that all other Muslims are unbelievers. They are feared as holy warriors."
 azariqa_scholar_modifier:0 "Azariqa Rite Clergy"
 desc_azariqa_scholar_modifier:0 "We are currently entertaining clergy of the Azariqa Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_azariqa_school:0 "Allows to invite a Cleric of the §YAzariqa Rite§! without diplomatic relations."
 najdat_school:0 "Najdat Rite"
 najdat_school_desc:0 "The Kharijites of Arabia, who allow dissimulation and accept authority in need. They are a people of the deserts and of numbers."
 najdat_scholar_modifier:0 "Najdat Rite Clergy"
 desc_najdat_scholar_modifier:0 "We are currently entertaining clergy of the Najdat Rite to further the liturgical and theological discussion in our country."
