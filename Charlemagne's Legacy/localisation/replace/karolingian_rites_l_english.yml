 desc_vinaya_scholar_modifier:0 "We are currently entertaining clergy of the Vinaya Rite to further the liturgical and theological discussion in our country."
 allows_every_time_invite_of_vinaya_school:0 "Allows to invite a Cleric of the §YVinaya Rite§! without diplomatic relations."
 theravada_school:0 "Theravada Rite"
