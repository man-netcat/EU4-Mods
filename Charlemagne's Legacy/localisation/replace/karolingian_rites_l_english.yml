l_english:
 roman_rite_school:0 "Roman Rite"
 roman_rite_school_desc:0 "The liturgy of the Church of Rome, spread by the papacy and the Benedictines across the Latin west. Its scholars carry the weight of Peter's see into every court."
 roman_rite_scholar_modifier:0 "Roman Rite Scholars"
 desc_roman_rite_scholar_modifier:0 "We are currently entertaining scholars of the Roman Rite to further the theological discussion in our country."
 allows_every_time_invite_of_roman_rite_school:0 "Allows to invite a Scholar from the §YRoman Rite§! without diplomatic relations."
 carolingian_rite_school:0 "Carolingian Rite"
 carolingian_rite_school_desc:0 "The Frankish church of Reims and Metz, shaped by Charlemagne's reforms: the king as protector of the faith, bishops as servants of the realm, and a liturgy bent to the needs of the crown."
 carolingian_rite_scholar_modifier:0 "Carolingian Rite Scholars"
 desc_carolingian_rite_scholar_modifier:0 "We are currently entertaining scholars of the Carolingian Rite to further the theological discussion in our country."
 allows_every_time_invite_of_carolingian_rite_school:0 "Allows to invite a Scholar from the §YCarolingian Rite§! without diplomatic relations."
 ambrosian_rite_school:0 "Ambrosian Rite"
 ambrosian_rite_school_desc:0 "The rite of Milan, which keeps the chants and customs of Saint Ambrose and bows to Rome only in what it must. The cathedral builders of Lombardy are its pride."
 ambrosian_rite_scholar_modifier:0 "Ambrosian Rite Scholars"
 desc_ambrosian_rite_scholar_modifier:0 "We are currently entertaining scholars of the Ambrosian Rite to further the theological discussion in our country."
 allows_every_time_invite_of_ambrosian_rite_school:0 "Allows to invite a Scholar from the §YAmbrosian Rite§! without diplomatic relations."
 beneventan_rite_school:0 "Beneventan Rite"
 beneventan_rite_school_desc:0 "The old Lombard rite of Benevento and Monte Cassino, with its own script, chant and calendar. Its monks are soldiers of the faith as much as scribes."
 beneventan_rite_scholar_modifier:0 "Beneventan Rite Scholars"
 desc_beneventan_rite_scholar_modifier:0 "We are currently entertaining scholars of the Beneventan Rite to further the theological discussion in our country."
 allows_every_time_invite_of_beneventan_rite_school:0 "Allows to invite a Scholar from the §YBeneventan Rite§! without diplomatic relations."
 mozarabic_rite_school:0 "Mozarabic Rite"
 mozarabic_rite_school_desc:0 "The ancient Visigothic liturgy of Toledo, kept alive by the Christians of al-Andalus under Muslim rule. Its people have learned to prosper among those who do not share their creed."
 mozarabic_rite_scholar_modifier:0 "Mozarabic Rite Scholars"
 desc_mozarabic_rite_scholar_modifier:0 "We are currently entertaining scholars of the Mozarabic Rite to further the theological discussion in our country."
 allows_every_time_invite_of_mozarabic_rite_school:0 "Allows to invite a Scholar from the §YMozarabic Rite§! without diplomatic relations."
 insular_celtic_rite_school:0 "Insular Celtic Rite"
 insular_celtic_rite_school_desc:0 "The church of Ireland, Wales and Scotland, built on monasteries rather than dioceses. Its scholars copy and teach through the dark ages, and carry the faith abroad as peregrini."
 insular_celtic_rite_scholar_modifier:0 "Insular Celtic Rite Scholars"
 desc_insular_celtic_rite_scholar_modifier:0 "We are currently entertaining scholars of the Insular Celtic Rite to further the theological discussion in our country."
 allows_every_time_invite_of_insular_celtic_rite_school:0 "Allows to invite a Scholar from the §YInsular Celtic Rite§! without diplomatic relations."
 byzantine_rite_school:0 "Byzantine Rite"
 byzantine_rite_school_desc:0 "The rite of Constantinople, with its Divine Liturgy of Saint John Chrysostom, imperial ceremonial and the patriarch beside the emperor. Order in worship is order in the state."
 byzantine_rite_scholar_modifier:0 "Byzantine Rite Scholars"
 desc_byzantine_rite_scholar_modifier:0 "We are currently entertaining scholars of the Byzantine Rite to further the theological discussion in our country."
 allows_every_time_invite_of_byzantine_rite_school:0 "Allows to invite a Scholar from the §YByzantine Rite§! without diplomatic relations."
 georgian_rite_school:0 "Georgian Rite"
 georgian_rite_school_desc:0 "The church of Iberia and Kartli, autocephalous in all but name and fiercely loyal to its own saints. It stands as a wall of faith in the Caucasus."
 georgian_rite_scholar_modifier:0 "Georgian Rite Scholars"
 desc_georgian_rite_scholar_modifier:0 "We are currently entertaining scholars of the Georgian Rite to further the theological discussion in our country."
 allows_every_time_invite_of_georgian_rite_school:0 "Allows to invite a Scholar from the §YGeorgian Rite§! without diplomatic relations."
 slavic_rite_school:0 "Slavic Rite"
 slavic_rite_school_desc:0 "The liturgy in Old Church Slavonic, fruit of the mission of Saints Cyril and Methodius. It carries the Gospel to the Slavs in a tongue they understand."
 slavic_rite_scholar_modifier:0 "Slavic Rite Scholars"
 desc_slavic_rite_scholar_modifier:0 "We are currently entertaining scholars of the Slavic Rite to further the theological discussion in our country."
 allows_every_time_invite_of_slavic_rite_school:0 "Allows to invite a Scholar from the §YSlavic Rite§! without diplomatic relations."
 coptic_rite_school:0 "Coptic Rite"
 coptic_rite_school_desc:0 "The church of Alexandria and Egypt, which holds to the miaphysite creed and has endured every conqueror. Its people have long learned patience."
 coptic_rite_scholar_modifier:0 "Coptic Rite Scholars"
 desc_coptic_rite_scholar_modifier:0 "We are currently entertaining scholars of the Coptic Rite to further the theological discussion in our country."
 allows_every_time_invite_of_coptic_rite_school:0 "Allows to invite a Scholar from the §YCoptic Rite§! without diplomatic relations."
 antiochian_rite_school:0 "Antiochian Rite"
 antiochian_rite_school_desc:0 "The rite of the ancient see of Antioch and the Syriac-speaking Christians of the Levant. Its merchants and translators move between the courts of the world."
 antiochian_rite_scholar_modifier:0 "Antiochian Rite Scholars"
 desc_antiochian_rite_scholar_modifier:0 "We are currently entertaining scholars of the Antiochian Rite to further the theological discussion in our country."
 allows_every_time_invite_of_antiochian_rite_school:0 "Allows to invite a Scholar from the §YAntiochian Rite§! without diplomatic relations."
 ethiopian_rite_school:0 "Ethiopian Rite"
 ethiopian_rite_school_desc:0 "The church of Aksum, with its Ge'ez liturgy and ties to Alexandria. In its mountain kingdom it is the faith of the whole people and its armies."
 ethiopian_rite_scholar_modifier:0 "Ethiopian Rite Scholars"
 desc_ethiopian_rite_scholar_modifier:0 "We are currently entertaining scholars of the Ethiopian Rite to further the theological discussion in our country."
 allows_every_time_invite_of_ethiopian_rite_school:0 "Allows to invite a Scholar from the §YEthiopian Rite§! without diplomatic relations."
 armenian_rite_school:0 "Armenian Rite"
 armenian_rite_school_desc:0 "The church of Armenia, the first Christian kingdom, whose merchants hold the roads from Persia to the sea and whose priests hold the nation together."
 armenian_rite_scholar_modifier:0 "Armenian Rite Scholars"
 desc_armenian_rite_scholar_modifier:0 "We are currently entertaining scholars of the Armenian Rite to further the theological discussion in our country."
 allows_every_time_invite_of_armenian_rite_school:0 "Allows to invite a Scholar from the §YArmenian Rite§! without diplomatic relations."
