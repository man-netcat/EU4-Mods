l_english:
 catholic:0 "Chalcedonian"
 romuva:0 "Romuva"
 romuva_desc:0 "The old Baltic faith of Dievas, Perkunas and Gabija, kept beneath the sacred oaks."
 suomenusko:0 "Suomenusko"
 suomenusko_desc:0 "The old Finnish faith of Ukko, Tapio and the spirits of forest and water."
 slavic:0 "Slavic"
 slavic_desc:0 "The faith of Perun and Veles, of the old gods worshipped in groves and on hilltops."
 krstjani:0 "Krstjani"
 krstjani_desc:0 "Long forgotten by Catholic and Orthodox alike, the Krstjani of the Bosnian highlands are more permissive than their better-known compatriots, but lack formal structure."
 khurmazdis:0 "Khurmazdism"
 khurmazdis_desc:0 "The old royal Zoroastrianism of Khwarezm: to Khurmazt, lord of the fire altars of Khiva and Gurganj, worshipped by the Afrigids and their people."
 taltosist:0 "Táltosism"
 taltosist_desc:0 "The old Magyar faith of the táltos, seers who ride between sky and steppe."
 apostolic:0 "Apostolic"
 apostolic_desc:0 "The Armenian Apostolic Church of Etchmiadzin, Miaphysite out of Chalcedon like the Copts, and no part of their communion."
 nestorian:0 "Nestorian"
 nestorian_desc:0 "The Church of the East, severed from the communion of the empire since Ephesus, kept by the Patriarch of Baghdad and carried east along the Silk Road by merchant missionaries."
