l_english:
 catholic:0 "Chalcedonianism"
 romuva:0 "Vidilism"
 romuva_desc:0 "The old Baltic faith of Dievas, Perkunas and Gabija, kept beneath the sacred oaks."
 suomenusko:0 "Ukonusko"
 suomenusko_desc:0 "The old Finnish faith of Ukko, Tapio and the spirits of forest and water."
 slavic:0 "Slovianska Pravda"
 slavic_desc:0 "The faith of Perun and Veles, of the old gods worshipped in groves and on hilltops."
 krstjani:0 "Krstjani"
 krstjani_desc:0 "Long forgotten by Catholic and Orthodox alike, the Krstjani of the Bosnian highlands are more permissive than their better-known compatriots, but lack formal structure."
 khurmazdis:0 "Khurmazdism"
 khurmazdis_desc:0 "The old royal Zoroastrianism of Khwarezm: to Khurmazt, lord of the fire altars of Khiva and Gurganj, worshipped by the Afrigids and their people."
 taltosist:0 "Táltosism"
 taltosist_desc:0 "The old Magyar faith of the táltos, seers who ride between sky and steppe."
 apostolic:0 "Apostolic"
 apostolic_desc:0 "The Armenian Apostolic Church of Etchmiadzin, Miaphysite out of Chalcedon like the Copts, and no part of their communion."
 nestorian:0 "Nestorianism"
 nestorian_desc:0 "The Church of the East, severed from the communion of the empire since Ephesus, kept by the Patriarch of Baghdad and carried east along the Silk Road by merchant missionaries."
 shaivism:0 "Shaivism"
 shaivism_desc:0 "The worship of Shiva, Lord of Yogis and of destruction and renewal, with its ascetics and temples across the subcontinent."
 vaishnavism:0 "Vaishnavism"
 vaishnavism_desc:0 "The worship of Vishnu and his avatars, carried by temple and pilgrimage across the subcontinent."
 achamanism:0 "Achamánism"
 achamanism_desc:0 "The old faith of the Berber and Guanche peoples of the Maghreb and the Atlantic islands, with its holy places and ancestral customs."
 coptic:0 "Coptic"
 coptic_desc:0 "The Coptic faith."
 sunni:0 "Sunni"
 sunni_desc:0 "The Sunni faith."
 shiite:0 "Shia"
 shiite_desc:0 "The Shia faith."
 ibadi:0 "Kharijite"
 ibadi_desc:0 "The Kharijite faith."
 mahayana:0 "Mahayana"
 mahayana_desc:0 "The Mahayana faith."
 buddhism:0 "Theravada"
 buddhism_desc:0 "The Theravada faith."
 vajrayana:0 "Vajrayana"
 vajrayana_desc:0 "The Vajrayana faith."
 confucianism:0 "Confucianism"
 confucianism_desc:0 "The Confucianism faith."
 zoroastrian:0 "Mazdayasna"
 zoroastrian_desc:0 "The Mazdayasna faith."
 norse_pagan_reformed:0 "Ásatrú"
 norse_pagan_reformed_desc:0 "The Ásatrú faith."
 tengri_pagan_reformed:0 "Tengriism"
 tengri_pagan_reformed_desc:0 "The Tengriism faith."
 utaki:0 "Utaki"
 utaki_desc:0 "The faith of the Ryukyu islands and southern Kyushu, with its sacred groves, the utaki, where the noro priestesses commune with the kami."
 shinto:0 "Shintoism"
 shinto_desc:0 "The Shintoism faith."
 kamuyism:0 "Kamuyism"
 kamuyism_desc:0 "The faith of the Ainu and the peoples of Hokkaido and Sakhalin, who honour the kamuy, the spirits dwelling in animals, mountains and tools."
 hantuism:0 "Hantuism"
 hantuism_desc:0 "The faith of the Austronesian peoples of Taiwan, where the hantu, the ancestral spirits, watch over the village and the hunt."
 shamanism:0 "Shamanism"
 shamanism_desc:0 "The Shamanism faith."
