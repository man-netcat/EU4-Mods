l_english:
 afridunism:0 "Afridunism"
 afridunism_desc:0 "The folk religion of the Daylamites and the Caspian shore, which honours the hero Afridun and keeps the old Iranian customs of the forest and the hills."
 akom_pagan:0 "Akom"
 akom_pagan_desc:0 "The Akom of the Akan, in which the okomfo priests commune with the abosom, the lesser gods, under the high god Nyame."
 aluk:0 "Aluk"
 aluk_desc:0 "The Aluk To Dolo of the Toraja highlands, whose ancestral cult, funeral feasts and tongkonan houses bind the living to the dead."
 armenian_apostolic:0 "Apostolic"
 armenian_apostolic_desc:0 "The Armenian Apostolic Church of Etchmiadzin, Miaphysite out of Chalcedon like the Copts, and no part of their communion."
 baltic_pagan:0 "Vidilism"
 baltic_pagan_desc:0 "The old Baltic faith of Dievas, Perkunas and Gabija, kept beneath the sacred oaks."
 bilikuism:0 "Bilikuism"
 bilikuism_desc:0 "The faith of the Nias and Mentawai islanders and the peoples of the Andamans, who keep the ancestral megalithic cults of their villages."
 bimoism:0 "Bimoism"
 bimoism_desc:0 "The faith of the Yi peoples of the south-western mountains, led by their bimo priests, keepers of the ancestral scriptures."
 bon_faith:0 "Bön"
 bon_faith_desc:0 "The old religion of Tibet, older than the Buddha's teaching, whose priests make offerings to the mountain gods and the spirits of the high plateau."
 bosnian_church:0 "Krstjani"
 bosnian_church_desc:0 "Long forgotten by Catholic and Orthodox alike, the Krstjani of the Bosnian highlands are more permissive than their better-known compatriots, but lack formal structure."
 christian_faith:0 "Chalcedonianism"
 christian_faith_desc:0 "The Chalcedonianism faith."
 confucian_faith:0 "Confucianism"
 confucian_faith_desc:0 "The Confucianism faith."
 dab_qhuas:0 "Dab Qhuas"
 dab_qhuas_desc:0 "The faith of the Hmong and the hill peoples of the south, in which the dab, the spirits of house and hill, are honoured."
 dayawism:0 "Dayawism"
 dayawism_desc:0 "The faith of the peoples of the Philippines, who honour the anito, the spirits of ancestors and nature, through the babaylan and the datu."
 finnish_pagan:0 "Ukonusko"
 finnish_pagan_desc:0 "The old Finnish faith of Ukko, Tapio and the spirits of forest and water."
 hantuism:0 "Hantuism"
 hantuism_desc:0 "The faith of the Austronesian peoples of Taiwan, where the hantu, the ancestral spirits, watch over the village and the hunt."
 haymanot:0 "Haymanot"
 haymanot_desc:0 "The Judaism of the Beta Israel of the Ethiopian highlands, kept by their monks and smiths under the mountain kings."
 jain_faith:0 "Jainism"
 jain_faith_desc:0 "The path of the Tirthankaras and of ahimsa, kept by monks and lay merchants in the cities and courts of western and southern India."
 kabarism:0 "Kuzarism"
 kabarism_desc:0 "The Judaism of the Khazar khagans and their court at Itil, carried along the steppe roads by Radhanite merchants."
 kaharingan:0 "Kaharingan"
 kaharingan_desc:0 "The faith of the Dayak peoples of Borneo, who honour Ranying and the spirits of river and forest, and keep the secondary funeral of the tiwah."
 kamuyism_pagan:0 "Kamuyism"
 kamuyism_pagan_desc:0 "The faith of the Ainu and the peoples of Hokkaido and Sakhalin, who honour the kamuy, the spirits dwelling in animals, mountains and tools."
 kharijite:0 "Kharijite"
 kharijite_desc:0 "The Kharijite faith."
 khurmazta:0 "Khurmazdism"
 khurmazta_desc:0 "The old royal Zoroastrianism of Khwarezm: to Khurmazt, lord of the fire altars of Khiva and Gurganj, worshipped by the Afrigids and their people."
 khurramism:0 "Khurramism"
 khurramism_desc:0 "The Khurramites, the joyous, heirs of Mazdak and of Babak, a faith of the hill peoples of Azerbaijan, Gilan and Khorasan who rose against the caliphs."
 kiratism:0 "Kiratism"
 kiratism_desc:0 "The Mundhum of the Kirati peoples of the eastern Himalayan foothills, who honour their ancestors and the spirits of the hills and rivers."
 kushitism_pagan:0 "Kushitism"
 kushitism_pagan_desc:0 "The ancient faith of the Kushite and Beja peoples of the Nile and the Red Sea hills, whose holy places lie at Aswan and Naqis."
 magyar_pagan:0 "Táltosism"
 magyar_pagan_desc:0 "The old Magyar faith of the táltos, seers who ride between sky and steppe."
 mahayana_faith:0 "Mahayana"
 mahayana_faith_desc:0 "The Mahayana faith."
 maitreya_faith:0 "Maitreya"
 maitreya_faith_desc:0 "The hope of the coming Buddha Maitreya, kept by the lay societies of the Chinese plains."
 manichaean_faith:0 "Manichaeism"
 manichaean_faith_desc:0 "The dualist faith of Mani, spread along the Silk Road and kept in the Uyghur lands and the ports of the south."
 mazdakism:0 "Mazdakism"
 mazdakism_desc:0 "The communal creed of Mazdak, who preached the sharing of goods and was put down by Khosrow; his followers still hide in the hills of Khuzestan."
 mazdayasna:0 "Mazdayasna"
 mazdayasna_desc:0 "The Mazdayasna faith."
 melieism:0 "Melie"
 melieism_desc:0 "The ancestral faith of the Qiangic and Tangut peoples of the north-western marches, whose shamans read the stars and keep the rites of their forefathers."
 miaphysitism:0 "Coptic"
 miaphysitism_desc:0 "The Coptic faith."
 moism:0 "Moism"
 moism_desc:0 "The folk faith of the Zhuang and the peoples of the southern hills, led by its mo priests."
 mu:0 "Mu"
 mu_desc:0 "The shamanic faith of Jeju and the Korean peninsula, in which the mudang, the shamans, honour the spirits of mountain, sea and ancestors through the gut."
 nestorian:0 "Nestorianism"
 nestorian_desc:0 "The Church of the East, severed from the communion of the empire since Ephesus, kept by the Patriarch of Baghdad and carried east along the Silk Road by merchant missionaries."
 ngaiism_pagan:0 "Gothaithaya Ngai"
 ngaiism_pagan_desc:0 "The faith of the Kikuyu, Maasai and the peoples of the Kenyan highlands, who pray to Ngai on the slopes of Kirinyaga, the mountain of brightness."
 norse_pagan:0 "Ásatrú"
 norse_pagan_desc:0 "The Ásatrú faith."
 north_african_acham_pagan:0 "Achamánism"
 north_african_acham_pagan_desc:0 "The old faith of the Berber and Guanche peoples of the Maghreb and the Atlantic islands, with its holy places and ancestral customs."
 rabbinic_faith:0 "Rabbinic"
 rabbinic_faith_desc:0 "The Rabbinic faith."
 rrmeaism:0 "Vvluphixje"
 rrmeaism_desc:0 "The mountain faith of the Qiang of the upper Min valley, a religion of the sacred peaks and the white stones kept by their priests."
 satsana_phi:0 "Thep Arak"
 satsana_phi_desc:0 "The spirit faith of the Tai peoples, in which the phi, the spirits of house, field and village, are placated by the elders."
 sedism:0 "Sedism"
 sedism_desc:0 "The faith of the Meitei of Manipur, who honour Sanamahi and the lai, the spirits of the land, at the lairembi shrines."
 shaiva_faith:0 "Shaivism"
 shaiva_faith_desc:0 "The worship of Shiva, Lord of Yogis and of destruction and renewal, with its ascetics and temples across the subcontinent."
 shakta_faith:0 "Shaktism"
 shakta_faith_desc:0 "The worship of the Goddess in her many forms, with its temples and its tantric masters across Bengal, Kashmir and the south."
 shamanism:0 "Shamanism"
 shamanism_desc:0 "The Shamanism faith."
 shangqing_faith:0 "Shangqing"
 shangqing_faith_desc:0 "The Highest Clarity tradition of the Daoists, with its revelations of the immortals and the scripture of the Mao Mountain."
 shia:0 "Shia"
 shia_desc:0 "The Shia faith."
 shinto_faith:0 "Shintoism"
 shinto_faith_desc:0 "The Shintoism faith."
 siberian_pagan:0 "Turumism"
 siberian_pagan_desc:0 "The shamanism of the Komi, Khanty and the peoples of the northern forests, who honour the spirits of the river, the bear and the sacred groves of the Urals."
 slavic_pagan:0 "Slovianska Pravda"
 slavic_pagan_desc:0 "The faith of Perun and Veles, of the old gods worshipped in groves and on hilltops."
 smartism:0 "Smartism"
 smartism_desc:0 "The tradition of the smriti and of Advaita, which honours five deities as aspects of one and is kept by learned Brahmins."
 sunni:0 "Sunni"
 sunni_desc:0 "The Sunni faith."
 tengri_pagan:0 "Tengriism"
 tengri_pagan_desc:0 "The Tengriism faith."
 theravada_faith:0 "Theravada"
 theravada_faith_desc:0 "The Theravada faith."
 tolotang:0 "Tolotang"
 tolotang_desc:0 "The faith of the Bugis and Makassar peoples and the peoples of eastern Indonesia, who revere Dewata Seuwae and the bissu priests."
 utaki:0 "Utaki"
 utaki_desc:0 "The faith of the Ryukyu islands and southern Kyushu, with its sacred groves, the utaki, where the noro priestesses commune with the kami."
 vaishnava_faith:0 "Vaishnavism"
 vaishnava_faith_desc:0 "The worship of Vishnu and his avatars, carried by temple and pilgrimage across the subcontinent."
 vajrayana_faith:0 "Vajrayana"
 vajrayana_faith_desc:0 "The Vajrayana faith."
 waaqism_pagan:0 "Waaqism"
 waaqism_pagan_desc:0 "The faith of the Cushitic peoples of the Horn, who honour Waaq, the sky god, and hold their assemblies under the sacred trees."
 west_african_bidu_pagan:0 "Bidaism"
 west_african_bidu_pagan_desc:0 "The faith of the Soninke and the peoples of the old Wagadu, who keep the cult of Bida, the serpent of the well, for the rains and the gold."
 west_african_bori_pagan:0 "Bori"
 west_african_bori_pagan_desc:0 "The Bori of the Hausa and the peoples of the central Sudan, the possession cult of the iskoki, the spirits that ride their devotees."
 west_african_orisha_pagan:0 "Orisa"
 west_african_orisha_pagan_desc:0 "The faith of the Yoruba, Edo and Fon, who honour Olodumare and the orisa, the divine powers whose shrines and festivals order the life of the towns."
 west_african_pagan:0 "Siguism"
 west_african_pagan_desc:0 "The faith of the Mande peoples, whose smiths and hunters keep the komo and the boli, the powers of the earth and the ancestors."
 west_african_roog_pagan:0 "Roog Sene"
 west_african_roog_pagan_desc:0 "The faith of the Serer, who honour Roog Sene, the creator, and keep the pangool, the ancestral spirits of the saltane priests."
 zhengyi:0 "Zhengyi"
 zhengyi_desc:0 "The Way of Orthodox Unity, descended from the Celestial Masters, whose priests heal the sick and keep the registers of the spirits."
 zun_pagan:0 "Zunism"
 zun_pagan_desc:0 "The sun faith of the Zun, the god-kings of Zabulistan and Sistan, whose temple at Zamindawar and whose idol drew pilgrims from all India."
