l_english:
 shogunate:0 "Sekkan Regency"
 shogunate_desc:0 "The Fujiwara regents, sessho and kampaku, govern in the name of the Emperor, and the great families of the court hold the provinces through their kokushi governors. The regency became the true centre of power in Japan.\n§MA country can take over the Regency, and become the overlord of all Kuni, by taking the province of Kyoto.§!"
 shogunate_legacy:0 "Sekkan Regency"
 daimyo:0 "Kokushi"
 daimyo_desc:0 "A governor appointed by the court to administer a kuni and gather its taxes, increasingly ruling the province as a hereditary domain under the regency.\n§MA country can take over the Regency, and become the overlord of all Kuni, by taking the province of Kyoto.§!"
 daimyo_legacy:0 "Kokushi"
 indep_daimyo:0 "Defiant Kokushi"
 indep_daimyo_desc:0 "A provincial governor who holds his kuni without acknowledging the regency.\n§MA country can take over the Regency, and become the overlord of all Kuni, by taking the province of Kyoto.§!"
 indep_daimyo_legacy:0 "Defiant Kokushi"
 daimyo_vassal_title:0 "Kuni"
 daimyo_vassal_title_plural:0 "Kuni"
 daimyo_vassal_long_desc:0 "A Kuni is a province entrusted to a kokushi governor. It must follow its overlord to war, cannot make certain diplomatic actions and will pay a fraction of its income to its overlord. Kuni can also fight each other."
 daimyo_vassal_is_our:0 "$NAME|Y$ is our Kuni."
 daimyo_subject:0 "Kuni Governor"
 ability_shogunate_mechanic:0 "Sekkan Regency Mechanic"
 shogunate_mechanic_explanation:0 "§MA country can take over the Regency, and become the overlord of all Kuni, by taking the province of Kyoto.§!"
 sword_hunt:0 "Kondei Edict"
 sword_hunt_desc:0 "Within our provinces lie many idle fighters and bands of vagrants who threaten the peace of the realm. We shall issue an edict to muster the kondei, calling in the arms of those who may wish to do us harm."
 sankin_kotai:0 "Choshu Envoys"
 sankin_kotai_desc:0 "We shall oblige our governors to send their choshu envoys to [Root.Capital.GetCapitalName] every year while keeping key members of their households at court. This will place our subjects under diplomatic strains while increasing our own influence."
 expel_ronin:0 "Purge the Furo"
 expel_ronin_desc:0 "The furo are peasants who have fled the registers and wander the provinces, often finding new lives as bandits and vagrants. We shall have the registers audited in the provinces and drive the vagrants back to their lands, buying us favor among the governors."
 overlord_sankin_kotai:0 "Choshu Envoys"
 subject_sankin_kotai:0 "Choshu Envoys"
 overlord_expel_ronin:0 "Purged Vagrants"
 subject_expel_ronin:0 "Vagrants Purged"
 overlord_sword_hunt:0 "Kondei Edict"
 subject_sword_hunt:0 "Kondei Edict"
 shogun_every_daimyo_tt:0 "Every §YKuni§! subject will receive:"
 shogun_every_daimyo_sword_hunt_tt:0 "\nFor §Y10§! years every §YKuni§! subject will receive: \nManpower Recovery Speed: §R-10%§!\n "
 shogun_every_daimyo_sankin_kotai_tt:0 "\nFor §Y10§! years every §YKuni§! subject will receive: \nMonthly Autonomy Change: §R+0.25%§! \n "
 shogun_every_daimyo_expel_ronin_tt:0 "\nFor §Y10§! years every §YKuni§! subject will receive: \nLiberty Desire: §G-5.00%§! \n "
 DUE_TO_X_DAIMYOS:0 "due to its $X|Y$ Kuni.\n"
 EACH_DAIMYO:0 "Each Kuni"
 overlord_daimyo_at_peace:0 "Kuni at peace"
 overlord_daimyo_same_isolationism:0 "Kuni's Isolationism"
 sankin_kotai_modifier:0 "Choshu Envoys"
 cb_daimyo_annex:0 "War for the Emperor"
 cb_daimyo_annex_desc:0 "We should unite Japan under our banner! By conquering the Imperial capital of Kyoto we will place the Emperor under our protection and take over the reins of the Regency."
 cb_independent_daimyo_annex:0 "War for the Emperor"
 cb_independent_daimyo_annex_desc:0 "We should unite Japan under our banner! By conquering the Imperial capital of Kyoto we will place the Emperor under our protection and take over the reins of the Regency."
 cb_shogun_annex:0 "Annex Kuni"
 cb_shogun_annex_desc:0 "They are threatening the regency of Japan!"
 PEACE_BECOME_SHOGUN:0 "§Y$SHOGUN$ will become the new Kampaku of Japan!§!"
 NO_CAPITAL_MOVE_SHOGUN:0 "The Kampaku cannot move his capital."
 DAIMYO_NO_WAR_ON_EMPEROR:0 "As a kokushi you cannot declare war on your emperor."
 SHOGUN_DIPLOMACY:0 "Since you're the Kampaku you will take this action as a representative of §Y$EMPEROR$§! and the action will only influence the relation of §Y$EMPEROR$§!."
