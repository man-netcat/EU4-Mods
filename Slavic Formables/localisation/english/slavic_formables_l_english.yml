l_english:
 SLV:0 "Slovenia"
 SLV_ADJ:0 "Slovenian"
 slovenian_nation_title:0 "Form Slovenia"
 slovenian_nation_desc:0 "The Slovene people have long lived in the shadow of greater powers - Austria, Venice, and Hungary. From the historic Counts of Cilli to the present day, our lands in Carniola, Carinthia, and Gorizia hold a unique cultural identity. The House of Cilli showed that even a small Slovene principality can wield great influence through shrewd diplomacy and political maneuvering. By uniting the Slovene-speaking territories under one banner, we can forge a nation that will preserve our heritage and culture for generations to come."
 
 # National Ideas (from Cilli)
 SLV_ideas:0 "Slovenian Ideas"
 SLV_ideas_start:0 "Slovenian Traditions"
 SLV_ideas_bonus:0 "Slovenian Ambition"
 cli_marry_your_daughters:0 "Dynastic Marriages"
 cli_marry_your_daughters_desc:0 "Our dynasty was able to rise to become a regional force largely through shrewd dynastic marital policy. By following the lessons learnt from our forebears, we will be able to secure further lands for ourselves."
 cli_mercenary_captains:0 "Mercenary Captains"
 cli_mercenary_captains_desc:0 "The lords of Slovenia have often served as mercenary captains for nearby great powers in their wars. Through this experience, they have learnt the art of war and become able generals capable of leading our troops to glory."
 cli_political_manoevring:0 "Political Maneuvering"
 cli_political_manoevring_desc:0 "Our House is no stranger to political intrigues. From the earliest rise of the Counts of Cilli to the influence Ulrich enjoyed over the powerful nations of Austria and Hungary, we have been able to punch above our weight on the regional scene via smart political and diplomatic maneuvering."
 cli_slovenian_reformation:0 "Slovenian Reformation"
 cli_slovenian_reformation_desc:0 "Our lands are fertile territory for new ways of thinking towards the church. If we can avoid the ire of those who cling to old ways, we could establish ourselves as a center of innovative thought in the northern Balkans."
 cli_border_wars:0 "Border Wars"
 cli_border_wars_desc:0 "At the intersection between Austria, Hungary, Venice and the Ottomans, our lands are often a battlefield for competing great powers. In order to protect ourselves from the calamities of war, we have been forced to take extra measures for the defense of our people."
 cli_italian_baroque:0 "Italian Baroque"
 cli_italian_baroque_desc:0 "We are able to attract many Italian and German artists and scientists to our court, contributing to the development of Slovene culture and the splendor of our nation."
 cli_standardised_slovene_language:0 "Standardized Slovenian Language"
 cli_standardised_slovene_language_desc:0 "The vernacular spoken by the peasantry of our lands is distinct from those of our neighbors. By standardizing it, we can encourage the growth of our own culture and build it into a uniting force for our people."

 # Slovakia
 SVK:0 "Slovakia"
 SVK_ADJ:0 "Slovak"
 slovakian_nation_title:0 "Form Slovakia"
 slovakian_nation_desc:0 "The Slovak people have inhabited the Carpathian highlands for centuries, from the days of Great Moravia to Hungarian rule. Our lands are rich in minerals and strategic importance, sitting at the crossroads of Central Europe. Now is the time to unite the Slovak-speaking territories and establish a nation that will protect our unique culture and language."
 
 SVK_ideas:0 "Slovak Ideas"
 SVK_ideas_start:0 "Slovak Traditions"
 SVK_ideas_bonus:0 "Slovak Ambition"
 svk_rudohorie:0 "Ore Mountains"
 svk_rudohorie_desc:0 "The Rudohorie mountains are rich in precious metals and minerals, making them a valuable source of income for our nation."
 svk_universitas_istropolitana:0 "Universitas Istropolitana"
 svk_universitas_istropolitana_desc:0 "Founded in Bratislava, this university was one of the first in Central Europe and a center of learning and culture."
 svk_golden_kremnica:0 "Golden Kremnica"
 svk_golden_kremnica_desc:0 "The mint in Kremnica has been producing high-quality coins for centuries, helping to stabilize our economy."
 svk_land_of_castles:0 "Land of Castles"
 svk_land_of_castles_desc:0 "Slovakia is dotted with numerous castles and fortifications, testament to our turbulent history and strategic importance."
 svk_town_air_liberates:0 "Town Air Liberates"
 svk_town_air_liberates_desc:0 "The old saying 'town air makes you free' holds true in our prosperous urban centers, which attract settlers and soldiers alike."
 svk_literary_language:0 "Literary Language"
 svk_literary_language_desc:0 "The development of a standardized Slovak literary language helps unite our people and reduce internal strife."
 svk_slovak_national_awakening:0 "Slovak National Awakening"
 svk_slovak_national_awakening_desc:0 "A growing sense of Slovak national identity inspires our soldiers to fight with renewed vigor for their homeland."

 # Czechia
 CZE:0 "Czechia"
 CZE_ADJ:0 "Czech"
 czech_nation_title:0 "Form Czechia"
 czech_nation_desc:0 "The Czech lands have a proud history stretching from the Kingdom of Bohemia through the Hussite Wars. Our people have shown resilience and innovation, from the religious reforms of Jan Hus to the Defenestration of Prague. By unifying the Czech-speaking territories under one banner, we can create a nation that embodies our unique identity and protects our religious and cultural freedoms."
 
 CZE_ideas:0 "Czech Ideas"
 CZE_ideas_start:0 "Czech Traditions"
 CZE_ideas_bonus:0 "Czech Ambition"
 cze_compacta_of_prague:0 "Compacta of Prague"
 cze_compacta_of_prague_desc:0 "The Compacta of Prague established religious tolerance between Catholics and Hussites, a landmark achievement in religious freedom."
 cze_elective_monarchy:0 "Elective Monarchy"
 cze_elective_monarchy_desc:0 "The tradition of electing our rulers has given us flexibility and legitimacy in choosing strong leaders."
 cze_wagenburg:0 "Wagenburg Tactics"
 cze_wagenburg_desc:0 "The revolutionary wagon fort tactics developed during the Hussite Wars made our infantry nearly unbeatable in defensive positions."
 cze_letter_of_majesty:0 "Letter of Majesty"
 cze_letter_of_majesty_desc:0 "The Letter of Majesty guaranteed religious freedom to all estates, helping to maintain internal peace."
 cze_hussite_legacy:0 "Hussite Legacy"
 cze_hussite_legacy_desc:0 "The spirit of reform and innovation inspired by Jan Hus continues to drive our intellectual and technological advancement."
 cze_kutnohorian_deal:0 "Kutnohorian Mining Deal"
 cze_kutnohorian_deal_desc:0 "The silver mines of Kutná Hora have brought prosperity and stability to our realm."
 cze_czech_nationalism:0 "Czech Nationalism"
 cze_czech_nationalism_desc:0 "A strong sense of Czech identity makes our advisors more affordable and loyal to the nation."

 # Yugoslavia
 YUG:0 "Yugoslavia"
 YUG_ADJ:0 "Yugoslav"
 yugoslav_nation_title:0 "Form Yugoslavia"
 yugoslav_nation_desc:0 "For too long, the South Slavic peoples have been divided - Serbs, Croats, Slovenes, Bosnians, and Bulgarians, each with their own proud history but separated by borders drawn by foreign powers. From the medieval Serbian Empire to the Kingdom of Croatia, our peoples share common Slavic roots and centuries of shared struggle against foreign domination. By uniting all South Slavs under one banner, we can create a powerful nation that will finally give our peoples the strength and unity they deserve. Together, we shall forge Yugoslavia - the land of the South Slavs."
 
 YUG_ideas:0 "Yugoslav Ideas"
 YUG_ideas_start:0 "Yugoslav Traditions"
 YUG_ideas_bonus:0 "Yugoslav Ambition"
 yug_south_slavic_unity:0 "South Slavic Unity"
 yug_south_slavic_unity_desc:0 "By bringing together the diverse South Slavic peoples under one banner, we can more easily integrate and administer our vast multi-ethnic realm."
 yug_brotherhood_and_unity:0 "Brotherhood and Unity"
 yug_brotherhood_and_unity_desc:0 "Though our peoples speak different languages and follow different faiths, we are united as brothers in our shared Slavic heritage and common destiny."
 yug_balkan_highlanders:0 "Balkan Highlanders"
 yug_balkan_highlanders_desc:0 "Our soldiers are hardened by the rugged Balkan terrain, able to fight effectively in harsh conditions and move swiftly through mountain passes."
 yug_adriatic_ambition:0 "Adriatic Ambition"
 yug_adriatic_ambition_desc:0 "With control of the Adriatic coastline, we can develop prosperous port cities and project naval power into the Mediterranean."
 yug_unified_army:0 "Unified Army"
 yug_unified_army_desc:0 "By combining the military traditions of Serbs, Croats, and other South Slavs, we have created a professional and experienced army."
 yug_central_administration:0 "Central Administration"
 yug_central_administration_desc:0 "Effective governance of our diverse territories requires a strong central administration capable of coordinating policies across regions."
 yug_cultural_heritage:0 "Cultural Heritage"
 yug_cultural_heritage_desc:0 "Our nation represents the culmination of centuries of South Slavic history and culture, from Byzantine mosaics to epic poetry, earning us prestige and legitimacy."

 # Belarus
 BLR:0 "Belarus"
 BLR_ADJ:0 "Belarusian"
 belarusian_nation_title:0 "Form Belarus"
 belarusian_nation_desc:0 "The Principality of Polotsk was once a powerful East Slavic state, controlling vital trade routes between the Baltic and Black seas. Though now overshadowed by Lithuania, Muscovy, and Poland, the Byelorussian people retain their unique identity and culture. The lands of White Ruthenia - from Polotsk to Minsk to Brest - form a distinct region with its own traditions. By uniting these territories, we can forge a nation that will protect the Byelorussian people and restore the glory of ancient Polotsk."
 
 BLR_ideas:0 "Belarusian Ideas"
 BLR_ideas_start:0 "Belarusian Traditions"
 BLR_ideas_bonus:0 "Belarusian Ambition"
 legacy_of_the_werewolf_prince:0 "Legacy of the Werewolf Prince"
 legacy_of_the_werewolf_prince_desc:0 "Prince Vseslav of Polotsk, known as the 'Werewolf Prince,' was famed for his cunning and ability to expand his realm through shrewd claims and strategic conquests."
 heritage_of_the_rus:0 "Heritage of the Rus"
 heritage_of_the_rus_desc:0 "As descendants of the Kievan Rus, we inherit a proud tradition of strong rulership and dynastic legitimacy that commands respect."
 cultural_center:0 "Cultural Center"
 cultural_center_desc:0 "Polotsk has long been a center of Orthodox culture and learning, fostering intellectual development and new ideas."
 land_of_strongholds:0 "Land of Strongholds"
 land_of_strongholds_desc:0 "Our territory is dotted with fortified towns and castles, making it difficult for invaders to conquer our lands."
 trade_hub:0 "Trade Hub"
 trade_hub_desc:0 "Situated between the Baltic and the Black Sea, our lands have always been vital crossroads for trade between East and West."
 diplomatic_initiative:0 "Diplomatic Initiative"
 diplomatic_initiative_desc:0 "Caught between powerful neighbors, we have learned to maintain multiple diplomatic relationships to ensure our survival."
 forest_of_europe:0 "Forest of Europe"
 forest_of_europe_desc:0 "The vast Belarusian forests provide abundant timber and resources, making construction and development more efficient."

 # Illyria
 ILY:0 "Illyria"
 ILY_ADJ:0 "Illyrian"
 illyrian_nation_title:0 "Form Illyria"
 illyrian_nation_desc:0 "The lands along the eastern Adriatic have been home to South Slavic peoples for centuries - Slovenes, Croats, Dalmatians, and Bosnians. Though these peoples share common roots, they have been divided by foreign powers: Austria, Venice, Hungary, and the Ottoman Empire. The ancient name of Illyria evokes a time when these lands were united. By bringing together the South Slavic territories of the Adriatic coast and its hinterlands, we can create a strong regional power that will defend our shared interests and culture against external domination."
 
 ILY_ideas:0 "Illyrian Ideas"
 ILY_ideas_start:0 "Illyrian Traditions"
 ILY_ideas_bonus:0 "Illyrian Ambition"
 hrvatski_ban:0 "The Ban's Authority"
 hrvatski_ban_desc:0 "The office of the Ban has long governed our lands with the support of the nobility, maintaining strong cavalry traditions and aristocratic loyalty."
 pearl_of_the_adriatic:0 "Pearl of the Adriatic"
 pearl_of_the_adriatic_desc:0 "Our ports along the Adriatic coast are vital hubs of Mediterranean trade, allowing us to direct commerce to our benefit."
 granary_of_croatia:0 "Breadbasket of Illyria"
 granary_of_croatia_desc:0 "The fertile plains of Slavonia and Bosnia provide abundant grain harvests that enrich our treasury."
 antemurale_christianitatis:0 "Bulwark of Christendom"
 antemurale_christianitatis_desc:0 "For centuries our people have defended Christian Europe from Ottoman expansion, earning us respect and strengthening our faith."
 the_sabor:0 "The Sabor"
 the_sabor_desc:0 "Our traditional parliament represents the interests of the nobility and helps maintain regional stability, reducing tensions from our expansion."
 croatian_renaissance:0 "Illyrian Renaissance"
 croatian_renaissance_desc:0 "A flourishing of arts and learning along the Adriatic, drawing from both Italian and Slavic traditions, helps modernize our administration."
 pandurs:0 "Pandur Infantry"
 pandurs_desc:0 "These light infantry, drawn from the frontier regions, are renowned for their ferocity and effectiveness in battle."

 # Czechoslovakia
 CZS:0 "Czechoslovakia"
 CZS_ADJ:0 "Czechoslovak"
 czechoslovak_nation_title:0 "Form Czechoslovakia"
 czechoslovak_nation_desc:0 "The Czech and Slovak peoples share deep historical and cultural bonds, from the Great Moravian Empire to centuries of common Habsburg rule. Though the Czechs of Bohemia and Moravia have developed their own distinct identity, and the Slovaks of the Carpathian highlands maintain their unique traditions, our peoples speak closely related languages and share a common Slavic heritage. By uniting the Czech and Slovak lands under one banner, we can create a powerful Central European state that will protect both our peoples and promote our shared interests."
 
 CZS_ideas:0 "Czechoslovak Ideas"
 CZS_ideas_start:0 "Czechoslovak Traditions"
 CZS_ideas_bonus:0 "Czechoslovak Ambition"
 bohemian_castles:0 "Bohemian Castles"
 bohemian_castles_desc:0 "The Czech lands are dotted with numerous well-maintained castles and fortifications, reducing the cost of maintaining our defenses."
 hussite_legacy:0 "Hussite Legacy"
 hussite_legacy_desc:0 "The martial tradition of the Hussite wars lives on, inspiring our troops with revolutionary fervor and discipline."
 defenestrations:0 "Defenestration Tradition"
 defenestrations_desc:0 "Our history of decisive political action through defenestration has taught us to resolve conflicts swiftly and maintain stability."
 czech_industry:0 "Czech Industry"
 czech_industry_desc:0 "The industrial heartland of Bohemia and Moravia produces high-quality manufactured goods for export."
 slovak_mines:0 "Slovak Mining Wealth"
 slovak_mines_desc:0 "The rich mineral deposits of the Slovak mountains provide valuable resources for trade."
 central_european_crossroads:0 "Central European Crossroads"
 central_european_crossroads_desc:0 "Our position at the heart of Central Europe allows us to profit from trade flowing in all directions."
 masaryk_reforms:0 "Progressive Reforms"
 masaryk_reforms_desc:0 "Embracing enlightened governance and democratic reforms helps us modernize our state more efficiently."

 # Bosnia and Herzegovina
 BHZ:0 "Bosnia and Herzegovina"
 BHZ_ADJ:0 "Bosnian"
 bosnia_herzegovina_nation_title:0 "Form Bosnia and Herzegovina"
 bosnia_herzegovina_nation_desc:0 "The lands of Bosnia and Herzegovina have a proud history as independent realms. From the medieval Kingdom of Bosnia under the Kotromanić dynasty to the semi-autonomous Duchy of Herzegovina under the Kosača family, our people have maintained their distinct identity despite pressure from neighbors. The unique religious tolerance of historical Bosnia, where Catholic, Orthodox, and Bogomil believers coexisted, set our lands apart. By uniting Bosnia and Herzegovina once more, we can restore our sovereignty and create a state that honors our pluralistic traditions."
 
 BHZ_ideas:0 "Bosnian Ideas"
 BHZ_ideas_start:0 "Bosnian Traditions"
 BHZ_ideas_bonus:0 "Bosnian Ambition"
 heretic_teachings:0 "Heretical Teachings"
 heretic_teachings_desc:0 "Our position between Orthodox and Catholic spheres has exposed us to many different ideas and teachings, accelerating our technological advancement."
 per_aspera_ad_astra:0 "Per Aspera ad Astra"
 per_aspera_ad_astra_desc:0 "Through hardship to the stars - our rulers have persevered through many trials to maintain our independence."
 empower_bosnian_nobility:0 "Empower the Nobility"
 empower_bosnian_nobility_desc:0 "The great noble families of Bosnia - the Kosača, Hrvatinić, and Pavlović - control vast lands and can provide substantial military forces."
 italian_connections:0 "Italian Connections"
 italian_connections_desc:0 "Our proximity to the Adriatic has given us strong ties to Italian merchants and diplomats, expanding our diplomatic reach."
 land_of_princes:0 "Land of Princes"
 land_of_princes_desc:0 "Bosnia has historically been divided among powerful magnates who ruled as semi-independent princes, making vassalage a natural part of our political structure."
 flexible_diplomacy:0 "Flexible Diplomacy"
 flexible_diplomacy_desc:0 "Squeezed between great powers, we have learned to maintain cordial relations with all sides through skilled diplomacy."
 over_hills_through_woods:0 "Over Hills and Through Woods"
 over_hills_through_woods_desc:0 "Our mountainous terrain is formidable to invaders and our people know how to use it to their advantage in defense."

 # Ukraine rename decision
 UKRAINE_STRING:0 "Ukraine"
 rename_ruthenia_to_ukraine_title:0 "Adopt the Name Ukraine"
 rename_ruthenia_to_ukraine_desc:0 "The term 'Ruthenia' is an old Latin term for our lands, used by foreigners. Our people have long called our homeland 'Ukraina' - the borderland. By officially adopting this native name, we can strengthen our distinct national identity and distance ourselves from the Russian and Polish powers that have sought to control us."
 ukrainian_identity:0 "Ukrainian National Identity"
 ukrainian_identity_desc:0 "We have embraced our identity as Ukrainians, strengthening our sense of nationhood."


