 kar_crown_finland_title:0 "Crown Finland"
 kar_crown_finland:0 "Crown Finland"
 kar_crown_finland_desc:0 "The tribes of Finland and Bothnia answer to no king, only to their own chiefs and elders. Yet one high crown over the lakes and forests would shield the Finns from the tribute-takers pressing in from east and west alike. Let us take the crown and raise Finland among the kingdoms of the world."
 kar_form_finland_title:0 "Form Finland"
 kar_form_finland:0 "Form Finland"
 kar_form_finland_desc:0 "The tribes of Finland and Bothnia answer to no king, only to their own chiefs and elders. Yet one high crown over the lakes and forests would shield the Finns from the tribute-takers pressing in from east and west alike. Let us unite the Finns and raise Finland among the kingdoms of the world."
 kar_form_finland_provinces_tooltip:0 "Is §YHighlighted§! by the Decision."
