 kar_form_pomerania_title:0 "Form Pomerania"
 kar_form_pomerania:0 "Form Pomerania"
 kar_form_pomerania_desc:0 "The tribes between the Oder and the sea have never answered to one duke, and each stronghold keeps its own gods and customs. Yet one crown over the whole coast would end the age of tribute-takers from east and west alike. Let us unite the tribes and raise Pomerania among the kingdoms of the world."
