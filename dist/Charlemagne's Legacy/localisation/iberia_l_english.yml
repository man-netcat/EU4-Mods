l_english:
 kar_leon_1_title:0 "The Crown of León"
 kar_leon_1_desc:0 "Asturias was the refuge; León shall be the kingdom. The old Roman city is ours, and the counts look to Oviedo no longer. Let the lion banner rise over León."
 kar_leon_1_a:0 "Raise the lion banner."
 kar_leon_1_b:0 "Oviedo remains our seat."
 kar_portugal_1_title:0 "The Quinas"
 kar_portugal_1_desc:0 "Porto holds the Douro and Lisboa the Tagus, and no emir or king beyond the mountains has done aught for us. Let the county be a county no longer: Portugal shall have its own crown."
 kar_portugal_1_a:0 "Crown Portugal."
 kar_portugal_1_b:0 "Not yet."
 kar_galicia_1_title:0 "The Partition of Galicia"
 kar_galicia_1_desc:0 "The Galician counts chafe under a distant court, and Hermenegildo's line in Tui remembers older rights. Let Galicia go under its own count and keep its friendship."
 kar_galicia_1_a:0 "Let Galicia go."
 kar_galicia_1_b:0 "Galicia stays with us."
