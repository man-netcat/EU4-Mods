l_english:
 KAROLINGIANS_NAME:0 "Charlemagne's Legacy"
 KAROLINGIANS_DESC:0 "Charlemagne's grandsons hold his empire between them: West, East and Middle Francia, with Bavaria and Italy their own. The Viking ships are coming, the Emirate of Cordoba is young, and in Constantinople a drunken emperor reigns over the Romans. Every realm on this map takes its crown from the year 867.\n\nPlay any of them, or write your own story."

  THE_CALIPHATE_NAME:0 "The Caliphate and the Romans"
  THE_CALIPHATE_DESC:0 "West of the Hindu Kush the old order is cracking: the Abbasid caliph at Baghdad is a prisoner of his own Turkish guard, tribute has stopped flowing from his tributary in Egypt, and the Saffarids are marching out of Sistan with everything ahead of them. Rome stands across the Taurus with an emperor given to drink. Islam's western reaches - the Aghlabids in Africa, the Marwanids on the Jazira frontier - answer to no one's orders but their own.\n\nYear 867, as seen from Baghdad and Constantinople."
  GREAT_TANG_NAME:0 "The Great Tang"
  GREAT_TANG_DESC:0 "In Chang'an the Huangchao upheaval has not yet come: the Tang dynasty still rules as hegemon of the eastern world, though the Khitans stir on its northern marches. Across the sea, Japan is a Fujiwara regency; Silla and Balhae divide Korea between them, old rivals grown comfortable. Trade, faith and court poetry bind these realms together - and ambition will unbind them.\n\nYear 867, as seen from the capitals of the East."
