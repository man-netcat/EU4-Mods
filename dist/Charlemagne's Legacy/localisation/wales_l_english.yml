l_english:
 kar_form_wales_title:0 "Form Wales"
 kar_form_wales:0 "Form Wales"
 kar_form_wales_desc:0 "The petty kings of Gwynedd, Dyfed, Deheubarth and Ceredigion share blood, tongue and enemies across the mountains, yet each calls himself the true heir of the Britons. One crown over the whole west would silence the rival courts for good. Let us unite the kingdoms and wear the dragon of Wales."
