l_english:
 fall_of_tang:0 "The Fall of Tang"
 fall_of_tang_desc:0 "Huang Chao's armies have burned Chang'an, and the military governors of the circuits no longer send their taxes to the throne. The empire of the Tang is breaking into the lands of its warlords."
 fall_of_tang.1.t:0 "The Fall of Tang"
 fall_of_tang.1.d:0 "The rebel armies have broken the cities of the plain, and the governors of the distant circuits rule in their own names. The house of Tang still sits on the throne, but its edicts reach only as far as its soldiers do."
 fall_of_tang.1.a:0 "The mandate is slipping."
 fall_of_tang.2.t:0 "Dai Viet Is Its Own"
 fall_of_tang.2.d:0 "The governors of the Jinghai circuit, the Khuc family of Hongzhou, have stopped sending the southern tribute and no longer ask the throne to confirm them. The Red River country will no longer answer to the north."
 fall_of_tang.2.a:0 "They will not have our land."
 fall_of_tang.3.t:0 "Hexi Passes to Its Lords"
 fall_of_tang.3.d:0 "The Gansu corridor has been held by its own families since the Tibetans were driven out, and with the throne a ruin they will accept no governor from the capital. The oasis cities answer only to their own lords now."
 fall_of_tang.3.a:0 "The west is lost."
 fall_of_tang.4.t:0 "The Sixteen Prefectures"
 fall_of_tang.4.d:0 "A warlord of the north has bought the Khitan's help with the passes of the Yan mountains. The sixteen prefectures, from Youzhou to Yunzhou, now belong to the steppe."
 fall_of_tang.4.a:0 "The north is lost."
 fall_of_tang.5.t:0 "The End of the Tang"
 fall_of_tang.5.d:0 "The age of the warlords is over. Whoever holds the throne now holds it by the strength of his own armies, and the old circuits are in new hands."
 fall_of_tang.5.a:0 "A new age begins."
