l_english:
 kar_form_tibet_title:0 "Form Tibet"
 kar_form_tibet:0 "Form Tibet"
 kar_form_tibet_desc:0 "The roof of the world has long been ruled from many monasteries and many fortresses, each of its valleys keeping its own lord. Yet the Dharma and the high plateau are one, and a single throne above them all would raise Tibet again as the great empire of the snows."
 kar_form_tsang_title:0 "Form Tsang"
 kar_form_tsang:0 "Form Tsang"
 kar_form_tsang_desc:0 "Along the Tsangpo the lords of Xigazê, Sa'gya and Ngamring have long kept their own thrones, each beside its monastery. Yet the valley is one, and a single banner over all of it would raise Tsang again as the kingdom of the west of the plateau."
 kar_form_kham_title:0 "Form Kham"
 kar_form_kham:0 "Form Kham"
 kar_form_kham_desc:0 "The riders of Kham hold the gorges of the great rivers in many small lordships, each proud and quarrelsome. Yet their horses and their courage are known to all, and one throne above the chieftains would make Kham a kingdom to be feared."
 kar_form_amdo_title:0 "Form Amdo"
 kar_form_amdo_desc:0 "Between the Yellow River and the blue lake the herders and the princes of Amdo have lived beside the Chinese marches under many lords. Yet the grass is one country, and a single crown over every pasture would make Amdo a kingdom in its own right."
 kar_form_amdo:0 "Form Amdo"
 kar_form_lhomon_title:0 "Form Lhomon"
 kar_form_lhomon:0 "Form Lhomon"
 kar_form_lhomon_desc:0 "South of the great passes the valleys of Paro, Punakha and Sikkim have long kept their own lords beneath the same Himalayan wall. Yet their gods and their peoples are close kin, and one throne above the valleys would raise Lhomon again as the kingdom of the southern slopes."
 kar_form_maryul_title:0 "Form Maryül"
 kar_form_maryul:0 "Form Maryül"
 kar_form_maryul_desc:0 "Where the Indus and the Shyok run between the high ranges the lords of Baltistan and Ladakh have long kept their own forts and monasteries. Yet the river is one road, and a single crown over its valleys would raise Maryül again as the kingdom of the far west."
 kar_form_gyalrong_title:0 "Form Gyalrong"
 kar_form_gyalrong:0 "Form Gyalrong"
 kar_form_gyalrong_desc:0 "In the steep valleys on the eastern edge of the plateau the lords of Gyalrong have long raised their watchtowers against one another. Yet the valleys share a tongue and a faith, and one king in the towers would make Gyalrong a kingdom that its neighbours must reckon with."
 kar_form_ue_title:0 "Restore Ü"
 kar_form_ue:0 "Restore Ü"
 kar_form_ue_desc:0 "The throne of Ü has fallen empty, and the lords of the plains of Lhasa and Nagqu have no king to follow. Yet the land of Ü remembers its rulers, and one who gathers it again may take up the crown and raise the kingdom anew."
