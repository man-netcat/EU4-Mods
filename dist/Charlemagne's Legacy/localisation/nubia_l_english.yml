 kar_form_nubia_title:0 "Form Nubia"
 kar_form_nubia:0 "Form Nubia"
 kar_form_nubia_desc:0 "From the first cataract to the Blue Nile the Nile valley has long answered to many kings, and each has kept the faith of the Cross in its own manner. Yet one throne in Dongola, with the strength of Soba and Sennar behind it, would raise Nubia again as the great Christian kingdom of the south."
