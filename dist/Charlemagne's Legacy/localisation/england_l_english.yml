l_english:
 kar_form_england_title:0 "Form England"
 kar_form_england:0 "Form England"
 kar_form_england_desc:0 "The Saxon kingdoms have warred against each other since the first keels beached on these shores, and the Danes now carve out kingdoms of their own. One crown over all the English would end the age of petty kings and tribute-takers. Let us unite the Saxons and raise England among the kingdoms of the world."
