l_english:
 kar_form_ireland_title:0 "Form Ireland"
 kar_form_ireland:0 "Form Ireland"
 kar_form_ireland_desc:0 "The tuatha have warred over cattle and hostages since before the songs began, and each petty king calls himself the heir of Tara. Yet one high crown over the whole island would silence the feuds and turn back the raiders from across the sea. Let us take the kingship of Tara and raise Ireland among the kingdoms of the world."
