l_english:
 kar_form_poland_title:0 "Form Poland"
 kar_form_poland:0 "Form Poland"
 kar_form_poland_desc:0 "The tribes of the plain have never marched under one banner, and each duke guards his own groves and strongholds fiercely. Yet one crown over the whole plain would end the age of petty dukes and tribute-takers. Let us unite the tribes and raise Poland among the kingdoms of the world."
