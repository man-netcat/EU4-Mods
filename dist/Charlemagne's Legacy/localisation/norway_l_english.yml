l_english:
 kar_form_norway_title:0 "Form Norway"
 kar_form_norway:0 "Form Norway"
 kar_form_norway_desc:0 "The petty kings of the fjords have warred over Vestfold and Trondheim since the songs began, while Danes press from the south and the sea road calls westward. Yet one crown over the whole long coast would make the North Way a kingdom to be reckoned with. Let us unite the Norwegians and raise Norway among the kingdoms of the world."
