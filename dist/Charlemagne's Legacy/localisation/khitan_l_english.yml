l_english:
 kar_form_khitan_title:0 "Form Khitan"
 kar_form_khitan:0 "Form Khitan"
 kar_form_khitan_desc:0 "The eight tribes of the Khitan have long followed their own khans along the Liao and the Xilamulun. Yet the Yelü clan has a name above the rest, and one banner raised over the grass and the river valleys would make the Khitan a kingdom."
 kar_form_liao_title:0 "Proclaim the Great Liao"
 kar_form_liao:0 "Proclaim the Great Liao"
 kar_form_liao_desc:0 "The Khitan king rules the steppe from his felt tents and the river towns from his walled cities. Let him take a dynastic name, the Great Liao, and sit among the emperors of the earth as their equal."
