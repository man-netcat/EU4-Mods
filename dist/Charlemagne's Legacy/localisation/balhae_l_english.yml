l_english:
 fall_of_balhae:0 "The Fall of Balhae"
 fall_of_balhae_desc:0 "The Khitan armies have taken the Liaodong cities, and the forest tribes of the east no longer fear the crown in the Upper Capital. The great kingdom of the east is breaking into the lands of its tribes."
 fall_of_balhae.1.t:0 "The Fall of Balhae"
 fall_of_balhae.1.d:0 "The Khitan have broken the royal army, and the tribes in the river valleys have begun to look to their own chiefs. The kingdom of Balhae is falling apart, and each tribe will take its own banner."
 fall_of_balhae.1.a:0 "The kingdom is breaking."
 fall_of_balhae.2.t:0 "The Wanyan Rise"
 fall_of_balhae.2.d:0 "The Wanyan clan of the Anchuhu river has gathered the tribes of the upper Sungari under its own chief, and has stopped sending tribute to Balhae. Its chiefs will found a dynasty."
 fall_of_balhae.2.a:0 "They will not have our land."
 fall_of_balhae.3.t:0 "The Jiagu Break Away"
 fall_of_balhae.3.d:0 "The Jiagu tribe, whose valleys lie at the mountain edge, has driven out the Balhae governors and raised its own banner."
 fall_of_balhae.3.a:0 "They will not have our land."
 fall_of_balhae.4.t:0 "The Tangkuo Break Away"
 fall_of_balhae.4.d:0 "The Tangkuo tribe of the lower Tumen has driven out the Balhae governors and raised its own banner."
 fall_of_balhae.4.a:0 "They will not have our land."
 fall_of_balhae.5.t:0 "The Nipanggu Break Away"
 fall_of_balhae.5.d:0 "The Nipanggu tribe of the eastern forests has stopped answering to Balhae and chosen a chief of its own."
 fall_of_balhae.5.a:0 "They will not have our land."
 fall_of_balhae.6.t:0 "The Adian Break Away"
 fall_of_balhae.6.d:0 "The Adian tribe of the Sungari plain has stopped answering to Balhae and chosen a chief of its own."
 fall_of_balhae.6.a:0 "They will not have our land."
 fall_of_balhae.7.t:0 "The Helandian Break Away"
 fall_of_balhae.7.d:0 "The Helandian tribe on the coast has stopped answering to Balhae and chosen a chief of its own."
 fall_of_balhae.7.a:0 "They will not have our land."
 fall_of_balhae.8.t:0 "The Tribes Settle"
 fall_of_balhae.8.d:0 "The age of the Balhae kingdom is over. What remains is the rule of the tribes and of the strongest among them."
 fall_of_balhae.8.a:0 "An age has ended."
