 kar_form_bohemia_title:0 "The Crown of Bohemia"
 kar_form_bohemia:0 "The Crown of Bohemia"
 kar_form_bohemia_desc:0 "The Czech lands stand divided between Bohemia, Moravia, the harvest fields of Silesia and the marches of Lusatia. One crown could bind them all, as the Great Moravian lords once knew. Let Premyslid banners rise over every Czech town and village, and let Bohemia take her place among the kingdoms of the world."
