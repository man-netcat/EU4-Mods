 kar_form_aynumosir_title:0 "Form Aynumosir"
 kar_form_aynumosir:0 "Form Aynumosir"
 kar_form_aynumosir_desc:0 "Each kotan has long guarded its own shore, river and hunting ground, and the mosir has never answered to one voice. Yet the gods of the sea and the mountain are shared by all, and one banner over every kotan would turn the scattered fires of our people into a single hearth."
