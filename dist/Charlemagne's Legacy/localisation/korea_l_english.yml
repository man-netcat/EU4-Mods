 kar_form_korea_title:0 "Unite the Three Han"
 kar_form_korea:0 "Unite the Three Han"
 kar_form_korea_desc:0 "Three kings claim the peninsula, and none has the strength to hold it alone. Yet the old kingdoms were one people before they were three, and whoever raises a single banner from the river of the north to the southern sea may take the name of Goryeo and answer to no rival."
