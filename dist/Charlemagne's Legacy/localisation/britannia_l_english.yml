 kar_form_britannia_title:0 "Form Britannia"
 kar_form_britannia:0 "Form Britannia"
 kar_form_britannia_desc:0 "The isles have never bowed to a single crown, and every petty king from the far north to the southern shores guards his own birthright fiercely. Yet one high crown over all the islanders would end the age of raiders and tribute-takers. Let us unite the isles and raise Britannia among the empires of the world."
 PRYDAIN:0 "Prydain"
