l_english:
 form_ezo_title:0 "Form Ezo"
 form_ezo_desc:0 "It is time that we leave behind our tribal roots and establish a proper nation-state to represent our people on the world stage. By uniting the various clans and tribes of Ezo under a single banner, we can create a stronger, more cohesive society that can better defend our interests and promote our culture. This new nation will be built on the principles of unity, strength, and progress, and will serve as a beacon of hope for all Ezoans."
 EZO:0 "Ezo"
 EZO_ADJ:0 "Ezoan"
 ezo:0 "Ezo"

 EZO_ideas:0 "Ezo Ideas"
 EZO_ideas_bonus:0 "Efficient Shipbuilding"
 EZO_ideas_start:0 "Expanded Infrastructure"
 ezo_civilising_the_northern_tribes:0 "Civilising the Northern Tribes"
 ezo_civilising_the_northern_tribes_desc:0 "Past the Kamchatka Peninsula lie vast, untamed lands inhabited by various nomadic tribes. By establishing colonies and outposts in these regions, we can bring order and civilization to these wild frontiers, expanding our influence and securing valuable resources for our growing nation."
 ezo_syncretic_beliefs:0 "Syncretic Beliefs"
 ezo_syncretic_beliefs_desc:0 "Our people have adopted the Shinto faith of the Japanese, blending it with our traditional animist beliefs. This syncretism has created a unique spiritual identity that resonates deeply with our people, fostering unity and cultural pride."
 ezo_fortified_villages:0 "Fortified Villages"
 ezo_fortified_villages_desc:0 "To protect our settlements from potential threats, we have begun constructing fortified villages. These strongholds will serve as safe havens for our people, providing security and stability in an often unpredictable world."
 ezo_council_republic:0 "Council Republic"
 ezo_council_republic_desc:0 "We have established a council-based system of governance, where representatives from various clans and tribes come together to make decisions for the betterment of our nation. This inclusive approach ensures that all voices are heard and that our government reflects the diverse interests of our people."
 ezo_mariner_heritage:0 "Mariner Heritage"
 ezo_mariner_heritage_desc:0 "Our people have a long-standing tradition of seafaring and exploration. By embracing our mariner heritage, we can enhance our naval capabilities, expand our trade networks, and establish ourselves as a formidable maritime power in the region."
 ezo_fur_trade:0 "Fur Trade"
 ezo_fur_trade_desc:0 "The abundant wildlife of Ezo provides us with valuable furs that are highly sought after in international markets. By developing our fur trade, we can boost our economy and establish lucrative trade relationships with other nations."
 ezo_merchants_guilds:0 "Merchants' Guilds"
 ezo_merchants_guilds_desc:0 "To support our growing economy, we have established merchants' guilds that facilitate trade and commerce. These guilds will help regulate trade practices, protect the interests of our merchants, and promote economic growth throughout our nation."