roc_ideas: "ROC Ideas"
roc_ideas_start: "Republican Traditions"
roc_national_unity: "National Unity"
roc_national_unity_desc: "Policies meant to stabilise the republic in wartime."
roc_modern_army: "Modern Army"
roc_modern_army_desc: "Efforts to modernise the officer corps and armaments."
roc_republican_institutions: "Republican Institutions"
roc_republican_institutions_desc: "Administrative reforms to support a modern state."
roc_international_support: "International Support"
roc_international_support_desc: "Aid and recognition from foreign powers."
roc_civil_reforms: "Civil Reforms"
roc_civil_reforms_desc: "Economic reforms to encourage industry and trade."
roc_coastal_fleet: "Coastal Fleet"
roc_coastal_fleet_desc: "A fleet to protect trade and evacuate civilians if necessary."
roc_resilient_state: "Resilient State"
roc_resilient_state_desc: "Endurance in the face of military setbacks."
roc_republican_spirit: "Republican Spirit"
roc_republican_spirit_desc: "Patriotic fervour bolstering morale and prestige."

# Government reform names
roc_republic_level_1: "ROC Early Reform"
roc_republic_level_1_desc: "An early republican reform adopted by the Republic of China as it consolidates power."

ccp_peasant_republic: "Peasant Republic"
ccp_peasant_republic_desc: "A government built on peasant councils and revolutionary committees, emphasising mass mobilisation."

# Event modifiers used by government reforms
ccp_peasant_republic_modifier: "Peasant Republic (temporary)"
ccp_peasant_republic_modifier_desc: "The revolutionary structures of the peasant republic provide short-term manpower recovery and organisation."

# 'desc_' keys expected by some validators: provide short descriptions matching modifier keys
desc_taiping_revolution: "The Taiping Heavenly Kingdom enforces a radical theocratic order."
desc_ccp_peasant_republic: "A revolutionary peasant-led republic."
desc_roc_democratic_republic: "A republican government based on early democratic reforms."
desc_exiled_to_taiwan: "Temporary exile across the strait; the government retains legitimacy while displaced."

