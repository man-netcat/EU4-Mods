ccp_ideas: "CCP Ideas"
ccp_ideas_start: "Peasant Traditions"
ccp_peasant_councils: "Peasant Councils"
ccp_peasant_councils_desc: "Local councils organise land and labour for the revolution."
ccp_land_reform: "Land Reform"
ccp_land_reform_desc: "Redistribution of land to peasant holdings."
ccp_guerrilla_warfare: "Guerrilla Warfare"
ccp_guerrilla_warfare_desc: "Small-unit tactics and mobilised peasantry."
ccp_workers_committees: "Workers' Committees"
ccp_workers_committees_desc: "Revolutionary committees guide labour organisation."
ccp_revolutionary_practice: "Revolutionary Practice"
ccp_revolutionary_practice_desc: "Experience in revolutionary warfare."
ccp_international_solidarity: "International Solidarity"
ccp_international_solidarity_desc: "Support from foreign revolutionaries and sympathisers."
ccp_red_army: "Red Army"
ccp_red_army_desc: "A reorganised people's army trained in ideological warfare."
ccp_new_society: "Building the New Society"
ccp_new_society_desc: "Reforms to state and society to reflect revolutionary ideals."

