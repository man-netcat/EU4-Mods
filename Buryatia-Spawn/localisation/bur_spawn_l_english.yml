l_english:
 bur_spawn.1.t:0 "Rise of Buryatia"
 bur_spawn.1.d:0 "The Buryat tribes of the Lake Baikal region have long lived as scattered nomadic clans, but the time has come for them to unite under a single banner. A charismatic leader has emerged from among the Borjigin clans, claiming descent from the great Khans of old. With the backing of the Hutukta spiritual leaders, he seeks to forge a new state from the tribes of the steppe."
 bur_spawn.1.a:0 "Let them unite!"
 bur_spawn.1.b:0 "I shall lead them myself!"
