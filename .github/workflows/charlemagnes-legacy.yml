name: Charlemagne's Legacy

on:
  push:
    paths:
      - "Charlemagne's Legacy/**"
      - ".github/workflows/charlemagnes-legacy.yml"
  pull_request:
    paths:
      - "Charlemagne's Legacy/**"
  workflow_dispatch:

# The vanilla files come from the private man-netcat/eu4-ck3-reference repo. Give
# the REFERENCE_REPO_TOKEN secret read access to it (a fine-grained PAT).
env:
  EU4_GAME: ${{ github.workspace }}/eu4-ck3-reference/eu4
  CK3_GAME: ${{ github.workspace }}/eu4-ck3-reference/ck3/game

jobs:
  validate:
    name: Build, validate, and check the committed output is the build output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Charlemagne's Legacy
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: man-netcat/eu4-ck3-reference
          token: ${{ secrets.REFERENCE_REPO_TOKEN }}
          path: eu4-ck3-reference
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Charlemagne's Legacy/tools/requirements.txt"
      - run: pip install -r "Charlemagne's Legacy/tools/requirements.txt"
      - name: Build
        working-directory: Charlemagne's Legacy
        run: python3 tools/build.py
      - name: Validate (must end ALL CHECKS PASSED)
        working-directory: Charlemagne's Legacy
        run: python3 tools/validate.py | tee /tmp/validate.txt; grep -q "ALL CHECKS PASSED" /tmp/validate.txt
      - name: The committed files are what the build writes
        run: |
          git status --porcelain -- "Charlemagne's Legacy" | tee /tmp/dirty.txt
          test ! -s /tmp/dirty.txt || { echo "::error::build output differs from what is committed - run tools/build.py and commit the result"; git diff --stat -- "Charlemagne's Legacy" | tail -20; exit 1; }

  self-contained:
    name: Rebuild from tools/ alone (the script-only rule)
    runs-on: ubuntu-latest
    # Reports until every hand-kept input is lifted; make it required afterwards.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Charlemagne's Legacy
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: man-netcat/eu4-ck3-reference
          token: ${{ secrets.REFERENCE_REPO_TOKEN }}
          path: eu4-ck3-reference
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r "Charlemagne's Legacy/tools/requirements.txt"
      - working-directory: Charlemagne's Legacy
        run: python3 tools/selfcontained.py
