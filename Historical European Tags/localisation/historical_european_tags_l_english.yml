l_english:
  LANDGRAVIATE:0 "Landgraviate"
  LANDGRAVE:0 "Landgrave"
  LANDGRAVINE:0 "Landgravine"
  ABBEY:0 "Abbey"
  ABBOT:0 "Abbot"
  restore_kingdom_of_cilicia_title:0 "Restore the Kingdom of Cilicia"
  restore_kingdom_of_cilicia_desc:0 "The plain of Cilicia lies under our rule, and the Armenians of the fallen kingdom look to our court at Nicosia. Their church remembers the kings of Sis, and their nobles still speak of the Rubenids who raised Cilicia to a throne. We may seat one of our own house upon the throne of Sis, ruling the old kingdom as a junior partner under our crown and drawing the Armenians of the east to our cause."
  restore_kingdom_of_jerusalem_title:0 "Restore the Kingdom of Jerusalem"
  restore_kingdom_of_jerusalem_desc:0 "Jerusalem, Gazzah and Jaffa are in our hands, and the crowns of Christendom once belonged to the house of our kings. We may set that crown upon the head of a junior partner of our line, ruling the Holy Land as a younger branch of the Lusignan house while we remain sovereign of Cyprus."
  reinforce_legend_of_melusine_title:0 "Reinforce the Legend of Melusine"
  reinforce_legend_of_melusine_desc:0 "The old tales say our house descends from Melusine, the serpent-woman of Lusignan. Luxembourg carries that same name and that same blood. With their duchy in our hands, we may restore the bond and seat a kinsman upon the throne, drawing the lands of the west under our dynasty."
  restore_duchy_of_limburg_title:0 "Restore the Duchy of Limburg"
  restore_duchy_of_limburg_desc:0 "The town of Loon has come under our rule, and with it the old seat of the Duchy of Limburg. We may seat a junior partner of our house upon that ducal throne, drawing the lords of the Meuse to our cause and restoring the ancient bond between our lands."
  ludowingian_nation_title:0 "Form Ludowingia"
  ludowingian_nation_desc:0 "The House of Ludowingia, the venerable Landgraves of Thuringia, once ruled a vast domain stretching from the Saale to the Rhine. Through the union of Hesse and Thuringia under the lion banner of the Ludowingians, we can restore our ancestral lands and revive the glory of our dynasty. The Wartburg shall once more be the seat of a great prince, and the lands of Hesse and Thuringia shall be united under one crown — Ludowingia!"
  sxn_saxon_nation_title:0 "Form the Kingdom of Saxony"
  sxn_saxon_nation_desc:0 "The name of Saxony has passed between dynasties and drifted across the Low and Upper Saxon lands for centuries. By uniting the Saxon and Lower Saxon lands under one crown, Saxe-Wittenberg may cast off the ducal title of its old stem duchy and raise itself to the rank of a true kingdom of the Saxons. A prince of the Empire who has grown strong enough, whether an elector or one who has outgrown the Imperial estate, may claim that royal dignity — elevating the Saxon lands to a kingdom both within and beyond the Empire."
  het_dissolve_bishopric_title:0 "Dissolve the Bishoprics"
  het_dissolve_bishopric_desc:0 "In order to end the Livonian Confederacy we must deal with each prince-bishopric. The bishops hold their sees as our vassals. We may end their tenure by force and incorporate their estates into our own lands, though this may stir up disloyalty and revolt."
  het_rig_dissolve_bishopric_title:0 "Command the Dissolution of the Bishoprics"
  het_rig_dissolve_bishopric_desc:0 "The Livonian Order holds the prince-bishoprics as vassals, and the Order is under our command. We may order it to end the bishops' tenure by force and incorporate their estates into its lands, drawing the Livonian church to heel under our crown."
  het_purchase_bishopric_title:0 "Purchase the Bishoprics"
  het_purchase_bishopric_desc:0 "The bishops of Livonia are not the saints they claim to be. Each holds his see as our vassal and is willing to sell his land for gold. We may buy out a bishopric and incorporate its estates into our own lands by purse rather than by force."
  het_rig_purchase_bishopric_title:0 "Command the Purchase of the Bishoprics"
  het_rig_purchase_bishopric_desc:0 "The Livonian Order holds the prince-bishoprics as vassals, and the Order is under our command. We may pay the gold to buy out a bishopric, incorporating its estates into the Order's lands until they pass under our own crown."
  brl_brunswick_luneburg_title:0 "Form Brunswick-Lüneburg"
  brl_brunswick_luneburg_desc:0 "The Duchy of Brunswick-Lüneburg was a historical state of the Holy Roman Empire. Formed from the union of Brunswick and Lüneburg under the Welf dynasty, it became one of the most important states in northern Germany."
  claim_principality_of_orange_title:0 "Claim the Principality of Orange"
  claim_principality_of_orange_desc:0 "The town of Orange lies under our rule, and with it the old seat of the Princes of Orange. That ancient title passed through the marriage of Claudia of Chalon to Henry of Nassau-Breda, and fell to our house when her son, Rene de Chalon, died at the siege of Saint-Dizier without an heir. We may seat a junior partner of our line upon the princely throne of Orange, joining the lion of Nassau to the bugles of Orange and drawing the lords of the Rhone to our cause."
  claim_county_of_nassau_title:0 "Claim the County of Nassau"
  claim_county_of_nassau_desc:0 "The old county of Nassau lies under our rule, the seat of the house from which our Chalon line descends. When Claudia of Chalon wed Henry of Nassau-Breda, the two houses became one blood, and her son Rene carried both names to the grave at Saint-Dizier. We may seat a junior partner of our line upon the Hessian throne of Nassau, joining the bugles of Orange to the lion of Nassau and restoring the bond between our lands."
  restore_principality_of_antioch_title:0 "Restore the Principality of Antioch"
  restore_principality_of_antioch_desc:0 "The old capital of the crusaders lies under our rule, and with it the seat of the Princes of Antioch. That principality fell to the Mamluks in 1268, but its princes live on: our kings are the heirs male of the house of Poitiers-Antioch, descended from Henry of Antioch through Hugh the Great of Cyprus. We may seat a junior partner of our line upon that princely throne, drawing the Franks of the Levant to the banner of the cross and restoring the ancient bond between Cyprus and the coast."
  restore_county_of_tripoli_title:0 "Restore the County of Tripoli"
  restore_county_of_tripoli_desc:0 "The port of Tripoli lies under our rule, the old seat of the Counts of Tripoli. Raymond of Toulouse founded that county on the First Crusade, and it passed in time to the house of Poitiers-Antioch and so to the kings of Cyprus. We may seat a junior partner of our line upon that comital throne, whether as heirs of Toulouse or of the crusader kings, drawing the lords of the coast to our cause and restoring the bond between our lands."
  occitan_nation_title:0 "Form Occitania"
  occitan_nation_desc:0 "From the Garonne to the Rhone, and from the Massif Central to the Mediterranean, one tongue is spoken: the Occitan. The Eagles of Toulouse, the lions of Gascony and the counts of Provence once ruled these lands in turn. He who holds the seats of all three houses may claim the crown of the whole language, uniting the South of France under one banner."
  arles_nation_title:0 "Form the Kingdom of Arles"
  arles_nation_desc:0 "The Arelat was once a crown that united Upper and Lower Burgundy. Its lands ran from Franche-Comté, Savoy, Dauphiné and Provence to the Romandie and the city of Arles itself. The arms that medieval heraldists attributed to the kingdom are a field of Or with two pallets of gules. The crown passed to the Holy Roman Emperors when Conrad II of Franconia claimed it in 1032. We hold the old Burgundian seats. We may raise that crown again and press the kingdom's claims upon the Italian lands it once held."
  restore_margraviate_of_moravia_title:0 "Restore the Margraviate of Moravia"
  restore_margraviate_of_moravia_desc:0 "The town of Brno has come under our rule, and with it the old seat of the Margraviate of Moravia. Our house governed that margraviate for three generations, from John Henry, brother of the Emperor Charles IV, to Jobst, Margrave of Moravia and King of the Romans. We may seat a junior partner of our line upon that margravial throne, drawing the Czech crown lands to our cause and restoring the ancient bond between our lands."
  luxembourg_moravia_nation_title:0 "Form Luxembourg-Moravia"
  luxembourg_moravia_nation_desc:0 "The House of Luxembourg once held two seats: the duchy on the Alzette and the margraviate of Moravia beyond the Bohemian marches. John of Bohemia held both crowns, and Sigismund, the last of our line, wore them together with the diadem of the Romans. The margraviate is bound to our house, and both seats are ours. We may claim the inheritance of the old emperors under one crown — Luxembourg-Moravia!"
  restore_county_of_gorz_title:0 "Restore the County of Görz"
  restore_county_of_gorz_desc:0 "The town of Görz on the Isonzo was the ancestral seat of our house, which once ruled Tirol as well. The counts of Görz were the elder line of the Meinhardiner, and their line held the county until 1500. Now that Görz has come under our rule, we may seat a junior partner of our line upon the comital throne of our fathers and restore the house of Görz and Tirol to both its seats."
  gorz_tirol_nation_title:0 "Form Görz–Tirol"
  gorz_tirol_nation_desc:0 "The Meinhardiner held two seats: the county of Görz on the Adriatic and the princely county of Tirol behind the Brenner. One house ruled from the Isonzo to the Inn, taking tolls from the merchants of the passes and silver from the mines of the mountains. The county of Görz is bound to our house, and both seats are ours. We may raise the ancient banner of the house of Görz and Tirol again."
  restore_county_of_urach_title:0 "Restore the County of Urach"
  restore_county_of_urach_desc:0 "In 1441 the county of Württemberg was divided, with a line of the house seated at Hohenurach and another at Stuttgart. The Treaty of Münsingen of 1482 bound the two halves together again. Urach has come under our rule; we may seat a junior partner of the house at Hohenurach and restore the county in its old form."
  release_duchy_of_normandy_title:0 "Release the Duchy of Normandy"
  release_duchy_of_normandy_desc:0 "The duchy of Normandy lies under our rule, and the Norman lords look to our court at Pamplona. Our house, the Évreux, held the county of Évreux in these lands before we inherited the crown of Navarre. Charles II, our ancestor, held the Cotentin and other Norman territories by right of his mother Joan, daughter of Louis X of France. The old duchy was raised by Rollo the Dane and passed through the Plantagenets and the Valois. We may seat a junior partner of our line upon that ducal throne, restoring the bond between the Pyrenees and the sea."
  navarre_normandy_nation_title:0 "Form Navarre-Normandy"
  navarre_normandy_nation_desc:0 "The House of Évreux held two seats: the kingdom of Navarre in the Pyrenees and the county of Évreux in Normandy. Charles II, our ancestor, held the Cotentin and other Norman territories by right of his mother Joan, daughter of Louis X of France. He pressed his claim to the French throne against the Valois, but the union was never sealed: the Norman lands returned to the French crown and the dynasty died out. We hold the old seats of both houses. We may raise the ancient banner of the house of Évreux again — Navarre-Normandy!"

