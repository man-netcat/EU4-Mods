l_english:
  LANDGRAVIATE:0 "Landgraviate"
  LANDGRAVE:0 "Landgrave"
  LANDGRAVINE:0 "Landgravine"
  ABBEY:0 "Abbey"
  ABBOT:0 "Abbot"
  restore_kingdom_of_cilicia_title:0 "Restore the Kingdom of Cilicia"
  restore_kingdom_of_cilicia_desc:0 "The plain of Cilicia lies under our rule, and the Armenians of the fallen kingdom look to our court at Nicosia. Their church remembers the kings of Sis, and their nobles still speak of the Rubenids who raised Cilicia to a throne. We may seat one of our own house upon the throne of Sis, ruling the old kingdom as a junior partner under our crown and drawing the Armenians of the east to our cause."
  restore_kingdom_of_jerusalem_title:0 "Restore the Kingdom of Jerusalem"
  restore_kingdom_of_jerusalem_desc:0 "Jerusalem, Gazzah and Jaffa are in our hands, and the crowns of Christendom once belonged to the house of our kings. We may set that crown upon the head of a junior partner of our line, ruling the Holy Land as a younger branch of the Lusignan house while we remain sovereign of Cyprus."
  reinforce_legend_of_melusine_title:0 "Reinforce the Legend of Melusine"
  reinforce_legend_of_melusine_desc:0 "The old tales say our house descends from Melusine, the serpent-woman of Lusignan. Luxembourg carries that same name and that same blood. With their duchy in our hands, we may restore the bond and seat a kinsman upon the throne, drawing the lands of the west under our dynasty."
  restore_duchy_of_limburg_title:0 "Restore the Duchy of Limburg"
  restore_duchy_of_limburg_desc:0 "The town of Loon has come under our rule, and with it the old seat of the Duchy of Limburg. We may seat a junior partner of our house upon that ducal throne, drawing the lords of the Meuse to our cause and restoring the ancient bond between our lands."
  ludowingian_nation_title:0 "Form Ludowingia"
  ludowingian_nation_desc:0 "The House of Ludowingia, the venerable Landgraves of Thuringia, once ruled a vast domain stretching from the Saale to the Rhine. Through the union of Hesse and Thuringia under the lion banner of the Ludowingians, we can restore our ancestral lands and revive the glory of our dynasty. The Wartburg shall once more be the seat of a great prince, and the lands of Hesse and Thuringia shall be united under one crown — Ludowingia!"
  sxn_saxon_nation_title:0 "Form the Kingdom of Saxony"
  sxn_saxon_nation_desc:0 "The name of Saxony has passed between dynasties and drifted across the Low and Upper Saxon lands for centuries. By uniting the Saxon and Lower Saxon lands under one crown, Saxe-Wittenberg may cast off the ducal title of its old stem duchy and raise itself to the rank of a true kingdom of the Saxons. A prince of the Empire who has grown strong enough, whether an elector or one who has outgrown the Imperial estate, may claim that royal dignity — elevating the Saxon lands to a kingdom both within and beyond the Empire."
  het_dissolve_bishopric_title:0 "Dissolve the Bishoprics"
  het_dissolve_bishopric_desc:0 "In order to end the Livonian Confederacy we must deal with each prince-bishopric. The bishops hold their sees as our vassals. We may end their tenure by force and incorporate their estates into our own lands, though this may stir up disloyalty and revolt."
  het_rig_dissolve_bishopric_title:0 "Command the Dissolution of the Bishoprics"
  het_rig_dissolve_bishopric_desc:0 "The Livonian Order holds the prince-bishoprics as vassals, and the Order is under our command. We may order it to end the bishops' tenure by force and incorporate their estates into its lands, drawing the Livonian church to heel under our crown."
  het_purchase_bishopric_title:0 "Purchase the Bishoprics"
  het_purchase_bishopric_desc:0 "The bishops of Livonia are not the saints they claim to be. Each holds his see as our vassal and is willing to sell his land for gold. We may buy out a bishopric and incorporate its estates into our own lands by purse rather than by force."
  het_rig_purchase_bishopric_title:0 "Command the Purchase of the Bishoprics"
  het_rig_purchase_bishopric_desc:0 "The Livonian Order holds the prince-bishoprics as vassals, and the Order is under our command. We may pay the gold to buy out a bishopric, incorporating its estates into the Order's lands until they pass under our own crown."
  brl_brunswick_luneburg_title:0 "Form Brunswick-Lüneburg"
  brl_brunswick_luneburg_desc:0 "The Duchy of Brunswick-Lüneburg was a historical state of the Holy Roman Empire. Formed from the union of Brunswick and Lüneburg under the Welf dynasty, it became one of the most important states in northern Germany."
  claim_principality_of_orange_title:0 "Claim the Principality of Orange"
  claim_principality_of_orange_desc:0 "The town of Orange lies under our rule, and with it the old seat of the Princes of Orange. That ancient title passed through the marriage of Claudia of Chalon to Henry of Nassau-Breda, and fell to our house when her son, Rene de Chalon, died at the siege of Saint-Dizier without an heir. We may seat a junior partner of our line upon the princely throne of Orange, joining the lion of Nassau to the bugles of Orange and drawing the lords of the Rhone to our cause."
  claim_county_of_nassau_title:0 "Claim the County of Nassau"
  claim_county_of_nassau_desc:0 "The old county of Nassau lies under our rule, the seat of the house from which our Chalon line descends. When Claudia of Chalon wed Henry of Nassau-Breda, the two houses became one blood, and her son Rene carried both names to the grave at Saint-Dizier. We may seat a junior partner of our line upon the Hessian throne of Nassau, joining the bugles of Orange to the lion of Nassau and restoring the bond between our lands."
