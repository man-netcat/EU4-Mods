  restore_kingdom_of_cilicia_title:0 "Restore the Kingdom of Cilicia"
  restore_kingdom_of_cilicia_desc:0 "The plain of Cilicia lies under our rule, and the Armenians of the fallen kingdom look to our court at Nicosia. Their church remembers the kings of Sis, and their nobles still speak of the Rubenids who raised Cilicia to a throne. We may seat one of our own house upon the throne of Sis, ruling the old kingdom as a junior partner under our crown and drawing the Armenians of the east to our cause."
  restore_kingdom_of_jerusalem_title:0 "Restore the Kingdom of Jerusalem"
  restore_kingdom_of_jerusalem_desc:0 "Jerusalem, Gazzah and Jaffa are in our hands, and the crowns of Christendom once belonged to the house of our kings. We may set that crown upon the head of a junior partner of our line, ruling the Holy Land as a younger branch of the Lusignan house while we remain sovereign of Cyprus."
  reinforce_legend_of_melusine_title:0 "Reinforce the Legend of Melusine"
  reinforce_legend_of_melusine_desc:0 "The old tales say our house descends from Melusine, the serpent-woman of Lusignan. Luxembourg carries that same name and that same blood. With their duchy in our hands, we may restore the bond and seat a kinsman upon the throne, drawing the lands of the west under our dynasty."
  restore_duchy_of_limburg_title:0 "Restore the Duchy of Limburg"
  restore_duchy_of_limburg_desc:0 "The town of Loon has come under our rule, and with it the old seat of the Duchy of Limburg. We may seat a junior partner of our house upon that ducal throne, drawing the lords of the Meuse to our cause and restoring the ancient bond between our lands."
  ludowingian_nation_title:0 "Form Ludowingia"
  ludowingian_nation_desc:0 "The House of Ludowingia, the venerable Landgraves of Thuringia, once ruled a vast domain stretching from the Saale to the Rhine. Through the union of Hesse and Thuringia under the lion banner of the Ludowingians, we can restore our ancestral lands and revive the glory of our dynasty. The Wartburg shall once more be the seat of a great prince, and the lands of Hesse and Thuringia shall be united under one crown — Ludowingia!"
