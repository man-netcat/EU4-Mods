 ork_raven_of_the_north_desc:0 "The raven banners of the Sigurðssons flew from the headlands of Orkney, striking fear into the shores of Scotland and Norway alike. Where the old war-flag still rides the wind, the islanders remember that they come from a people that rowed to the edge of the world."
 ork_sinclair_earls_desc:0 "The house of Sinclair holds the earldom by right of the Roslin claim, and its strong hands have made the isles a single lordship. A loyal Sinclair on the Orkney chair is worth a fleet to any crown that can bind him to its service."
 ork_earls_guard_desc:0 "The Earls of Orkney keep a household guard of picked men from the mæn of the isles, sworn to the chair rather than to any distant king. They stand watch on the castles of Kirkwall and the Scapa shore, ready at the earl's word."
 ork_st_magnus_cathedral_desc:0 "The red sandstone walls of St. Magnus Cathedral rise over Kirkwall, built by the earls to atone for a kinsman's murder and to hold the bones of a saint. Its towers watch the Sound, and its bells carry the service of the isles."
 ork_orkney_ships_desc:0 "The shallow seas between the hundred isles are no place for deep-water galleons, but the earl's pilots know every skerry and sound. In his ships the islands speak with one voice, carrying men and trade where the crown's galleys cannot follow."
 ork_strengthen_the_earldom_desc:0 "The earldom is a string of islands held by custom and castles, not by broad fields of grain. To make it endure, the earl binds the lairds of Orkney and Shetland into one council and one law, so that the islands hang together like the links of a mail shirt."
 ork_islands_under_the_crown_desc:0 "From the Pentland Firth to the Faroes, the isles look to a single seat of power. Loyalty to the crown is the earldom's oldest bargain: the king's peace in return for the earl's ships, and the white cross on azure flying from every mast."

fae_sheep_of_the_isles_desc:0 "The hills of the Faroes are green with the flocks that have grazed them since the first settlers, and the wool of the islands is their surest wealth. Shepherds hold the pastures by ancient right, and the dread of the winter storms keeps the flocks close to the longhouses that shelter both men and sheep."
fae_old_faroese_laws_desc:0 "The Faroes keep the old Norse law of the Thing, where the freeholders of the islands meet on the slopes of Tinganes to judge their own quarrels and choose their own headmen. King's men hold the isles from afar, but the law that binds the islanders is the law they have kept since the days of the settlers."
fae_legacy_of_the_norsemen_desc:0 "The Faroese speak the tongue of the Norse settlers and keep their customs, from the roofless halls of the first farmsteads to the sea-going craft that still carry fishermen beyond the last skerry. The islands are a fragment of the old north, and their men pride themselves on the heritage of the viking ships."
fae_the_islenska_kvefth_desc:0 "The islenska kvæði, the ballads of the western isles, are sung in every longhouse of the Faroes, telling of kings and heroes, of the voyage of the first settlers and the deeds of the old commonwealth. The singers who keep these verses are the memory of the islands, and their songs bind the Faroese to each other and to the north."
fae_faroese_longboats_desc:0 "The Faroese build their longboats for the strong currents of the archipelago, low and narrow, able to run the race between the isles and reach the open sea beyond the reefs. They are the fisherman's skiffs, the trader's coasters, and in the old manner they can be rowed by the whole household, making the islands a small but stubborn naval people."
fae_isles_of_the_west_desc:0 "The Faroes lie on the sea road that runs from Norway to Iceland and on to the islands of the west, and their harbors catch the ships that pass through the swirling currents of the north. By sheltering mariners, taking tolls, and selling provisions, the islanders make the archipelago a stepping-stone of the northern sea."
fae_loyal_to_the_crown_desc:0 "The Faroese hold their islands as subjects of the crown of Norway, and their loyalty has never wavered through storm, famine, and the changing fortunes of the realm. The crown's authority in the isles rests on this faithfulness, turned again and again to the service of the king."

grl_eiriksfjord_settlement_desc:0 "Eiriksfjord is the heart of Greenland, where the Norse settlers raised their farms on the shores of the long fjord and built the cathedral of Gardar from the stone of the headland. The settlement clings to the fjord's edge, a patch of church, field, and pasture on the rim of the ice."
grl_walrus_hunting_desc:0 "The Greenlanders hunt the walrus that hauls out on the skerries, taking ivory, hide, and rope from the great beasts, and their tusks are prized in the markets of the north. The hunting crews range far up the coast, and the ivory that returns with them is the settlement's most certain trade."
grl_greenland_trade_desc:0 "Greenland trades with the wider world by the ships that brave the northern seas, bringing timber, iron, and grain, and taking away ivory, furs, and the wool of the island flocks. The trade is thin and slow, but it is the lifeline of the settlements, and every ship that comes is a cause for feast."
grl_marginal_settlements_desc:0 "The settlements of Greenland cling to the narrow strips of meadow between the ice sheet and the sea, where the growing season is short and the winters long. To keep them alive, the Greenlanders must husband every resource, rotate the pastures, and endure the hardships of the farthest west."
grl_last_of_the_norse_desc:0 "The Norse of Greenland are the last of their kind, the westernmost remnant of the people who once filled the islands of the north. Their bishops, their farmers, and their hunters keep the old ways, and in their isolation they hold to the faith, the tongue, and the customs that their grandfathers brought across the sea."
grl_knarr_sailors_desc:0 "The Greenlanders sail the knarr, the broad-beamed cargo ship of the Norse, which can cross the open sea and carry a settlement's worth of goods. The knarr sailors of the fjords are hardy and skilled, and their ships keep the two settlements, the church, and the trade of the isles bound to the north."
grl_far_outposts_desc:0 "Beyond Eiriksfjord and the western settlement, the Norse keep far-flung outposts, hunting grounds, and summer camps along the coast of the island, from the fishing grounds of the north to the fells of the south. These outposts carry the Norse presence across Greenland, and slowly widen the reach of the settlements."

SLA_ideas:0 "Slavonian Ideas"
SLA_ideas_start:0 "Slavonian Traditions"
SLA_ideas_bonus:0 "Slavonian Ambition"
sla_crown_of_slavonia:0 "The Crown of Slavonia"
sla_crown_of_slavonia_desc:0 "The kings of Hungary also hold the crown of Slavonia, a separate kingdom whose ban rules the plain of the Sava and the Drava in the king's name. We bear that crown as our own, and the estates of the land look to us for the rights they were promised."
sla_sava_and_drava:0 "The Sava and the Drava"
sla_sava_and_drava_desc:0 "The two great rivers define our land: the Drava in the north and the Sava in the south, with the grain lands lying between them. The barges that work these rivers bind our towns to the trade of Buda and the sea beyond."
sla_granary_of_the_crown:0 "Granary of the Crown"
sla_granary_of_the_crown_desc:0 "The plain between the rivers yields harvests that feed much of Hungary, and the lords of Slavonia warehouse the crown's grain at Osijek and Virovitica. So long as our fields prosper, the land stays rich."
sla_slavonian_palatinates:0 "The Slavonian Palatinates"
sla_slavonian_palatinates_desc:0 "The bans and counts of the palatinates hold wide privileges in the king's name, from Varazdin to Vukovar. Their strongholds keep order along the frontier, and their courts give the country its own laws and usages."
sla_marten_of_the_kuna:0 "The Marten of the Kuna"
sla_marten_of_the_kuna_desc:0 "The marten is the badge of our land, whose fur gave the kuna its name in the days when our merchants paid in skins. The trade of the pelts still flows through our fairs, and the marten marks the coin and the banner alike."
sla_defenders_of_the_frontier:0 "Defenders of the Frontier"
sla_defenders_of_the_frontier_desc:0 "Slavonia guards the marches where Christendom meets the Ottoman borderland, and its bands have held the passes time and again. The border warfare gives our captains a sharpness that peacetime armies never learn."
sla_osijek_bridgehead:0 "The Osijek Bridgehead"
sla_osijek_bridgehead_desc:0 "Osijek guards the bridge over the Drava on the road from Hungary into the Balkans, and its walls command the crossing. Whoever masters the bridgehead holds the gate into our land."

  KAK_ideas:0 "Kakhetian Ideas"
  KAK_ideas_start:0 "Kakhetian Traditions"
  KAK_ideas_bonus:0 "Kakhetian Ambition"
  kakheti_cradle_of_wine:0 "The Cradle of Wine"
  kakheti_cradle_of_wine_desc:0 "The valleys of the Alazani and the Iori ripen the vines that have made Kakheti the winepress of the Caucasus. From Telavi to Signagi the terraced slopes yield vintages prized by the courts of Persia and Russia alike, filling our cellars and our treasuries."
  kakheti_light_horse:0 "Light Horse of the Marches"
  kakheti_light_horse_desc:0 "Kakheti's riders are raised to the saddle from boyhood, swift bands who know every defile of the Caucasus from the passes of Dagestan to the bank of the Mtkvari. Their harrying has broken many an invader who dared enter our mountain land."
  kakheti_silken_road:0 "The Silken Roads"
  kakheti_silken_road_desc:0 "Through our valleys run the caravan roads that carry silk and spices between the Caspian and the Black Sea. The merchants of Tiflis, Tabriz and Derbent meet at our fairs, and their tolls fatten the treasuries of our princes."
  kakheti_david_gareja:0 "The Rock-Hewn Monasteries of David Gareja"
  kakheti_david_gareja_desc:0 "In the cliffs of the Gareja ridge the monks of David have hewn churches and cells since the sixth century, keeping the Orthodox faith alive through the ages of invasion. Their prayers hallow our land, and the hermits of the desert count among our holiest and most respected subjects."
  kakheti_bagrationi_legacy:0 "Legacy of the Bagrationi"
  kakheti_bagrationi_legacy_desc:0 "Our princes spring from the Bagrationi, the ancient house that has given Georgia her kings since the days of the first David. The blood of the kings of Kartli runs in our veins, and our claim to the crown of all Georgia is remembered in every court of the Caucasus."
  kakheti_court_of_telavi:0 "The Court of Telavi"
  kakheti_court_of_telavi_desc:0 "Telavi, set upon its hill above the Alazani valley, is the seat of the Kakhetian princes and the heart of the eastern Georgian lands. Its court draws the learned, the merchants and the craftsmen of the region, and from its walls the whole of the valley is governed."
  kakheti_mountain_redoubts:0 "Redoubts of the High Valleys"
  kakheti_mountain_redoubts_desc:0 "Kakheti is a land of steep valleys and high passes, where every village can become a fortress and every shepherd a soldier. When the Qizilbash or the Ottomans press into our mountains, our people melt into the redoubts and strike back from the heights."
