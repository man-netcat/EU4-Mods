l_english:
 ZEA_ideas:0 "Zeelander Ideas"
 ZEA_ideas_start:0 "Zeelander Traditions"
 ZEA_ideas_bonus:0 "Zeelander Ambition"
 zea_the_watergeuzen:0 "The Watergeuzen"
 zea_the_watergeuzen_desc:0 "When the sea ports of Europe were closed to us, our sailors answered with letters of marque. From Flushing and Veere the beggars of the sea fell upon Spanish shipping, and the prizes they carried home paid for guns upon our walls."
 zea_staple_of_middelburg:0 "The Staple of Middelburg"
 zea_staple_of_middelburg_desc:0 "Scottish wool landed at Veere and French wine at Middelburg, and both paid their dues before a single bale moved on. Our charters oblige foreign merchants to offer their goods here first, so that we buy cheap before the world buys at all."
 zea_kamer_zeeland:0 "Kamer Zeeland"
 zea_kamer_zeeland_desc:0 "Amsterdam may hold the largest chamber, but Middelburg sits at the table of the East India Company all the same. Ships fitted out on the Walcheren quays sail east under one charter, and the pepper that returns lines the pockets of Zeeland's burghers."
 zea_dijk_en_polder:0 "Dijk en Polder"
 zea_dijk_en_polder_desc:0 "The sea takes what it will, and we take it back. Every dike thrown across an inlet turns seabed into pasture, and every windmill drained adds another field to our children's inheritance. What the floods drown, Zeeland rebuilds better than before."
 zea_cautionary_towns:0 "The Cautionary Towns"
 zea_cautionary_towns_desc:0 "A small land cannot buy armies, but it can borrow great friends. We have pledged harbors to England and flattered kings in Paris, and every treaty signed in our name reminds Europe that whoever wants the Scheldt must first deal with us."
 zea_oyster_and_herring_fleets:0 "Oysters and Herring"
 zea_oyster_and_herring_fleets_desc:0 "Our boys learn the tides in the oyster beds of the Oosterschelde before their voices break. The herring busses follow the fish from Shetland to the Sound, so when war calls for crews, Zeeland has more able seamen than her population can explain."
 zea_admiralty_of_zeeland:0 "The Admiralty of Zeeland"
 zea_admiralty_of_zeeland_desc:0 "The admiralty seated between Vlissingen and Middelburg has armed and victualled our fleets for two hundred years. It gave the Republic its finest admiral, born a miller's son in Flushing, and it will give us captains who know every sandbank of the delta."
 DOB_ideas:0 "Dobrujan Ideas"
 DOB_ideas_start:0 "Dobrujan Traditions"
 DOB_ideas_bonus:0 "Dobrujan Ambition"
 dob_fleet_of_kaliakra:0 "Fleet of Kaliakra"
 dob_fleet_of_kaliakra_desc:0 "Despot Dobrotitsa based his galleys at Kaliakra and made his little despotate feared on the Euxine. Our captains still know every anchorage from the delta to the Bosphorus approaches, and no raiding flotilla sails these waters unchallenged."
 dob_genuese_factories:0 "Genoese Factories"
 dob_genuese_factories_desc:0 "Genoese merchants keep counting houses at Vicina and Kilia, trading in silk, wax and the furs of the steppe. Their coin fills our harbors and their charts teach our pilots, making Dobruja a crossroads rather than a dead end."
 dob_salt_of_the_lagoons:0 "Salt of the Lagoons"
 dob_salt_of_the_lagoons_desc:0 "The coastal lagoons yield white gold without plough or mine. Salt pans worked since Greek days season the fish and flocks of half the Danube lands, and every cart that leaves our shore carries profit back to the despot's treasury."
 dob_cave_monasteries:0 "Cave Monasteries"
 dob_cave_monasteries_desc:0 "Monks have carved chapels into the limestone cliffs since the first apostles passed this way. Hermits pray in cells above the sea, their sanctity draws pilgrims along the coast, and their blessing settles quarrels that swords cannot."
 dob_walls_of_silistra:0 "Walls of Silistra"
 dob_walls_of_silistra_desc:0 "Durostorum has kept watch on the Danube since Rome raised its first towers. Every generation adds stone to stone, so that Tatar horsemen and Balkan armies alike break against walls that command the great river crossing."
 dob_horses_of_the_steppe:0 "Horses of the Steppe"
 dob_horses_of_the_steppe_desc:0 "The grasslands south of the Danube breed hardy horses and the men who ride them. Our light horse learned scouting and skirmishing from Cuman neighbors and Tatar foes alike, and they ask no richer pasture than thin grass and room to run."
 dob_grain_down_the_danube:0 "Grain Down the Danube"
 dob_grain_down_the_danube_desc:0 "Barges heavy with wheat drift from the Wallachian landings through our waters to the sea. Whoever holds the delta holds the trade of the river, and we mean to hold both."
 FDA_ideas:0 "Fuldan Ideas"
 FDA_ideas_start:0 "Fuldan Traditions"
 FDA_ideas_bonus:0 "Fuldan Ambition"
 fda_tomb_of_boniface:0 "Tomb of Boniface"
 fda_tomb_of_boniface_desc:0 "The apostle of the Germans sleeps beneath our high altar, and Christendom remembers it. Kings send gold for his shrine, pilgrims fill our guesthouses, and every soul that kneels at his tomb owes a little of their devotion to us."
 fda_scriptorium_of_fulda:0 "Scriptorium of Fulda"
 fda_scriptorium_of_fulda_desc:0 "Monks of Fulda copied the classics of Rome when barbarians burned them everywhere else. Our abbey library holds more books than many a kingdom, and learning that survives here will outlive any single war."
 fda_abbatial_guard:0 "Abbatial Guard"
 fda_abbatial_guard_desc:0 "The abbot fields men-at-arms like any prince, sworn to defend church lands with their lives. They fight not for plunder but for the safety of holy ground, which makes them steady where hired blades waver."
 fda_lands_of_the_abbot:0 "Lands of the Abbot"
 fda_lands_of_the_abbot_desc:0 "From the Rhön to the Saale the abbot is lord of manor, mill and market. Tithes flow to the abbey cellars as reliably as the Fulda flows to the Werra, and woe to the steward who lets a village fall idle."
 fda_princes_of_the_empire:0 "Princes of the Empire"
 fda_princes_of_the_empire_desc:0 "Our abbot holds bench and vote among the princes of Germany. A cowl may seem poor armor in the diet, yet a voice there is worth more than a hundred spears, and we have earned ours by centuries of service."
 fda_pilgrim_roads:0 "Pilgrim Roads"
 fda_pilgrim_roads_desc:0 "Every road in Germany sooner or later brings a pilgrim to Fulda. We keep bridges mended, hostels stocked and tolls honest, so that travelers speak well of us in every town they pass through afterward."
 fda_schools_of_rabanus:0 "Schools of Rabanus"
 fda_schools_of_rabanus_desc:0 "Rabanus Maurus taught all Germany its letters from this abbey. We keep his schools open to nobleman's son and burgher's son alike, and the chanceries of Europe are glad to hire men who learned their craft at Fulda."
 FRE_ideas:0 "Freisingian Ideas"
 FRE_ideas_start:0 "Freisingian Traditions"
 FRE_ideas_bonus:0 "Freisingian Ambition"
 fre_evangelist_of_bavaria:0 "Evangelist of Bavaria"
 fre_evangelist_of_bavaria_desc:0 "Saint Corbinian brought the faith to the Bavarians when they still worshipped in groves, and his successors finished what he began. The church bells of Bavaria ring first for Freising, and every soul converted adds to our charge and our glory."
 fre_weihenstephan_brewery:0 "Weihenstephan Brewery"
 fre_weihenstephan_brewery_desc:0 "On the hill above the town the monks have brewed beer longer than any house in Christendom can prove. Travelers swear by it, dukes pay for it, and the hops of our hills turn to silver in the cellar."
 fre_cathedral_hill:0 "Cathedral Hill"
 fre_cathedral_hill_desc:0 "The Domberg rises steep above the Isar marshes, crowned by cathedral, cloister and college. An enemy would have to storm the one road up, and that road is commanded by walls older than most kingdoms."
 fre_lands_between_isar_and_amper:0 "Lands Between Isar and Amper"
 fre_lands_between_isar_and_amper_desc:0 "Between the two rivers lie farms, fisheries and ferry rights that pay the bishopric better than many a duke's domain. We know every field, weir and bridge within them, and we collect accordingly."
 fre_the_freising_gospels:0 "The Freising Gospels"
 fre_the_freising_gospels_desc:0 "In our scriptorium scribes set down words in tongues no roman court has ever heard. Such manuscripts travel with merchants and missionaries, carrying new knowledge into old lands wherever parchment can go."
 fre_prince_bishops:0 "Prince Bishops"
 fre_prince_bishops_desc:0 "Our shepherd wears mitre and sword alike, consecrated by Rome and enfeoffed by the Emperor. Spiritual father to his flock and temporal prince over them, he answers to heaven alone, and the world must negotiate accordingly."
 fre_isar_tolls:0 "Isar Tolls"
 fre_isar_tolls_desc:0 "Salt from Hallein, cloth from Augsburg and wine from the south all pass the Isar on their way down-country. Bridges belong to us, fords belong to us, and everything that crosses them pays before it goes farther."
 GOR_ideas:0 "Gorizian Ideas"
 GOR_ideas_start:0 "Gorizian Traditions"
 GOR_ideas_bonus:0 "Gorizian Ambition"
 gor_counts_of_gorz:0 "Counts of Görz"
 gor_counts_of_gorz_desc:0 "Meinhard's house rose from one castle to rule Tyrol itself, and though provinces were lost, the blood remains. Our envoys sit uninvited at every negotiation worth having, because everyone knows the counts of Görz keep count of favors owed."
 gor_collio_vineyards:0 "Collio Vineyards"
 gor_collio_vineyards_desc:0 "On the terraces between castle and Isonzo grow grapes that make wine fit for patriarchs. Venetian merchants carry it west, Austrian officers carry it north, and both pay as if it were medicine."
 gor_advocates_of_aquileia:0 "Advocates of Aquileia"
 gor_advocates_of_aquileia_desc:0 "By ancient grant the counts are advocates of the patriarchate, sword-arm of the church in these marches. When Rome needs a champion on the upper Adriatic, it need look no further than our banners."
 gor_castles_of_the_frontier:0 "Castles of the Frontier"
 gor_castles_of_the_frontier_desc:0 "Every hilltop between the Julian Alps and the sea carries one of our watchtowers. Built against Lombard, Hungarian and Turk in turn, they let a handful of men hold ground that armies cannot cross unseen."
 gor_between_emperor_and_doge:0 "Between Emperor and Doge"
 gor_between_emperor_and_doge_desc:0 "Empire stands behind us, Venice stands across the Isonzo, and both prefer buying us to breaking us. A small land that knows its price can live well off two rich neighbors, provided neither ever learns it can take us cheaply."
 gor_slovene_valleys:0 "Slovene Valleys"
 gor_slovene_valleys_desc:0 "German lords and Slovene peasants share these valleys, and the counts have always spoken both tongues at table. A subject who hears justice in his own language does not listen to agitators promising him another master."
 gor_inheritance_claims:0 "Inheritance Claims"
 gor_inheritance_claims_desc:0 "Half the charters in the region name a Görz relative somewhere in the succession. We keep the archives dusted, the genealogies current, and the lawyers fed, for paper has won this house more land than war ever did."
 GRN_ideas:0 "Groninger Ideas"
 GRN_ideas_start:0 "Groninger Traditions"
 GRN_ideas_bonus:0 "Groninger Ambition"
 grn_stad_en_lande:0 "Stad en Lande"
 grn_stad_en_lande_desc:0 "City and Ommelanden quarrel endlessly about precedence, taxes and bridges, yet when danger comes from outside they close ranks as one. We keep both proud parties talking in the same council chamber, for divided Groningen falls and united Groningen endures."
 grn_grain_and_peat:0 "Grain and Peat"
 grn_grain_and_peat_desc:0 "Rye from the clay and peat from the moors feed hearths far beyond our borders. Digging and dredging never stop, and every barge that sinks lower under cargo raises our standing higher among the merchant towns."
 grn_martini_tower:0 "Martini Tower"
 grn_martini_tower_desc:0 "The tower of Saint Martin's rises over the market square, tallest thing between Utrecht and the sea. Let every traveler who sees it understand whose city this is, and whose law rules the countryside around it."
 grn_gate_to_the_ems:0 "Gate to the Ems"
 grn_gate_to_the_ems_desc:0 "The river Ems is the door through which East Frisia, Münster and the Westphalian towns reach northern seas. We hold the hinge of that door, and trade being what it is, we have keys cut for those willing to pay."
 grn_frisian_freedom:0 "Frisian Freedom"
 grn_frisian_freedom_desc:0 "No lord has ever ruled true Frisians by force, and the levies of city and countryside remember it. They march behind the banner of Magnus Sanctus as free men, which makes them stubborn beyond their numbers."
 grn_redoubt_of_the_north:0 "Redoubt of the North"
 grn_redoubt_of_the_north_desc:0 "Walls, canals and flooded polders make the city an island fortress whenever needed. Besiegers find the land around too soft to dig and the defenses too hard to storm, and winter does the rest."
 grn_high_school_of_groningen:0 "High School of Groningen"
 grn_high_school_of_groningen_desc:0 "Let the province endow a school where preachers, lawyers and physicians are trained in the north rather than sent abroad. Learning kept at home serves home first, and the fees of foreign students pay for the rest."
 GTN_ideas:0 "Göttingen Ideas"
 GTN_ideas_start:0 "Göttingen Traditions"
 GTN_ideas_bonus:0 "Göttingen Ambition"
 gtn_linen_weavers:0 "Linen Weavers"
 gtn_linen_weavers_desc:0 "Flax from the Leine valley becomes cloth in our looms, and cloth buys more flax. The clatter of the weaving quarter is the sound of the city treasury filling, and no guild forgets it."
 gtn_trading_privileges:0 "Trading Privileges"
 gtn_trading_privileges_desc:0 "Charters won from emperors and dukes give our merchants rights of storage and sale that richer towns envy. Privilege outlasts prosperity, so we guard the parchments as closely as the coin."
 gtn_city_liberties:0 "City Liberties"
 gtn_city_liberties_desc:0 "The council answers to no bishop and tolerates no princely bailiff inside the walls. Freedom so defended becomes habit, and habit becomes the surest foundation a commonwealth can build on."
 gtn_walls_against_the_dukes:0 "Walls Against the Dukes"
 gtn_walls_against_the_dukes_desc:0 "When princes tried to yoke the city, burghers stood on the ramparts and outlasted them. The walls have been raised and deepened ever since, because liberty once tested must be defended forever."
 gtn_university_of_gottingen:0 "University of Göttingen"
 gtn_university_of_gottingen_desc:0 "Endow chairs, raise libraries and invite the learned of Europe to teach where princes cannot silence them. A city famous for professors draws students whose spending outweighs any fair."
 gtn_guild_muskets:0 "Guild Muskets"
 gtn_guild_muskets_desc:0 "Every apprentice drills with his company on feast days, and the guilds pride themselves on turning out armed men faster than the council can ring the bells. Merchants fight best when defending their own shopfronts."
 gtn_leine_valley_fields:0 "Leine Valley Fields"
 gtn_leine_valley_fields_desc:0 "Meadows along the Leine feed the city and the herds that follow its markets. Careful husbandry turns each small holding into more than it was, and the tithe rolls grow without a single new acre."
 HOY_ideas:0 "Hoya Ideas"
 HOY_ideas_start:0 "Hoya Traditions"
 HOY_ideas_bonus:0 "Hoya Ambition"
 hoy_weser_tolls:0 "Weser Tolls"
 hoy_weser_tolls_desc:0 "Every keel bound for Bremen or Minden passes our banks and our counting tables. The counts of Hoya learned long ago that the river works harder than any peasant, and it never asks for harvest weather."
 hoy_grain_and_cattle:0 "Grain and Cattle"
 hoy_grain_and_cattle_desc:0 "Geest rye and marsh meadow cattle fatten better here than anywhere on the middle Weser. Droves going south and grain going north both stop at our markets, where our scale sets the price."
 hoy_counts_upper_and_lower:0 "Counts Upper and Lower"
 hoy_counts_upper_and_lower_desc:0 "Cousins rule Upper and Lower Hoya, sometimes in peace, often otherwise. Keeping the family talking keeps the county whole, and the county whole keeps the neighbors polite."
 hoy_marriage_into_brunswick:0 "Marriage into Brunswick"
 hoy_marriage_into_brunswick_desc:0 "A small house survives by marrying upward and collecting dowries. Each alliance with the Welf lands wraps Hoya in protection no army of our size could buy."
 hoy_hired_spears:0 "Hired Spears"
 hoy_hired_spears_desc:0 "Our levies are few, so the counts hire professionals when war comes near. Coin spent early on good soldiers saves thrice its worth in burned villages, and Hoya has never lacked for coin or sense."
 hoy_nienburg_bastion:0 "Nienburg Bastion"
 hoy_nienburg_bastion_desc:0 "Where the Weser cuts through the moraines stands Nienburg, keeper of the crossing. Its ramparts hold the road that every invading column must use, and its garrison drinks toasts to the tax it levies on them."
 hoy_barges_downriver:0 "Barges Downriver"
 hoy_barges_downriver_desc:0 "What the tolls do not take from passing trade, our own barges earn carrying it. Timber, grain and stone ride the Weser under Hoya flags, and skippers flying other colors pay for the privilege of company."
 JMT_ideas:0 "Jämtlandic Ideas"
 JMT_ideas_start:0 "Jämtlandic Traditions"
 JMT_ideas_bonus:0 "Jämtlandic Ambition"
 jmt_jamtamot_assembly:0 "The Jamtamót"
 jmt_jamtamot_assembly_desc:0 "Each spring the free men of Jämtland gather at the lake island to settle law and choose their lay judges. No king granted this moot and no king shall take it, for a people who judge themselves obey willingly."
 jmt_furs_of_the_fells:0 "Furs of the Fells"
 jmt_furs_of_the_fells_desc:0 "Martin trappers pack sable, beaver and fox down from the highlands every winter. Trondheim's merchants wait for them with salt and iron, and the mountain takes payment in silver from whoever bids highest."
 jmt_passes_to_trondelag:0 "Passes to Trøndelag"
 jmt_passes_to_trondelag_desc:0 "Whoever moves fastest in the mountains owns them. Our hunters cross passes in snow that stops armies, guiding columns and carrying messages where roads fear to go."
 jmt_trapper_settlements:0 "Trapper Settlements"
 jmt_trapper_settlements_desc:0 "A cabin, a snare line and a smoke rack are all a settler needs to make the wilderness pay. From such modest holdings comes a trade that clothes half the north."
 jmt_guardian_of_storsjon:0 "Guardian of Storsjön"
 jmt_guardian_of_storsjon_desc:0 "The great lake keeps its monster and keeps its mysteries, and Jamtlanders tell both tales round every fire. Stories travel with furs to every market in Scandinavia, and men pay attention to people whose lakes hide wonders."
 jmt_partnership_with_sami:0 "Partnership with the Sami"
 jmt_partnership_with_sami_desc:0 "The reindeer-herding Sami know the high country as no farmer ever will. Trade fairs at Persbacken join their trails to our markets, and friendship there is worth more than any fort."
 jmt_cross_of_st_olav:0 "Cross of St Olav"
 jmt_cross_of_st_olav_desc:0 "The eternal cross on Frösön has marked this land Christian for five centuries. Priests trained beside it carry the faith across the fells to huts no bishop's rider could ever reach."
 JUL_ideas:0 "Jülich Ideas"
 JUL_ideas_start:0 "Jülich Traditions"
 JUL_ideas_bonus:0 "Jülich Ambition"
 jul_black_gold:0 "Black Gold"
 jul_black_gold_desc:0 "Beneath our fields lies coal in seams a ploughshare can reach. Peasants dig it from open pits and cart it to every kiln, forge and brewhouse of the lower Rhine, calling the duchy rich who never saw a gold coin change hands."
 jul_wool_weavers:0 "Wool Weavers"
 jul_wool_weavers_desc:0 "Cloth halls in Jülich supply half the Rhineland with good heavy wool. Weaving families pass their looms down like heirlooms, the fulling mills never stand idle, and a Jülich breadth is trusted wherever wool is worn."
 jul_pasqualini_citadel:0 "The Pasqualini Citadel"
 jul_pasqualini_citadel_desc:0 "Master Pasqualini rebuilt our capital as an ideal fortress of the Italian manner: five bastions, casemates cut deep into rock, walls that shrug at cannon. Engineers come from every court to study it, and besiegers come only once."
 jul_succession_claims:0 "Succession Claims"
 jul_succession_claims_desc:0 "When great houses die out, lawyers inherit. Our archives hold marriage contracts older than most dynasties, and each one is a door through which a patient duke may walk into another province."
 jul_lower_rhine_leagues:0 "Leagues of the Lower Rhine"
 jul_lower_rhine_leagues_desc:0 "Between Emperor and France the small states survive by standing together. We keep envoys at Cleves, Berg, Guelders and the Electors besides, so that no league forms without a Jülich voice inside it."
 jul_rhenish_horse:0 "Rhenish Horse"
 jul_rhenish_horse_desc:0 "The broad meadows of the Rur raise cavalrymen as easily as cattle. Our riders hire out to every war along the Rhine and bring home pay, horses and a reputation that keeps neighbors polite."
 jul_imperial_vicars:0 "Imperial Vicars"
 jul_imperial_vicars_desc:0 "When the imperial throne stands empty, certain princes exercise its authority as vicars. We have pressed such claims before and will again, for a duke who has governed the Empire once is never quite an ordinary prince afterward."
 KZN_ideas:0 "Katzenelnbogen Ideas"
 KZN_ideas_start:0 "Katzenelnbogen Traditions"
 KZN_ideas_bonus:0 "Katzenelnbogen Ambition"
 kzn_first_riesling_vines:0 "The First Riesling"
 kzn_first_riesling_vines_desc:0 "In 1435 our stewards bought new vines for the count's cellar at Rüsselsheim, and the wine they bore will one day make the Rhine famous. Every slope plants what Katzenelnbogen pioneered, yet connoisseurs still ask for the county's own pressing."
 kzn_rhine_castle_tolls:0 "Castle Tolls of the Rhine"
 kzn_rhine_castle_tolls_desc:0 "From the Katz to Reichenberg the count's castles watch the shipping lanes of the river. Every cargo that passes lowers a basket at our walls, and the baskets come back full."
 kzn_countly_cellars:0 "The Count's Cellars"
 kzn_countly_cellars_desc:0 "Under Katzenelnbogen castle the barrels sleep in rows, some older than the counts who filled them. A gift of vintage from these cellars opens doors at every court along the river."
 kzn_new_cuttings:0 "New Cuttings"
 kzn_new_cuttings_desc:0 "A vineyard is a long patience, and we are patient people. Each spring we try new slopes, new stocks and new pressings, so that no hillside worth a vine remains unplanted."
 kzn_countless_inheritances:0 "Countless Inheritances"
 kzn_countless_inheritances_desc:0 "Marriage contracts tie this house to half the nobility between Rhine and Werra. When a cousin's line fails, our claim arrives with the mourners, properly witnessed and impossible to refuse politely."
 kzn_tolling_castles:0 "Tolling Castles"
 kzn_tolling_castles_desc:0 "Each castle commands a bend of river where ships must slow, turn or wait. Stone placed well earns more than spearmen ever will, so we build where the water does the work."
 kzn_wine_merchants:0 "Wine Merchants"
 kzn_wine_merchants_desc:0 "Our factors follow the casks downriver to Cologne, upriver to Basel, and overseas wherever ships will float them. They sell not merely wine but the name Katzenelnbogen, and both fetch a fair price."
 SILESIAN_ideas:0 "Silesian Ideas"
 SILESIAN_ideas_start:0 "Silesian Traditions"
 SILESIAN_ideas_bonus:0 "Silesian Ambition"
 LIM_ideas:0 "Limburg Ideas"
 LIM_ideas_start:0 "Limburg Traditions"
 LIM_ideas_bonus:0 "Limburg Ambition"
 lim_limbourg_cloth:0 "Limbourg Cloth"
 lim_limbourg_cloth_desc:0 "Our weavers dress half the Meuse valley, and the fairs of Champagne knew our bales before most maps knew our name. Quality guarded jealously sells itself, leaving us free to mind the tolls."
 lim_meuse_barges:0 "Meuse Barges"
 lim_meuse_barges_desc:0 "Everything that floats between Verdun and the sea passes our stretch of river twice. Barge masters grumble and pay, for the alternative is unloading at Limbourg prices anyway."
 lim_contested_succession:0 "Contested Succession"
 lim_contested_succession_desc:0 "Brabant fought Guelders for our duchy once, and learned what Limburg costs. We play suitors against each other openly, since a duchy everyone wants is a duchy nobody dares swallow."
 lim_ducal_banners:0 "Ducal Banners"
 lim_ducal_banners_desc:0 "Knights of Limburg have ridden under every banner from Jerusalem to Brabant, and their retinues come home hardened. The duchy fields more lances than its size explains, because its lords have always known how to raise them."
 lim_coal_under_the_soil:0 "Coal Under the Soil"
 lim_coal_under_the_soil_desc:0 "Black seams run beneath the orchards here as they do across the Meuse lands. Smiths buy our coal by the muid, and what lies under a Limburger's field is his lord's fortune waiting for a shovel."
 lim_brabantine_ties:0 "Brabantine Ties"
 lim_brabantine_ties_desc:0 "Trade, marriage and law bind us to Brussels closer than any oath. When trouble comes, friends downstream answer faster than allies three kingdoms away, and Leuven's lawyers settle what swords might spoil."
 lim_meuse_castles:0 "Meuse Castles"
 lim_meuse_castles_desc:0 "Cliff and river make this country a chain of natural fortresses. Invaders find every crossing watched and every road commanded, and armies starve in a countryside stripped clean ahead of them."
 MTZ_ideas:0 "Metz Ideas"
 MTZ_ideas_start:0 "Metz Traditions"
 MTZ_ideas_bonus:0 "Metz Ambition"
 mtz_lantern_of_god:0 "Lantern of God"
 mtz_lantern_of_god_desc:0 "The cathedral of Saint Stephen holds more stained glass than any church between Paris and Cologne. Pilgrims call it God's lantern, and pilgrims leave silver where they marvel."
 mtz_graoully_tamed:0 "Graoully Tamed"
 mtz_graoully_tamed_desc:0 "Saint Clement dragged the dragon Graoully from the amphitheater and tamed it with the sign of the cross. The beast's effigy still hangs in the crypt, reminding every faction in the city that even monsters obey Metz in the end."
 mtz_moselle_vineyards:0 "Moselle Vineyards"
 mtz_moselle_vineyards_desc:0 "Steep south-facing slopes give wines the Romans praised and our bishops improved. Vintners plant every terrace a foot can stand on, and the chapter's cellars fund more prayers than tithes do."
 mtz_between_two_crowns:0 "Between Two Crowns"
 mtz_between_two_crowns_desc:0 "France courts us, the Emperor courts us, and we listen graciously to both. A city too useful to conquer gets wooed instead, and wooing pays better than tribute ever did."
 mtz_cathedral_guard:0 "Cathedral Guard"
 mtz_cathedral_guard_desc:0 "The bishop's men-at-arms muster under the shadow of the towers they defend. Fighting for altar and hearth together, burgher and retainer hold ground that hired garrisons abandon."
 mtz_roman_divodurum:0 "Roman Divodurum"
 mtz_roman_divodurum_desc:0 "Grid streets, aqueduct arches and amphitheater stones lie beneath our lanes, left by a city older than France. We build on Roman foundations and dig Roman stone, saving both labor and reverence."
 mtz_bishop_of_the_city:0 "Bishop of the City"
 mtz_bishop_of_the_city_desc:0 "Consecrated shepherd and temporal prince at once, the bishop of Metz answers to heaven for soul and sewer alike. Such double office breeds double diligence, and the city prospers under both crook and key."
 NAM_ideas:0 "Namurian Ideas"
 NAM_ideas_start:0 "Namurian Traditions"
 NAM_ideas_bonus:0 "Namurian Ambition"
 nam_the_citadel:0 "The Citadel of Namur"
 nam_the_citadel_desc:0 "Where Sambre meets Meuse rises the rock of Namur, crowned by a fortress engineers call the finest between Paris and Cologne. Besiegers take it only by starving it, and every siege ends with it rebuilt stronger."
 nam_confluence_tolls:0 "Tolls of the Confluence"
 nam_confluence_tolls_desc:0 "Every barge from Champagne to the Rhineland must thread the meeting of two rivers beneath our guns. We keep the channels dredged and the pilots licensed, and the traffic pays for both."
 nam_dampierre_margraves:0 "The Dampierre Margraves"
 nam_dampierre_margraves_desc:0 "House Dampierre married Flanders and defied France within a single generation. Such boldness runs in the line, and our envoys bargain from strength because their ancestors taught Europe to expect it."
 nam_burgundian_pensioners:0 "Burgundian Pensioners"
 nam_burgundian_pensioners_desc:0 "Sold to Burgundy with our own consent, we learned that gold in hand beats promises on paper. The dukes paid lavishly, honored our liberties, and taught us the worth of being courted rather than conquered."
 nam_meuse_metalworkers:0 "Meuse Metalworkers"
 nam_meuse_metalworkers_desc:0 "Foundries along the river cast bells, cannon and church doors shipped as far as England. The din of the hammermen is our anthem, and every casting bears the margrave's mark at premium price."
 nam_conscripted_bourgeois:0 "Conscripted Burghers"
 nam_conscripted_bourgeois_desc:0 "When the alarm bell rings, every guildsman takes his post on the walls by ancient ordinance. Merchants fight best defending their own warehouses, and Namur's burghers have never yet surrendered a breach."
 nam_title_of_marquis:0 "Title of Marquis"
 nam_title_of_marquis_desc:0 "Ours is one of the few true margravates of the Low Countries, a title earned guarding an imperial frontier. Precedence opens doors that money cannot, and we hold precedence over half our neighbors."
 RAV_ideas:0 "Ravensberg Ideas"
 RAV_ideas_start:0 "Ravensberg Traditions"
 RAV_ideas_bonus:0 "Ravensberg Ambition"
 rav_sparrenberg_castle:0 "Sparrenberg Castle"
 rav_sparrenberg_castle_desc:0 "Sparrenberg crowns the ridge above Bielefeld, seat of the counts since before the county bore its name. Its walls shelter the linen trade below and remind every subject whose peace protects the looms."
 rav_ravensberger_linens:0 "Ravensberger Linens"
 rav_ravensberger_linens_desc:0 "Linen woven here feeds half Germany's shirts and, merchants boast, all of Spain's tables. Households weave through winter while fields sleep, turning idle hands into export silver."
 rav_flax_fields:0 "Flax Fields"
 rav_flax_fields_desc:0 "Every cottage keeps its strip of flax, retted in shared ponds and spun at common firesides. Careful tending of humble fiber yields steadier wealth than any mine."
 rav_bielefeld_market_rights:0 "Market Rights of Bielefeld"
 rav_bielefeld_market_rights_desc:0 "The counts founded Bielefeld and granted its market first choice of the region's cloth. Charter days draw buyers from Münster to Minden, and stall rents fill the castle's coffers."
 rav_heiresses_of_ravensberg:0 "Heiresses of Ravensberg"
 rav_heiresses_of_ravensberg_desc:0 "Twice this county passed through a woman's hand and grew thereby. We choose marriages as carefully as battles, for a well-wed daughter enlarges a house more than a well-fought war."
 rav_teutoburg_militia:0 "Teutoburg Militia"
 rav_teutoburg_militia_desc:0 "From the villages of the Teutoburg Forest come pikemen who remember Hermann's example. They march poorly but stand superbly among their home beech trees, where foreign columns go astray."
 rav_charters_and_privileges:0 "Charters and Privileges"
 rav_charters_and_privileges_desc:0 "Town rights, guild letters and toll exemptions accumulate in our archive like interest. Paper liberty, faithfully renewed, binds subjects closer than fear ever did."
 STG_ideas:0 "St. Gallen Ideas"
 STG_ideas_start:0 "St. Gallen Traditions"
 STG_ideas_bonus:0 "St. Gallen Ambition"
 stg_library_of_st_gall:0 "The Abbey Library"
 stg_library_of_st_gall_desc:0 "Manuscripts from Charlemagne's own century rest in our library, copied by hands long turned to dust. Scholars cross the Alps to read them, and each visiting pen spreads the abbey's name further than any sermon could."
 stg_plan_of_st_gall:0 "The Plan of St Gall"
 stg_plan_of_st_gall_desc:0 "The great plan drawn here shows an ideal monastery down to the henhouse. We build by such measured reason, and our masons raise buildings as sound as the scheme behind them."
 stg_embroidered_linens:0 "Embroidered Linens"
 stg_embroidered_linens_desc:0 "Gold thread on white linen from St Gall dresses altars from Vienna to Santiago de Compostela. Embroidery is our export art, priced like jewelry and shipped like cloth."
 stg_abbot_and_burghers:0 "Abbot and Burghers"
 stg_abbot_and_burghers_desc:0 "Abbot and town quarrel over looms, tolls and souls, yet neither can thrive without the other. Keeping the quarrel in the family protects both parties from the princes waiting beyond the walls."
 stg_appenzell_clients:0 "Appenzell Clients"
 stg_appenzell_clients_desc:0 "Appenzell's herdsmen were our tenants before they were anyone's allies. However proud they grow, their cattle still graze abbey land, and their young men still take the abbey's coin."
 stg_confederate_friends:0 "Friends Among the Confederates"
 stg_confederate_friends_desc:0 "Abbey and city alike keep sworn friendship with the forest cantons. When emperors or dukes press too hard, allies who broke knights at Morgarten are worth more than any charter."
 stg_schools_of_notker:0 "Schools of Notker"
 stg_schools_of_notker_desc:0 "Notker the Stammerer taught music, letters and wit from this cloister. His schools endure, sending choir masters and secretaries into every court willing to pay for learning, which is to say all of them."
 STR_ideas:0 "Straubing Ideas"
 STR_ideas_start:0 "Straubing Traditions"
 STR_ideas_bonus:0 "Straubing Ambition"
 str_memory_of_agnes:0 "Memory of Agnes Bernauer"
 str_memory_of_agnes_desc:0 "A duke once drowned his commoner bride in the Danube, and the town never forgave nor forgot. Pilgrims tend her grave still, and our princes rule mindful that here justice weighs heavier than blood."
 str_danube_barges:0 "Barges of the Danube"
 str_danube_barges_desc:0 "Salt from Passau, wine from the Wachau and cloth from Ulm all ride the current past our wharves. Straubing skippers carry more of it each year, and wharfage fees rise with every keel."
 str_claim_on_holland:0 "Claim on Holland"
 str_claim_on_holland_desc:0 "The dukes of Straubing once ruled Holland, Zeeland and Hainault besides. Maps change, but claims do not rot if kept dry, and ours are kept very dry indeed."
 str_stadturm_of_straubing:0 "The Stadturm"
 str_stadturm_of_straubing_desc:0 "Our watch tower stands taller than any between Regensburg and Passau. From its lantern one spies fire, flood and marching column hours before they arrive, which is often hours more warning than our rivals get."
 str_gaubingen_marksmen:0 "Gäuboden Marksmen"
 str_gaubingen_marksmen_desc:0 "The marksmen's guilds shoot at the bird pole every spring and at the duke's enemies whenever needed. Their crossbows took prizes at Prague, and their arquebuses win battles nearer home."
 str_seligenthal_abbey:0 "Seligenthal Abbey"
 str_seligenthal_abbey_desc:0 "Duke Ludwig founded the Cistercians of Seligenthal to pray for his house forever. The monks school noble daughters, copy charters and bury dukes, binding church and dynasty into one household."
 str_hop_gardens:0 "Hop Gardens"
 str_hop_gardens_desc:0 "Hops from our hinterland season beer from Munich to Hamburg. Brewers contract years ahead, and a good harvest pays better than a good vintage anywhere south of the river."
 TSR_ideas:0 "Triestine Ideas"
 TSR_ideas_start:0 "Triestine Traditions"
 TSR_ideas_bonus:0 "Triestine Ambition"
 tsr_charter_of_free_port:0 "Charter of the Free Port"
 tsr_charter_of_free_port_desc:0 "Emperor Charles declared Trieste free of import duties, and merchants flooded in before the ink dried. A port where nothing is taxed grows rich on everything that moves."
 tsr_adriatic_rivalry:0 "Adriatic Rivalry"
 tsr_adriatic_rivalry_desc:0 "Venice calls this gulf its own; our galleys answer otherwise. Competition from a Habsburg harbor disciplines Venetian freight rates, and every ship they lose to us is profit found."
 tsr_karst_shipwrights:0 "Karst Shipwrights"
 tsr_karst_shipwrights_desc:0 "Oak and larch come down from the Karst plateau straight into our yards. Ships built here cost less and launch sooner than anything fitted out across the gulf."
 tsr_illyrian_sailors:0 "Illyrian Sailors"
 tsr_illyrian_sailors_desc:0 "Hard men from Illyrian coasts crew our ships at home in any water from Corfu to Comacchio. Their tongues, their saints and their sea-law all dock at Trieste, and the city grows richer for every one."
 tsr_favor_of_charles_vi:0 "Favor of Charles VI"
 tsr_favor_of_charles_vi_desc:0 "The Emperor deepened our harbor, confirmed our freedoms and used our fleet as his own. Court favor is cargo too, and we know exactly which warehouse stores it."
 tsr_tergeste_heritage:0 "Heritage of Tergeste"
 tsr_tergeste_heritage_desc:0 "Rome's Tergeste left walls, temples and legal memory beneath our streets. A city two thousand years old does not panic easily, and neither do its bankers."
 tsr_levant_windfall:0 "Windfall of the Levant"
 tsr_levant_windfall_desc:0 "When Venice closed its harbors to interlopers, Levant trade went looking for another door. Ours stood open, and spices, silks and dyes have been pouring through ever since."
 URW_ideas:0 "Urach Ideas"
 URW_ideas_start:0 "Urach Traditions"
 URW_ideas_bonus:0 "Urach Ambition"
 urw_partition_of_1442:0 "Partition of 1442"
 urw_partition_of_1442_desc:0 "Treaty divided Württemberg between Stuttgart and ourselves, and both halves learned to govern carefully. Ruling one half of something famous teaches patience, bookkeeping and the value of every charter."
 urw_palace_at_urach:0 "Palace at Urach"
 urw_palace_at_urach_desc:0 "Our residence glows like warm honey above the market square, built to show that Urach's court lacks nothing but size. Ambassadors who sleep well here sign treaties kindly."
 urw_tubingen_compromise:0 "Compromise of Tübingen"
 urw_tubingen_compromise_desc:0 "When cousins quarreled, it was at Tübingen that they learned to stop. We have made mediation a house specialty, settling disputes so fairly that both sides leave as clients."
 urw_jura_wool:0 "Jura Wool"
 urw_jura_wool_desc:0 "Sheep on the Jura highlands grow fleece fine enough for cloth merchants to send agents up the Alb itself. Shearing season empties the ducal scales of coin and fills them again by Michaelmas."
 urw_waterfalls_and_quarries:0 "Waterfalls and Quarries"
 urw_waterfalls_and_quarries_desc:0 "Falling water drives our mills, and the Jura yields limestone that builds half Swabia. Where nature works for nothing, everything we raise costs less than anywhere else."
 urw_counts_of_wurttemberg:0 "Counts of Württemberg"
 urw_counts_of_wurttemberg_desc:0 "Ours is among the oldest houses of Swabia, older by far than the honors it now holds. Ancient name and clean record open every diet, marriage market and battlefield negotiation in the Empire."
 urw_reunified_duchy:0 "Reunified Duchy"
 urw_reunified_duchy_desc:0 "The Münsingen treaty joined the two halves under one hand without a sword drawn. What was rejoined by paper stays joined better than anything won by war, for no one dreams of revenge."
 VDN_ideas:0 "Verdunois Ideas"
 VDN_ideas_start:0 "Verdunois Traditions"
 VDN_ideas_bonus:0 "Verdunois Ambition"
 vdn_seat_of_a_bishop:0 "Seat of a Bishop"
 vdn_seat_of_a_bishop_desc:0 "Our bishop counts among the ancient princes of Gaul, shepherd before he is lord. The crozier governs what the sword merely holds, and souls under care obey more faithfully than subjects under fear."
 vdn_rebuilt_from_attilas_ashes:0 "Rebuilt from Attila's Ashes"
 vdn_rebuilt_from_attilas_ashes_desc:0 "The scourge of God burned this city, and it rose from his ashes with a bishop's blessing. A people twice founded do not frighten easily, and their reputation for endurance opens doors that force never could."
 vdn_meuse_fairs:0 "Meuse Fairs"
 vdn_meuse_fairs_desc:0 "Merchants of Champagne and Flanders meet halfway at our fairs, where river tolls are low and justice swift. Coin changes hands so often at Verdun that some of it always sticks."
 vdn_between_two_realms:0 "Between Two Realms"
 vdn_between_two_realms_desc:0 "King of France and Emperor both find us too useful to crush. Playing the courteous neighbor to each keeps the bishopric standing long after prouder states have been carved up."
 vdn_romanesque_cathedral:0 "Romanesque Cathedral"
 vdn_romanesque_cathedral_desc:0 "Notre-Dame rises square-towered and sure, stone laid by masons whose names we keep. Building once, building well, saves coin for a century afterward."
 vdn_marches_of_bar:0 "Marches of Bar"
 vdn_marches_of_bar_desc:0 "Along the marches toward Bar our castles watch every road into the Meuse valley. Kept garrisoned and stocked, they turn any invasion into an expensive siege timetable."
 vdn_orchards_of_the_valley:0 "Orchards of the Valley"
 vdn_orchards_of_the_valley_desc:0 "Plum, pear and cherry orchards line the Meuse terraces, and dragées from Verdun sweeten courts across Europe. Fruit trees outpay grain wherever a spade can reach."
 VID_ideas:0 "Vidin Ideas"
 VID_ideas_start:0 "Vidin Traditions"
 VID_ideas_bonus:0 "Vidin Ambition"
 vid_baba_vida_fortress:0 "Baba Vida Fortress"
 vid_baba_vida_fortress_desc:0 "Baba Vida stands where the Danube runs deep and fast, and no enemy has ever stormed it. Its towers watch the crossing, its walls shelter the town, and its legend steadies every defender behind them."
 vid_sratsimirs_crown:0 "Sratsimir's Crown"
 vid_sratsimirs_crown_desc:0 "When Bulgaria fell elsewhere, the tsars' crown survived at Vidin. Wearing the last legitimate crown of the Bulgars makes us heir to all their claims, and heirs do not negotiate like usurpers."
 vid_danube_crossings:0 "Danube Crossings"
 vid_danube_crossings_desc:0 "Ferrymen, bridge rights and river pilots answer to Vidin, and every wagon crossing north or south pays the town's due. The river carries our customs officers further than any cavalry ever could."
 vid_chiprovtsi_silver:0 "Chiprovtsi Silver"
 vid_chiprovtsi_silver_desc:0 "In the western hills miners work silver lodes and smiths beat it into ornament famous from Sofia to Buda. Ore, craft and trade routes meet at Chiprovtsi, and the ducal tithe touches all three."
 vid_faith_of_the_ancestors:0 "Faith of the Ancestors"
 vid_faith_of_the_ancestors_desc:0 "Here the Orthodox rite never broke, through Frankish kings, Magyar raids and Turkish shadow alike. A people sure of heaven are hard to unsettle on earth, and our priests remind them weekly."
 vid_boyar_horsemen:0 "Boyar Horsemen"
 vid_boyar_horsemen_desc:0 "The boyars of Vidin field armored lances in the old Bulgarian manner, proud as their grandfathers under the tsars. They charge like men defending their own land, because they are."
 vid_hungarian_understanding:0 "Hungarian Understanding"
 vid_hungarian_understanding_desc:0 "Across the river sits Hungary, sometimes threat, often shield. We keep that border friendly with marriages, trade and careful words, for a wise state buys its neighbors before it needs to buy its enemies."
 FRC_ideas:0 "Franche-Comtois Ideas"
 FRC_ideas_start:0 "Franche-Comtois Traditions"
 FRC_ideas_bonus:0 "Franche-Comtois Ambition"
 frc_salines_de_salins:0 "The Salines of Salins"
 frc_salines_de_salins_desc:0 "Salt from Salins enriched the counts long before Burgundy fell to France. Farmers took their share, yet the pans kept boiling, and salt roads through Pontarlier carried Comtois wealth into Germany and Italy."
 frc_comte_palatin:0 "Counts Palatine"
 frc_comte_palatin_desc:0 "Emperor Frederick Barbarossa made the count palatine over Besancon's archbishops. Whatever crown claimed them, the Comtois answered first to their own prince."
 frc_universite_de_dole:0 "University of Dole"
 frc_universite_de_dole_desc:0 "Philip the Good founded Dole's university in 1422. Its law faculty drew students from across the Empire and gave the county judges, doctors and clerks of its own."
 frc_parlement_de_dole:0 "Parlement of Dole"
 frc_parlement_de_dole_desc:0 "Dole's sovereign parlement heard final appeals for lands between Rhone and Meuse, binding nobles and towns to Comtois law rather than foreign courts."
 frc_entre_deux_couronnes:0 "Between Two Crowns"
 frc_entre_deux_couronnes_desc:0 "Wedged between France and the Empire, the county survived by selling its friendship dearly. Treaties, pensions and careful marriages kept conquerors out while trade flowed through."
 frc_milices_comtoises:0 "Comtois Militias"
 frc_milices_comtoises_desc:0 "When Louis XI invaded in 1479, town militias and mountain pikemen held Dole against his marshals. The county fell at last, but its soldiers earned respect even from the French."
 frc_rois_de_bourgogne:0 "Kings of Burgundy"
 frc_rois_de_bourgogne_desc:0 "Our counts hold their pedigree from the royal house that ruled these lands before the crown passed to the Emperor. When the dukes of Dijon call themselves Burgundy, we remember who wore that name first."
 ARS_ideas:0 "Arlesian Ideas"
 ARS_ideas_start:0 "Arlesian Traditions"
 ARS_ideas_bonus:0 "Arlesian Ambition"
 ars_les_deux_pals:0 "The Two Pales"
 ars_les_deux_pals_desc:0 "Or, two pallets gules: the arms the kings of Burgundy carried. Every kingdom needs a banner its people will follow, and ours flies above a restored crown."
 ars_entre_france_et_empire:0 "Between France and the Empire"
 ars_entre_france_et_empire_desc:0 "Wedged between two thrones, our envoys play each court against the other. The rivalries of our neighbors buy us time, money and recognition."
 ars_vallee_du_rhone:0 "The Rhone Valley"
 ars_vallee_du_rhone_desc:0 "From the Alps to the sea, the Rhone binds the realm and carries its trade. We hold the river, and the river holds the merchants."
 ars_salines_de_salins:0 "Salt of Salins"
 ars_salines_de_salins_desc:0 "The pans of Salins paid for the old kingdom, and they can pay for the new one. Salt money breeds loyalty faster than any tax on bread."
 ars_milices_des_communes:0 "Militias of the Free Towns"
 ars_milices_des_communes_desc:0 "Arles, Vienne and Besancon keep their own banners and their own levies. Free towns defend their walls with a fury hired soldiers lack."
 ars_cour_de_vienne:0 "The Court of Vienne"
 ars_cour_de_vienne_desc:0 "Vienne was the seat of the first kings of Burgundy. Restored courts bring restored order, and old titles lend weight to new laws."
 ars_le_troisieme_royaume:0 "The Third Kingdom"
 ars_le_troisieme_royaume_desc:0 "Beyond Germany and Italy stands Burgundy, the third kingdom of the Empire. While the crown is disputed between France and the Emperor, our name is ours to wear."
 ZWE_ideas:0 "Zweibruecken Ideas"
 ZWE_ideas_start:0 "Zweibruecken Traditions"
 ZWE_ideas_bonus:0 "Zweibruecken Ambition"
 zwe_erbe_von_veldenz:0 "The Veldenz Inheritance"
 zwe_erbe_von_veldenz_desc:0 "When Duke Frederick of Veldenz died in 1444, his counties passed to his Zweibrucken grandsons, doubling Wittelsbach lands along the Moselle."
 zwe_pfalzgrafenrecht:0 "Palatine Rights"
 zwe_pfalzgrafenrecht_desc:0 "As Counts Palatine by old imperial grant, the dukes of Zweibrucken bore regalia at coronations and claimed precedence over far greater princes."
 zwe_wasgau_waelder:0 "Forests of the Wasgau"
 zwe_wasgau_waelder_desc:0 "The Wasgau woods once hid robber knights until the dukes tamed them. Dense forests still sheltered troops and fed pigs, hunts and the timber trade."
 zwe_kleiner_hof:0 "A Small Court"
 zwe_kleiner_hof_desc:0 "A court of forty men cannot hire Italian bankers or Dutch scholars. Zweibrucken's princes knew every official by name and bought loyalty with trust rather than gold."
 zwe_ehepolitik:0 "Marriage Politics"
 zwe_ehepolitik_desc:0 "Ruprecht wed Mathilde of Habsburg and Alexander rode to Jerusalem before taking Margarete of Hohenlohe as bride. Each match pulled the small county into Europe's greatest networks."
 zwe_saarhandel:0 "Trade on the Saar"
 zwe_saarhandel_desc:0 "Coal lay under Saarbrucken woods and wine floated down the Blies. The dukes built tolls, markets and roads where Lorraine, Trier and the Palatinate met."
 zwe_gefolgsleute:0 "Loyal Retainers"
 zwe_gefolgsleute_desc:0 "Small lords owed the duke service, not silver. When war called, Zweibrucken fielded horsemen from every castle between Blieskastel and Hornbach."
 ZUR_ideas:0 "Zuricher Ideas"
 ZUR_ideas_start:0 "Zuricher Traditions"
 ZUR_ideas_bonus:0 "Zuricher Ambition"
 zur_bruns_verfassung:0 "Brun's Constitution"
 zur_bruns_verfassung_desc:0 "Rudolf Brun seized the city in 1336 and sealed the guild constitution. Craft guilds shared rule behind the walls, and no lord outside could overturn their oath."
 zur_seidengewerbe:0 "Silk Workshops"
 zur_seidengewerbe_desc:0 "By 1400 Zurich silk weavers sold cloth to Milan and sent agents to the Lyon fairs. Their workshops gave the guilds wealth to balance abbey lands."
 zur_stapelrecht:0 "Staple Rights"
 zur_stapelrecht_desc:0 "Goods crossing Zurich had to be offered for sale three days. Staple rights made the city a warehouse for salt, cloth and grain moving over the Alps."
 zur_grossmuensterstift:0 "The Grossmuenster Stift"
 zur_grossmuensterstift_desc:0 "The Grossmuenster's canons crowned kings and educated reformers. Whoever guided its school could steer young minds across Switzerland."
 zur_alt_zuerichkrieg:0 "Memory of the Old War"
 zur_alt_zuerichkrieg_desc:0 "When the Old Zurich War ended in 1450, the city had stood alone against half the Confederacy and lost its lands. Zurich rebuilt, and the memory taught caution its councillors never forgot."
 zur_stadtbann:0 "The Bannkreis"
 zur_stadtbann_desc:0 "No rival market was allowed within miles of the walls. Peasants brought wool, hides and wine to Zurich because no nearer town could legally sell them."
 zur_rueckkehr_in_den_bund:0 "Return to the Confederacy"
 zur_rueckkehr_in_den_bund_desc:0 "Readmitted to the Confederacy after bitter defeat, Zurich learned that allies outweigh pride. Its banner marched beside Bern and Lucerne ever after."
 MST_ideas:0 "Mecklenburg-Stargard Ideas"
 MST_ideas_start:0 "Mecklenburg-Stargard Traditions"
 MST_ideas_bonus:0 "Mecklenburg-Stargard Ambition"
 mst_hausvertrag_von_1352:0 "Hausvertrag of 1352"
 mst_hausvertrag_von_1352_desc:0 "In 1352 Albrecht II and Johann I divided their father's lands by treaty. The younger brother took the land of Stargard and ruled it as his own duchy, founding a line that kept its court at Neubrandenburg for over a century."
 mst_stargarder_arm:0 "The Stargarder Arm"
 mst_stargarder_arm_desc:0 "When Stargard fell to the dukes of Mecklenburg, its badge joined theirs: a maiden's arm issuing from a cloud and holding up a golden ring. The emblem stood for lordship won by marriage and defended by arms."
 mst_neubrandenburger_landwehr:0 "Neubrandenburg Landwehr"
 mst_neubrandenburger_landwehr_desc:0 "The four gates of Neubrandenburg opened onto marchland claimed by Brandenburg and Pomerania alike. Walls, banks and watchmen kept raiders out and cattle in."
 mst_viehweiden:0 "Herds and Rye Fields"
 mst_viehweiden_desc:0 "The land of Stargard fed its lords from wide pastures and rye fields. Herds driven to markets in Prenzlau and Stettin paid dues that filled the ducal chest."
 mst_landesteilung_von_1408:0 "Division of 1408"
 mst_landesteilung_von_1408_desc:0 "Johann took Sternberg and Friedland while Ulrich took Stargard and Neubrandenburg. Rival courts competed in building and dispensing justice, and subjects learned to play one line against the other to keep their liberties."
 mst_dewitz_verwaltung:0 "The Dewitz Administration"
 mst_dewitz_verwaltung_desc:0 "The counts of Dewitz held Stargard castle and managed the ducal lands for generations. Their stewardship kept taxes low, records straight and the nobility loyal to a small court."
 mst_heinrichs_wiedervereinigung:0 "Heinrich's Reunification"
 mst_heinrichs_wiedervereinigung_desc:0 "Duke Heinrich reunited the split lands and ruled from Stargard until his death. One court again meant one law, one mint and one army for the whole land."
 MRB_ideas:0 "Merseburg Ideas"
 MRB_ideas_start:0 "Merseburg Traditions"
 MRB_ideas_bonus:0 "Merseburg Ambition"
 mrb_saale_river_tolls:0 "Tolls of the Saale"
 mrb_saale_river_tolls_desc:0 "The Saale carries grain and timber past Merseburg toward the Elbe. Our lords take their toll at the bridge, and every boat that ties up in the town leaves a little of its cargo in the bishop's purse."
 mrb_chronicle_of_thietmar:0 "The Chronicle of Thietmar"
 mrb_chronicle_of_thietmar_desc:0 "Bishop Thietmar wrote his chronicle at the turn of the first millennium, and it became the memory of these eastern marches. His pages school our clerks and lend the see an authority older than any neighbor."
 mrb_border_of_the_empire:0 "Marches of the Empire"
 mrb_border_of_the_empire_desc:0 "Merseburg was a frontier see, planted where the realm faced the Slavs. Its castles kept the border, and its bishop led the men of the march against every raid that threatened the eastern door of Saxony."
 mrb_scribe_schools:0 "Schools of the See"
 mrb_scribe_schools_desc:0 "Clerks trained at Merseburg inscribe the charters and keep the accounts of half the eastern church. Learned men bred here fill the chanceries of Saxony, and the see draws on that learning whenever it pleads."
 mrb_bishopric_market:0 "Market of the Bishopric"
 mrb_bishopric_market_desc:0 "Merchants from the Elbe to the Thuringian hills bring their wares to the Merseburg market. The bishop grants stalls and weights and takes his dues, so that the trade of the road enriches the whole see."
 mrb_church_lands:0 "Lands of the Church"
 mrb_church_lands_desc:0 "The see holds villages and mills along the river valley. Settled, farmed and rented on clear terms, these church lands give the bishopric a steady income that no rival can seize."
 mrb_mission_bishops:0 "Order on the Border"
 mrb_mission_bishops_desc:0 "Bishops who keep a settled march keep quiet villages. Law, tithe and faith together hold the eastern border calm, and a calm border is a border that breeds no ruinous wars."
 TCK_ideas:0 "Tecklenburg Ideas"
 TCK_ideas_start:0 "Tecklenburg Traditions"
 TCK_ideas_bonus:0 "Tecklenburg Ambition"
 tck_moated_castles:0 "Moated Castles"
 tck_moated_castles_desc:0 "Water rings every stronghold of the county, Tecklenburg foremost among them. Well-kept moats and fosse turn each castle into an island, cheap to hold and hard to take."
 tck_westphalian_forests:0 "Woods of Westphalia"
 tck_westphalian_forests_desc:0 "Oak and beech cover the heights where the county meets the plain. Paths wind and vanish, so that strangers lose their way while our own men pass freely along hidden tracks."
 tck_linnen_weavers:0 "Linen Weavers"
 tck_linnen_weavers_desc:0 "The looms of Tecklenburg turn local flax into Westphalian linen. The cloth walks south to the great fairs, and the weavers who make it stay loyal to the count who keeps their trade safe."
 tck_counts_of_tecklenburg:0 "The Counts of Tecklenburg"
 tck_counts_of_tecklenburg_desc:0 "A single countly house has held Tecklenburg through the generations. Long rule and steady succession give the county a weight in Westphalian councils out of all proportion to its size."
 tck_marshland_graze:0 "Pastures of the Marsh"
 tck_marshland_graze_desc:0 "Drained meadow along the river feeds herds that stock the county's markets. Cattle and cheese travel far, and the rent of the pastures keeps the count's court supplied without squeezing the villages."
 tck_consolidate_the_county:0 "Gather the Inheritance"
 tck_consolidate_the_county_desc:0 "The county is a patchwork of claims and parcels. Count after count has bought, wed and bargained to join the pieces, and each addition makes the next one easier to win."
 tck_young_counts:0 "Fresh Levies"
 tck_young_counts_desc:0 "Westphalian farms breed more sons than the fields can feed. The county calls the surplus to its banners, and young men who might otherwise drift away serve instead in the count's wars."
 SYE_ideas:0 "Speyer Ideas"
 SYE_ideas_start:0 "Speyer Traditions"
 SYE_ideas_bonus:0 "Speyer Ambition"
 sye_reichskammergericht:0 "The Imperial Court"
 sye_reichskammergericht_desc:0 "The highest court of the empire sat at Speyer, and law and letters gathered around it. Suitors, lawyers and judges crowded the city, carrying its name and influence into every quarter of Germany."
 sye_cathedral_of_speyer:0 "The Cathedral of Speyer"
 sye_cathedral_of_speyer_desc:0 "The great red cathedral on the Rhine is the burial church of emperors and the largest church of its age. Its chapter and shrine win the see the reverence of all Christendom."
 sye_rhine_tolls:0 "Tolls of the Upper Rhine"
 sye_rhine_tolls_desc:0 "The bishop holds the tolls where the Rhine bends past Speyer. Barge and raft pay their dues, and the unhurried river trade pours a steady silver into the see that no harvest can fail."
 sye_imperial_free_diet:0 "City of the Empire"
 sye_imperial_free_diet_desc:0 "Diet and council met at Speyer, and the bishop moved among the princes as an equal. Long practice at the imperial table taught the see to speak, bargain and hold its own among the great."
 sye_wine_of_the_pfalz:0 "Wine of the Palatinate"
 sye_wine_of_the_pfalz_desc:0 "The vineyards about Speyer ripen some of the finest wine of the Rhine. Church, noble and burgher all hold vines, and the vintage makes the city rich in good years and famous in all."
 sye_edict_of_tolerance:0 "The Edict of Speyer"
 sye_edict_of_tolerance_desc:0 "The city that once gave its name to a decree of toleration learned to keep its many peoples in peace. Faiths and tongues live side by side in Speyer, and that quiet order lets the city prosper."
 sye_river_defense:0 "Ramparts of the River"
 sye_river_defense_desc:0 "Speyer faces the Rhine and the open plain beyond, so its walls and towers are kept strong against every quarter. A city well walled and well watched meets its enemies on the ramparts, not in its streets."
 WRM_ideas:0 "Wormser Ideas"
 WRM_ideas_start:0 "Wormser Traditions"
 WRM_ideas_bonus:0 "Wormser Ambition"
 wrm_concordat_of_worms:0 "The Concordat of Worms"
 wrm_concordat_of_worms_desc:0 "In 1122 the concordat that bears our city's name ended the long quarrel between pope and emperor over who invests bishops. Worms gave the church its peace, and the see that brokered it knows how to speak so that Rome and the Empire both listen."
 wrm_key_of_saint_peter:0 "The Key of Saint Peter"
 wrm_key_of_saint_peter_desc:0 "Our arms show the silver key of Saint Peter on a field of blue, for the bishopric holds its power from Rome. The pope knows Worms as a faithful see, and the favor of the curia follows our clergy wherever they serve."
 wrm_city_of_the_diet:0 "City of the Imperial Diet"
 wrm_city_of_the_diet_desc:0 "Empire and church have met in our halls since the Carolingians held their assemblies by the Rhine. Emperors, princes and electors come to Worms to settle the affairs of Germany, and a city that hosts the Diet learns the weight of its own voice."
 wrm_rhine_tolls:0 "Tolls of the Rhine"
 wrm_rhine_tolls_desc:0 "The Rhine carries the trade of half of Germany past our walls. The tolls raised at Worms are old right of the see, and every barge that pays them brings the city closer to the merchants of the whole river."
 wrm_wine_of_the_rhine:0 "Wine of the Rhine"
 wrm_wine_of_the_rhine_desc:0 "The warm slopes above the river grow the wine of Worms, prized in every cellary of the west. The see's own vineyards fill its treasury and its table, and a good vintage buys friends no treaty could win."
 wrm_edict_of_worms:0 "The Edict of Worms"
 wrm_edict_of_worms_desc:0 "When the Diet of Worms outlawed the reformer in 1521, the bishopric stood fast with the old faith. The edict that bears our name was written in our city, and Worms holds its ground when the faith is challenged."
 wrm_imperial_cathedral:0 "The Imperial Cathedral"
 wrm_imperial_cathedral_desc:0 "Saint Peter's rose above Worms as one of the great churches of the empire, seat of our chapter and crown of the city. Princes are buried beneath its towers, and its reverence flows out over all who live in the see."
 DOR_ideas:0 "Dorpater Ideas"
 DOR_ideas_start:0 "Dorpater Traditions"
 DOR_ideas_bonus:0 "Dorpater Ambition"
 dor_battle_on_the_ice:0 "The Battle on the Ice"
 dor_battle_on_the_ice_desc:0 "The frozen Peipus remembered a day of steel in 1242, when the knights of the eastern march met the host of Novgorod. The ice held the enemy and broke under them, and the see that fought there has never forgotten how to make invasion bleed."
 dor_monastic_scholars:0 "Monastic Scholars"
 dor_monastic_scholars_desc:0 "The cloisters of Dorpat teach the seven arts to the sons of Livonia, keeping the learning of the Latin west alive on its eastern edge. Scribes copy the fathers, masters dispute the doctors, and the see grows wise in the scripture of its faith."
 dor_hanseatic_dorpat:0 "Hanseatic Dorpat"
 dor_hanseatic_dorpat_desc:0 "The Emajõgi carries the trade of the interior down to Lake Peipus and the Gulf of Finland. Hanseatic merchants keep their counting houses in Dorpat, and the tolls of their traffic fill the bishop's treasury."
 dor_sword_brothers_legacy:0 "Legacy of the Sword Brothers"
 dor_sword_brothers_legacy_desc:0 "Bishop and knights brought the cross to the east of Livonia at the point of the sword. The martial brotherhood that won this land is our inheritance, and its veterans still take up arms for the see."
 dor_vassals_of_the_see:0 "Vassals of the See"
 dor_vassals_of_the_see_desc:0 "The knights who hold their fiefs from the bishop are the sinew of the march. They guard the Emajõgi crossings, keep the peasantry in order, and answer the summons of the see against all who threaten the frontier."
 dor_church_of_the_eastern_march:0 "Church of the Eastern March"
 dor_church_of_the_eastern_march_desc:0 "Dorpat is the easternmost see of the Latin church, and its clergy carry the faith into the pagan lands beyond. The church that stands on the frontier of Christendom holds a people of many tongues in one obedience."
 dor_see_of_the_east:0 "See of the East"
 dor_see_of_the_east_desc:0 "The bishops of Dorpat hold their seat from Rome itself, and the curia counts them among the pillars of the northern church. Their loyalty to the pope makes their voice heard in the counsels of Christendom."
 OSL_ideas:0 "Ösel-Wiek Ideas"
 OSL_ideas_start:0 "Ösel-Wiek Traditions"
 OSL_ideas_bonus:0 "Ösel-Wiek Ambition"
 osl_reconquista_of_the_baltic:0 "Reconquista of the Baltic"
 osl_reconquista_of_the_baltic_desc:0 "The galleys of the bishop carry the cross over the waters that the Oeselians once roamed. As the knights of the south hunted the infidel at sea, so the fleet of Ösel hunts the enemies of the faith in the Baltic, and takes their ships as its reward."
 osl_see_of_hapsal:0 "See of Hapsal"
 osl_see_of_hapsal_desc:0 "The cathedral of Hapsal rose on the shore of the bay as the seat of the island bishopric. Rome knows the chapter for its zeal and its loyalty, and the see that stands between sea and forest keeps the favor of the pope."
 osl_fortress_of_kuressaare:0 "Fortress of Kuressaare"
 osl_fortress_of_kuressaare_desc:0 "On the south shore of Ösel stands the castle of Kuressaare, ringed by walls and moat against the raiders of the sea. The fortress guards the bishop's seat and the island behind it, and the enemy that lands on Ösel finds a stone wall waiting."
 osl_irbe_strait_tolls:0 "Tolls of the Irbe Strait"
 osl_irbe_strait_tolls_desc:0 "The Irbe Strait between Ösel and the mainland is the gate of the Gulf of Riga. The ships that pass through it pay the island for the right, and the see that holds the strait holds the key to the trade of Courland and Livonia."
 osl_island_militia:0 "Island Militia"
 osl_island_militia_desc:0 "Every man of the islands knows the oar and the net, and when the beacon burns they take up arms for the see. The militia that answers the call is more than a levy: it is a people who defend their own shores."
 osl_light_ships_of_the_wick:0 "Light Ships of the Wiek"
 osl_light_ships_of_the_wick_desc:0 "The shallow coasts of the Wiek demand a fleet of light, swift ships. The islanders build them fast and handle them better, and the black hulls of Ösel outrun any warship the mainland can send against them."
 osl_sonnenburg_abbey:0 "Abbey of Sonnenburg"
 osl_sonnenburg_abbey_desc:0 "The abbey of Sonnenburg on the eastern shore of Ösel is the oldest house of the order in Livonia. Its monks pray for the land and its estates feed the see, and the peace of the abbey settles the quarrels of the island."
 KRB_ideas:0 "Courland Ideas"
 KRB_ideas_start:0 "Courland Traditions"
 KRB_ideas_bonus:0 "Courland Ambition"
 krb_curonian_levies:0 "Curonian Levies"
 krb_curonian_levies_desc:0 "The Curonians are the old lords of this coast, a people the crusaders subdued but never tamed. They serve the see as soldiers, and the forest-born footmen of Courland fight harder than any hired army for the land they call their own."
 krb_see_of_pilten:0 "See of Pilten"
 krb_see_of_pilten_desc:0 "The bishop of Courland sits at Pilten, a castle above the Venta among the woods of the west. Rome planted this see among a stubborn people, and its clergy hold the faith firm where three lands and three faiths meet."
 krb_amber_coast:0 "Amber Coast"
 krb_amber_coast_desc:0 "The shores of Courland are the richest fields of amber in the Baltic, and the stone of the sun washes up after every storm. The see gathers the harvest of the coast and sells it south, and the amber trade keeps the bishopric alive."
 krb_forest_of_curland:0 "Forest of Courland"
 krb_forest_of_curland_desc:0 "Forests of oak and pine cover the land between the Venta and the sea, and the see holds its best wealth in timber. The settlers of the clearing and the raftsmen of the rivers make the woods yield, and the forest gives the bishopric what the fields cannot."
 krb_neighbor_of_the_order:0 "Neighbor of the Order"
 krb_neighbor_of_the_order_desc:0 "The Livonian order surrounds the see on every side, and Courland has learned to live beside the crusaders. Steady words and firm treaties keep the peace, and the skill of the small state in the shadow of the great one is not to be despised."
 krb_marsh_defenses:0 "Marshes of the Coast"
 krb_marsh_defenses_desc:0 "The coast of Courland is a maze of dunes, bogs and shallow inlets. The invaders who follow the shore roads find the marsh turns against them, and the men of the see know every path that a hostile army does not."
 krb_livonian_vassals:0 "Vassals of Livonia"
 krb_livonian_vassals_desc:0 "The knights and freemen who hold their lands from the bishop have held this march since the conversion. Their families serve the see generation after generation, and the men who answer the summons are a host that never grows old."
 REV_ideas:0 "Reval Ideas"
 REV_ideas_start:0 "Reval Traditions"
 REV_ideas_bonus:0 "Reval Ambition"
 rev_hansa_of_reval:0 "Hansa of Reval"
 rev_hansa_of_reval_desc:0 "The bay of Reval is the gate of the east, where the trade of Novgorod and Pskov meets the ships that go out to Lübeck and the west. The merchants of the Hansa keep their yards on the bay, and the tolls of their traffic fill the treasury of the see."
 rev_st_marys_cathedral:0 "Cathedral of St Mary"
 rev_st_marys_cathedral_desc:0 "On the heights of Toompea above the town stands the dome church that the Danes raised to the Queen of Heaven. The cathedral is the heart of the see, and the devotion that built it still gathers the faithful of the city to the bishop's table."
 rev_toompea_fortress:0 "Fortress of Toompea"
 rev_toompea_fortress_desc:0 "The citadel of Toompea crowns the hill that overlooks Reval and its harbor, its walls sheltering the cathedral and the bishop's court. Whoever holds the heights of Toompea holds the city, and the see has held them since the Danish conquest."
 rev_danish_royal_patronage:0 "Danish Royal Patronage"
 rev_danish_royal_patronage_desc:0 "The kings of Denmark founded this see and long named its bishops, and Rome still counts the bishops of Reval among the loyal pillars of the northern church. The favor of the curia makes the voice of this small see heard in the counsels of Christendom."
 rev_the_great_guild:0 "The Great Guild"
 rev_the_great_guild_desc:0 "The merchants of Reval gather in the Great Guild, the oldest and richest brotherhood on the bay. Their charters, warehouses and ships are at the bishop's service, and the grain and wax and furs that pass their scales enrich the see no less than the town."
 rev_gate_to_novgorod:0 "Gate to Novgorod"
 rev_gate_to_novgorod_desc:0 "The streets of Reval run with the trade of the east: furs from the Volga, wax from the Novgorod market, silver that has crossed half of Russia. The bishopric stands where that wealth meets the sea, and turns the current to its own advantage."
 rev_mission_field_of_estland:0 "Mission Field of Estland"
 rev_mission_field_of_estland_desc:0 "The countryside beyond the walls still remembers the old gods, and the see measures its mission in villages and parishes. The clergy of Reval carry the faith into the forests of Estland, and every soul brought to the church strengthens the bishopric."
 CIL_ideas:0 "Cilician Ideas"
 CIL_ideas_start:0 "Cilician Traditions"
 CIL_ideas_bonus:0 "Cilician Ambition"
 cil_court_of_sis:0 "The Court of Sis"
 cil_court_of_sis_desc:0 "Sis is the heart of the restored kingdom and the seat of the Catholicos of the Armenian Church. From this see the faith that survived centuries of exile now goes out again to every valley of the mountain land."
 cil_reunion_of_the_churches:0 "Reunion of the Churches"
 cil_reunion_of_the_churches_desc:0 "The kings of Cilicia courted both Rome and Constantinople, offering union while guarding their own rite. Such skill at holding two doors open wins the small kingdom a hearing in every Christian court from the Bosphorus to the Tiber."
 cil_rubenid_restoration:0 "The Rubenid Restoration"
 cil_rubenid_restoration_desc:0 "The house that raised the barony to a kingdom is remembered in song and charter alike. A ruler who descends from that line enters the throne with a claim no rival can out-bid and a history every subject already honors."
 cil_cukurova_plain:0 "The Çukurova Plain"
 cil_cukurova_plain_desc:0 "The rich plain between the Taurus and the sea feeds the kingdom as no mountain valley can. Where irrigation and settlement are renewed, the land that once fathered an empire pours out its bounty again."
 cil_taurus_levies:0 "Taurus Levies"
 cil_taurus_levies_desc:0 "From the high passes of the Taurus come footmen who know every crag and shepherd track. Men raised in such country repair to the banner quickly and return to their herds sooner, keeping the army whole through long campaigns."
 cil_armenian_diaspora:0 "The Armenian Diaspora"
 cil_armenian_diaspora_desc:0 "Exiles remember Cilicia, and merchants of the diaspora keep its markets alive from Aleppo to Tana. Every Armenian community that finds its way home brings coin, letters and kin, so that the kingdom grows as its scattered people return."
 cil_gregorian_faith:0 "The Gregorian Faith"
 cil_gregorian_faith_desc:0 "The Armenian church is the pillar on which the nation stands. Where bishop and prince work as one, the many peoples of the plain share a single altar and a single loyalty, and no foreign creed loosens the bonds between them."
 OCC_ideas:0 "Occitan Ideas"
 OCC_ideas_start:0 "Occitan Traditions"
 OCC_ideas_bonus:0 "Occitan Ambition"
 occ_troubadour_courts:0 "The Courts of the Troubadours"
 occ_troubadour_courts_desc:0 "Our courts first gave Europe the art of the troubadour, the song of courteous love that every court of Christendom tried to copy. Poets, musicians and wandering scholars carried our name to Aragon, Provence and beyond, and our speech became the tongue of poetry itself."
 occ_canal_du_midi:0 "Canal du Midi"
 occ_canal_du_midi_desc:0 "When Pierre-Paul Riquet drove his canal from the Garonne to the Mediterranean, the trade of the Midi no longer needed to round Iberia. Wool, wine and woad now pass through our heartland, and every cargo that crosses our waters pays its toll."
 occ_pastel_of_lauragais:0 "The Pastel of Lauragais"
 occ_pastel_of_lauragais_desc:0 "The pastel fields of Lauragais made Toulouse one of the richest cities of the west. Boiled, dried and pressed into balls, the blue dye of our woad clothed half of Europe, and the money it brought built the brick mansions of the Garonne."
 occ_capitouls_of_toulouse:0 "The Capitouls of Toulouse"
 occ_capitouls_of_toulouse_desc:0 "Eight capitouls, drawn from the guilds and the noble houses of Toulouse, govern the city in its own name. Their courts settle the quarrels of market and street alike, and their authority keeps the peace where royal power is far away."
 occ_parlement_of_toulouse:0 "The Parlement of Toulouse"
 occ_parlement_of_toulouse_desc:0 "Toulouse gave France its first Parlement outside Paris, a high court that speaks for the whole Midi. Appeals from the Pyrenees to the Rhone end in its chambers, and a verdict from Toulouse is law from one sea to the other."
 occ_university_of_toulouse:0 "The University of Toulouse"
 occ_university_of_toulouse_desc:0 "Founded after the Albigensian crusade to teach the true faith, the University of Toulouse grew into one of the great schools of law and theology in the west. Its doctors sit on councils from Rome to Barcelona, and its books fill our libraries."
 occ_militias_of_the_bonnes_villes:0 "Militias of the Bonnes Villes"
 occ_militias_of_the_bonnes_villes_desc:0 "Every chartered town of the Midi keeps its own companies of citizen-soldiers, drilled on feast days and paid from the town treasury. When war comes to the plain, the walls of Carcassonne and the pikes of the bonnes villes need no royal garrison."
 LXM_ideas:0 "Luxembourg-Moravian Ideas"
 LXM_ideas_start:0 "Luxembourg-Moravian Traditions"
 LXM_ideas_bonus:0 "Luxembourg-Moravian Ambition"
 lxm_golden_bull:0 "The Golden Bull"
 lxm_golden_bull_desc:0 "Charles IV set the order of the Empire in the Golden Bull of 1356. Succession had fixed law, the seven electors had fixed seats, and the crowns of our house passed by rule rather than by the sword. What the Bull ordered once, our chancery keeps ordered still."
 lxm_karlstejn:0 "Karlštejn and the Crown Jewels"
 lxm_karlstejn_desc:0 "Charles IV raised Karlštejn to guard the crown of the Empire and the relics of the Passion. Its walls hold what kings dare not lose, and no enemy has ever taken the fortress by storm."
 lxm_silver_of_kutna_hora:0 "The Silver of Kutná Hora"
 lxm_silver_of_kutna_hora_desc:0 "The silver mines of Kutná Hora paid for the court of Prague and the armies of the Empire. Our mints keep the old workings in order, and the groschen of our lands remain coin that every merchant accepts."
 lxm_university_of_prague:0 "The University of Prague"
 lxm_university_of_prague_desc:0 "Charles IV founded the first university of the Empire north of the Alps. Jurists trained in Prague staff our chancery, and clerks who learned their Latin on the Vltava write the letters of our diplomacy."
 lxm_lands_of_the_bohemian_crown:0 "The Lands of the Bohemian Crown"
 lxm_lands_of_the_bohemian_crown_desc:0 "Bohemia, Moravia, Silesia and the Lusatias answer to the crown Charles IV wore. Where the estates of those lands meet our diet, one law runs from the Erzgebirge to the marches, and one treasury gathers the revenue of all."
 lxm_levies_of_two_lands:0 "The Levies of the Two Lands"
 lxm_levies_of_two_lands_desc:0 "Walloon men-at-arms from the Ardennes and Czech spearmen from the marches fight under one banner. Our captains drill both alike, so the army of the two seats does not need to learn in the field what it could learn in camp."
 lxm_the_two_seats:0 "The Two Seats"
 lxm_the_two_seats_desc:0 "The Alzette and the Morava, the duchy and the margraviate, are joined at last under one crown. The courts of Europe remember what the House of Luxembourg was when it held both seats, and our name carries that weight again."
 GTY_ideas:0 "Görz–Tirol Ideas"
 GTY_ideas_start:0 "Görz–Tirol Traditions"
 GTY_ideas_bonus:0 "Görz–Tirol Ambition"
 gty_silver_of_schwaz:0 "The Silver of Schwaz"
 gty_silver_of_schwaz_desc:0 "The silver veins of Schwaz made Tirol one of the richest lands of the Empire. Our mines keep the shafts open, the coiners at work, and the merchants of the passes in silver for their wares."
 gty_the_brenner_route:0 "The Brenner Route"
 gty_the_brenner_route_desc:0 "The road over the Brenner carries the traffic of Italy into Germany. Every merchant who crosses our passes pays toll, and every toll-gate of the Inn valley fills our treasury."
 gty_the_landlibell:0 "The Landlibell"
 gty_the_landlibell_desc:0 "The Landlibell bound every valley of Tirol to furnish its share of soldiers in times of war. The muster lists are kept, the districts drill, and the army of the county rests on the whole country."
 gty_ancient_counts_of_gorz:0 "The Ancient Counts of Görz"
 gty_ancient_counts_of_gorz_desc:0 "The counts of Görz trace their line to the marches of Friuli, older than many princely houses of the Empire. Courts that respect antiquity listen when the house of the two seats speaks."
 gty_house_of_two_seats:0 "The House of the Two Seats"
 gty_house_of_two_seats_desc:0 "Görz and Tirol, the county and the princely county, answer to one house again. Chancellors of the two seats write with one hand, and the letters of our diplomacy carry the weight of both."
 gty_ways_of_the_mountains:0 "The Ways of the Mountains"
 gty_ways_of_the_mountains_desc:0 "The roads over the passes bind the valley towns to Innsbruck and Bozen. Bridges span the Etsch, paths climb to the high pastures, and settlers who come to the county find a way into every dell."
 gty_armies_of_the_valleys:0 "The Armies of the Valleys"
 gty_armies_of_the_valleys_desc:0 "Every valley of the county raises its banner, and the men of each district muster under their own captains. The people of the mountains fight for their valleys, and no invader can hold a pass against them for long."
 KTN_ideas:0 "Carinthian Ideas"
 KTN_ideas_start:0 "Carinthian Traditions"
 KTN_ideas_bonus:0 "Carinthian Ambition"
 ktn_ferrum_noricum:0 "The Iron of Noricum"
 ktn_ferrum_noricum_desc:0 "The mines of the eastern Alps yield the iron that the smiths of Noricum once worked into the best steel of the ancient world. Our forges keep the old art, and the swords they turn out carry our name into every army of the Empire."
 ktn_vojvodski_prestol:0 "The Ducal Throne"
 ktn_vojvodski_prestol_desc:0 "The stone seat of the dukes of Carantania stands in the open field, and he who would be duke must sit upon it before the people. The ceremony binds the ruler to the land, and a duke who keeps its ancient law holds the loyalty of every valley."
 ktn_three_black_lions:0 "The Three Black Lions"
 ktn_three_black_lions_desc:0 "Three black lions guard the golden shield of the duchy. Enemies who see the banner know that the valleys of the Drava stand behind it, and the memory of Carantania gives the arms their weight."
 ktn_tauern_roads:0 "The Roads of the Tauern"
 ktn_tauern_roads_desc:0 "The passes of the High Tauern link the duchy to Salzburg and the Adriatic. The traffic of the mountains pays our tolls, and the merchants who cross our ridges carry the news of the world to our market squares."
 ktn_marches_of_carantania:0 "The Marches of Carantania"
 ktn_marches_of_carantania_desc:0 "Carantania, the oldest Slavic principality of the Alps, gave our valleys their first dukes and their first law. The memory of the marches holds the peoples of the duchy together, and no court of the Empire can claim older lordship over our lands."
 ktn_city_of_klagenfurt:0 "The City of Klagenfurt"
 ktn_city_of_klagenfurt_desc:0 "Klagenfurt rises where the roads of the duchy meet on the banks of the Glan. A city raised by our own hand gives Carinthia a capital of its own, and its walls and market draw the trade of the whole region."
 ktn_landtag_of_karnten:0 "The Landtag of Carinthia"
 ktn_landtag_of_karnten_desc:0 "The estates of prelates, nobles and towns meet in the Landtag to consent to the burdens of the land. A duke who hears his estates keeps the peace of the duchy, and laws made with their consent hold the allegiance of every district."
 VBO_ideas:0 "Viborg Ideas"
 VBO_ideas_start:0 "Viborg Traditions"
 VBO_ideas_bonus:0 "Viborg Ambition"
 vbo_castle_of_the_isthmus:0 "The Castle of the Isthmus"
 vbo_castle_of_the_isthmus_desc:0 "Raised by the Swedish marshal Torkel Knutsson in 1293, the walled town of Viborg guards the shortest road between the Gulf of Finland and Lake Ladoga. Every attack from the east has broken against its towers."
 vbo_ladoga_fisheries:0 "Fisheries of Ladoga"
 vbo_ladoga_fisheries_desc:0 "The salmon of the Vuoksi and the whitefish of Ladoga feed the castle town and the peasantry of the isthmus alike, and every tawny autumn the nets come home heavy and the smokehouses run."
 vbo_tar_and_timber:0 "Tar and Timber"
 vbo_tar_and_timber_desc:0 "The dark pine of Karelia becomes tar that seals the hulls of every Baltic fleet, timber for the merchantmen of Lübeck and the Sound. Down the rivers it comes, and gold goes back."
 vbo_peace_of_noteborg:0 "The Peace of Nöteborg"
 vbo_peace_of_noteborg_desc:0 "The old treaty with the lords of Novgorod drew the frontier between the Latin and the Orthodox worlds through the very heart of our marches. A border that trades is a border that holds."
 vbo_frontier_levies:0 "Frontier Levies"
 vbo_frontier_levies_desc:0 "Every farmstead of the isthmus stands within a day's ride of the border, and its men are mustered against the east before the smoke of a burning village settles. These are borders hard as the land."
 vbo_gulf_of_finland_navy:0 "The Gulf Squadron"
 vbo_gulf_of_finland_navy_desc:0 "Between the skerries of the bay and the shallow port of Viborg, a few stout galleons and a good pilot's skill have more than once told heavier fleets to look elsewhere."
 vbo_between_west_and_east:0 "Between West and East"
 vbo_between_west_and_east_desc:0 "Catholic Swedes, Orthodox Karelians and the merchants of three nations meet in our markets. The town that learns to keep the peace at such crossroads finds its customs and its craftsmen taken up by all sides."
 KUY_ideas:0 "Kuyavian Ideas"
 KUY_ideas_start:0 "Kuyavian Traditions"
 KUY_ideas_bonus:0 "Kuyavian Ambition"
 kuy_cradle_of_the_piasts:0 "The Cradle of the Piasts"
 kuy_cradle_of_the_piasts_desc:0 "The old chronicles place the wheelmaker Piast here at Kruszwica, where the Polish lords came to eat his celebrated feast and left him their kingdom. A land that could raise a founding dynasty reminds every court of Europe how the Poles began."
 kuy_fertile_lowlands:0 "The Fertile Lowlands"
 kuy_fertile_lowlands_desc:0 "Between the Vistula and the Notec the black earth of the Kuyavian plain yields harvests that feed the river towns. Land is cheap, labour abundant, and every clearing settled by our folk fills the ducal granaries."
 kuy_salt_works_of_inowroclaw:0 "The Salt Works of Inowrocław"
 kuy_salt_works_of_inowroclaw_desc:0 "Brine springs rise at Inowrocław in the very middle of our lands. Kettles boil the salt that seasons the hams of the region, and the pans that have made Inowrocław wealthy keep our coin at home."
 kuy_bishops_of_kujawy:0 "The Bishops of Kujawy"
 kuy_bishops_of_kujawy_desc:0 "The see of Włocławek watches the river crossings of the duchy, and its bishops have blessed the arms of Piast dukes and kings alike. Their cathedral on the Vistula sets the law of the land and steadies the throne."
 kuy_militia_bands_of_kujawy:0 "The Militia Bands of Kujawy"
 kuy_militia_bands_of_kujawy_desc:0 "Every hamlet of the plain can arm its men on short notice, for farmers of the border country are soldiers when the river rises or the Teutonic banners appear. Free peasants who fight for their own fields fight hard."
 kuy_weichsel_customs:0 "The Weichsel Customs"
 kuy_weichsel_customs_desc:0 "Grain, timber and salt drift down the Vistula toward the Baltic ports, and every barge pays at our quays. Whoever holds the river of Kuyavia takes toll of the trade that feeds the Hanse towns."
 kuy_legacy_of_lokietek:0 "The Legacy of the Elbow-high"
 kuy_legacy_of_lokietek_desc:0 "Władysław the Elbow-high, a Kuyavian duke, raised a scattered inheritance into the reunited crown of Poland. We bear the same eagle and the same patience, and the men of Kuyavia still know how a small realm grows great."
 SKN_ideas:0 "Scanian Ideas"
 SKN_ideas_start:0 "Scanian Traditions"
 SKN_ideas_bonus:0 "Scanian Ambition"
 skn_great_herring_market:0 "The Great Herring Market"
 skn_great_herring_market_desc:0 "Between Michaelmas and Christmas the herring shoals pack the Sound off Skanör and Falsterbo, drawing merchants and tolls to every fair of the Baltic. Where the herring run, gold follows."
 skn_scanian_ox_trade:0 "The Scanian Cattle Trade"
 skn_scanian_ox_trade_desc:0 "The great oxen of Scania are driven through the bays at the autumn fairs, fat on pasture that needs no ploughing. The stock trade with the German towns fills our treasury year after year."
 skn_archbishopric_of_lund:0 "The Archbishopric of Lund"
 skn_archbishopric_of_lund_desc:0 "On its hill above the Sound, Lund boasts the oldest see of the North and crowns its archbishops as primates of the three realms. Its church is the steadiest pillar of Scanian society."
 skn_scanian_farmlands:0 "The Scanian Plains"
 skn_scanian_farmlands_desc:0 "The smiling plains of Scania feed not only their own folk but Copenhagen and the Baltic towns, and their granaries have made the region the richest countryside of the North."
 skn_oresund_navy:0 "Guardians of the Sound"
 skn_oresund_navy_desc:0 "The skippers of the Sound know every shoal and current between Helsingør and Helsingborg, and the war fleets of two kingdoms have been warned off by the gale-ships raised on the Scanian coast."
 skn_scanian_knights:0 "The Scanian Knights"
 skn_scanian_knights_desc:0 "From border marches caught between Danish kings and Swedish pretenders, the Scanian knights are proven horsemen, as feared on the field as the cattle they herd."
 skn_danish_heritage:0 "The Danish Heritage"
 skn_danish_heritage_desc:0 "The flag of the Dannebrog flies over Lund as over Roskilde, the law is Danish law and the speech is Danish speech. The bonds of language and faith hold our merchants welcome in every Danish port, and our crowns harken to Copenhagen."
 OST_ideas:0 "Östergötland Ideas"
 OST_ideas_start:0 "Östergötland Traditions"
 OST_ideas_bonus:0 "Östergötland Ambition"
 ost_griffin_of_the_east:0 "The Griffin of the East"
 ost_griffin_of_the_east_desc:0 "Golden on a red field the grip of the eastern Goths stands guard, and the four roses at the corners mark the arms granted to the land. Where the banner flies, the old pride of Östergötland rides."
 ost_plains_of_ostergotland:0 "The Plains Between the Lakes"
 ost_plains_of_ostergotland_desc:0 "From the shores of Vättern past the waters of Roxen and Boren, the smiling plains give the richest harvests of Stockholm's realm, and the granaries of the east fill the smorgasbord of the Swedish crown."
 ost_ostgotalag:0 "The Östgötalag"
 ost_ostgotalag_desc:0 "The old provincial law of Östergötland, written down in the thirteenth century, still orders the markets, the inheritances and the courts of the countryside. A land that keeps its own law keeps its own peace."
 ost_linkoping_cathedral:0 "The Cathedral of Linköping"
 ost_linkoping_cathedral_desc:0 "The see of Linköping crowns the land's chief city, and its bishop sits in the councils of the realm. The estates know their duties, and the clergy keeps the times and the tales of the province."
 ost_east_coast_trade:0 "The East Coast Trade"
 ost_east_coast_trade_desc:0 "From Söderköping and Norrköping the goods of the east coast take ship for Reval and Lübeck, and the tolls of the small harbours keep the markets of Östergötland busy through the long winters."
 ost_norrkoping_fleet:0 "The Norrköping Fleet"
 ost_norrkoping_fleet_desc:0 "Behind the skerries the deep-water port of Norrköping can shelter the galleys and galleons of the east, and the pilots and carpenters of the coast keep the fleet in being through the ice-bound months."
 ost_ostgota_cavalry:0 "The Östgöta Cavalry"
 ost_ostgota_cavalry_desc:0 "The horsemen of Östergötland are raised from the plains' gentry, mounted on the swift horses of the country, and from Bråviken to the Vistula they have made the name of the eastern cavalry feared."
 SML_ideas:0 "Småland Ideas"
 SML_ideas_start:0 "Småland Traditions"
 SML_ideas_bonus:0 "Småland Ambition"
 sml_tioharad_laws:0 "The Laws of Tiohärad"
 sml_tioharad_laws_desc:0 "The ten hundreds of Värend, Finnveden and Njudung keep their old lag-sagas, sworn under open sky at the assembly stones. A people that carries its law court in its courting, and its verdicts in the memory of its elders, needs no other crown to hold it together."
 sml_calmar_castle:0 "Kalmar Slott"
 sml_calmar_castle_desc:0 "Across the sound and the straits the fortress of Kalmar holds the gate between the Baltic and the provinces, and its halls have welcomed kings and councils since the Union was sealed within its walls. So long as the castle watches, no army passes the coast of Småland."
 sml_kalmar_union:0 "Heir of the Kalmar Union"
 sml_kalmar_union_desc:0 "In the year 1397 the crowns of the North were bound together in the great hall of Kalmar, and the memory of the Union still lingers in every court between the Baltic and the Arctic. The heirs of that compact know the worth of an alliance kept in writing, and of a cousin's promise."
 sml_vaxjo_cathedral:0 "The Cathedral of Växjö"
 sml_vaxjo_cathedral_desc:0 "At the heart of the highlands the see of Växjö gathers the faithful of the three districts, east of the monastery of Nydala and the shrines of the old land. Where the sees are settled, the realm sits easy, and the tithes and the prayers alike are kept in order."
 sml_lions_crossbow:0 "The Lion and the Crossbow"
 sml_lions_crossbow_desc:0 "The arms of Småland show the red lion cocking a crossbow, and the burghers and the bondsmen alike are taught to draw the string from childhood. From the stockades of the woods the crossbowmen of the highlands loose their bolts with a steadiness few levies can match."
 sml_east_coast_towns:0 "The Towns of the East Coast"
 sml_east_coast_towns_desc:0 "Kalmar, Västervik and the strand markets stretch along the coast where the archipelagos give shelter to the Baltic sailing. The merchants of the east keep the mail routes open to the German ports, and the customs of the small harbours line the treasury."
 sml_forest_harvest:0 "Harvest of the Forests"
 sml_forest_harvest_desc:0 "From the deep woods come tar and timber, charcoal for the iron and, in the fullness of time, the clear glass of the province's hearths. The highlands give grudgingly, but what they give—the mast, the ham, the nail—is of the kind that fills a ship's hold with honesty."
 VGL_ideas:0 "Västergötland Ideas"
 VGL_ideas_start:0 "Västergötland Traditions"
 VGL_ideas_bonus:0 "Västergötland Ambition"
 vgl_cradle_of_the_goths:0 "Cradle of the Goths"
 vgl_cradle_of_the_goths_desc:0 "Between Vättern and the Göta river the old heartland of the Gothic kingdom keeps its monuments and its pride, the mounds and the stones before the runes of the kings. To hold Västergötland is to hold the beginning of the Swedish realm, and all the realm knows it."
 vgl_skara_see:0 "The See of Skara"
 vgl_skara_see_desc:0 "The bishopric of Skara is the eldest see of the Swedish church, founded in the age of the first missionary kings. Its cathedral presides over the plains and its canons sit in the great councils, keeping the law, the letters and the peace of the old clergy."
 vgl_vastgotalag:0 "The Västgötalag"
 vgl_vastgotalag_desc:0 "The oldest lawbook written in a Nordic tongue was drafted in these plains, and the Västgötalag still orders the fields, the kin and the courts of the countryside. A province that wrote its own law before the realm was grown keeps a long memory and a settled temper."
 vgl_gota_river:0 "The Göta River Route"
 vgl_gota_river_desc:0 "Down the falling waters of the Göta river the way runs out to the western sea, joining the plied lanes of the Sound and the herring markets of the Kattegat. The timber and the iron of the interior find their way to the estuary, and the tolls of the river feed the hands that guide them."
 vgl_west_frontier:0 "Warders of the West Frontier"
 vgl_west_frontier_desc:0 "Against the Norwegian mountains and the Danish coast the plains of the west keep their watch, bron and border-marked from the old marches. The warders of the frontier are seasoned to alarm and raid, and their fields are tilled within call of the watch-fire."
 vgl_elvsborg_stronghold:0 "The Elfsborg Stronghold"
 vgl_elvsborg_stronghold_desc:0 "The fortress of Elfsborg commands the mouth of the Göta river, and its guns close the approach to the heart of the land. So long as the stronghold flies its colours, no fleet forces the entry to the western provinces, and no army marches past its walls unwatched."
 vgl_gothic_cavalry:0 "The Gothic Cavalry"
 vgl_gothic_cavalry_desc:0 "The gentry of the plains have ridden to the muster since the age of the folk-kings, mounted on the sturdy horses bred between the lakes. From the Vistula to the Leitha the Westrogothian horse has carried the banner of the old Goths into battle."
 VBT_ideas:0 "Västerbotten Ideas"
 VBT_ideas_start:0 "Västerbotten Traditions"
 VBT_ideas_bonus:0 "Västerbotten Ambition"
 vbt_northern_frontier:0 "The Northern Frontier"
 vbt_northern_frontier_desc:0 "Beyond the coastal parishes the fells of Lapland run unmastered to the Arctic, and beyond them lie the Karelian marches. The watch against the wilderness is the oldest charge of the Bothnian men, kept by season-trodden pastures and the winter trails that the enemy cannot read."
 vbt_fur_road:0 "The Fur Road"
 vbt_fur_road_desc:0 "From the winter markets to the Bothnian quays the furs of the north come down by sledge and boat, the pelts of marten and ermine and the hides of the reindeer herds. The merchants of Umeå and Skellefteå have turned the wilderness into thoroughfare, and the frontier pays its tolls in the coin of the realm."
 vbt_reindeer_fells:0 "The Reindeer Fells"
 vbt_reindeer_fells_desc:0 "On the high summer pastures the herds range under the open sky, and the life of the province turns on their great migration. A land that feeds on the reindeer knows how to live from the land itself, sparing the granary and the purse."
 vbt_bothnian_coast:0 "The Bothnian Coast"
 vbt_bothnian_coast_desc:0 "The fairways of the Bothnian Gulf carry the timber and tar of the north to the markets of the realm, and the coastal towns grow where the rivers meet the sea. The men of the coast are born to the boat, plying the passed lanes between the skerries in all weathers."
 vbt_umea_meeting:0 "The Umeå Meeting"
 vbt_umea_meeting_desc:0 "At the old meeting grounds on the Umeå river the freeholders of the north gather to settle the law, the borders and the common lands of the parishes. A government that keeps the old courts keeps the north contented, for the frontier folk will not be ruled from afar."
 vbt_vasterbotten_regimente:0 "The Västerbotten Regimente"
 vbt_vasterbotten_regimente_desc:0 "From the parishes of the Bothnian coast the Västerbotten regimente marches to every war of the realm, the tall men of the north famed for their endurance in the field and their steadiness under fire. Long marches and hard winters are their training ground."
 vbt_skargards_fleet:0 "The Skerry Fleet"
 vbt_skargards_fleet_desc:0 "The shallow fairways between the islets cannot carry the great warships, but the swift skerry-boats and the armed sloops of the coast can pick their way through any pass. The defence of the Bothnian coast rests on these small, weather-wise crews who know every rock and current by name."
 HLS_ideas:0 "Hälsingland Ideas"
 HLS_ideas_start:0 "Hälsingland Traditions"
 HLS_ideas_bonus:0 "Hälsingland Ambition"
 hls_halsingegardar:0 "The Hälsingegårdar"
 hls_halsingegardar_desc:0 "Inland from the coast the great timber farmhouses of Hälsingland rise storey upon storey, painted in the old ochre and blue, with carved porches that the travellers of the realm come far to see. They are the pride of the countryside, and the standing proof that the north builds to endure."
 hls_bothnian_timber:0 "The Bothnian Timber"
 hls_bothnian_timber_desc:0 "From the river-parishes the timber of Hälsingland floats down to the saws of the Bothnian coast, the masts and planks that the fleets of the realm are built with. The forests of the province are the reserve of the Swedish navy, marked, measured and guarded."
 hls_hudiksvall:0 "The Port of Hudiksvall"
 hls_hudiksvall_desc:0 "Hudiksvall holds the principal market of the northern coast, where the tar, the iron and the timber of the interior are traded for the goods of the Sound and the Baltic. Its merchants keep the old Bothnian privileges and the fairways that carry the wealth of the north."
 hls_coastal_fairways:0 "The Uplands Fairways"
 hls_coastal_fairways_desc:0 "The fairways of the Uplands run among the islets and the skerries where deep draught ships cannot follow. The helmsmen of Hälsingland know every rock and shallows by name, and raiding squadrons that enter these waters come to grief on the rocks that local pilots steer by."
 hls_iron_hills:0 "The Iron of the Hills"
 hls_iron_hills_desc:0 "On the edges of the province the iron hills of Bergslagen rear their furnaces, and the ore of the interior feeds the forges of the coast. The iron wares of the north are carried through Hälsingland, and every bar and bolt pays tribute to the province that guards the road."
 hls_churches_of_the_north:0 "The Churches of the North"
 hls_churches_of_the_north_desc:0 "From the stone kirks of the coast to the log-stave chapels of the forest the churches of Hälsingland hold the north in the faith, tended by a clergy that knows its flock in every river valley. Through these parishes the learning and the liturgy of the realm reach the far Bothnian shore."
 hls_halsinge_regemente:0 "The Hälsinge Regemente"
 hls_halsinge_regemente_desc:0 "The farmers of the coast and the forest muster under the Hälsinge regemente, the tall men of the north who have carried the banner of the realm to every war from Livonia to the Baltic isles. Endurance, marksmanship and the stubborn humour of the Bothnian parishes are their war-gear."
  ATN_ideas:0 "Antiochene Ideas"
  ATN_ideas_start:0 "Antiochene Traditions"
  ATN_ideas_bonus:0 "Antiochene Ambition"
  atn_bohemonds_heritage:0 "Bohemond's Heritage"
  atn_bohemonds_heritage_desc:0 "Bohemond of Taranto carved this principality from a city held against the odds, and his blood still leads our hosts. The name that routed emperors at the walls gives our knights a pride no rival banner can answer."
  atn_port_of_st_symeon:0 "The Port of St Symeon"
  atn_port_of_st_symeon_desc:0 "At the mouth of the Orontes our port receives the galleys of Genoa, Venice and the Cypriot kings. Every cargo lifted on the Antioch quays pays the prince his due, and the tolls of the port feed the treasury that keeps Outremer whole."
  atn_orontes_fields:0 "Fields of the Orontes"
  atn_orontes_fields_desc:0 "The valley of the Orontes is the granary of the principality, irrigated and planted since Rome's day. Where the waters are kept flowing and the villages settled, the plain feeds Antioch and pays the prince besides."
  atn_silk_of_the_levant:0 "Silk of the Levant"
  atn_silk_of_the_levant_desc:0 "The mulberry groves of the coast yield silk that the weavers of Antioch turn into cloth finer than any in Christendom. Bales stamped with the prince's mark travel west as far as Paris, and the price of silk is fixed in our markets."
  atn_castles_of_the_amuk:0 "Castles of the Amuk"
  atn_castles_of_the_amuk_desc:0 "The plain of the Amuk is ringed with forts that guard the approaches to the city. Kept garrisoned and stocked from the sea, they hold the field against the armies that would otherwise invest our walls."
  atn_relics_of_god:0 "Relics of the True Cross"
  atn_relics_of_god_desc:0 "Pilgrims come to Antioch to venerate the relics our fathers brought from the east. Where relics draw pilgrims, pilgrims draw gold, and the churches of the principality are the truest friends of its treasury."
  atn_franks_of_outremer:0 "Franks of Outremer"
  atn_franks_of_outremer_desc:0 "Frankish knights, Armenian lords, Syriac priests and Greek merchants all owe the prince fealty. A realm that rules many peoples by one law is stronger than any single nation, and ours has learned that lesson in every generation."
  GZR_ideas:0 "Gazaria Ideas"
  GZR_ideas_start:0 "Gazarian Traditions"
  GZR_ideas_bonus:0 "Gazarian Ambition"
  gzr_walls_of_kaffa:0 "The Walls of Kaffa"
  gzr_walls_of_kaffa_desc:0 "Kaffa's walls are the wonder of the Euxine, towers upon towers raised by the Genoese to hold the greatest emporium of the Black Sea. So long as the walls stand, no Tatar, Turk or rival flag seizes the trade behind them."
  gzr_genoese_consuls:0 "The Genoese Consuls"
  gzr_genoese_consuls_desc:0 "Each colony is ruled by a consul chosen from the merchant families, bound to keep the books and the charters of the comune. Men of the ledger and the scale govern soberly, and a republic of shopkeepers is hard to corrupt or to conquer."
  gzr_black_sea_salt:0 "Salt of the Black Sea"
  gzr_black_sea_salt_desc:0 "The pans and the shallow lagoons of the coast yield salt that preserves the fish and the hides of half the Euxine. Every barrel of salt sent inland comes back filled with grain, wax and furs, and the trade never sleeps."
  gzr_crimean_vineyards:0 "Vineyards of the Crimea"
  gzr_crimean_vineyards_desc:0 "Vines brought from the west grow well on the southern slopes of the peninsula. The wine of the colonies travels the sea-lanes beside the silk, and our ships never sail empty to a market that will take our vintage."
  gzr_galley_squadrons:0 "Galley Squadrons"
  gzr_galley_squadrons_desc:0 "The galleys of the consulate patrol the lanes between Kaffa, Tana and the Bosphorus. Kept sharp against raiders and rivals, they make the passage of the Black Sea safe for our convoys — and unsafe for everyone else's."
  gzr_grain_of_the_steppe:0 "Grain of the Steppe"
  gzr_grain_of_the_steppe_desc:0 "The steppe behind the colonies is a granary without bounds, and the khams sell its wheat cheap at our quays. Ships bound for Constantinople load grain in Kaffa, and the export grain of the south is our steadiest revenue."
  gzr_merchant_houses_of_kaffa:0 "The Merchant Houses of Kaffa"
  gzr_merchant_houses_of_kaffa_desc:0 "The counting houses of Kaffa fund voyages from Cairo to Caffa, and their agents sit in every port of the Euxine. A consul who keeps the houses rich keeps the colony safe, for their ships, their gold and their letters are its true navy."
  KRN_ideas:0 "Carniolan Ideas"
  KRN_ideas_start:0 "Carniolan Traditions"
  KRN_ideas_bonus:0 "Carniolan Ambition"
  krn_roads_of_carniola:0 "Roads of Carniola"
  krn_roads_of_carniola_desc:0 "The roads of the march join the Adriatic to Vienna and the Danube to Italy at Ljubljana's crossroads. Every wagon train that crosses our passes pays toll, and a land that guides the trade of two seas never goes hungry."
  krn_iron_and_salt:0 "Iron and Salt"
  krn_iron_and_salt_desc:0 "The hills yield iron for the forges and brine for the pans, the two staples the valleys trade abroad. Where iron fells trees and salt seasons the herds, the march earns twice what its thin fields alone could give."
  krn_burja_wind:0 "The Bora Wind"
  krn_burja_wind_desc:0 "The burja tears down from the Karst in winter, hurling stones and freezing columns on the roads. Enemies who come in its season learn what the mountain folk always knew: the wind is our first and fiercest ally."
  krn_march_levies:0 "Levy of the March"
  krn_march_levies_desc:0 "Border men muster fast, for a march that answers slowly vanishes. The valleys of Carniola keep their muster lists ready, and their men return to their fields as quickly as they take the road."
  krn_slovene_tongue:0 "The Slovene Tongue"
  krn_slovene_tongue_desc:0 "In this march the speech of the people is Slovene, kept in the courts and the pulpits of the valleys. A land that keeps its own tongue keeps its own loyalties, and no foreign chancery reads our councils over our shoulder."
  krn_castles_of_the_march:0 "Castles of the March"
  krn_castles_of_the_march_desc:0 "The castles of Carniola watch the passes where Turk, Hungarian and rebel alike have come. Kept stocked and garrisoned by the estates, each one turns an invasion into a siege before the plain is ever reached."
  krn_landtags_of_the_march:0 "The Landtag of Carniola"
  krn_landtags_of_the_march_desc:0 "Prelates, nobles and towns consent to the burdens of the land in the assembly of the march. A ruler who hears his estates keeps their homage, and grants made with consent are paid without grudge."
  ORA_ideas:0 "Orange Ideas"
  ORA_ideas_start:0 "Orange Traditions"
  ORA_ideas_bonus:0 "Orange Ambition"
  ora_house_of_nassau:0 "The House of Nassau"
  ora_house_of_nassau_desc:0 "Marriage yoked the ancient principality to the counts of Nassau, and the match brought Orange friends in the Empire and the Netherlands beyond its size. We choose our alliances at the altar, and each wedding adds a regiment to our name."
  ora_rhone_tolls:0 "Tolls of the Lower Rhone"
  ora_rhone_tolls_desc:0 "The Rhone carries the trade of Provence and the Alps, and Orange stands where the river narrows below the papal city. Our towers take toll of the barges, and the river that feeds Avignon pays its way through our waters."
  ora_terraces_of_the_prinat:0 "Terraces of the Prinat"
  ora_terraces_of_the_prinat_desc:0 "On the south-facing terraces of the Prinat hill grow fruit and vines that ripen weeks ahead of the plain. Small princes live by such careful husbandry, and every terrace is worth more to us than a square league of marsh."
  ora_wines_below_avignon:0 "Wines Below Avignon"
  ora_wines_below_avignon_desc:0 "The warm slopes below Avignon yield vintages that fill the cellars of the Curia itself. Cards, princes and popes drink our wine, and a vintage accepted at Avignon is a letter of credit in every court of Christendom."
  ora_ancient_walls:0 "The Ancient Walls"
  ora_ancient_walls_desc:0 "Orange has guarded its walls since the time of the Roman city Arausio. Kept strong and cased with modern stone, they have outlived Franks, Saracens and kings, and every besieger who tests them leaves his pickets to starve."
  ora_coins_of_orange:0 "The Coin of Orange"
  ora_coins_of_orange_desc:0 "The princes of Orange struck their own money by ancient right, and its good silver has long been trusted in the markets of the Rhone. A prince who mints sound coin borrows land, ships and loyalty the moment he lands at any quay."
  ora_militia_of_the_rhone:0 "Militia of the Rhone"
  ora_militia_of_the_rhone_desc:0 "Every mansion of the principality keeps its men drilled against the day the Rhone brings war as well as wine. Farmers and boatmen who fight for their own orchards hold ground that paid garrisons would gladly abandon."
  TPL_ideas:0 "Tripolitan Ideas"
  TPL_ideas_start:0 "Tripolitan Traditions"
  TPL_ideas_bonus:0 "Tripolitan Ambition"
  tpl_castle_of_pelerin:0 "Castle of Pèlerin"
  tpl_castle_of_pelerin_desc:0 "The fortress of Mount Pilgrim, raised on its height above the harbor, guards the city and the bay at once. Its walls have watched every Mamluk host come and go, and no army has ever stormed the heights that crown the county."
  tpl_sugar_and_silk:0 "Sugar and Silk"
  tpl_sugar_and_silk_desc:0 "The terraced valleys yield sugar and the coast yields silk, the two goods the county sells to every market of the west. From Tripoli's fields come the sweetmeats and the cloth that make its name known beyond any border."
  tpl_merchants_of_the_county:0 "Merchants of the County"
  tpl_merchants_of_the_county_desc:0 "Genoese, Venetian and local traders crowd the quays of Tripoli, the last great port of the Frankish east. The county takes its dues from all, and a harbor where three fleets anchor is a harbor no prince may let fall."
  tpl_hospitaller_cross:0 "The Hospitaller Cross"
  tpl_hospitaller_cross_desc:0 "When its own lords failed, Tripoli passed to the knights of Saint John, who held it till the walls fell. Their cross still leads our foot, and the discipline of the brotherhood has set the standard of every garrison since."
  tpl_litani_valley:0 "Valley of the Litani"
  tpl_litani_valley_desc:0 "The Litani waters the orange groves and the fields that feed the city. Where the river is kept flowing and the terraces tended, the valley fills the granaries and the market alike."
  tpl_diplomats_of_outremer:0 "Diplomats of Outremer"
  tpl_diplomats_of_outremer_desc:0 "Caught between the Mamluks and the sea, the county has survived by treaty as much as by arms. Our envoys keep the peace paid, the truces renewed and the rivals of our enemies divided, for a small realm's best watchtower is a well-kept promise."
  tpl_franks_of_the_county:0 "Franks of the County"
  tpl_franks_of_the_county_desc:0 "Frankish lords and Syrian peasants, Maronite and Melkite and Latin, share the county and its defense. A land that has learned to rule many peoples by one law holds together when kingdoms of one tongue fall apart."
  WEI_ideas:0 "Saxe-Weimar Ideas"
  WEI_ideas_start:0 "Saxe-Weimar Traditions"
  WEI_ideas_bonus:0 "Saxe-Weimar Ambition"
  wei_wartburg_castle:0 "The Wartburg"
  wei_wartburg_castle_desc:0 "On its crag above Eisenach stands the Wartburg, watching the roads of Thuringia and the memory of the old landgrave's court. Its halls have sheltered saints and singers, and its walls make the patrimony strong."
  wei_refuge_of_the_reformation:0 "Refuge of the Reformation"
  wei_refuge_of_the_reformation_desc:0 "In the shadow of the Wartburg the reformer completed the Scripture in the German tongue, and the Ernestine lands became the seedbed of the new faith. Where Scripture and schoolmasters walk together, learning and loyalty follow."
  wei_university_of_jena:0 "The University of Jena"
  wei_university_of_jena_desc:0 "The princes of Saxe-Weimar founded the university on the Saale, and its faculties drew students from all the Protestant lands. Jurists, divines and physicians trained at Jena serve our chancery, our pulpit and our state."
  wei_saale_tolls:0 "Tolls of the Saale"
  wei_saale_tolls_desc:0 "Timber, salt and cloth ride the Saale past our towns on their way from the mountains to the Elbe. Bridges, locks and quays belong to the prince, and the barges that pass pay the patrimony for the road they use."
  wei_thuringian_forest:0 "The Thuringian Forest"
  wei_thuringian_forest_desc:0 "The forest and its glades feed our herds, fire our forges and hide our hunting parks. Men who live off the forest know its tracks, and a land of woods and valleys is a land an invader never masters."
  wei_the_ernestine_claim:0 "The Ernestine Claim"
  wei_the_ernestine_claim_desc:0 "The Ernestine line is the elder branch of the Wettins, keepers of the Saxon name and its rights. However small our portion, the claim to the Saxon inheritance is remembered in every charter, and paper has pressed more than steel before."
  wei_court_of_muses:0 "The Court of the Muses"
  wei_court_of_muses_desc:0 "Poets, musicians and learned men find welcome at Weimar, and their works carry the principality's name across Europe. A court known for its muses wins the friendship of scholars, and history itself pronounces for a state that keeps the arts."
  ZEM_ideas:0 "Samogitian Ideas"
  ZEM_ideas_start:0 "Samogitian Traditions"
  ZEM_ideas_bonus:0 "Samogitian Ambition"
  zem_medininkai_castle:0 "The Castle of Medininkai"
  zem_medininkai_castle_desc:0 "Medininkai, the seat of the elder chiefs, guards the heart of the land and the gathering of its councils. Its towers have seen every invader of the west beaten back, and its walls house the memory of a free people."
  zem_cross_of_samogitia:0 "The Cross of Samogitia"
  zem_cross_of_samogitia_desc:0 "The double cross of the Grand Duke was set over the land when the last pagans of Europe came at last to the font. The new faith binds the old loyalties to the Lithuanian crown, and the cross goes before us as we settle and baptise."
  zem_raid_cavalry:0 "Raid Cavalry"
  zem_raid_cavalry_desc:0 "Samogitian horsemen learned war from the border that never rested, riding light and sure through forest and ford. Their raids stripped the Teutonic castles bare of forage, and their skill passes from father to son."
  zem_bishops_of_medininkai:0 "Bishops of Medininkai"
  zem_bishops_of_medininkai_desc:0 "The first bishop of Samogitia was ordained within a year of the land's conversion, and his successors have kept a clergy rooted among the free farmers. A church that speaks the tongue of the people is a church the people defend."
  zem_lowland_pastures:0 "Pastures of the Lowlands"
  zem_lowland_pastures_desc:0 "Between the forests and the sea the lowlands carry herds and flocks that feed the land and its armies. Cattle, cheese and hides go down the rivers to the ports, and the pasture pays where the thin plough cannot."
  zem_amber_of_the_coast:0 "Amber of the Coast"
  zem_amber_of_the_coast_desc:0 "The shore of Samogitia yields amber in the storms, the golden stone that every court of Europe prizes. The harvest of the coast is gathered by ancient right and traded along the rivers, and the sea pays the land what the field refuses."
  zem_land_of_the_grand_duke:0 "Land of the Grand Duke"
  zem_land_of_the_grand_duke_desc:0 "The Grand Duke of Lithuania granted Samogitia its rights and its self-government, and the land holds the grant sacred. A people whose liberties are in writing answer their prince with willing men, coin and loyalty."

