l_english:
 # THE France REGION, and the other half of why France "would not rename".
 # `france_region` is a scoping region in map/region.txt - vanilla triggers on it
 # for CBs, estate privileges, the institution spread, parliament issues and the
 # French mission tree - and it carries its own display name, drawn in large text
 # across the map in the imperial and region map modes. It is a separate key from
 # the country's name and sits on top of France's territory, so it reads as the
 # country's name unless it is overridden as well.
 # Caution when editing: the region is larger than West Francia, covering
 # Burgundy, Champagne and the rest of the French region, so this label is
 # printed across land that is not Frankish. Rename it only if that is intended.
 france_region:1 "West Francia"
 france_region_name:1 "West Francia"
