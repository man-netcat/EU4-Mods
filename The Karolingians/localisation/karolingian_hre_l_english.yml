l_english:
 kar_form_hre:0 "Unite the Karlings"
 kar_form_hre_desc:0 "The Carolingian partition was never meant to last. When the Treaty of Verdun split the Frankish empire between Lothair, Louis the German and Charles the Bald, the imperial title was left vacant, and the old Frankish heartlands have passed from one successor kingdom to another ever since.\n\nIf every one of the five kingdoms has been swallowed up, and their combined lands are held in one hand, then the empire can be made whole again. Europe will know a single Karolingian emperor once more.\n\nTo qualify you must be the last of the five still standing, and hold all 227 provinces that the five kingdoms began the game with. Lusatia and every other realm lie outside the empire entirely: they can claim no part of this, and none of their land is needed."
 HLR:0 "Karolingian Empire"
 HLR_ADJ:0 "Karolingian"
 HLR_DETH:0 "the Karolingian Empire"
 HLR_parliament_name:0 "Imperial Diet"