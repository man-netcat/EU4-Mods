 kar_form_scandinavia_title:0 "Form Scandinavia"
 kar_form_scandinavia:0 "Form Scandinavia"
 kar_form_scandinavia_desc:0 "The Norse have warred over fjords and forests since the songs began, while kings rise and fall from Dublin to Novgorod. Yet one high crown over all the northern lands would make the ravens' homeland an empire to be reckoned with. Let us unite the North and raise Scandinavia among the empires of the world."
