l_english:
 kar_form_hungary_title:0 "Form the Kingdom of Hungary"
 kar_form_hungary:0 "Form the Kingdom of Hungary"
 kar_form_hungary_desc:0 "The Magyars crossed the Carpathian passes as nomadic raiders, but the basin itself has chosen them: river, steppe and mountain rim alike are where a people settles and a kingdom is born. Let us take a crown and found Hungary, that our dynasty may rule a settled realm instead of a wandering horde."
 magyar_settlement_1_title:0 "Settlement of Pannonia"
 magyar_settlement_1_desc:0 "The war is won and the basin is ours. The Avar remnants working its valleys now look to our tents for law, and take up our tongue and our gods. Behind us, the camps we have left on the eastern steppes fall to Pecheneg ways. A people that would hold both must learn to rule the settled and the wandering alike."
 magyar_settlement_1_a:0 "We are home."
 magyar_settlement_1_b:0 "We shall hold both."
 magyar_settlement_2_title:0 "A Crown in Pannonia"
 magyar_settlement_2_desc:0 "The basin lords now ride under our banners, and Pest itself opens its gates. The time for wandering is over: a crown waits to be taken, and a kingdom to be named."
 magyar_settlement_2_a:0 "Found Hungary."
 magyar_settlement_3_title:0 "The Basin is Ours"
 magyar_settlement_3_desc:0 "Their armies are broken and the whole basin lies open, from the river marshes to the mountain rim. The crown of Pannonia waits to be taken this very day - or we can ride home laden with glory and leave crowns for later."
 magyar_settlement_3_a:0 "Take the crown now."
 magyar_settlement_3_b:0 "Glory is enough."
