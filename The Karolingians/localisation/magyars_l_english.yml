l_english:
 MGY:0 "Magyars"
 MGY_ADJ:0 "Magyar"
 kar_form_hungary:0 "Form the Kingdom of Hungary"
 kar_form_hungary_desc:0 "The Magyars crossed the Carpathian passes into the basin as nomadic raiders, but the land itself has chosen them: the Danube bend, the Alfold steppe and both shoulders of Transylvania are where a people settles and a kingdom is born.\n\nWhen the whole basin is in one hand - every county from the Bakony to the Tisza-loops, from the foothills of the Carpathians to the Iron Gates - then the Magyars will have found their home, and the Kingdom of Hungary can be founded around Buda.\n\nTo qualify you must hold all 16 provinces that surround the Carpathian Basin."