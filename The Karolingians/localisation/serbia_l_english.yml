 kar_form_serbia_title:0 "Form Serbia"
 kar_form_serbia:0 "Form Serbia"
 kar_form_serbia_desc:0 "The župans of Raška and the coastlands have warred over cattle and salt since before the songs began, while Bulgars press from the east and Franks from the north. Yet one crown over all the Serbian lands would make the mountain tribes a kingdom to be reckoned with. Let us unite the Serbs and raise Serbia among the kingdoms of the world."
