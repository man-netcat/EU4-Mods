 kar_form_iceland_title:0 "Form Iceland"
 kar_form_iceland:0 "Form Iceland"
 kar_form_iceland_desc:0 "The Norse have only just found these islands, and their shores hold farmsteads that owe nothing to any king. One law over every island would end the age of quarrelling godar. Let us hold the Althing under one banner and call it all Iceland."
