 START_1337_NAME:0 "The Hundred Years' War Looms"
 START_1337_DESC:0 "April 1337. Edward III of England is about to press his claim to the French crown, the Black Death is still a decade away, and the Ilkhanate has just collapsed into warring successor states. Europe, Byzantium and the steppe stand on the edge of an age of war and plague."
