l_english:
 SLV:0 "Slovenia"
 SLV_ADJ:0 "Slovenian"
 slovenian_nation_title:0 "Form Slovenia"
 slovenian_nation_desc:0 "The Slovene people have long lived in the shadow of greater powers - Austria, Venice, and Hungary. Yet our lands in Carniola, Carinthia, and Gorizia hold a unique cultural identity. By uniting the Slovene-speaking territories under one banner, we can forge a nation that will preserve our heritage and culture for generations to come."
 
 # National Ideas
 SLV_ideas:0 "Slovenian Ideas"
 SLV_ideas_start:0 "Slovenian Traditions"
 SLV_ideas_bonus:0 "Slovenian Ambition"
 alpine_defenses:0 "Alpine Defenses"
 alpine_defenses_desc:0 "The mountainous terrain of our lands provides natural fortifications that we can leverage to our advantage."
 crossroads_of_europe:0 "Crossroads of Europe"
 crossroads_of_europe_desc:0 "Positioned between Italy, Austria, and the Balkans, we can profit from the trade passing through our lands."
 slovene_cultural_identity:0 "Slovene Cultural Identity"
 slovene_cultural_identity_desc:0 "We must preserve and promote our unique Slovene culture while accepting our neighbors."
 reformed_administration:0 "Reformed Administration"
 reformed_administration_desc:0 "A streamlined administration will help us govern our territories more effectively."
 merchant_privileges:0 "Merchant Privileges"
 merchant_privileges_desc:0 "By granting privileges to merchants, we can enhance our commercial capabilities."
 alpine_mercenaries:0 "Alpine Mercenaries"
 alpine_mercenaries_desc:0 "Our hardy mountain people make excellent mercenaries."
 embrace_reformation:0 "Embrace Learning"
 embrace_reformation_desc:0 "We shall embrace new ideas and learning from across Europe."
