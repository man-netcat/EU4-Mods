 wittenberg_school:0 "Wittenberg Concord"
 wittenberg_school_desc:0 "The Wittenberg Concord aligns the university's catechisms with territorial church orders. Its professors treat pulpit, schoolroom, and civic chancery as one apparatus, yielding a steady flow of church power."
 magdeburg_school:0 "Magdeburg Magistracy"
 magdeburg_school_desc:0 "The Magdeburg Confession of 1550 defended magistrates who resisted tyranny under Lutheran law. Jurists trained on its arguments supervise municipal finances and keep burgher taxation predictable."
 philippist_school:0 "Philippist Dialogue"
 philippist_school_desc:0 "Philippists follow Philipp Melanchthon's humanist lectures, blending rhetoric, mathematics, and cautious diplomacy. Their academies trim the cost of adopting new ideas by stressing consensus over polemic."
 gnesiolutheran_school:0 "Gnesio-Lutheran Orthodoxy"
 gnesiolutheran_school_desc:0 "The Gnesio-Lutheran current insists on the unaltered Augsburg Confession and militarized discipline. It produces pastors and captains who refuse compromises during the confessional struggles."
 genevan_school:0 "Genevan Consistory"
 genevan_school_desc:0 "The Genevan Consistory created under John Calvin weds moral oversight to mercantile bookkeeping. Elders and syndics trained there project Reformed discipline into every trading house they touch."
 covenanter_school:0 "Covenanter Tables"
 covenanter_school_desc:0 "The Scottish Covenanters bound nobles, kirks, and militias through national covenants in the 1630s. Their tables coordinate levies and insist that estates defend Reformed worship at sword's point."
 remonstrant_school:0 "Remonstrant Debates"
 remonstrant_school_desc:0 "The Remonstrants issued their articles at The Hague in 1610 to defend moderate Calvinism and religious toleration. Their pastors keep synods open to dissenters and temper sectarian persecution."
 collegiant_school:0 "Collegiant Exchanges"
 collegiant_school_desc:0 "Dutch Collegiants, meeting aboard Rijnsburg barges and merchant lofts, refused formal clergy after the Synod of Dort. Their collegia foster trust among skippers and exchange theology alongside maritime intelligence."
 palamite_school:0 "Palamite Theology"
 palamite_school_desc:0 "Palamism codifies Gregory Palamas's defense of hesychast prayer against Latin critics. It affirms the distinction between divine essence and energies and slowly raises patriarchal authority across the Orthodox world."
 hesychast_school:0 "Hesychast Pilgrims"
 hesychast_school_desc:0 "Hesychast brotherhoods centered on Mount Athos and Sinai promote contemplative prayer, fasting, and long missions. Their networks keep Orthodox missionaries supplied with zeal and proven methods."
 kyivan_school:0 "Kyivan Brotherhood"
 kyivan_school_desc:0 "Kyivan brotherhood schools in Kyiv, Vilnius, and the steppe towns taught rhetoric, Slavonic letters, and militia drill to lay confraternities. The system turns loyal subjects into trained defenders of true-faith provinces."
 stoglav_school:0 "Stoglav Statutes"
 stoglav_school_desc:0 "The Stoglav (Hundred Chapters) Council of 1551 codified Muscovite rites and parish discipline. Its statutes let rulers decree future stability edicts with reference to a single canonical manual."

