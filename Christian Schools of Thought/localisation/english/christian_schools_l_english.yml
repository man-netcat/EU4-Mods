 alexandrian_school:0 "Alexandrian Catechesis"
 alexandrian_school_desc:0 "Alexandria's ancient catechetical school shaped Cyril and the patriarchal chancery. Its lecturers keep priests fluent in scripture, rhetoric, and polemics aimed at both Muslims and Latin missionaries."
 debre_libanos_school:0 "Debre Libanos Monasticism"
 debre_libanos_school_desc:0 "Debre Libanos is the foremost monastery of the Ethiopian highlands, founded by Saint Tekle Haymanot. Nobles vie to patronize its abbots, who in turn direct levies and church estates across the realm."
 lalibela_school:0 "Lalibela Pilgrimages"
 lalibela_school_desc:0 "Pilgrimage circuits through the rock-hewn churches of Lalibela bind artisans, stonecutters, and clergy together. The techniques they share strengthen both fortification projects and local devotion."
 nubian_school:0 "Nubian Frontier Keepers"
 nubian_school_desc:0 "The bishops of Makuria and Alodia guarded the Nile frontier long after the fall of Christian Nubia. Their cautious diplomacy teaches how to welcome foreign traders while watching heathen neighbors."
 utraquist_school:0 "Utraquist Synods"
 utraquist_school_desc:0 "The Utraquist compacts bound Czech towns to communion in both kinds while negotiating with kings and bishops. Their synods prize moderation, build tolerant parishes, and keep church elders debating doctrine rather than tearing realms apart."
 taborite_school:0 "Taborite War Congregations"
 taborite_school_desc:0 "The warriors of Tábor preached from wagon bastions and swore to defend scripture with pikes and righteous fire. Their preaching captains still drill infantry in tight formations and demand that every commune be ready for crusaders."
