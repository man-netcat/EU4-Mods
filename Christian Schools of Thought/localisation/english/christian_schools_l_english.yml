 christian_school_events.1.t:0 "A Catholic School of Thought"
 christian_school_events.1.d:0 "Rome expects us to ground our clergy in a coherent school of theology before new controversies arise. Which current shall inform our missions, our confessors, and the bishops we appoint?"
 christian_school_events.2.t:0 "A Protestant School of Thought"
 christian_school_events.2.d:0 "Our state churches need a guiding confession before every pulpit begins preaching its own emphasis. Shall we follow the concords of university men or the rallying cries of stricter reformers?"
 christian_school_events.3.t:0 "A Reformed School of Thought"
 christian_school_events.3.d:0 "Merchants, consistories, and synods look to us for a steady hand. Which Reformed tradition should define our discipline and shape our diplomacy?"
 christian_school_events.4.t:0 "An Orthodox School of Thought"
 christian_school_events.4.d:0 "Patriarchs and monks urge us to choose between contemplative orders, Muscovite statutes, or Kyivan brotherhoods. Which current shall we empower?"
 christian_school_events.5.t:0 "A Coptic School of Thought"
 christian_school_events.5.d:0 "Ethiopian and Egyptian hierarchs offer competing visions for our future. Should we anchor the church in Alexandria's libraries, Lalibela's pilgrims, or the frontier wisdom of Nubia?"
 christian_school_events.6.t:0 "A Hussite School of Thought"
 christian_school_events.6.d:0 "The heirs of Jan Hus split between moderates who bargain with crowns and militants who weld sermons to pikes. Which cause will define our movement as we press its message abroad?"

