l_english:
 thomist_school:0 "Thomism"
 thomist_school_desc:0 "Thomism follows Thomas Aquinas's synthesis of Aristotelian philosophy and Latin theology. Dominican lecturers trained on the Summa equip bishops with orderly casuistry when science and law collide."
 scotist_school:0 "Scotism"
 scotist_school_desc:0 "Scotism traces to the Franciscan John Duns Scotus and flourished in the Paris and Cologne studia. Its careful distinctions and focus on the divine will give confessors arguments that hold up during long wars."
 nominalist_school:0 "Nominalism"
 nominalist_school_desc:0 "Nominalism, associated with William of Ockham and the via moderna, treats universals as contingent tools rather than immutable forms. Its jurists turn scholastic hairsplitting into pragmatic statutes that keep chancelleries revising government reforms instead of worshiping old formulas."
 augustinian_school:0 "Augustinianism"
 augustinian_school_desc:0 "Augustinian observants look to the rigorous preaching of Augustine of Hippo and the later Iberian reforms of their houses. Their austere missions rekindle zeal among parish clergy and frontier converts alike."
 molinist_school:0 "Molinism"
 molinist_school_desc:0 "Molinism is named for Jesuit theologian Luis de Molina, whose doctrine of middle knowledge seeks to reconcile providence with human freedom. The debates it sparked in Iberian colleges furnish diplomats with flexible arguments in confessional disputes."
 jansenist_school:0 "Jansenism"
 jansenist_school_desc:0 "Jansenism draws on the posthumous Augustinus of Cornelius Jansen at Louvain. Its rigorist reading of grace and communion demands interior reform and calms unruly cities even as it unsettles court factions."
