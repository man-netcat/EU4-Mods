 LOM:0 "Lombardy"
 LOM_ADJ:0 "Lombard"
 form_lombardy_title:0 "Form Lombardy"
 form_lombardy_desc:0 "From Milan to the Adriatic, from the Alps to the Po, the Lombard heartland is one of the wealthiest and most populous regions of the Empire. Our cities lead Europe in banking, manufacturing, and learning. It is time to unite all of Lombardy under one crown."
