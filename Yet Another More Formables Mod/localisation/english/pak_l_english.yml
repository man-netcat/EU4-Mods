l_english:
 PAK:0 "Pakistan"
 PAK_ADJ:0 "Pakistani"
 pakistani_nation_title:0 "Form Pakistan"
 pakistani_nation_desc:0 "The lands from the Indus to the Himalayas, home to Punjab, Sindh, Balochistan, and Kashmir, shall be united under one banner. By forging a single nation from these diverse peoples, we can create a state worthy of the region's great civilizations."

 PAK_ideas:0 "Pakistani Ideas"
 PAK_ideas_start:0 "Pakistani Traditions"
 PAK_ideas_bonus:0 "Pakistani Ambition"
 pak_land_of_five_rivers:0 "Land of Five Rivers"
 pak_land_of_five_rivers_desc:0 "The Punjab, the land of five rivers, has been the breadbasket of the subcontinent for millennia."
 pak_indus_civilization:0 "Indus Civilization"
 pak_indus_civilization_desc:0 "The legacy of Mohenjo-daro and Harappa reminds us that advanced civilization thrived on the Indus long before others."
 pak_defenders_of_faith:0 "Defenders of the Faith"
 pak_defenders_of_faith_desc:0 "Our people have long been steadfast guardians of their religious traditions."
 pak_martial_tradition:0 "Martial Tradition"
 pak_martial_tradition_desc:0 "From the Sikh warriors to the Pathan fighters, our martial heritage runs deep."
 pak_strategic_crossroads:0 "Strategic Crossroads"
 pak_strategic_crossroads_desc:0 "Sitting at the crossroads of Central Asia, South Asia, and the Middle East, we control vital trade routes."
 pak_united_peoples:0 "United Peoples"
 pak_united_peoples_desc:0 "Despite our diverse ethnic and linguistic makeup, we stand together as one nation."
 pak_national_resilience:0 "National Resilience"
 pak_national_resilience_desc:0 "Through partition, wars, and natural disasters, our nation has proven its resilience time and again."
