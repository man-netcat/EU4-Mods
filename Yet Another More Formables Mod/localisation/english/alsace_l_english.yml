l_english:
 ALS:0 "Alsace"
 ALS_ADJ:0 "Alsatian"
 form_alsace_title:0 "Form Alsace"
 form_alsace_desc:0 "Alsace, the land between the Rhine and the Vosges, has long been torn between the crowns of France and the Empire. Its cities, vineyards, and mountain passes are a prize worth uniting under one banner. Let us forge a state that speaks with a single voice from the Rhine to the Vosges."

 ALS_ideas:0 "Alsatian Ideas"
 ALS_ideas_start:0 "Alsatian Traditions"
 ALS_ideas_bonus:0 "Alsatian Ambition"
 als_decapolis:0 "The Décapole"
 als_decapolis_desc:0 "The ten imperial cities of Alsace have long stood together to defend their privileges and their trade. United under our rule, they form the backbone of our prosperity."
 als_vineyards:0 "Vineyards of the Rhine"
 als_vineyards_desc:0 "From the foothills of the Vosges to the banks of the Rhine, our wines are prized across the Empire and beyond."
 als_frontier_fortresses:0 "Frontier Fortresses"
 als_frontier_fortresses_desc:0 "Caught between France and the Empire, Alsace has learned to fortify every pass, bridge, and town."
 als_rhine_crossroads:0 "Crossroads of the Rhine"
 als_rhine_crossroads_desc:0 "Our position on the Rhine makes us the natural meeting point for the merchants and diplomats of western Europe."
 als_gutenberg_legacy:0 "Gutenberg's Legacy"
 als_gutenberg_legacy_desc:0 "Johannes Gutenberg perfected his printing press in Straßburg. Let the printed word carry Alsatian ideas to the world."
 als_imperial_diplomacy:0 "Voice in the Empire"
 als_imperial_diplomacy_desc:0 "As loyal princes of the Empire, we know how to win friends and influence at the Imperial Diet."
 als_religious_tolerance:0 "Refuge of Conscience"
 als_religious_tolerance_desc:0 "From the Waldensians to the Huguenots, the oppressed have always found shelter in our towns. Their skill and industry enrich us all."
